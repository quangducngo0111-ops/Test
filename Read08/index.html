const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwfwWjJ7Q3VTJEF5ldKGnFKYoziQdntAzRjq1Yqy6HSmbZSc69ijSdOvMCC_Zogbpcm/exec";
const passages={"1": {"title": "The English gentleman farmer who revolutionised the practice of agriculture", "subtitle": "", "text": "<p data-para=\"1\"><b>A</b> Jethro Tull was a major pioneer in the modernisation of agriculture. He was born in 1674 in Berkshire, southern England, into a family of land-owning gentry. He studied first at Oxford University and then at the Inns of Court, London, in preparation for a legal or political career. However, ill health caused him to postpone these plans, and after qualifying as a barrister in 1699, he made a tour of Europe, in the hope that the milder climates of France and Italy would alleviate his breathing problems. In every country through which he passed, he made careful observations of the soil and agricultural production, and on his return to England, the young Tull married, then began farming with his father at Howberry Farm in Oxfordshire.</p><p data-para=\"2\"><b>B</b> Tull was determined to improve farming methods and increase crop yield on the family land, and pursued a number of agricultural experiments there. He particularly wanted to increase efficiency in the sowing of seeds. At that time seeds were still thrown by hand across the field in a haphazard manner, in a traditional method known as broadcasting. Tull soon realised this method of random distribution was inefficient, being wasteful of both seed and labour, so he instructed his staff to sow seeds at very precise, low densities. But by 1701, his frustration with their lack of co-operation prompted him to invent a machine to do the work for him.</p><p data-para=\"3\"><b>C</b> Earlier in his life, Tull had once dismantled a pipe-organ, and the application of the technology behind this musical instrument inspired him to devise a drill that would distribute precise amounts of seed into pre-cut channels. Basic seeding devices had been known for almost 2000 years, but Tull took the concept a stage further. In his device, as the main wheels of the drill turned, the cylinder rotated against a spring-held tongue. This allowed seed to pass evenly from the hopper above to a funnel below. From here, the seed was directed at regular intervals into three channels, or furrows, in the earth. These were dug to a specific depth by the blades at the front of the machine. Spikes at the back of the machine then turned the soil over to immediately cover the seeds. Tull's 'seed drill' would limit the wastage of seed, and as the seedlings grew in uniform rows, it would also make it easier to remove any unwanted weeds growing among the crop. Accordingly, each plant would have more space to grow, and although there would be fewer plants, the net yield would be greater.</p><p data-para=\"4\"><b>D</b> Initially the machine was only a limited success, and in 1711 Tull decided to travel around Europe again, both to improve his health and to study agricultural techniques there. Upon his return in 1714, he perfected both his system and machinery. Following practices he had observed in the vine-growing methods of southern Europe, he used an animal-drawn hoe to turn over and pulverise the earth between the rows. He wrongly believed that this practice would release enough nutrients in the soil to nourish the crop, and so eliminate the need for manure to be used to fertilise the soil. His experiments were apparently successful, as he did manage to grow wheat in the same field for 13 successive years without the use of manure. However, it is more likely that it was the turning over and pulverisation of the soil that cut down on the volume of weeds competing with the seed.</p><p data-para=\"5\"><b>E</b> Tull's complete system eventually proved to be a major influence in the agricultural revolution, and its impact can still be seen in today's methods. Most subsequent drilling and hoeing implements have been either copies of, or improvements upon his inventions, and his modifications to the basic model of the plough continue to be visible in modern versions. Tull also advocated the use of horses over the oxen, more traditionally used to pull farm machinery, and published a book in 1731 outlining this and other ideas to enhance agricultural efficiency. The book caused great controversy when it appeared, and resistance to his revolutionary theories persisted for many decades. Another century would pass before his eventual vindication. It was only following the editing of his writings in 1822, and the subsequent translations and acceptance in France, that Tull's ideas finally achieved recognition in his native land. Although in his lifetime Tull's methods and inventions were dismissed and ridiculed, they were gradually adopted by large landowners, and in time, came to form the basis of modern agriculture.</p>"}, "2": {"title": "The internal body clock", "subtitle": "Each of our cells has an internal ‘clock’ which dictates our daily rhythms. But why?", "text": "<p data-para=\"1\"><b>A</b> From buffalo to bacteria, oaks to algae, all life follows the same relentless 24-hour cycle, which is driven by the rising and setting of the Sun. Or is it? Over 250 years ago, a French scientist performed a simple experiment that blew apart the idea that all life on Earth does the bidding of the Sun. Intrigued by the way some flowers open and close their leaves each day, Jean-Jacques de Mairan put a heliotrope in a darkened room and observed the effect. He was expecting the plant, robbed of sunlight, to cease its daily routine. To his astonishment, its leaves continued to open and close as if in response to some invisible timekeeper.</p><p data-para=\"2\"><b>B</b> But what – and where – is this internal timekeeper? And how does it achieve such astonishing regularity? These are the mysteries at the forefront of chronobiology, the study of the effect of time in living organisms. The search for answers is about more than just tying up some scientific loose ends. Internal ‘clocks’ clearly cause a lot of hardship. When an individual’s ‘clock’ is knocked out of synchronization through having to work at night or go on long-haul flights, that person can be left utterly unable to think or act. Yet even when these ‘clocks’ work correctly, the natural rhythms of alertness they generate prove dangerous: traffic accident statistics show two deadly peaks, at 4 a.m. and again twelve hours later when people are at their least alert.</p><p data-para=\"3\"><b>C</b> During the 1970s, best-selling books began to emerge claiming such phenomena were manifestations of so-called biorhythms, a set of three cycles governing physical, emotional and intellectual traits. Said to start from the moment of birth and repeat every 23, 28 and 33 days respectively, they were supposed to result in ‘critical days’ when one or more cycles led to sub- optimal performance, with unfortunate consequences.</p><p data-para=\"4\"><b>D</b> Scientists have since dismissed biorhythms as pseudoscience, insisting the existence of the three cycles has no basis in fact. In 1998, Dr Terence Hines of Pace University, New York State published the most comprehensive study of the claims made for biorhythms, reviewing the results of over 130 investigations. He found that three-quarters of them failed to provide any support for biorhythms. Most of the remainder contained blunders ranging from faulty mathematics to basic errors in statistics, while the handful of positive studies were explicable as flukes.</p><p data-para=\"5\"><b>E</b> But there is no doubting the existence of 24-hour biological cycles – or, rather, ones roughly 24 hours long. Following de Mairan’s pioneering work, other researchers found that when deprived of the cues provided by sunlight, organisms settle down to ‘free-running’ cycles that are close to, but rarely exactly, 24 hours. In the case of humans, the cycle is typically around 24.5 hours long. This is the so-called ‘circadian’ cycle (from the Latin meaning ‘about a day’), the length of which is generated by the mysterious internal ‘clock’.</p><p data-para=\"6\"><b>F</b> During the late 1960s, chronobiologists believed they had found the ‘clock’, in the form of the suprachiasmatic nucleus (SCN), a collection of nerves in a region of the brain known as the hypothalamus. Linked to photosensitive cells in the eye, the SCN senses daylight and triggers the release of hormones like melatonin, which keep body functions in synchronization with the time of day. For a few years the SCN was regarded as the ultimate pacemaker – at least in higher organisms such as ourselves. But in 1971, scientists at the California Institute of Technology working with fruit flies found evidence for something truly amazing. Fruit flies appeared to have genes affecting the daily rhythm of their behavior – suggesting that there are ‘clocks’ inside each of their cells. Further evidence for this emerged in 1995, when researchers at Massachusetts General Hospital isolated nerve cells from the SCN, and found they kept up a circadian cycle without help from daylight. Finally in 1997, scientists at Northwestern University in Illinois found a gene that regulates the daily rhythms of cellular activity in mammals.</p><p data-para=\"7\"><b>G</b> The details of how this gene, known as CLOCK, actually works are still being investigated, but they could culminate in better ways of coping with shift-work and jet-lag. Professor Takahashi, who led the research, says that now that we know that circadian clocks exist throughout our bodies, we will need new strategies and therapeutics to reset all of our cells. But how do all the biochemical ‘clocks’ inside their cells stay in synchronization and why did organisms bother to acquire a link with sunlight? So far, no-one knows, though there are several theories. For example, sunlight might be useful in keeping the myriad cellular ‘clocks’ in lockstep.</p><p data-para=\"8\"><b>H</b> In the search for answers, researchers are studying the behavior of a microbe called cyanobacterium. In 2005, a team at Nagoya University, Japan, showed that chemical reactions between three proteins produced by this bacterium ebbed and flowed on a 24-hour cycle. Cyanobacterium is the oldest form of life on Earth, so this suggests that cellular ‘clocks’ have existed for over three billion years. All subsequent organisms have followed suit, says Professor Johnson of Vanderbilt University, Tennessee. ‘Bacteria, fungi, plants and animals all appear to have evolved clock systems independently from each other.’ Quite why is still unknown. But one thing is clear: the daily routine of life is certainly not a modern invention.</p>"}, "3": {"title": "The origin of language", "subtitle": "", "text": "<p data-para=\"1\">Theories on the origin and evolution of language have been a major area of my research for many years. By 1859, when British scientist Charles Darwin published The Origin of Species, there was already a great deal of interest in this subject. However, the debate became plagued by strange theories, so much so that in 1866 the influential Société de Linguistique de Paris banned all discussions about the origin of language. The ban lasted for more than a century, before a surge of research began during the 1990s. Linguists, psychologists, anthropologists, and archaeologists now frequently debate the origin of language and have published many articles and books on this topic. And yet, despite almost frenzied activity, limited progress has been made.</p><p data-para=\"2\">I believe there are four reasons for this. The first is an insufficient concern with the archaeological and fossil proof of the brains and behaviour of our human ancestors. Many theories to date rely on an assumed association between brain size and language abilities, without acknowledging the problem this creates: fossil evidence indicates that the Neanderthals\\ had larger brains than modern humans, Homo sapiens, but archaeological evidence indicates that the Neanderthals lacked a capacity for language. So something is seriously amiss with those theories.</p><p data-para=\"3\">That ‘something’ might relate to the second reason for limited progress: insufficient concern with the other major aural and vocal communication system of modern humans: music. Even though the Société de Linguistique de Paris had nothing to say about studying the origin of music, academics appear to have had a self-imposed ban, with limited discussion of this issue during the 19th and 20th centuries. However, there are notable exceptions that should be acknowledged. One is the aforementioned Charles Darwin who, in his 1871 book on human evolution, The Descent of Man, devoted several pages to the development of music. Another is the renowned ethnomusicologist John Blacking, whose 1973 book, How Musical is Man?, broached the idea that music is an inherent and universal human quality.</p><p data-para=\"4\">The origin of music deserves as much attention as that of language, as we cannot treat one without the other. Those writers who had evidently annoyed the Société de Linguistique de Paris were quite aware of this. For them, music and language were intimately linked; the French writer and philosopher Jean-Jacques Rousseau’s On the Origin of Language (1781) was a reflection on both music and language. In contrast, Morten Christiansen and Simon Kirby’s book, Language Evolution (2000), which they conceived as ‘a definitive book on the subject,’ failed to mention music in any of its 17 chapters. Those authors have an important lesson to learn from Rousseau and other writers of his time who addressed the origin of language.</p><p data-para=\"5\">Music is a universal feature of human society and plays a significant role in the lives of all individuals. Indeed, music is perhaps in even greater need of study than language: the latter has a self-evident function — the transmission of information — and can be readily accepted as a product of evolution, even if its specific evolutionary history remains unclear. But what is the point of music?</p><p data-para=\"6\">That question leads directly to a third reason for our lack of progress in understanding how language evolved, and indeed the human mind in general: an insufficient concern with emotion. If music is about anything, it is about expressing emotion. But while archaeologists have put significant effort into examining the intellectual capacities of our ancestors, their emotional lives have been sorely neglected. This has contributed to the neglect of music, which, in turn, has constrained our understanding of language.</p><p data-para=\"7\">There is one further reason why progress has been limited: those who have been most influential regarding the evolution of language have simply got it wrong, and misled everyone else. Linguist Derek Bickerton has made an important contribution towards our understanding of the origin of language by bringing his profound knowledge of linguistics to the discussions that have occurred. But Bickerton’s idea that the precursor of modern language consisted of words strung together with limited, if any, grammar is, I believe, fundamentally mistaken. Bickerton refers to this precursor as ‘proto-language’ and suggests that it was similar to the type of ‘language’ spoken by young children today, and mastered by apes through the use of computer keyboards. This idea has dominated the field of language origins for the last two decades, and is one that I once found persuasive. But I now understand that it is not only flawed but has severely limited the progress that should have been made.</p><p data-para=\"8\">My book therefore provides an alternative view, one that draws on the ideas of a linguist who has, I believe, identified the true nature of proto-language. Her name is Alison Wray. She argues that proto-language was ‘holistic’ rather than ‘compositional’ in character. By this she means that the precursor to language was a communication system composed of ‘messages’ rather than words; each message was uniquely associated with an arbitrary meaning, as are the utterances of language today. But in Wray’s proto-language, they were not composed out of smaller units of meaning (i.e. words) which could be combined together using a rule system (i.e. grammar) to make more complex messages with emergent meanings. For Wray, proto-language was ‘semantically complex and agrammatical’. I believe this insight enables us to understand the origin of music as well as language, and to relate both to the emotional lives of our human ancestors.</p><p data-para=\"9\">\\------------------------------------------------------</p><p data-para=\"10\">Neanderthals\\: an extinct race of humans who lived in Europe 230,000 to 35,000 years ago</p><p class=\"footnote\"><i>* Neanderthals: an extinct race of humans who lived in Europe 230,000 to 35,000 years ago.</i></p>"}};

function optionValue(x){const t=String(x),i=t.indexOf(' — ');return i>=0?t.slice(0,i):t} function qBy(n){return questions.find(q=>q.n===n)}
function startExam(){const n=document.getElementById('studentName').value.trim(),c=document.getElementById('studentClass').value.trim();if(!n||!c){document.getElementById('startError').textContent='Vui lòng nhập đầy đủ Họ tên và Lớp.';return}clearAttempt();document.getElementById('topName').textContent=n;document.getElementById('topClass').textContent=c;document.getElementById('startScreen').classList.add('hidden');document.getElementById('exam').classList.remove('hidden');startedAt=Date.now();endAt=startedAt+3600000;buildNav();showPassage(1);tick();timerHandle=setInterval(tick,250)}
function tick(){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));const m=Math.floor(remaining/60),s=remaining%60,e=document.getElementById('timer');e.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;e.classList.toggle('warning',remaining<=600&&remaining>300);e.classList.toggle('danger',remaining<=300);if(remaining<=0&&!submitted){clearInterval(timerHandle);submitExam(true)}}
function annotationToolbar(zone){return `<div class="annot-bar"><button class="annot-btn" onclick="addHighlight('${zone}')">🖍 Highlight</button><button class="annot-btn" onclick="clearHighlight('${zone}')">Xóa HL</button><button class="annot-btn" onclick="addNote('${zone}')">📝 Add note</button><button class="annot-btn" onclick="toggleNotes('${zone}')">Ghi chú</button><span class="annot-tip">Bôi đen chữ rồi chọn công cụ.</span></div>`}
function zoneRoot(zone){return document.getElementById(zone==='passage'?'passageCopy':'questionsCopy')} function notesKey(zone,p=current){return `notes_${zone}_${p}`} function markupKey(zone,p=current){return `markup_${zone}_${p}`}
function loadNotes(zone){try{return JSON.parse(ssGet(notesKey(zone))||'[]')}catch(e){return[]}} function saveNotes(zone,a){ssSet(notesKey(zone),JSON.stringify(a))}
function captureSelection(zone){if(submitted)return;const sel=window.getSelection(),root=zoneRoot(zone);if(!sel||!root||!sel.rangeCount||sel.isCollapsed)return;const r=sel.getRangeAt(0);if(root.contains(r.commonAncestorContainer)){savedSelection=r.cloneRange();savedSelectionZone=zone}}
function getSel(zone){const root=zoneRoot(zone);if(!savedSelection||savedSelectionZone!==zone||!root||!root.contains(savedSelection.commonAncestorContainer)||!savedSelection.toString().trim()){alert('Hãy bôi đen phần chữ trước.');return null}return savedSelection.cloneRange()}
function addHighlight(zone){const r=getSel(zone);if(!r)return;try{const m=document.createElement('mark');m.className='user-highlight';m.appendChild(r.extractContents());r.insertNode(m);activeHighlight=m;activeHighlightZone=zone;saveMarkup(zone)}catch(e){alert('Hãy chọn đoạn ngắn hơn.')}}
function clearHighlight(zone){if(!activeHighlight||activeHighlightZone!==zone)return alert('Hãy bấm phần đã highlight trước.');const p=activeHighlight.parentNode;while(activeHighlight.firstChild)p.insertBefore(activeHighlight.firstChild,activeHighlight);activeHighlight.remove();p.normalize();saveMarkup(zone)}
function addNote(zone){const r=getSel(zone);if(!r)return;const quote=r.toString().trim(),text=prompt('Nhập ghi chú:');if(!text)return;const id='n'+Date.now(),s=document.createElement('span');s.className='note-anchor';s.dataset.noteId=id;s.appendChild(r.extractContents());r.insertNode(s);const a=loadNotes(zone);a.push({id,quote,text});saveNotes(zone,a);saveMarkup(zone);renderNotes(zone,true)}
function renderNotes(zone,force=false){const id=zone==='passage'?'notesPassage':'notesQuestions',p=document.getElementById(id),a=loadNotes(zone);if(!p)return;p.innerHTML=a.length?a.map(n=>`<div class="note-item"><i>“${esc(n.quote)}”</i><br>${esc(n.text)}</div>`).join(''):'Chưa có ghi chú.';if(force)p.classList.add('open')}
function toggleNotes(zone){document.getElementById(zone==='passage'?'notesPassage':'notesQuestions')?.classList.toggle('open')} function saveMarkup(zone){const r=zoneRoot(zone);if(r)ssSet(markupKey(zone),r.innerHTML)}
function bindAnnotations(zone){const r=zoneRoot(zone);if(!r)return;r.addEventListener('mouseup',()=>captureSelection(zone));r.addEventListener('keyup',()=>captureSelection(zone));r.addEventListener('click',e=>{const m=e.target.closest('mark.user-highlight');if(m){activeHighlight=m;activeHighlightZone=zone}})}
function passageHTML(p){const d=passages[p],saved=ssGet(markupKey('passage',p));return annotationToolbar('passage')+`<div id="notesPassage" class="notes-panel"></div><h2 class="passage-title">${d.title}</h2>${d.subtitle?`<div class="passage-sub">${d.subtitle}</div>`:''}<div id="passageCopy" class="passage-copy">${saved||d.text}</div>`}
function inlineText(n){return `<span class="inline" id="card${n}"><span class="qnum">${n}</span><input class="ans" id="q${n}" data-q="${n}" type="text"></span>`}
function inlineSelect(n,opts){return `<span class="inline" id="card${n}"><span class="qnum">${n}</span><select class="ans" id="q${n}" data-q="${n}"><option value="">-- choose --</option>${opts.map(x=>`<option value="${optionValue(x)}">${x}</option>`).join('')}</select></span>`}
function card(q){return `<div class="card" id="card${q.n}"><div class="card-head"><span class="qnum">${q.n}</span><div class="qtext">${q.text}</div></div>${q.opts.map(x=>`<label class="option" data-q="${q.n}" data-val="${optionValue(x)}"><input type="radio" name="q${q.n}" value="${optionValue(x)}"> ${x}</label>`).join('')}<div id="fb${q.n}" class="feedback"></div></div>`}
function renderMatch(start,end,title,inst,showBank=true){const rows=questions.filter(q=>q.n>=start&&q.n<=end),opts=rows[0].opts;return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>${showBank?`<div class="bank">${opts.map(x=>`<div>${x}</div>`).join('')}</div>`:''}${rows.map(q=>`<div class="match-row" id="card${q.n}"><div class="match-label"><span class="qnum">${q.n}</span> ${q.text}</div>${inlineSelect(q.n,opts).replace(`id="card${q.n}"`,'')}</div>`).join('')}</div>`}
function multiCard(group,start,end,title,stem,opts){
  return `<div class="group">
    <h3>${title}</h3>
    <div class="inst">Choose <b>${end-start+1===2?'TWO':'THREE'}</b> correct answers.</div>
    <div class="card" style="margin-bottom:10px">
      <div class="qtext"><b>${start}–${end}</b> ${stem}</div>
    </div>
    <div class="multi-card" id="card${start}">
      ${Array.from({length:end-start},(_,i)=>`<span id="card${start+i+1}"></span>`).join('')}
      ${opts.map(x=>`<label class="option multi-option" data-group="${group}" data-val="${optionValue(x)}"><input type="checkbox" name="${group}" value="${optionValue(x)}"> ${x}</label>`).join('')}
      <div id="fb${group}" class="multi-score-note">Select exactly ${end-start+1} options.</div>
      <div id="review${group}"></div>
    </div>
  </div>`
}
const g2324Opts=['A — a decrease in output in workplaces without windows to let in natural light','B — a failure among workers on night-shifts to perform tasks','C — an increase in casualties on the roads at specific times of day','D — a decline in efficiency on certain days in a number of fixed cycles','E — a rise in mood swings dependent on the appearance of the Sun'];
const g2526Opts=['A — the precise length of the free-running daily cycle in different animals','B — the reason for clocks being temporarily driven out of synchronisation','C — the reason for living beings forming a connection with the Sun’s rhythms','D — the way in which all clocks in a single organism are able to stay in step with one another','E — the location of the clocks across the whole range of living organisms'];
const g3840Opts=['A — Evidence from prehistoric times','B — Intelligence','C — Individual sounds','D — Music','E — Emotions','F — Human intellect','G — Children’s language'];
function buildQuestions(p){let h='';if(p===1){h+=`<div class="group"><h3>Questions 1–4</h3><div class="inst">Label the diagram. Write <b>ONE WORD ONLY</b> from the passage.</div><img class="diagram" src="${DIAGRAM_IMAGE}" alt="Jethro Tull seed drill"><div class="diagram-answers">${[1,2,3,4].map(n=>`<div>${inlineText(n)}</div>`).join('')}</div></div>`;h+=`<div class="group"><h3>Questions 5–8</h3><div class="inst">Write <b>NO MORE THAN TWO WORDS</b> from the passage.</div><div class="completion"><p>5. What name was given to the traditional technique of seed-sowing? ${inlineText(5)}</p><p>6. What type of agriculture gave Tull inspiration on his second tour of Europe? ${inlineText(6)}</p><p>7. What traditional addition to soil did Tull believe to be unnecessary? ${inlineText(7)}</p><p>8. What animals did Tull recommend farmers should use to pull their machinery? ${inlineText(8)}</p></div></div>`;h+=`<div class="group"><h3>Questions 9–13</h3><div class="inst">Choose TRUE, FALSE or NOT GIVEN.</div>${questions.filter(q=>q.n>=9&&q.n<=13).map(card).join('')}</div>`}else if(p===2){h+=renderMatch(14,18,'Questions 14–18','Which paragraph contains the following information? Choose A–H.',false);h+=`<div class="group"><h3>Questions 19–22</h3><div class="inst">Complete the summary. Write <b>NO MORE THAN TWO WORDS</b>.</div><div class="completion"><h4>An overview of research into the existence of the internal ‘clock’</h4><p>The SCN is able to perceive ${inlineText(19)} as a result of connections to the eye.</p><p>Several years later, research involving ${inlineText(20)} showed that the timing of their normal actions was regulated by certain ${inlineText(21)} or ‘clocks’ in their cells.</p><p>Other scientists went on to conduct experiments in the dark that proved that a ${inlineText(22)} was maintained by individual SCN cells.</p></div></div>`;h+=multiCard('g2324',23,24,'Questions 23–24','Which TWO of the following problems are stated as being linked with the internal ‘clock’?',g2324Opts);h+=multiCard('g2526',25,26,'Questions 25–26','Which TWO of the following issues relating to internal ‘clocks’ remain to be solved, according to information in the passage?',g2526Opts)}else{h+=`<div class="group"><h3>Questions 27–31</h3><div class="inst">Choose the correct answer.</div>${questions.filter(q=>q.n>=27&&q.n<=31).map(card).join('')}</div>`;h+=renderMatch(32,37,'Questions 32–37','Complete each sentence with the correct ending, A–H.',true);h+=multiCard('g3840',38,40,'Questions 38–40','According to the writer, which THREE of the following areas have not been studied enough in order to understand the origin of language?',g3840Opts)}const saved=ssGet(markupKey('questions',p));document.getElementById('questionsPane').innerHTML=annotationToolbar('questions')+`<div id="notesQuestions" class="notes-panel"></div><div id="questionsCopy">${saved||h}</div>`;restore(p);bindTracking();bindAnnotations('questions');renderNotes('questions');if(submitted){document.getElementById('questionsCopy').insertAdjacentHTML('afterbegin','<div class="review-note">Review mode: câu sai có giải thích và evidence ngay bên dưới.</div>');markPassage(p)}}
function showPassage(p){saveMarkup('passage');saveMarkup('questions');current=p;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.p===p));document.getElementById('passagePane').innerHTML=passageHTML(p);bindAnnotations('passage');renderNotes('passage');buildQuestions(p);document.getElementById('passagePane').scrollTop=0;document.getElementById('questionsPane').scrollTop=0}
function save(n,v){ssSet('q'+n,v);document.getElementById('nav'+n)?.classList.toggle('answered',String(v).trim()!=='')} function getGroup(g){try{return JSON.parse(ssGet(g)||'[]')}catch(e){return[]}}
function restore(p){for(const q of questions.filter(x=>x.p===p&&x.type!=='multi')){const v=ssGet('q'+q.n)||'',e=document.getElementById('q'+q.n);if(e)e.value=v;const r=[...document.querySelectorAll(`input[name="q${q.n}"]`)].find(x=>x.value===v);if(r)r.checked=true}['g2324','g2526','g3840'].forEach(g=>{const sel=getGroup(g);document.querySelectorAll(`input[name="${g}"]`).forEach(e=>e.checked=sel.includes(e.value))})}
function bindTracking(){document.querySelectorAll('.ans').forEach(e=>e.oninput=e.onchange=()=>save(+e.dataset.q,e.value));document.querySelectorAll('input[type="radio"]').forEach(e=>e.onchange=()=>save(+e.closest('.option').dataset.q,e.value));[['g2324',2,[23,24]],['g2526',2,[25,26]],['g3840',3,[38,39,40]]].forEach(([g,max,navs])=>document.querySelectorAll(`input[name="${g}"]`).forEach(e=>e.onchange=()=>{let sel=[...document.querySelectorAll(`input[name="${g}"]:checked`)].map(x=>x.value);if(sel.length>max){e.checked=false;sel=[...document.querySelectorAll(`input[name="${g}"]:checked`)].map(x=>x.value);alert(`Chỉ chọn ${max} đáp án.`)}ssSet(g,JSON.stringify(sel));navs.forEach(n=>document.getElementById('nav'+n)?.classList.toggle('answered',sel.length===max))}))}
function buildNav(){document.getElementById('navigator').innerHTML=Array.from({length:40},(_,i)=>`<button id="nav${i+1}" onclick="goQ(${i+1})">${i+1}</button>`).join('')} function goQ(n){const p=n<=13?1:n<=26?2:3;if(p!==current)showPassage(p);setTimeout(()=>document.getElementById('card'+n)?.scrollIntoView({behavior:'smooth',block:'center'}),60)}
function correct(q,u){return q.type==='text'?q.ans.map(norm).includes(norm(u)):norm(u)===norm(q.ans)} function displayKey(q){if(q.type==='select'||q.type==='choice'){const f=(q.opts||[]).find(x=>optionValue(x)===String(q.ans));return f||q.ans}return Array.isArray(q.ans)?q.ans.join(' / '):q.ans} function displayAnswer(q,u){if(!u)return 'Không trả lời';if(q.type==='select'||q.type==='choice'){const f=(q.opts||[]).find(x=>optionValue(x)===String(u));return f||u}return u}
function reviewHTML(q,u){const r=answerReview[q.n];return `<div class="inline-review" data-review="${q.n}"><div class="inline-review-title">Q${q.n} · Giải thích câu sai</div><div class="review-row"><div class="review-label">Bạn trả lời</div><div class="student-wrong">${esc(displayAnswer(q,u))}</div></div><div class="review-row"><div class="review-label">Đáp án đúng</div><div class="correct-answer">${esc(displayKey(q))}</div></div><div class="explain"><b>Vì sao?</b> ${esc(r.explain)}</div><div class="evidence"><b>Evidence:</b> “${esc(r.evidence)}”</div><button class="evidence-btn" onclick="focusEvidence(${q.n})">↗ Đối chiếu trong bài đọc</button></div>`}
function placeReview(q,u,ok){document.querySelectorAll(`[data-review="${q.n}"]`).forEach(e=>e.remove());if(ok)return;const c=document.getElementById('card'+q.n);if(!c)return;const host=c.classList.contains('card')?c:(c.closest('p,.match-row')||c.parentElement);host.insertAdjacentHTML('beforeend',reviewHTML(q,u))}
function multiSpec(g){return g==='g2324'?{key:['B','C'],nav:[23,24],p:2,evidenceQ:23}:g==='g2526'?{key:['C','D'],nav:[25,26],p:2,evidenceQ:25}:{key:['A','D','E'],nav:[38,39,40],p:3,evidenceQ:38}}
function markMulti(g){const s=multiSpec(g),sel=getGroup(g),hits=sel.filter(x=>s.key.includes(x)).length,perfect=hits===s.key.length&&sel.length===s.key.length;document.querySelectorAll(`[data-group="${g}"]`).forEach(l=>{l.classList.remove('correct','wrong');if(s.key.includes(l.dataset.val))l.classList.add('correct');else if(sel.includes(l.dataset.val))l.classList.add('wrong')});const fb=document.getElementById('fb'+g);if(fb)fb.textContent=perfect?`✓ Correct — ${hits} / ${s.key.length}`:`Correct answers: ${s.key.join(', ')} · Score: ${hits} / ${s.key.length}`;s.nav.forEach(n=>{const e=document.getElementById('nav'+n);if(e){e.classList.remove('answered','correct','wrong','partial');e.classList.add(perfect?'correct':hits>0?'partial':'wrong')}});const host=document.getElementById('review'+g);if(host&&!perfect){const r=answerReview[s.evidenceQ];host.innerHTML=`<div class="inline-review"><div class="inline-review-title">Nhóm câu ${s.nav[0]}–${s.nav.at(-1)}</div><div class="review-row"><div class="review-label">Bạn chọn</div><div class="student-wrong">${esc(sel.join(', ')||'Không trả lời')}</div></div><div class="review-row"><div class="review-label">Đáp án đúng</div><div class="correct-answer">${s.key.join(', ')}</div></div><div class="explain"><b>Vì sao?</b> ${esc(r.explain)}</div><div class="evidence">“${esc(r.evidence)}”</div><button class="evidence-btn" onclick="focusEvidence(${s.evidenceQ})">↗ Đối chiếu trong bài đọc</button></div>`}document.querySelectorAll(`input[name="${g}"]`).forEach(e=>e.disabled=true);return hits}
function markPassage(p){for(const q of questions.filter(x=>x.p===p&&x.type!=='multi')){const u=ssGet('q'+q.n)||'',ok=correct(q,u),e=document.getElementById('q'+q.n);if(e){e.classList.remove('correct','wrong');e.classList.add(ok?'correct':'wrong')}document.querySelectorAll(`label[data-q="${q.n}"]`).forEach(l=>{l.classList.remove('correct','wrong');if(norm(l.dataset.val)===norm(q.ans))l.classList.add('correct');else if(u&&norm(l.dataset.val)===norm(u))l.classList.add('wrong')});const nav=document.getElementById('nav'+q.n);if(nav){nav.classList.remove('answered');nav.classList.add(ok?'correct':'wrong')}placeReview(q,u,ok)}if(p===2){markMulti('g2324');markMulti('g2526')}if(p===3)markMulti('g3840');document.querySelectorAll('#questionsCopy input,#questionsCopy select').forEach(e=>e.disabled=true)}
function focusEvidence(n){const q=qBy(n),r=answerReview[n],reveal=()=>{const ps=[...document.querySelectorAll('#passageCopy p[data-para]')],t=ps[r.para-1];if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.add('evidence-pulse');setTimeout(()=>t.classList.remove('evidence-pulse'),3000)}};if(q.p!==current){showPassage(q.p);setTimeout(reveal,120)}else reveal()}
async function submitExam(auto=false){if(submitted)return;saveMarkup('passage');saveMarkup('questions');const normal=questions.filter(q=>q.type!=='multi'&&!(ssGet('q'+q.n)||'').trim()).length;const mm=Math.max(0,2-getGroup('g2324').length)+Math.max(0,2-getGroup('g2526').length)+Math.max(0,3-getGroup('g3840').length);const unanswered=normal+mm;if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu/ô đáp án chưa hoàn thành. Vẫn nộp bài?`))return;submitted=true;clearInterval(timerHandle);let total=0,s=[0,0,0,0],details=[];for(const q of questions.filter(q=>q.type!=='multi')){const u=ssGet('q'+q.n)||'',ok=correct(q,u);if(ok){total++;s[q.p]++}details.push({q:q.n,answer:u,correct:ok,key:displayKey(q)})}for(const g of ['g2324','g2526','g3840']){const sp=multiSpec(g),sel=getGroup(g),hits=sel.filter(x=>sp.key.includes(x)).length;total+=hits;s[sp.p]+=hits;details.push({q:sp.nav.join('-'),answer:sel.join(', '),correct:hits===sp.key.length,key:sp.key.join(', '),score:hits})}markPassage(current);const name=document.getElementById('studentName').value.trim(),cls=document.getElementById('studentClass').value.trim(),dur=Math.round((Date.now()-startedAt)/1000);document.getElementById('resultStudent').textContent=`${name} — ${cls}`;document.getElementById('resultScore').textContent=`${total} / 40`;document.getElementById('resultPercent').textContent=`${Math.round(total/40*100)}% correct`;document.getElementById('p1score').textContent=`${s[1]} / 13`;document.getElementById('p2score').textContent=`${s[2]} / 13`;document.getElementById('p3score').textContent=`${s[3]} / 14`;document.getElementById('reviewSummary').innerHTML=total===40?'🎉 Bạn đã trả lời đúng cả 40 câu.':`Có <b>${40-total} điểm cần xem lại</b>. Đóng bảng điểm để xem giải thích + evidence ngay dưới câu sai.`;document.getElementById('resultOverlay').classList.remove('hidden');document.getElementById('sheetStatus').textContent='Đang gửi kết quả về Google Sheet...';const p=new URLSearchParams({name,className:cls,total:String(total),maxScore:'40',durationSeconds:String(dur),activity:'IELTS Reading - Jethro Tull / Body Clock / Origin of Language',reading:String(s[1]),grammar:String(s[2]),ing:String(s[3]),writingA:JSON.stringify(details),submittedAt:new Date().toISOString()});try{await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p.toString()});document.getElementById('sheetStatus').textContent='✓ Đã gửi kết quả về Google Sheet.'}catch(e){document.getElementById('sheetStatus').textContent='Không gửi được kết quả về Google Sheet.'}}
function closeResult(){document.getElementById('resultOverlay').classList.add('hidden');markPassage(current)}
</script></body></html>
