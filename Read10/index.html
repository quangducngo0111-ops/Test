ne);border-radius:9px;padding:14px 15px;margin:10px 0;scroll-margin:100px}.card-head{display:flex;gap:10px;align-items:flex-start}.qtext{flex:1;line-height:1.45}.option{display:block;border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:7px 0;cursor:pointer}.option.correct{border-color:var(--good);background:#edf7f1}.option.wrong{border-color:var(--bad);background:#fff1ee}.bank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 14px;background:#f3f6f8;border:1px solid var(--line);border-radius:8px;padding:11px;margin:9px 0 13px;font-size:.9rem}.match-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}.match-label{flex:1;min-width:240px;line-height:1.5}.diagram{width:100%;max-width:850px;display:block;margin:10px auto;border:1px solid var(--line);border-radius:8px;background:#fff}.diagram-answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.multi-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px 15px;margin:10px 0}.multi-score-note{font-size:.88rem;color:var(--muted);margin-top:7px}.nq.partial{background:#fff0c9!important;border-color:#d6a534!important}.feedback{font-size:.87rem;margin-top:6px}.good{color:var(--good)}.bad{color:var(--bad)}.inline-review{margin:11px 0 4px;padding:12px 13px;border:1px solid #e3c8c1;border-left:4px solid var(--bad);border-radius:8px;background:#fffaf8;font-size:.91rem;line-height:1.5}.inline-review-title{font-weight:800;color:var(--navy);margin-bottom:7px}.review-row{display:grid;grid-template-columns:105px 1fr;gap:5px 8px;margin:3px 0}.review-label{color:var(--muted);font-weight:700}.student-wrong{color:var(--bad);font-weight:700}.correct-answer{color:var(--good);font-weight:800}.explain{margin-top:8px;background:#fff;border-left:3px solid var(--blue);padding:8px 9px;border-radius:4px}.evidence{margin-top:8px;background:#f2f7fa;border:1px solid #d7e3ea;padding:8px 9px;border-radius:7px}.evidence-btn{margin-top:8px;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:6px;padding:6px 9px;font-size:.83rem;font-weight:700;cursor:pointer}.evidence-pulse{outline:3px solid rgba(231,121,78,.45);background:#fff8e8;border-radius:5px}.review-note{background:#eef5f9;color:var(--navy);padding:9px 11px;border-radius:7px;font-size:.9rem;font-weight:700;margin-bottom:10px}.bottom{border-top:1px solid var(--line);padding:9px 10px;background:#fff;display:flex;gap:9px;align-items:center}.nav{display:flex;gap:4px;overflow:auto;flex:1}.nav button{min-width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:5px;font-size:11px;font-weight:800;cursor:pointer}.nav button.answered{background:#dceaf5}.nav button.correct{background:#dff0e7;border-color:var(--good)}.nav button.wrong{background:#f4ddd8;border-color:var(--bad)}.submit{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:10px 15px;font-weight:800;cursor:pointer}.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,20,30,.72);display:flex;align-items:center;justify-content:center;padding:20px}.result{background:#fff;border-radius:14px;padding:25px;width:min(620px,100%);max-height:90vh;overflow:auto}.score{font-size:2.5rem;color:var(--navy);font-weight:800}.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.breakdown div{background:#f3f6f8;padding:10px;border-radius:8px;text-align:center}@media(max-width:850px){.workspace{grid-template-columns:1fr}.pane{height:48vh}.passage-pane{border-right:0;border-bottom:1px solid var(--line)}.bank,.diagram-answers{grid-template-columns:1fr}}</style></head><body>

<script>const STORAGE_PREFIX="READ_WHALE_HERBAL_KITCHEN_";
const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwfwWjJ7Q3VTJEF5ldKGnFKYoziQdntAzRjq1Yqy6HSmbZSc69ijSdOvMCC_Zogbpcm/exec";
const passages={"1": {"title": "The Whale Goes to Court", "subtitle": "A remarkable legal drama in the U.S.A.", "text": "<p data-para=\"1\">In 1818 a whale became the subject of a controversial court case in New York City. The case involved an old law requiring those who sold fish oil to pay a fee in order to have their barrels inspected by city officials, and certified. However, an oil merchant named Samuel Judd refused to pay the inspection fee on three barrels of oil, claiming that no inspection was necessary because it was whale oil, and whales were not fish. The state disagreed, and so a date was set for a court to decide not a point of law, but the answer to a more fundamental question: is a whale a fish?</p><p data-para=\"2\">As simple as that question may appear today, the answer was far from obvious in the early nineteenth century. Indeed, the public debate in New York sparked off by the trial was sensational. At stake was nothing less than what most regarded as the order of nature. According to the commonly accepted scheme of things, if an animal was not a beast or a bird, it was a fish, regardless of whether it breathed air or suckled its young. For as long as anyone could remember, all non-human creatures had been organised according to the categories of birds, beasts and fish. For the average person the answer seemed perfectly obvious: whales swam in the sea and therefore they were fish.</p><p data-para=\"3\">Against this traditional framework stood the new Linnaean system of classification, which sought to introduce more scientific values into the classification of living things. Barely half a century old in 1818, the Linnaean system controversially classified whales as mammals because they shared two mammalian characteristics: they were warm-blooded and breathed air.</p><p data-para=\"4\">So the trial began in December 1818. Judd’s defence lawyers chose as their star witness one of New York’s most prominent figures, the congressman Samuel Mitchill. Referred to as a ‘living encyclopaedia’ and a ‘walking library’, Mitchill was a renowned natural history lecturer at the College of Physicians and Surgeons who liked to dare his students to test his knowledge of the natural world. ‘Show me the fin, and I will name the fish,’ he boasted. Scientifically, it was an open-and-shut case, and Judd’s defence lawyers believed they only had to do one simple thing to win the trial: insist that it be decided by biology alone. Mitchill seemed fully qualified for this role.</p><p data-para=\"5\">But this is where the case becomes interesting, and is the reason why the trial of the whale is not some dusty nineteenth-century obscurity. For rather than debate Mitchill on his area of expertise, lawyers for the New York City fish-oil inspectors chose a different tack. Lead counsel William Sampson turned the trial into a contest between scientific learning and common sense, by asking plain-spoken whalers to make their case before the jury.</p><p data-para=\"6\">The crux of Sampson’s case was the trial’s implication with regard to humans, should Judd be found not guilty. Sampson told jury members that if they accepted Mitchill’s testimony on whales, they were obliged to accept a lower place for their own kind in the natural order. As a result, Mitchill’s day in court did not go smoothly, not least because he was forced to acknowledge serious disputes among his peers regarding exactly how to classify biological organisms. Sampson then took aim at Mitchill himself and what he represented: privileged aristocrats from the scientific community who had lost touch with reality. The smooth-talking Sampson then claimed Mitchill’s beliefs had their origin in Europe – something he rightly judged would infuriate the citizens of always-independent New York. This revolutionary new thinking, Sampson argued, was something that honest working New Yorkers could do without. No longer was this a case about barrels of oil, but the proper place of scientific knowledge in the U.S.A.</p><p data-para=\"7\">Ultimately, what won the case for Samuel Judd were not Mitchill’s scientific arguments, but testimony from a different sphere altogether. In New York’s markets, the merchants implicitly understood that whale oil and fish oil were not the same: whale oil could be used as a fuel for lamps because it could be burned without giving off smoke; fish oil, on the other hand, was nasty, impure stuff used primarily in tanning leather. In the end it was this testimony that led to Judd’s victory.</p><p data-para=\"8\">The trial of the whale still has relevance today, when the court of public opinion remains easily swayed by sceptics. The 1818 trial was really about this question: who gets to decide on the place of the natural world in the human world – scientific experts or public opinion? Whether the issue today is the effects of human activity on the climate of this planet, or one of many other contemporary topics, the legacy of Judd’s case continues to be of relevance.</p>"}, "2": {"title": "Herbal Medicine", "subtitle": "", "text": "<p data-para=\"1\"><b>A</b> There is an age-old practice of harvesting plants and herbs in their natural environment for use as medicines. And today there is huge potential for New Zealand to develop a herb industry based on the excellent growing conditions and expertise there, according to Phil Rasmussen, a pharmacist and medical herbalist. Take arnica for example, a popular pharmaceutical herb used to treat bruises and joint problems. Traditionally collected by Romanian communities in Europe, it is now in high demand worldwide as interest develops in the capabilities of the small alpine plant. A 2008 report for the Plant and Food Research organization concluded that New Zealand has a good opportunity to cultivate arnica flowers and roots for the international markets. However, the initiative was stopped in its tracks when the government abruptly halted funding for the research programmer. It was an unjustified move, according to agronomist Malcolm Douglas, based on a number of inaccurate views about weed invasion.</p><p data-para=\"2\"><b>B</b> The history of herbal medicines in New Zealand has long featured disagreements of this sort. For the early Maori people the original inhabitants of New Zealand the forest was well stocked with edible plants that were an obvious source of nutrition, but that were taken for the relief of pain as well. While the earliest European doctors in New Zealand relied on imported dried herbs, many were keen to include native plants in their practices: in his book published in 1891, herbalist James Neil described manuka and koromiko as among New Zealand's most valuable herbs. Despite its popularity among some, however, herbalism continued to have its detractor. In 1907 Neil, president of the then very young New Zealand Association of Medical Herbalists (NZAMH), petitioned parliament for legal status for herbalists, but he was unsuccessful. The Evening Post newspaper perhaps summed up the opposing position by claiming that herbalism 'is obsolete'.</p><p data-para=\"3\"><b>C</b> In fact, traditional Maori medicine faced a more determined challenge. In 1908 the government passed a controversial law that had the effect of restricting traditional herbal practice, or pushing it underground. Then for a brief period in the mid-20th century, herbal medicine was largely ignored, shunned by the majority of the medical profession, and absent from medical school curricula. But a centuries-old tradition was not going to disappear so easily, and in the 1980s the NZAMH was revived, and it became possible to complete a course in herbal medicine at several polytechnics around the country. However, the problem remained of how to connect the culture of plant-based medicine with conventional scientific thinking in order to promote herbal use within the general population. For many years, the limited evidence there was that herbal medicines worked was undermined by lack of interest among general practitioners and within the scientific community.</p><p data-para=\"4\"><b>D</b> Today, the ideas of herbalists in the 1980s-eat a varied diet, include lots of fresh fruit and vegetables, recognise stress - are completely accepted by the medical establishment and widely practiced in society as a whole. Natural health products are big sellers in pharmacies, and global pharmaceutical companies are buying up natural supplement brands or developing their own.</p><p data-para=\"5\"><b>E</b> What’s more, according to Rasmussen, robust clinical trials show that herbal medicine is generally safe-safer than most drugs. ‘It doesn’t do everything,’ he says, ‘but there’s a lot it does do, particularly in terms of preventative health care.’ One significant issue for today’s export-oriented herbal medicine producers is the question of how to guarantee standards for consumers in different countries. In other words, there is the need for some form of globally recognised system of documentation. Rasmussen's range of extracts are produced under the Good Manufacturing Practice (GMP) scheme, which is respected around the world. So too is the range produced by Sandra Clair, who says that such assurance is expensive but necessary if you want to export herbal remedies to the rest of the world. Moves to launch a joint Australia-New Zealand agency to regulate herbal remedies under a single, streamlined licensing process have recently been revived, after being abandoned in 2007 through lack of support in parliament.</p><p data-para=\"6\"><b>F</b> There are those in the industry who support further regulation still. According to Rasmussen, some herbs should require a prescription from a suitably qualified medical herbalist or doctor. For example, consumers shouldn't be able to go to their local supermarket and buy St John's Wort, according to Rasmussen, because it can interact in harmful ways with at least ten pharmaceutical drugs. Isla Burgess, who is part of the International Research Group for the Conservation of Medicinal Plants, agrees that tighter regulation is necessary,' but for a different reason. 'More than 400,000 tones of medicinal and aromatic plants are trade in the world each year,' says Burgess. 'The great majority of these are harvested from the wild, so they each have an impact on their local ecosystem.' She gives the example of elm trees in the USA ringbarked and stripped for the growing market for a product called 'slippery elm': this endangered tree should be protected. But others argue that more regulation would be prohibitively expensive for all but the largest manufacturers - a change, cautions Clair, that would probably put some local companies out of business[24.1]. So, for the time being at least, it seems that the topic of herbal medicines will continue to provoke debate.</p>"}, "3": {"title": "Science in the kitchen", "subtitle": "Chefs are bringing a new standard of experimentation and precision to their cooking.", "text": "<p data-para=\"1\">There is a recent movement in the world of food, in which chefs are collaborating with scientists to teach themselves the chemistry and physics of cuisine. Even academics are getting excited about the results. Colin Osborne of the Royal Society of Chemistry in London is enthusiastic: “Chefs are using unusual methods to produce exciting dishes that would be impossible without modern science,” he says. You may wonder what’s wrong with long established culinary traditions. The fact is, many culturally ingrained cooking methods are less than perfect. Osborne gives the example of the common belief that frying meat seals in moisture, while researchers who weighed the meat actually found that moisture is lost in the process. Another example is the age old technique of adding salt when boiling vegetables to raise the water’s boiling point, thus cooking the vegetables faster. In fact, the amount of salt typically added does not raise the temperature significantly – or improve the flavour, since only a minuscule amount is absorbed.</p><p data-para=\"2\">Hervé This, director of the Molecular Gastronomy team at the French National Institute for Agricultural Research, spends much of his time trying to disprove culinary old wives’ tales. He is empirically testing traditional beliefs about cooking and disproving the more absurd, tackling such questions as whether it’s better to add vinaigrette to potato salad while the potatoes are still hot. “The first modern chemists used kitchen equipment to do their experiments,” Hervé This explains. “Since then, chemistry has undergone massive changes – but cooking methods have remained largely as they were in the Middle Ages.”</p><p data-para=\"3\">“It’s seriously important work,” says Peter Barham, a physicist at Bristol University. “If you understand what’s going on in cooking, you’ll be better equipped to improve it.” Barham contends that it’s difficult to get consistent results from cookery books, because recipes are typically poorly written. In stark contrast, he notes, scientific papers are subject to peer review, whereby experts pore over experiments to ensure they can be accurately reproduced.</p><p data-para=\"4\">Barham also collaborates with leading British chef Heston Blumenthal, proprietor of The Fat Duck, a restaurant in the south of England. The restaurant is widely regarded as one of the best in the world, serving delightfully unexpected dishes such as nitro scrambled egg and bacon ice cream.</p><p data-para=\"5\">When Simon Campbell of the Royal Society of Chemistry bestowed an honorary fellowship on Blumenthal for creative applications of science to cooking, he said: “The scientific community admires and respects the research that Mr Blumenthal has performed to harness cuisine to science. Through his inquisitive and innovative approach to food he has underlined spectacularly how chemistry permeates all aspects of texture, taste and smell.”</p><p data-para=\"6\">Although some dishes sound gimmicky, this innovative approach to cooking is paying off. El Bulli in Catalonia, Spain – directed by chef Ferran Adrià – is another leading restaurant thus enthusiastically engaging with scientific techniques. It closes for six months of the year (to allow six months for research and development), yet is rumoured to be booked out for an entire year in advance.</p><p data-para=\"7\">Such restaurants are part of the movement known as ‘molecular gastronomy’, an expression coined by physicist Nicholas Kurti, working in collaboration with Hervé This. Kurti once quipped that “it is a sad reflection that we know the temperature inside the stars better than the temperature inside a soufflé\\.” Kurti and Hervé This devised the expression ‘molecular gastronomy’ during the 1980s to denote the science of culinary transformations and eating phenomena, and differentiate it from food science.</p><p data-para=\"8\">“Twenty years ago the worlds of science and cooking were neatly compartmentalised,” agrees author Harold McGee, a top food science writer. “There was food science: an applied science mainly concerned with understanding the materials and processes of industrial manufacturing. And there was the world of domestic and restaurant cooking, traditional crafts that had never attracted much scientific attention.”</p><p data-para=\"9\">A lot has changed in the two decades since he published his influential book on the topic. In a revised edition, McGee says the book was “riding a rising wave of general interest in food, a wave that grew and grew, and knocked down the barriers between science and cooking, especially in the last decade. Science has found its way into the kitchen, and cooking into laboratories.”</p><p data-para=\"10\">So what does the future hold? Rachel Edwards Stuart is a graduate PhD student who is studying some remarkable food additives, including modified cellulose gels that solidify on heating and melt again as they are cooled. The idea is to make dishes that develop different flavours as they are eaten. Her other project is creating drinks that change flavour.</p><p data-para=\"11\">“The concept came from Roald Dahl’s children’s book Charlie and the Chocolate Factory, where Willy Wonka makes a bubble gum that is a whole meal in one sweet,” she says. Unfortunately, Edwards Stuart was unable to say more, due to a confidentiality agreement with the restaurant for which she conducts her research.</p><p data-para=\"12\">While Hervé This, Blumenthal and Edwards Stuart are the pioneers, the next phase will be to bring science into kitchens at home. Already there are books that provide an insight into the wondrous chemistry that turns humble ingredients into cuisine. And as the movement grows it will not be long before we see laboratory test tubes, flasks and maybe the odd centrifuge on sale next to carving knives, rolling pins and pressure cookers.</p><p class=\"footnote\"><i>* soufflé: a French dish made using beaten eggs</i></p>"}};

      <p>New Yorkers disliked Mitchill because his ideas came from ${inlineText(10)}.</p>
      <p><b>Conclusions</b></p>
      <p>In the end it was statements from local ${inlineText(11)}, not Mitchill’s testimony, which helped Judd win.</p>
      <p>Whale oil made a good ${inlineText(12)} because it was clean.</p>
      <p>Judd’s case is relevant today, e.g. in the debate about Earth’s ${inlineText(13)}.</p>
    </div>
  </div>`;
}
function renderP2Summary(){
  return `<div class="group"><h3>Questions 18–21</h3>
    <div class="inst">Complete the summary below. Write <b>ONE WORD ONLY</b> from the passage for each answer.</div>
    <div class="completion">
      <h4>The history of herbal medicines in New Zealand</h4>
      <p>
        Originally, the Maori people consumed plants to help deal with ${inlineText(18)} and also as food.
        When Europeans settled in the country, a ${inlineText(19)} by James Neil showed that some of them also recognised the medicinal value of native plants.
        However, criticism of herbal medicine appeared in one newspaper in 1907.
        The following year, the use of herbal medicines was made more difficult because of a new ${inlineText(20)}, and for a time in the mid-20th century, they were largely ignored.
        Then, in the 1980s, a number of institutions started offering a ${inlineText(21)} in the subject.
      </p>
    </div>
  </div>`;
}
function renderSentenceEndings(){
  const rows=questions.filter(q=>q.n>=36&&q.n<=40),opts=rows[0].opts;
  return `<div class="group"><h3>Questions 36–40</h3>
    <div class="inst">Complete each sentence with the correct ending, <b>A–H</b>, below.</div>
    <div class="bank">${opts.map(x=>`<div>${x}</div>`).join('')}</div>
    ${rows.map(q=>`<div class="match-row" id="card${q.n}">
      <div class="match-label"><span class="qnum">${q.n}</span> ${q.text}</div>
      ${inlineSelect(q.n,opts).replace(`id="card${q.n}"`,'')}
    </div>`).join('')}
  </div>`;
}
function buildQuestions(p){
  let h='';
  if(p===1){
    h+=renderChoiceGroup(1,7,'Questions 1–7','Choose TRUE, FALSE or NOT GIVEN.');
    h+=renderP1Notes();
  }else if(p===2){
    h+=renderMatch(14,17,'Questions 14–17','Which paragraph contains the following information? Choose A–F. You may use any letter more than once.',false);
    h+=renderP2Summary();
    h+=renderMatch(22,26,'Questions 22–26','Match each statement with the correct person, A–D. You may use any letter more than once.',true);
  }else{
    h+=renderChoiceGroup(27,31,'Questions 27–31','Choose YES, NO or NOT GIVEN.');
    h+=renderChoiceGroup(32,35,'Questions 32–35','Choose the correct answer.');
    h+=renderSentenceEndings();
  }
  const saved=ssGet(markupKey('questions',p));
  document.getElementById('questionsPane').innerHTML=annotationToolbar('questions')+`<div id="notesQuestions" class="notes-panel"></div><div id="questionsCopy">${saved||h}</div>`;
  restore(p);bindTracking();bindAnnotations('questions');renderNotes('questions');
  if(submitted){
    const copy=document.getElementById('questionsCopy');
    if(copy&&!copy.querySelector('.review-note'))copy.insertAdjacentHTML('afterbegin','<div class="review-note">Review mode: câu sai có giải thích và evidence ngay bên dưới.</div>');
    markPassage(p);
  }
}
function showPassage(p){
  saveMarkup('passage');saveMarkup('questions');current=p;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.p===p));
  document.getElementById('passagePane').innerHTML=passageHTML(p);
  bindAnnotations('passage');renderNotes('passage');buildQuestions(p);
  document.getElementById('passagePane').scrollTop=0;
  document.getElementById('questionsPane').scrollTop=0;
}
function save(n,v){
  ssSet('q'+n,v);
  document.getElementById('nav'+n)?.classList.toggle('answered',String(v).trim()!=='');
}
function restore(p){
  for(const q of questions.filter(x=>x.p===p)){
    const v=ssGet('q'+q.n)||'';
    const e=document.getElementById('q'+q.n);
    if(e)e.value=v;
    if(q.type==='choice'&&v){
      const r=[...document.querySelectorAll(`input[name="q${q.n}"]`)].find(x=>x.value===v);
      if(r)r.checked=true;
    }
  }
}
function bindTracking(){
  document.querySelectorAll('.ans').forEach(e=>e.oninput=e.onchange=()=>save(+e.dataset.q,e.value));
  document.querySelectorAll('input[type="radio"]').forEach(e=>e.onchange=()=>save(+e.closest('.option').dataset.q,e.value));
}
function buildNav(){
  document.getElementById('navigator').innerHTML=Array.from({length:40},(_,i)=>`<button id="nav${i+1}" onclick="goQ(${i+1})">${i+1}</button>`).join('');
}
function goQ(n){
  const p=n<=13?1:n<=26?2:3;
  if(p!==current)showPassage(p);
  setTimeout(()=>document.getElementById('card'+n)?.scrollIntoView({behavior:'smooth',block:'center'}),60);
}
function correct(q,u){
  return q.type==='text'?q.ans.map(norm).includes(norm(u)):norm(u)===norm(q.ans);
}
function displayKey(q){
  if(q.type==='select'||q.type==='choice'){
    const f=(q.opts||[]).find(x=>optionValue(x)===String(q.ans));
    return f||q.ans;
  }
  return Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
}
function displayAnswer(q,u){
  if(!u)return 'Không trả lời';
  if(q.type==='select'||q.type==='choice'){
    const f=(q.opts||[]).find(x=>optionValue(x)===String(u));
    return f||u;
  }
  return u;
}
function reviewHTML(q,u){
  const r=answerReview[q.n];
  return `<div class="inline-review" data-review="${q.n}">
    <div class="inline-review-title">Q${q.n} · Giải thích câu sai</div>
    <div class="review-row"><div class="review-label">Bạn trả lời</div><div class="student-wrong">${esc(displayAnswer(q,u))}</div></div>
    <div class="review-row"><div class="review-label">Đáp án đúng</div><div class="correct-answer">${esc(displayKey(q))}</div></div>
    <div class="explain"><b>Vì sao?</b> ${esc(r.explain)}</div>
    <div class="evidence"><b>Evidence:</b> “${esc(r.evidence)}”</div>
    <button class="evidence-btn" onclick="focusEvidence(${q.n})">↗ Đối chiếu trong bài đọc</button>
  </div>`;
}
function placeReview(q,u,ok){
  document.querySelectorAll(`[data-review="${q.n}"]`).forEach(e=>e.remove());
  if(ok)return;
  const c=document.getElementById('card'+q.n);
  if(!c)return;
  const host=c.classList.contains('card')?c:(c.closest('.flow-step,p,.match-row')||c.parentElement);
  host.insertAdjacentHTML('beforeend',reviewHTML(q,u));
}
function markPassage(p){
  for(const q of questions.filter(x=>x.p===p)){
    const u=ssGet('q'+q.n)||'',ok=correct(q,u);
    const e=document.getElementById('q'+q.n);
    if(e){e.classList.remove('correct','wrong');e.classList.add(ok?'correct':'wrong')}
    document.querySelectorAll(`label[data-q="${q.n}"]`).forEach(l=>{
      l.classList.remove('correct','wrong');
      if(norm(l.dataset.val)===norm(q.ans))l.classList.add('correct');
      else if(u&&norm(l.dataset.val)===norm(u))l.classList.add('wrong');
    });
    const nav=document.getElementById('nav'+q.n);
    if(nav){nav.classList.remove('answered');nav.classList.add(ok?'correct':'wrong')}
    placeReview(q,u,ok);
  }
  document.querySelectorAll('#questionsCopy input,#questionsCopy select').forEach(e=>e.disabled=true);
}
function focusEvidence(n){
  const q=qBy(n),r=answerReview[n];
  const reveal=()=>{
    const t=document.querySelector(`#passageCopy p[data-para="${r.para}"]`);
    if(t){
      t.scrollIntoView({behavior:'smooth',block:'center'});
      t.classList.add('evidence-pulse');
      setTimeout(()=>t.classList.remove('evidence-pulse'),3000);
    }
  };
  if(q.p!==current){showPassage(q.p);setTimeout(reveal,120)}else reveal();
}
async function submitExam(auto=false){
  if(submitted)return;
  saveMarkup('passage');saveMarkup('questions');
  const unanswered=questions.filter(q=>!(ssGet('q'+q.n)||'').trim()).length;
  if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;
  submitted=true;clearInterval(timerHandle);
  let total=0,s=[0,0,0,0],details=[];
  for(const q of questions){
    const u=ssGet('q'+q.n)||'',ok=correct(q,u);
    if(ok){total++;s[q.p]++}
    details.push({q:q.n,answer:u,correct:ok,key:displayKey(q)});
  }
  markPassage(current);
  const name=document.getElementById('studentName').value.trim();
  const cls=document.getElementById('studentClass').value.trim();
  const dur=Math.round((Date.now()-startedAt)/1000);
  document.getElementById('resultStudent').textContent=`${name} — ${cls}`;
  document.getElementById('resultScore').textContent=`${total} / 40`;
  document.getElementById('resultPercent').textContent=`${Math.round(total/40*100)}% correct`;
  document.getElementById('p1score').textContent=`${s[1]} / 13`;
  document.getElementById('p2score').textContent=`${s[2]} / 13`;
  document.getElementById('p3score').textContent=`${s[3]} / 14`;
  document.getElementById('reviewSummary').innerHTML=total===40?'🎉 Bạn đã trả lời đúng cả 40 câu.':`Có <b>${40-total} câu cần xem lại</b>. Đóng bảng điểm để xem giải thích + evidence ngay dưới từng câu sai.`;
  document.getElementById('resultOverlay').classList.remove('hidden');
  document.getElementById('sheetStatus').textContent='Đang gửi kết quả về Google Sheet...';
  const data=new URLSearchParams({
    name,className:cls,total:String(total),maxScore:'40',durationSeconds:String(dur),
    activity:'IELTS Reading - Whale Court / Herbal Medicine / Science in the Kitchen',
    reading:String(s[1]),grammar:String(s[2]),ing:String(s[3]),
    writingA:JSON.stringify(details),submittedAt:new Date().toISOString()
  });
  try{
    await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data.toString()});
    document.getElementById('sheetStatus').textContent='✓ Đã gửi kết quả về Google Sheet.';
  }catch(e){
    document.getElementById('sheetStatus').textContent='Không gửi được kết quả về Google Sheet.';
  }
}
function closeResult(){
  document.getElementById('resultOverlay').classList.add('hidden');
  markPassage(current);
}
</script></body></html>
