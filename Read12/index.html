<script>const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwfwWjJ7Q3VTJEF5ldKGnFKYoziQdntAzRjq1Yqy6HSmbZSc69ijSdOvMCC_Zogbpcm/exec";
const passages={"1": {"title": "Candles", "subtitle": "", "text": "<p>One of the earliest forms of portable illumination, candles have served vital functions for humankind throughout history, a fact chronicled through the use of candles or candle-like objects in virtually every society. Historians believe the original candle may have been invented by early humans who dipped dried branches from trees into animal fat, thus producing a slow-burning and reliable source of light. Ancient Egyptian artworks depict the use of candles by writers and philosophers who worked long after sundown. These early candles were most likely developed from tapers that were made of fibrous materials mixed with wax or with tallow, the white, nearly tasteless fat of cattle or sheep also used to make soap.</p><p>A major improvement in candle making materials came in the Middle Ages, when beeswax was preferred over animal or vegetable fats candles were introduced to Europe. Beeswax was preferred over animal or vegetable fats because it smelled pleasant and did not produce as much mess as other fats. During this time, candles were primarily used as a source of illumination. However, this was not their only purpose. In the 15th century, for example, candles were used as a means of keeping time. At auctions, the bidding time was limited by inserting a pin into a candle and letting the wax melt until the pin dropped, thus concluding the period in which a bid could be made.</p><p>The growth of the whaling industry in the late 18th century brought another major change in candle making materials, as spermaceti wax, which was extracted from the oil of the sperm whale, became more widely available. Spermaceti wax was popular because it provided a significantly brighter light and burned evenly. Ozokerite, a colorless mineral hydrocarbon wax, was also popular in the 17th and 18th centuries, particularly in warmer weather, when its relatively high melting point meant it remained firm. Paraffin, a wax crystallized from petroleum, became popular during the 1860s. It was eventually blended with spermaceti and ceresin — a byproduct of refined petroleum oil. This created a more durable wax, and, thanks to the fact that it resulted in inexpensive candles of reasonably high quality; its use was widespread by the end of the 19th century.</p><p>The candle wick, the length of soft material which runs through the middle of the candle, was made from a variety of natural fibers. In 1824, Frenchman Jean-Jacques Cambaceres introduced an important refinement to wick technology with the plaited wick, which consisted of several strands of material woven together. This burned more evenly than unplaited wicks. Although candle making materials have changed through the years, the art of candle making has remained surprisingly similar to the original production process.</p><p>Originally, candles were produced by hand using an approach known as the dipping method. Dating back to the Middle Ages, the method involved the use of wicks made from rushes. These were repeatedly dipped into molten fat until the desired thickness of fat had stuck to them. In the pouring method, which was introduced later, melted beeswax was poured over a suspended cotton wick while the wick was manually twirled. After a sufficient amount of wax had gathered at the bottom of the wick, the candle was reversed and wax was poured from the other end.</p><p>It was not until the 1830s that the large-scale manufacture of candles became a reality when British manufacturer Joseph Morgan introduced the first mass-production candle making machine. Today’s modern machines are strikingly similar to Morgan’s original machine, with speed and the quality of the finished product being the only major differences.</p><p>In today’s manufacturing process, different substances are often mixed together to create stronger candles with higher melting points. In the United States, for example, standard commercial candles are made of paraffin, stearic acid and beeswax. Some candles also contain small amounts of candelilla, which comes from the stem of the candelilla shrub, or carnauba wax, which is from the leaves of the carnauba palm.</p><p>In the many decorative candles that are made, waxes other than beeswax and paraffin are used. One example is bayberry wax, which is derived from the fruit of the bayberry bush and has a distinctive aroma. In decorative candles, non-burning wax is used to make the casing, which is not intended to melt.</p><p>Today’s wicks are made of a high grade of cotton or linen. The material is woven (or plaited) so that it will burn in one direction and will curl so that its end remains in the candle flame’s oxidizing zone for even and intense burning. Often, these wicks have a center made of wire that allows them to burn slightly hotter than cotton and remain erect in the melted wax.</p>"}, "2": {"title": "Introduction to a book about the assessment of carbon footprints", "subtitle": "", "text": "<p><b>A</b> As this book is about ways of measuring the carbon footprint of particular things, I should start by making it clear what I mean. I am using the word ‘carbon’ as shorthand for all the different global-warming greenhouse gases, and I am using the word ‘footprint’ as a metaphor for the total impact that something has. So I am using the phrase ‘carbon footprint’ as shorthand to mean the full climate-change impact of something. That something could be anything – an activity, an item, a lifestyle, a company, a country, or even the whole world.</p><p><b>B</b> Measuring carbon footprints is a long way from being an exact process, whatever anyone tells you, or whatever numbers you might see written on the side of products in some shops. All my numbers are best estimates and nothing more, even though I have reached them as carefully as I can.</p><p><b>C</b> I have used a variety of different methods, and so I have drawn on a range of data sets and models taken from publicly available reports of life-cycle studies. I have also used studies carried out for businesses across different industries by my own company, Small World Consulting, using models that we are developing all the time. Often I have arrived at numbers by a couple of different routes, to check that the results agree with each other. Occasionally, it has been more a case of putting my finger in the air and guessing, but when that has been the case I have tried to make it clear.</p><p><b>D</b> The publicly available data sets I have used were arrived at by two main methods. The first of these, process-based life-cycle analysis, is the most common approach to carbon footprint calculations. It is often referred to as ‘bottom-up’ because you start off identifying, one by one, all the processes that have had to happen in order for, say, a product to be created. Then you add up the emissions from each process, and that is the footprint of the product. It may sound simple, but it is not at all. It is back-breaking work, and since the number of processes you really need to include is always infinite, the job is never quite complete, so you end up with an underestimate. In fact, the omissions from the calculation are often shocking: they can be fifty per cent or more. To make matters worse, these problems are commonly overlooked, even in the development of government-backed and government-funded guidelines, such as the UK’s PAS 2050 standard. But for all the problems, process-based life-cycle analysis is still an essential source of detailed information that can’t be gathered any other way.</p><p><b>E</b> The other method is environmental input-output analysis. This is a neat alternative to process-based life-cycle analysis. It is not as popular, perhaps because it is a bit less easy to understand, but it is at least as robust as anything else in the dim world of measuring carbon footprints. It is sometimes called a ‘top-down’ approach because it begins by looking at the whole economy. It uses macroeconomic modelling to understand the way in which the activities of one industry trigger activities and emissions in every other industry. Input-output analysis’ key ‘trick’ is a piece of ingenious maths (for which a man called Wassily Leontief got a Nobel Prize) that succeeds in capturing the endless ripple effects in a way that is one hundred per cent complete. It has the further advantage that if you know how much something costs, you can get an instant crude estimate of its carbon footprint. It is like a magic trick. And just like all the best magic it is also a bit too good to be true – in many cases the results can be ridiculously general and of little value.</p><p><b>F</b> Input-output analysis is nevertheless a method of choice both because it does not miss things, and because once a specific model has been built it is often easy to use. The basic technique is well established. The specific model I have used is one that was developed at Small World Consulting in collaboration with Lancaster University in the UK, and draws mainly on data obtained from government sources. It was based on a 2007 picture of the UK economy. It deals with all the greenhouse gases, and employs a weighting factor for gases emitted at a high altitude, which have a greater impact than ground-level emissions. A key weakness, which I sometimes adjust for, is that it treats imported products as though they had the same carbon intensity as products from within the UK, whereas in reality imports are usually more carbon intensive.</p><p><b>G</b> Most of the time I have used a combination of life-cycle analysis and input-output analysis to get my numbers. At its best, life-cycle analysis can be more precise, but input-output analysis is often able to get at information that life-cycle analysis is unable to reach. Putting the two methods together is sometimes called a hybrid approach, and the result is a bit like looking through both a microscope and a telescope at the same time. They each show you different things, and between them, if the lenses are clean, you end up with a passable understanding of whatever it is you are looking at. life-cycle: the stages of a product’s life from beginning to end (i.e. from raw material extraction through materials processing, manufacture, distribution, use, repair and maintenance, and disposal or recycling)</p><p class=\"footnote\"><i>* life-cycle: the stages of a product’s life from beginning to end (from raw material extraction through processing, manufacture, distribution, use, repair and maintenance, and disposal or recycling)</i></p>"}, "3": {"title": "The Science of Shopping", "subtitle": "", "text": "<p>You may have wondered why so many supermarkets are virtually indistinguishable from each other. It is not, as some might suspect, that the companies operating them lack imagination. It is more that they are all well-versed in the science of persuading people to buy things – a science that, thanks to technological advances, is beginning to understand what motivates consumers when they make decisions on what to purchase.</p><p>It takes a while for the mind to get into a shopping mode. People need to make a gentle start and take stock of the surroundings. This is why some supermarkets have a so-called ‘chill zone’ for browsing magazines, books and DVDs, an area which is also designed to catch the customer’s eye and tempt them to make impulsive purchases. But many will ignore it, in which case the first thing they encounter is the fresh fruit and vegetables section. For shoppers, this makes no sense. Fruit in particular can be easily bruised, so ideally should be bought at the end, not the beginning, of a shopping trip. But psychology is at work here: selecting wholesome fresh food is an uplifting way to start shopping, and it makes people feel less guilty about reaching for the less nutritious stuff later on.</p><p>Shoppers have worked out that everyday items, like milk, will invariably be placed in an aisle towards the back of a store to provide more opportunity to tempt customers on their way there. This is also why pharmacies are generally at the rear, even in ‘convenience’ stores. But supermarkets know shoppers know this, so they use other tricks, like placing popular items halfway along a section, thereby forcing people to walk along the aisle looking for them. The idea is to boost the length of time shoppers spend in a store.</p><p>Having walked to the end of the fruit and vegetable aisle, shoppers arrive at counters of prepared food, the fishmonger and the butcher. Then there is the in-store bakery, which can be smelt before being seen. Even small supermarkets now use in-store bakeries. Mostly these bake pre-prepared items, and they have boomed, although central bakeries that deliver to many stores are more efficient. The smell of freshly baked bread can make people hungry, encouraging them to buy not just bread but other food.</p><p>There are also numerous ways stores get shoppers to choose particular products. For example, stores encourage customers to buy expensive branded products by arranging them at eye-level, with cheaper ones lower down. Often head offices specify where everything has to be placed and spot-checks are carried out to make sure instructions are followed to the letter. But shelf-positioning is extremely controversial. Despite all the academic papers written on how best to stack shelves, retailers have their own views. While many stores consider eye-level to be the top spot, others think a little higher is better.</p><p>Technology is making the process of monitoring shopper behaviour easier, which is why the security cameras in stores may be doing considerably more than watching out for theft. Pictures showing shoppers while they are making their selections can now be analysed. It is possible to see how many shoppers went straight to one brand, the number that hesitated, and those that compared several brands. However, despite the availability of sophisticated technology, researchers have found that simply talking to consumers as they exit the store can yield valuable insights. This low-tech approach has become widespread following comments from stores that data collected electronically tells them little about why so many customers leave without making a purchase. Face-to-face interviews reveal that customers leave shops empty-handed more often because they are ‘unable to decide’ than because prices are too high.</p><p>People tell market researchers that they make decisions about what to buy based on logic and common sense, considering issues such as price, quality or convenience. But there are clearly other factors which play a role, such as certain feelings and memories which individuals are not fully aware of. Researchers hired by big stores are now conducting studies using functional magnetic resonance imaging (fMRI), which detects changes in the brain corresponding to increases or decreases in mental activity. Research participants are shown different products and asked questions about them, while scanners reveal their brain activity as they respond. Often, major contradictions are apparent between what they say and what they are thinking. This is immensely valuable information. Eight out of ten new consumer products launched on the market do not succeed, despite having been tested on people who insist they would buy them but who, deep down, may have reservations about the desirability of these products.</p><p>This ‘shopping science’ probably has its limits, however. Dr Eric Spangenberg of the University of Washington argues that while it’s unlikely that someone could be persuaded to buy something they don’t need, they might be convinced to choose one brand in preference to another without being aware that this is happening. This claim is also borne out by numerous research findings. But if consumers were to realise quite how much research is being done into the many psychological factors influencing their choices, they might be much more wary of making purchases in the future.</p>"}};

function captureSelection(zone){
  if(submitted)return;
  const sel=window.getSelection();
  const root=zoneRoot(zone);
  if(!sel||!root||sel.rangeCount===0||sel.isCollapsed)return;
  const r=sel.getRangeAt(0);
  if(root.contains(r.commonAncestorContainer)){
    savedSelection=r.cloneRange();
    savedSelectionZone=zone;

}

    alert(zone==='questions'
      ?'Hãy bôi đen phần chữ ở bên câu hỏi trước.'
      :'Hãy bôi đen phần chữ trong bài đọc trước.');
    return null;

  if(savedSelection.collapsed||!savedSelection.toString().trim()){

  const a=annotationBlock(savedSelection.startContainer);
  const b=annotationBlock(savedSelection.endContainer);

}

function addHighlight(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  try{
    const mark=document.createElement('mark');
    mark.className='user-highlight';
    mark.dataset.annotationZone=zone;
    const frag=r.extractContents();
    mark.appendChild(frag);
    r.insertNode(mark);
    activeHighlight=mark;
    activeHighlightZone=zone;
    saveZoneMarkup(zone);
    clearBrowserSelection();
  }catch(e){
    alert('Không thể highlight vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function clearHighlight(zone){
  if(submitted)return;
  let targets=[];
  if(activeHighlight&&activeHighlightZone===zone&&document.body.contains(activeHighlight)){
    targets=[activeHighlight];
  }else if(savedSelection&&savedSelectionZone===zone){
    const root=zoneRoot(zone);
    if(root)targets=[...root.querySelectorAll('mark.user-highlight')].filter(m=>{
      try{return savedSelection.intersectsNode(m)}catch(e){return false}
    });
  }
  if(!targets.length){
    alert('Hãy bấm vào phần đã highlight rồi chọn “Xóa HL”.');
    return;
  }
  targets.forEach(m=>{
    const p=m.parentNode;
    while(m.firstChild)p.insertBefore(m.firstChild,m);
    m.remove();
    p.normalize();
  });
  activeHighlight=null;
  activeHighlightZone=null;
  saveZoneMarkup(zone);
  clearBrowserSelection();
}
function loadNotes(zone,p=current){
  try{return JSON.parse(ssGet(noteStoreKey(zone,p))||'[]')}catch(e){return[]}
}
function saveNotes(zone,notes,p=current){
  ssSet(noteStoreKey(zone,p),JSON.stringify(notes));
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addNote(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  const quote=r.toString().trim();
  const text=prompt('Nhập ghi chú cho đoạn đã chọn:');
  if(text===null||!text.trim())return;
  const id='note_'+zone+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  try{
    const span=document.createElement('span');
    span.className='note-anchor';
    span.dataset.noteId=id;
    span.dataset.annotationZone=zone;
    span.title='Bấm để xem/sửa ghi chú';
    const frag=r.extractContents();
    span.appendChild(frag);
    r.insertNode(span);

    const notes=loadNotes(zone);
    notes.push({id,quote,text:text.trim()});
    saveNotes(zone,notes);
    saveZoneMarkup(zone);
    clearBrowserSelection();
    renderNotesPanel(zone,current,true);
  }catch(e){
    alert('Không thể tạo ghi chú cho vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function toggleNotes(zone){
  const panel=document.getElementById(notesPanelId(zone));
  if(panel)panel.classList.toggle('open');
}
function renderNotesPanel(zone,p=current,forceOpen=false){
  const panel=document.getElementById(notesPanelId(zone));
  const count=document.getElementById(notesCountId(zone));
  if(!panel)return;
  const notes=loadNotes(zone,p);
  if(count)count.textContent=notes.length;
  panel.innerHTML=notes.length
    ?notes.map(n=>`<div class="note-item">
        <div class="note-quote">“${esc(n.quote)}”</div>
        <div class="note-text">${esc(n.text)}</div>
        <div class="note-actions">
          <button type="button" onclick="editNote('${zone}','${n.id}')">Sửa</button>
          <button type="button" onclick="deleteNote('${zone}','${n.id}')">Xóa</button>
        </div>
      </div>`).join('')
    :'<div style="font-size:13px;color:var(--muted)">Chưa có ghi chú ở phần này.</div>';
  if(forceOpen)panel.classList.add('open');
}
function editNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt('Sửa ghi chú:',n.text);if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function deleteNote(zone,id){
  const notes=loadNotes(zone).filter(x=>x.id!==id);
  saveNotes(zone,notes);
  const root=zoneRoot(zone);
  if(root)root.querySelectorAll(`[data-note-id="${id}"]`).forEach(s=>{
    const p=s.parentNode;
    while(s.firstChild)p.insertBefore(s.firstChild,s);
    s.remove();
    p.normalize();
  });
  saveZoneMarkup(zone);
  renderNotesPanel(zone,current,true);
}
function openNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt(`Đoạn đã ghi chú:\n“${n.quote}”\n\nGhi chú:`,n.text);
  if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function bindAnnotations(zone){
  const root=zoneRoot(zone);if(!root)return;
  root.addEventListener('mouseup',()=>captureSelection(zone));
  root.addEventListener('keyup',()=>captureSelection(zone));
  root.addEventListener('click',e=>{
    const note=e.target.closest('.note-anchor');
    if(note){openNote(zone,note.dataset.noteId);return}
    const mark=e.target.closest('mark.user-highlight');
    if(mark){
      activeHighlight=mark;
      activeHighlightZone=zone;
    }else if(zone===activeHighlightZone){
      activeHighlight=null;
      activeHighlightZone=null;
    }
  });
}
function annotationToolbar(zone){
  const isQ=zone==='questions';
  const label=isQ?'Câu hỏi':'Bài đọc';
  const countId=isQ?'notesCountQuestions':'notesCountPassage';
  return `<div class="annotation-bar">
    <span class="annotation-zone-label">${label}</span>
    <button type="button" class="annotation-btn" onclick="addHighlight('${zone}')">🖍 Highlight</button>
    <button type="button" class="annotation-btn" onclick="clearHighlight('${zone}')">Xóa HL</button>
    <button type="button" class="annotation-btn" onclick="addNote('${zone}')">📝 Add note</button>
    <button type="button" class="annotation-btn" onclick="toggleNotes('${zone}')">Ghi chú (<span id="${countId}">0</span>)</button>
    <span class="annotation-tip">Bôi đen phần chữ rồi chọn công cụ.</span>
  </div>`;
}

function showPassage(p){
  saveCurrentMarkups();
  current=p;
  activeHighlight=null;
  activeHighlightZone=null;
  savedSelection=null;
  savedSelectionZone=null;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.p===p));

  const passageMarkup=ssGet(zoneMarkupKey('passage',p))||passages[p].text;
  document.getElementById('passage').innerHTML=
    annotationToolbar('passage')+
    `<div id="notesPanelPassage" class="notes-panel"></div>
     <h2>${passages[p].title}</h2>
     <div class="copy" id="passageCopy">${passageMarkup}</div>`;

  bindAnnotations('passage');
  renderNotesPanel('passage',p,false);
  buildQuestions(p);

  document.getElementById('passage').scrollTop=0;
  document.getElementById('questions').scrollTop=0;
}

function renderQ(q){
  let body='';
  if(q.type==='text'){
    body=`<input class="ans" id="q${q.n}" data-q="${q.n}" type="text" autocomplete="off" placeholder="Type your answer">`;
  }else if(q.type==='select'){
    body=`<select class="ans" id="q${q.n}" data-q="${q.n}"><option value="">-- Choose --</option>${q.opts.map(x=>`<option value="${optionValue(x)}">${x}</option>`).join('')}</select>`;
  }else{
    body=q.opts.map(x=>{
      const v=optionValue(x);
      return `<label class="option" data-q="${q.n}" data-val="${v}"><input type="radio" name="q${q.n}" value="${v}"> ${x}</label>`;
    }).join('');
  }
  return `<div class="card" id="card${q.n}"><div class="qhead"><span class="qnum">${q.n}</span><div class="qtext">${q.text}</div></div>${body}<div class="feedback" id="fb${q.n}"></div></div>`;
}
function inlineText(n,placeholder='answer'){
  return `<span class="inline-blank" id="card${n}"><span class="blank-num">${n}</span><input class="ans inline-answer short" id="q${n}" data-q="${n}" type="text" autocomplete="off" placeholder="${placeholder}"></span>`;
}
function inlineSelect(n,opts){
  return `<span class="inline-blank" id="card${n}"><span class="blank-num">${n}</span><select class="ans inline-answer select-wide" id="q${n}" data-q="${n}"><option value="">-- choose --</option>${opts.map(x=>`<option value="${optionValue(x)}">${x}</option>`).join('')}</select></span>`;
}
function renderMatchRows(start,end,title,inst,showBank=true){
  const rows=questions.filter(q=>q.n>=start&&q.n<=end),opts=rows[0].opts;
  return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>
    ${showBank?`<div class="bank">${opts.map(x=>`<div>${x}</div>`).join('')}</div>`:''}
    ${rows.map(q=>`<div class="match-row completion-text" id="card${q.n}">
      <div class="match-label"><span class="blank-num">${q.n}</span> ${q.text}</div>
      ${inlineSelect(q.n,opts).replace(`id="card${q.n}"`,'')}
    </div>`).join('')}
  </div>`;
}
function renderStandardGroup(rows,title,inst){
  return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>${rows.map(renderQ).join('')}</div>`;
}

function freshQuestionsHTML(p){
  let h='';
  if(p===1){
    h+=renderStandardGroup(questions.filter(q=>q.n>=1&&q.n<=5),'Questions 1–5','Choose TRUE, FALSE or NOT GIVEN.');
    h+=renderP1Notes();
  }else if(p===2){
    h+=renderMatchRows(14,19,'Questions 14–19','Which paragraph contains the following information? Choose A–G. You may choose any paragraph more than once.',false);
    h+=renderMultiGroup('g2021',20,21,'Questions 20–21','Which TWO of these features of process-based life-cycle analysis are mentioned by the writer?',[
      'A — It is more complicated than it sounds.','B — It usually produces exaggerated results.','C — It is a frequently used procedure.','D — Its faults are widely recognised.','E — It was first developed in the UK.'
    ]);
    h+=renderMultiGroup('g2223',22,23,'Questions 22–23','Which TWO of these features of environmental input-output analysis are mentioned by the writer?',[
      'A — It is often the basis of national guidelines.','B — Its starting point is the manufacturing process.','C — It is comprehensive in scope.','D — It is a relatively new method of calculation.','E — It can use prices to get approximate carbon footprints.'
    ]);
    h+=renderP2Summary();
  }else{
    h+=renderStandardGroup(questions.filter(q=>q.n>=27&&q.n<=30),'Questions 27–30','Choose the correct answer.');
    h+=renderStandardGroup(questions.filter(q=>q.n>=31&&q.n<=35),'Questions 31–35','Choose YES, NO or NOT GIVEN.');
    h+=renderP3Summary();
  }
  return h;
}
function buildQuestions(p){
  const h=freshQuestionsHTML(p);
  document.getElementById('questions').innerHTML=
    annotationToolbar('questions')+
    `<div id="notesPanelQuestions" class="notes-panel"></div><div id="questionsCopy">${h}</div>`;
  restore(p);
  bindTrack();
  bindAnnotations('questions');
  renderNotesPanel('questions',p,false);
  if(submitted){
    const copy=document.getElementById('questionsCopy');
    if(copy&&!copy.querySelector('.review-mode-note.top-review-note')){
      copy.insertAdjacentHTML('afterbegin','<div class="review-mode-note top-review-note">Review mode: câu sai có giải thích và evidence ngay bên dưới. Bấm “Đối chiếu trong bài đọc” để đưa đoạn bằng chứng ở cột trái vào vị trí xem.</div>');
    }
    markPassage(p);
  }
}
function getMulti(group){
  try{return JSON.parse(ssGet(group)||'[]')}catch(e){return[]}
}
function restore(p){
  for(const q of questions.filter(x=>x.p===p&&x.type!=='multi')){
    const v=ssGet('q'+q.n)||'';
    if(q.type==='text'||q.type==='select'){
      const e=document.getElementById('q'+q.n);
      if(e)e.value=v;
    }else if(v){
      const e=[...document.querySelectorAll(`input[name="q${q.n}"]`)].find(x=>x.value===v);
      if(e)e.checked=true;
    }
  }
  if(p===2){
    for(const group of ['g2021','g2223']){
      const sel=getMulti(group);
      document.querySelectorAll(`input[name="${group}"]`).forEach(e=>e.checked=sel.includes(e.value));
    }
  }
}
function bindTrack(){
  document.querySelectorAll('.ans').forEach(e=>e.oninput=e.onchange=()=>save(+e.dataset.q,e.value));
  document.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>save(+e.closest('.option').dataset.q,e.value));
  for(const [group,a,b] of [['g2021',20,21],['g2223',22,23]]){
    document.querySelectorAll(`input[name="${group}"]`).forEach(e=>{
      e.onchange=()=>{
        let sel=[...document.querySelectorAll(`input[name="${group}"]:checked`)].map(x=>x.value);
        if(sel.length>2){
          e.checked=false;
          sel=[...document.querySelectorAll(`input[name="${group}"]:checked`)].map(x=>x.value);
          alert('Chỉ chọn TWO đáp án.');
        }
        ssSet(group,JSON.stringify(sel));
        for(let n=a;n<=b;n++) document.getElementById('nav'+n)?.classList.toggle('answered',sel.length===2);
      };
    });
  }
}
function save(n,v){
  ssSet('q'+n,v);
  document.getElementById('nav'+n)?.classList.toggle('answered',String(v).trim()!=='');
}
function buildNav(){
  document.getElementById('nav').innerHTML=questions.map(q=>`<button class="nq" id="nav${q.n}" onclick="goQ(${q.n})">${q.n}</button>`).join('');
}
function goQ(n){
  const q=questions.find(x=>x.n===n);
  if(q.p!==current)showPassage(q.p);
  setTimeout(()=>{
    let target=document.getElementById('card'+n);
    if(!target&&n===21)target=document.getElementById('card20');
    if(!target&&n===23)target=document.getElementById('card22');
    target?.scrollIntoView({behavior:'smooth',block:'center'});
    document.getElementById('q'+n)?.focus?.({preventScroll:true});
  },60);
}
function correct(q,u){
  if(q.type==='multi')return false;
  return q.type==='text'?q.ans.map(norm).includes(norm(u)):norm(u)===norm(q.ans);
}

function removeInlineReview(n){
  document.querySelectorAll(`[data-inline-review="${n}"]`).forEach(e=>e.remove());
}

function renderInlineReview(q,user,ok){
  removeInlineReview(q.n);
  if(ok)return;

  const card=document.getElementById('card'+q.n);
  if(!card)return;

  // Standard IELTS question cards: explanation sits directly under the options.
  if(card.classList.contains('card')){
    card.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
    return;
  }

  // Completion tasks: place review under the sentence/step/note containing the blank.
  const host=card.closest('.flow-step,li,.completion-text') || card.parentElement;
  if(!host)return;

  // Several blanks may live in the same summary paragraph; keep each explanation labelled by Q number.
  host.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
}

function lockSubmittedAnswers(){
  if(!submitted)return;
  document.querySelectorAll('#questionsCopy input,#questionsCopy select').forEach(e=>e.disabled=true);
}

function focusEvidence(n){
  const q=questions.find(x=>x.n===n);
  const r=answerReview[n];
  if(!q||!r)return;
  const reveal=()=>{
    const copy=document.getElementById('passageCopy');
    const ps=copy?[...copy.querySelectorAll('p')]:[];
    const target=ps[r.para-1];
    if(!target)return;
    target.scrollIntoView({behavior:'smooth',block:'center'});
    target.classList.add('evidence-pulse');
    setTimeout(()=>target.classList.remove('evidence-pulse'),3200);
  };
  if(q.p!==current){showPassage(q.p);setTimeout(reveal,150)}else reveal();
}
function markMulti(group,start,end,key,evidenceQ){
  const sel=getMulti(group),hits=sel.filter(x=>key.includes(x)).length,perfect=hits===2&&sel.length===2;
  document.querySelectorAll(`[data-group="${group}"]`).forEach(l=>{
    l.classList.remove('correct','wrong');
    if(key.includes(l.dataset.val))l.classList.add('correct');
    else if(sel.includes(l.dataset.val))l.classList.add('wrong');
  });
  const fb=document.getElementById('fb'+group);
  if(fb){
    fb.className='multi-score-note '+(perfect?'good':'bad');
    fb.textContent=perfect?'✓ Correct — 2 / 2':`Correct answers: ${key.join(', ')} · Score: ${hits} / 2`;
  }
  for(let n=start;n<=end;n++){
    const nav=document.getElementById('nav'+n);
    if(nav){
      nav.classList.remove('answered','correct','wrong','partial');
      nav.classList.add(perfect?'correct':hits===1?'partial':'wrong');
    }
  }
  const host=document.getElementById('review'+group);
  if(host){
    host.innerHTML='';
    if(!perfect){
      const r=answerReview[evidenceQ];
      host.innerHTML=`<div class="inline-review integrated">
        <div class="inline-review-title"><span class="inline-review-badge">Q${start}–${end}</span><span>Giải thích nhóm câu sai</span></div>
        <div class="review-row"><div class="review-label">Bạn chọn</div><div class="student-wrong">${sel.join(', ')||'Không trả lời'}</div></div>
        <div class="review-row"><div class="review-label">Đáp án đúng</div><div class="correct-answer">${key.join(', ')}</div></div>
        <div class="explain"><b>Vì sao?</b> ${r.explain}</div>
        <div class="evidence"><b>Evidence:</b> “${r.evidence}”</div>
        <button class="evidence-btn" onclick="focusEvidence(${evidenceQ})">↗ Đối chiếu trong bài đọc</button>
      </div>`;
    }
  }
  return hits;
}
function markPassage(p){
  for(const q of questions.filter(x=>x.p===p&&x.type!=='multi')){
    const u=ssGet('q'+q.n)||'',ok=correct(q,u);
    const fb=document.getElementById('fb'+q.n);
    if(q.type==='text'||q.type==='select'){
      const e=document.getElementById('q'+q.n);
      if(e){e.classList.remove('correct','wrong');e.classList.add(ok?'correct':'wrong')}
    }else{
      document.querySelectorAll(`label[data-q="${q.n}"]`).forEach(l=>{
        l.classList.remove('correct','wrong');
        if(norm(l.dataset.val)===norm(q.ans))l.classList.add('correct');
        else if(u&&norm(l.dataset.val)===norm(u))l.classList.add('wrong');
      });
    }
    if(fb){
      const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
      fb.className='feedback '+(ok?'good':'bad');
      fb.textContent=ok?'✓ Correct':'Correct answer: '+key;
    }
    if(submitted)renderInlineReview(q,u,ok);
  }
  if(p===2&&submitted){
    markMulti('g2021',20,21,['A','C'],20);
    markMulti('g2223',22,23,['C','E'],22);
  }
  lockSubmittedAnswers();
}

function displayAnswer(q,user){
  if(!String(user).trim())return 'Không trả lời';
  if(q.type==='select'||q.type==='choice'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(user));
    return found||user;
  }
  return user;
}
function displayKey(q){
  const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
  if(q.type==='select'||q.type==='choice'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(key));
    return found||key;
  }
  return key;
}
function renderWrongReview(details){
  const box=document.getElementById('wrongReview');
  const wrong=details.filter(x=>!x.correct);
  if(!wrong.length){
    box.innerHTML='<h3 class="review-title">Review đáp án</h3><div class="perfect-review">🎉 Không có câu sai. Bạn đã trả lời đúng cả 40 câu!</div>';
    return;
  }
  box.innerHTML=`<h3 class="review-title">${wrong.length} câu cần xem lại</h3>
    <div class="review-mode-note">Đóng bảng điểm để xem <b>giải thích + evidence được ghim trực tiếp ngay dưới từng câu sai</b>. Khi chuyển Passage, phần giải thích vẫn còn để bạn đối chiếu với bài đọc.</div>`;
}
function gotoEvidence(n){
  document.getElementById('overlay').classList.add('hidden');
  focusEvidence(n);
}

async function submitExam(auto=false){
  if(submitted)return;
  saveCurrentMarkups();

  const normalMissing=questions.filter(q=>q.type!=='multi'&&!(ssGet('q'+q.n)||'').trim()).length;
  const missing2021=Math.max(0,2-getMulti('g2021').length);
  const missing2223=Math.max(0,2-getMulti('g2223').length);
  const unanswered=normalMissing+missing2021+missing2223;

  if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu/ô đáp án chưa hoàn thành. Vẫn nộp bài?`))return;

  submitted=true;
  clearInterval(timerHandle);

  let total=0,s=[0,0,0,0],details=[];
  for(const q of questions.filter(q=>q.type!=='multi')){
    const u=ssGet('q'+q.n)||'',ok=correct(q,u);
    if(ok){total++;s[q.p]++}
    details.push({q:q.n,answer:u,correct:ok,key:Array.isArray(q.ans)?q.ans.join(' / '):q.ans});
    const ne=document.getElementById('nav'+q.n);
    if(ne){ne.classList.remove('answered');ne.classList.add(ok?'correct':'wrong')}
  }

  const sel2021=getMulti('g2021'),hits2021=sel2021.filter(x=>['A','C'].includes(x)).length;
  const sel2223=getMulti('g2223'),hits2223=sel2223.filter(x=>['C','E'].includes(x)).length;
  total+=hits2021+hits2223;
  s[2]+=hits2021+hits2223;

  details.push({q:20,answer:sel2021.join(', '),correct:hits2021>=1,key:'A, C'});
  details.push({q:21,answer:sel2021.join(', '),correct:hits2021===2,key:'A, C'});
  details.push({q:22,answer:sel2223.join(', '),correct:hits2223>=1,key:'C, E'});
  details.push({q:23,answer:sel2223.join(', '),correct:hits2223===2,key:'C, E'});

  markPassage(current);

  const name=document.getElementById('studentName').value.trim();
  const cls=document.getElementById('studentClass').value.trim();
  const dur=Math.round((Date.now()-startedAt)/1000);

  document.getElementById('rstudent').textContent=`${name} — ${cls}`;
  document.getElementById('rscore').textContent=`${total} / 40`;
  document.getElementById('rpercent').textContent=`${Math.round(total/40*100)}% correct`;
  document.getElementById('p1s').textContent=`${s[1]} / 13`;
  document.getElementById('p2s').textContent=`${s[2]} / 13`;
  document.getElementById('p3s').textContent=`${s[3]} / 14`;

  renderWrongReview(details);
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('status').textContent='Đang gửi kết quả về Google Sheet...';

  const payload=new URLSearchParams({
    name,
    className:cls,
    total:String(total),
    maxScore:'40',
    durationSeconds:String(dur),
    activity:'IELTS Reading - Candles / Carbon Footprints / Science of Shopping',
    reading:String(s[1]),
    grammar:String(s[2]),
    ing:String(s[3]),
    writingA:JSON.stringify(details),
    submittedAt:new Date().toISOString()
  });

  try{
    await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:payload.toString()});
    document.getElementById('status').textContent='✓ Đã gửi kết quả về Google Sheet.';
  }catch(e){
    document.getElementById('status').textContent='Không gửi được kết quả về Google Sheet.';
  }
}
function closeResult(){document.getElementById('overlay').classList.add('hidden');markPassage(current);saveZoneMarkup('questions')}

(function(){
  const params=new URLSearchParams(location.search);
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem('IELTS_PRACTICE_STUDENT')||'null')}catch(e){}
  const name=(params.get('name')||'').trim()||(saved&&saved.name)||localStorage.getItem('IELTS_STUDENT_NAME')||'';
  const className=(params.get('className')||'').trim()||(saved&&saved.className)||localStorage.getItem('IELTS_STUDENT_CLASS')||'';
  const n=document.getElementById('studentName'),c=document.getElementById('studentClass');
  if(name&&className&&n&&c){
    n.value=name;c.value=className;
    if(params.get('fromPortal')==='1')setTimeout(()=>startExam(),100);
  }
})();

</script></body></html>
