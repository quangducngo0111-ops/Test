<div id="exam" class="exam hidden"><div class="top"><div>Student: <b id="topName"></b> &nbsp; | &nbsp; Class: <b id="topClass"></b></div><div id="timer" class="timer">60:00</div></div><div class="tabs"><button class="tab active" data-p="1" onclick="showPassage(1)">Passage 1</button><button class="tab" data-p="2" onclick="showPassage(2)">Passage 2</button><button class="tab" data-p="3" onclick="showPassage(3)">Passage 3</button></div><div class="workspace"><div id="passage" class="passage"></div><div id="questions" class="questions"></div></div><div class="bottom"><div id="nav" class="nav"></div><button class="submit" onclick="submitExam(false)">Nộp bài</button></div></div>

<script>const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwfwWjJ7Q3VTJEF5ldKGnFKYoziQdntAzRjq1Yqy6HSmbZSc69ijSdOvMCC_Zogbpcm/exec";
const passages={"1": {"title": "Australia's cane toad problem", "text": "<p><b>A</b> In the north of Australia there are many sugar cane plantations, which early in the 20th century were being damaged by a particular pest. This was a species of beetle whose larvae, the infant form of the beetle, live underground in the soil in the sugar cane fields. The sugar cane plants were weakened or died because their roots were eaten by the larvae. This had serious economic consequences for sugar cane farmers. Modern pesticides were not developed until the 1940s, so farmers had to use what was available at the time. Chemicals like arsenic and copper were used, but these were not only expensive but also stayed in the environment and were poisonous to people, plants and animals. It was generally acknowledged by government, farmers and scientists that cheaper and safer methods of pest control had to be found.</p>\n<p><b>B</b> A promising replacement for copper and arsenic was the use of biological control. Farmers already used some forms of biological pest control in the form of predatory and parasitic wasps and flies, insect-eating birds, and plants from different regions or countries to control pests. Common practice was to release these introduced agents into new environments, the expectation being that they would destroy resident pests. Some species of toad already had successful records as agents of biological control in gardens. For example, in 19th-century France toads were sold to gardeners at markets in Paris to eat insect pests in their gardens. In the early 20th century French sugar cane farmers first took giant toads from South America to control pests in their Caribbean sugar cane plantations. Although there is no evidence that these toads did help to control pests, sugar cane scientists then carried some of these toads from Jamaica and Barbados to Puerto Rico and from there to Hawaii.</p>\n<p><b>C</b> The idea of biological control of pests was not new to Australia. For example, in 1926 there had been a highly successful prevention of the increase of the exotic prickly-pear cactus by the introduction of a moth from Argentina. This success added strength to the argument that biological control was the answer to the sugar cane industry's pest problems. Accordingly, in the early 1930s a decision was taken to introduce the giant South American toads, which in Australia are now commonly called cane toads, into Australian sugar cane plantations.</p>\n<p><b>D</b> In 1935, an Australian entomologist brought 101 cane toads from Hawaii and released them in sugar cane plantations in the north of Australia. However, over the following years it became clear that the cane toads were a failure. There was a fatal flaw in the plan to use them as a form of biological control. This was that earthbound cane toads were expected to eat the mostly flying adult beetles in order to eliminate the soil-dwelling beetle larvae that ate the roots of the cane sugar plants. This, of course, cane toads could not do.</p>\n<p><b>E</b> Prior to their introduction in Australia, there had been very few opponents and only one made his views public. He was a retired former Chief Entomologist from the state government of New South Wales named Walter Froggatt. He forecast that cane toads might become as great a pest in Australia as rabbits. However, Froggatt's peers rebuked him and eminent scientists branded his views 'decidedly pessimistic'. It is estimated that today as many as a hundred million cane toads form a toxic infestation which is slowly spreading throughout the land.</p>\n<p><b>F</b> Cane toads are large, heavily built amphibians. Average-sized adults are 10-15 cm long and weigh more than a kilo. They have large swellings on each shoulder from which they squirt poison when they are threatened. This venom contains 14 different chemicals, but they do not appear to be harmful to humans as no-one has died in Australia from cane toad poison. Until recently there was no understanding of the toxicity of cane toad poison, but it is now clear that freshwater crocodiles, goannas (large lizards) and dingoes (wild dogs) have died after eating cane toads. Cane toads compete with native Australian fauna for food, and eat the eggs and young of ground-nesting birds. As their numbers increase, they are taking over more and more of the land where native Australian fauna live.</p>\n<p><b>G</b> The lesson that can be learned from the introduction of cane toads is important. It is wrong to think that such an awful biological event could not be repeated. In this instance, the catalyst was the overwhelming consensus of support for introducing cane toads to Australia. The error was that there was little or no testing of these biological agents before they were introduced to see what unplanned effects they might have on the environment.</p>"}, "2": {"title": "Farmers", "text": "<p><b>A</b> The chain of stores known as Farmers began one hundred years ago as a mail order company. Today the Farmers chain employs 3,500 staff across 58 branches making it the most venerable institution of its type in New Zealand. Coming to Farmers once a week has become woven into the fabric of New Zealand culture, says business historian Ian Hunter. By 1960, one in every ten people had an account with the company. It was not only a shop but also hosted the largest annual parade in the country, the Santa parade each Christmas time. Gary Blumenthal, whose family have been customers for three generations, understands well the role Farmers have played in New Zealand culture. 'We were on holiday in Auckland,' he explains, 'and I decided that the lookout tower on top of the Farmers building would be a unique place to fit the ring on my new fiancee's finger.' The couple has been married for 50 years.</p>\n<p><b>B</b> Farmers' longevity can be attributed to the philosophy fostered by Robert Laidlaw, the Scottish immigrant who established the business. Right from the outset, Laidlaw guaranteed customer satisfaction, and those who were not entirely happy with a purchase would receive a full refund with no questions asked. This was certainly the first time such a guarantee had been made by a New Zealand retailer and was probably one of the first worldwide. Laidlaw believed that the scheme could work if he ensured that every product sold was of the highest quality relative to its price.</p>\n<p><b>C</b> Another important aspect of the Farmers' philosophy was to internationalize the New Zealand market. By the time the Hobson Street store opened in 1920 in order to sell directly to customers for the first time, Laidlaw had established buying officers in New York and London so as to offer his customers the latest designs. This was a bold move in those days and won Farmers a devoted following. It's also true that whoever you speak to regarding Farmers in the early years, whether managers or workers, they all emphasize how the company represented a large family. Everyone employed by Laidlaw felt they were building something that would ultimately be to the benefit of the whole country. For example, to mark the centenary celebrations, 58 Farmers' stores around the country announced the neighborhood charities they would raise funds for; everything from guide dog services to volunteer fire brigades will benefit.</p>\n<p><b>D</b> Farmers has always had a heart, according to former board chairman Rawdon Busfield. 'One day I was in the Hobson Street store and a woman came in with two small children-they didn't have a lot of money, you could tell. That week we had a special on, a big bar of chocolate for a shilling... But the boy only had a penny. I took the penny and gave him the chocolate.' However, not everything has stayed the same. Farmers was once home to genteel tea rooms, children's playgrounds, and an annual sale to celebrate the birthday of Hector the Parrot-who came to embody the store in the eyes of many shoppers and who died, aged 131, in the 1970s. You could buy houses from Farmers, and its saddle factory supplied the armed forces. In fact, although the company has grown considerably over the years, today it sells a narrower assortment of products than in the past.</p>\n<p><b>E</b> Walk through a Farmers store today and you'll see big changes. Its most recent branch in the suburb of Albany is filled with bright lights and big brands. The branch sells cosmetics from 16 different international companies and buys from approximately 500 suppliers, of which about 30 percent are locally owned. 'Eight or ten years ago,' says current chief executive Rod McDermott, 'lots of brands wouldn't partner with us. We weren't in trouble as such, but we could have been doing much better because we were focused too much on price and not on fashion. The reorientation of the last decade has seen a great improvement.'</p>\n<p><b>F</b> Farmers almost didn't pull through one economic crisis. In the mid-1980s, business was booming and the company had stores throughout the country. Then, with sales topping $375 million, it was taken over by Chase Corporation. Lincoln Laidlaw, the son of the company's founder, remembers the dark days following the stock market crash of 1987 and the collapse of the Chase Corporation. The business was being divided up, he says, and 'I believe that the original culture of the store was dispelled and it hasn't been recovered. That's a shame, but the business is still strong.' For a few turbulent years the stores were controlled first by a consortium of Australian banks, and later a local corporation. In 2003, it went back into 'family' ownership with the purchase by the James Pascoe Group owned by an established New Zealand retail family. Brand power has made Farmers profitable again, according to McDermott. 'And now we're becoming the brand we used to be... It's like the rebirth of an icon.'</p>"}, "3": {"title": "LIFE ON MARS?", "text": "<p><b>A</b> When scientists began observing Mars with their first primitive telescopes, they assumed from the start that the planet was peopled. The 18th-century astronomer William Herschel, noting the seasons and atmosphere of Mars, declared that 'its inhabitants enjoy a situation similar to our own'. A century later, astronomers asserted that they could detect canals running across the Martian landscape. These canals, argued US scientist Percival Lowell, had been built by technologically advanced Martians to transport water from the poles to the equator of their drying world. 'Martian folk are possessed of inventions of which we have not dreamed,' he argued.</p>\n<p><b>B</b> The vision of an advanced culture trapped on a drying world was taken up by the British writer H.G. Wells in 1898 in his masterpiece The War of the Worlds, in which Earth is subjected to a pitiless invasion from a race of hideous Martians armed with poison gas and heat rays. Martians became synonymous with grotesque, threatening aliens, at least as far as the public was concerned. Scientists were more restrained, but still supported the idea that the planet might support relatively complex life forms.</p>\n<p><b>C</b> Then, in the late 1960s, rocket science changed our image of Mars forever. The US Mariner probes swept past Mars and sent back pictures, not of a world covered in vegetation, as many scientists still expected, but of vistas of cratered, arid deserts. Finally, in 1975, two huge US probes settled on the Martian surface and began a series of experiments aimed at pinpointing, once and for all, the existence of air-breathing organisms. None were found, for the Viking probes landed in areas as dead as the Sahara Desert. All that was sent back were images of a bleak, boulder-strewn terrain. Mars was declared officially dead – for a while.</p>\n<p><b>D</b> Since that time, two critical pieces of evidence have been found on Earth which support the idea that Mars has life. The first is known as ALH84001, a meteorite that was blasted into space when a large body struck Mars 15 million years ago and which spiralled across the solar system to crash into the Antarctic. Analysis carried out by NASA scientist Imre Friedmann showed that the meteorite contained elements identical to those found on Mars by the Viking probes, and revealed chains of crystals similar to those created by earthbound bacteria. Friedmann believes that these could only have been created by living organisms. Others, however, argue that the crystals could have been laid down by simple chemical processes. A second area of support for the idea that living organisms could survive Mars's harshness has been provided by the study of extremophiles, bacteria that have been found in increasingly hostile landscapes on Earth – acid lakes, for example, and volcanoes.</p>\n<p><b>E</b> In the past few years, astronomers have become convinced that the Martian surface, although hostile and arid today, was once lush and welcoming. Images sent back by recent probes such as the Mars Global Surveyor have revealed dried-up riverbeds and old estuaries. Rivers poured into ancient seas, it appears, and rain swept the sodden terrain. Then catastrophe struck. Mars lost its magnetic field several billion years ago, explains British astronomer Paul Murdin. 'Earth retained one, and it protects our atmosphere. Without that protection, Mars's gases and water boiled off.' That is why they are so different today.</p>\n<p><b>F</b> The discovery of signs of water on Mars has changed everything. Some researchers believe that water from underground reservoirs still gushes through Martian valleys as occasional flash floods bubble to the surface. In the 1990s, the Mars Odyssey probe began to map the chemical make-up of the Mars soil, and discovered that much of the ground in the southern hemisphere of Mars is mixed with large quantities of ice. And where there is ice, there is likely to be liquid water, probably underneath. 'There are huge underground reservoirs on Mars,' says Marcello Coradini, head of planetary exploration for the European Space Agency. 'I am now convinced of that.'</p>\n<p><b>G</b> Current projects are hoping to clarify the question of the presence of water once and for all. These are aimed at conducting experiments to detect the presence of a substance called carbon 13 in soil and rock samples on Mars; this would be, according to some researchers, an unequivocal indicator of the presence of living organisms, past or present.</p>\n<p><b>H</b> But would the presence of a few Martian organisms alter our world view in any significant way? Professor Juan Pérez Mercader of Madrid's Centre for Astrobiology in Spain believes that it would. 'For a start, we will be able to find out if Martian organisms have DNA, the golden molecule that controls the replication of earthly creatures.' If there is no DNA, that would show that Martian biology is quite unlike Earth's, and that on two planets, side by side in the same solar system, life evolved independently. If DNA is located, it would mean that life on Mars and on Earth may spring from the same source. 'If organisms can pop up that easily, our chances of finding intelligent versions elsewhere in the universe will look extremely good,' Pérez Mercader states. The discovery of any evidence of living organisms on Mars would also mean renewed purpose for manned space flight projects.</p>"}};

    activeHighlight=mark;
    activeHighlightZone=zone;
    saveZoneMarkup(zone);
    clearBrowserSelection();
  }catch(e){
    alert('Không thể highlight vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function clearHighlight(zone){
  if(submitted)return;
  let targets=[];
  if(activeHighlight&&activeHighlightZone===zone&&document.body.contains(activeHighlight)){
    targets=[activeHighlight];
  }else if(savedSelection&&savedSelectionZone===zone){
    const root=zoneRoot(zone);
    if(root)targets=[...root.querySelectorAll('mark.user-highlight')].filter(m=>{
      try{return savedSelection.intersectsNode(m)}catch(e){return false}
    });
  }
  if(!targets.length){
    alert('Hãy bấm vào phần đã highlight rồi chọn “Xóa HL”.');
    return;
  }
  targets.forEach(m=>{
    const p=m.parentNode;
    while(m.firstChild)p.insertBefore(m.firstChild,m);
    m.remove();
    p.normalize();
  });
  activeHighlight=null;
  activeHighlightZone=null;
  saveZoneMarkup(zone);
  clearBrowserSelection();
}
function loadNotes(zone,p=current){
  try{return JSON.parse(ssGet(noteStoreKey(zone,p))||'[]')}catch(e){return[]}
}
function saveNotes(zone,notes,p=current){
  ssSet(noteStoreKey(zone,p),JSON.stringify(notes));
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addNote(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  const quote=r.toString().trim();
  const text=prompt('Nhập ghi chú cho đoạn đã chọn:');
  if(text===null||!text.trim())return;
  const id='note_'+zone+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  try{
    const span=document.createElement('span');
    span.className='note-anchor';
    span.dataset.noteId=id;
    span.dataset.annotationZone=zone;
    span.title='Bấm để xem/sửa ghi chú';
    const frag=r.extractContents();
    span.appendChild(frag);
    r.insertNode(span);

    const notes=loadNotes(zone);
    notes.push({id,quote,text:text.trim()});
    saveNotes(zone,notes);
    saveZoneMarkup(zone);
    clearBrowserSelection();
    renderNotesPanel(zone,current,true);
  }catch(e){
    alert('Không thể tạo ghi chú cho vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function toggleNotes(zone){
  const panel=document.getElementById(notesPanelId(zone));
  if(panel)panel.classList.toggle('open');
}
function renderNotesPanel(zone,p=current,forceOpen=false){
  const panel=document.getElementById(notesPanelId(zone));
  const count=document.getElementById(notesCountId(zone));
  if(!panel)return;
  const notes=loadNotes(zone,p);
  if(count)count.textContent=notes.length;
  panel.innerHTML=notes.length
    ?notes.map(n=>`<div class="note-item">
        <div class="note-quote">“${esc(n.quote)}”</div>
        <div class="note-text">${esc(n.text)}</div>
        <div class="note-actions">
          <button type="button" onclick="editNote('${zone}','${n.id}')">Sửa</button>
          <button type="button" onclick="deleteNote('${zone}','${n.id}')">Xóa</button>
        </div>
      </div>`).join('')
    :'<div style="font-size:13px;color:var(--muted)">Chưa có ghi chú ở phần này.</div>';
  if(forceOpen)panel.classList.add('open');
}
function editNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt('Sửa ghi chú:',n.text);if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function deleteNote(zone,id){
  const notes=loadNotes(zone).filter(x=>x.id!==id);
  saveNotes(zone,notes);
  const root=zoneRoot(zone);
  if(root)root.querySelectorAll(`[data-note-id="${id}"]`).forEach(s=>{
    const p=s.parentNode;
    while(s.firstChild)p.insertBefore(s.firstChild,s);
    s.remove();
    p.normalize();
  });
  saveZoneMarkup(zone);
  renderNotesPanel(zone,current,true);
}
function openNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt(`Đoạn đã ghi chú:\n“${n.quote}”\n\nGhi chú:`,n.text);
  if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function bindAnnotations(zone){
  const root=zoneRoot(zone);if(!root)return;
  root.addEventListener('mouseup',()=>captureSelection(zone));
  root.addEventListener('keyup',()=>captureSelection(zone));
  root.addEventListener('click',e=>{
    const note=e.target.closest('.note-anchor');
    if(note){openNote(zone,note.dataset.noteId);return}
    const mark=e.target.closest('mark.user-highlight');
    if(mark){
      activeHighlight=mark;
      activeHighlightZone=zone;
    }else if(zone===activeHighlightZone){
      activeHighlight=null;
      activeHighlightZone=null;
    }
  });
}
function annotationToolbar(zone){
  const isQ=zone==='questions';
  const label=isQ?'Câu hỏi':'Bài đọc';
  const countId=isQ?'notesCountQuestions':'notesCountPassage';
  return `<div class="annotation-bar">
    <span class="annotation-zone-label">${label}</span>
    <button type="button" class="annotation-btn" onclick="addHighlight('${zone}')">🖍 Highlight</button>
    <button type="button" class="annotation-btn" onclick="clearHighlight('${zone}')">Xóa HL</button>
    <button type="button" class="annotation-btn" onclick="addNote('${zone}')">📝 Add note</button>
    <button type="button" class="annotation-btn" onclick="toggleNotes('${zone}')">Ghi chú (<span id="${countId}">0</span>)</button>
    <span class="annotation-tip">Bôi đen phần chữ rồi chọn công cụ.</span>
  </div>`;
}

function showPassage(p){
  saveCurrentMarkups();
  current=p;
  activeHighlight=null;
  activeHighlightZone=null;
  savedSelection=null;
  savedSelectionZone=null;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.p===p));

  const passageMarkup=ssGet(zoneMarkupKey('passage',p))||passages[p].text;
  document.getElementById('passage').innerHTML=
    annotationToolbar('passage')+
    `<div id="notesPanelPassage" class="notes-panel"></div>
     <h2>${passages[p].title}</h2>
     <div class="copy" id="passageCopy">${passageMarkup}</div>`;

  bindAnnotations('passage');
  renderNotesPanel('passage',p,false);
  buildQuestions(p);

  document.getElementById('passage').scrollTop=0;
  document.getElementById('questions').scrollTop=0;
}
function renderQ(q){let body='';if(q.type==='text')body=`<input class="ans" id="q${q.n}" data-q="${q.n}" type="text" autocomplete="off" placeholder="Type your answer">`;else if(q.type==='select')body=`<select class="ans" id="q${q.n}" data-q="${q.n}"><option value="">-- Choose --</option>${q.opts.map(x=>`<option value="${x.charAt(0)}">${x}</option>`).join('')}</select>`;else body=q.opts.map(x=>{const v=/^[A-H1-4] —/.test(x)?x.charAt(0):x;return `<label class="option" data-q="${q.n}" data-val="${v}"><input type="radio" name="q${q.n}" value="${v}"> ${x}</label>`}).join('');return `<div class="card" id="card${q.n}"><div class="qhead"><span class="qnum">${q.n}</span><div class="qtext">${q.text}</div></div>${body}<div class="feedback" id="fb${q.n}"></div></div>`}

function inlineText(n,placeholder='answer'){
  return `<span class="inline-blank" id="card${n}"><span class="blank-num">${n}</span><input class="ans inline-answer short" id="q${n}" data-q="${n}" type="text" autocomplete="off" placeholder="${placeholder}"></span>`;
}
function inlineSelect(n,opts){
  return `<span class="inline-blank" id="card${n}"><span class="blank-num">${n}</span><select class="ans inline-answer select-wide" id="q${n}" data-q="${n}"><option value="">-- choose --</option>${opts.map(x=>`<option value="${x.charAt(0)}">${x}</option>`).join('')}</select></span>`;
}
function renderP1Table(){
 return `<div class="group"><h3>Questions 1–7</h3><div class="inst">Complete the table below. Write <b>ONE WORD ONLY</b> from the passage for each answer.</div><div class="completion-box"><h4>Pest control</h4><p class="completion-text"><b>Early 20th-century problems in Australia</b></p><p class="completion-text">The larvae of a type of ${inlineText(1)} were a serious pest in sugar cane fields.</p><p class="completion-text">Its larvae ate the ${inlineText(2)} of the plant.</p><p class="completion-text">Chemical pesticides were unsatisfactory because they were:</p><ul class="notes-list"><li>poisonous</li><li>${inlineText(3)}</li><li>difficult to remove from the ground</li></ul><p class="completion-text"><b>Experiences with biological pest control</b></p><p class="completion-text">The use of insects, plants and birds was widespread.</p><p class="completion-text">In the 19th century French ${inlineText(4)} used toads.</p><p class="completion-text">In Australia a ${inlineText(5)} stopped the spread of prickly-pear cactus.</p><p class="completion-text">Cane toads were brought to Australia from ${inlineText(6)}.</p><p class="completion-text">Cane toads proved to be a ${inlineText(7)} as pest control.</p></div></div>`;
}
function renderP2SentenceCompletion(){
 return `<div class="group"><h3>Questions 19–22</h3><div class="inst">Complete the sentences below. Write <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</div><div class="completion-box"><p class="completion-text">Farmers were set up as a/an ${inlineText(19)} business before it became a chain.</p><p class="completion-text">Robert Laidlaw set up ${inlineText(20)} overseas so he could sell up-to-date fashions.</p><p class="completion-text">According to employees, Farmers were like a/an ${inlineText(21)}.</p><p class="completion-text">Farmers held a/an ${inlineText(22)} once a year in honour of the company's famous pet.</p></div></div>`;
}
function renderP2People(){
 const opts=questions.find(q=>q.n===23).opts;
 const rows=questions.filter(q=>q.n>=23&&q.n<=26);
 return `<div class="group"><h3>Questions 23–26</h3><div class="inst">Match each person with the correct idea, A–F.</div><div class="bank">${opts.map(x=>`<div>${x}</div>`).join('')}</div><table class="match-table">${rows.map(q=>`<tr id="card${q.n}"><td style="width:55px"><span class="blank-num">${q.n}</span></td><td style="font-weight:700">${q.text}</td><td>${inlineSelect(q.n,opts).replace(`id="card${q.n}"`,'')}</td></tr>`).join('')}</table></div>`;
}
function renderStandardGroup(qs,title,inst){return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>${qs.map(renderQ).join('')}</div>`;}
function buildQuestions(p){
 let h='';
 if(p===1){h+=renderP1Table();h+=renderStandardGroup(questions.filter(q=>q.n>=8&&q.n<=13),'Questions 8–13','Choose TRUE, FALSE or NOT GIVEN.');}
 else if(p===2){h+=renderStandardGroup(questions.filter(q=>q.n>=14&&q.n<=18),'Questions 14–18','Which paragraph contains the following information? Choose A–F.');h+=renderP2SentenceCompletion();h+=renderP2People();}
 else{h+=renderStandardGroup(questions.filter(q=>q.n>=27&&q.n<=32),'Questions 27–32','Which paragraph contains the following information? Choose A–H.');h+=renderStandardGroup(questions.filter(q=>q.n>=33&&q.n<=36),'Questions 33–36','Choose the correct answer.');h+=renderStandardGroup(questions.filter(q=>q.n>=37&&q.n<=40),'Questions 37–40','Choose YES, NO or NOT GIVEN.');}
 const savedQuestionMarkup=ssGet(zoneMarkupKey('questions',p));
 const questionMarkup=savedQuestionMarkup||h;
 document.getElementById('questions').innerHTML=annotationToolbar('questions')+`<div id="notesPanelQuestions" class="notes-panel"></div><div id="questionsCopy">${questionMarkup}</div>`;
 restore(p);bindTrack();bindAnnotations('questions');renderNotesPanel('questions',p,false);
 if(submitted){const copy=document.getElementById('questionsCopy');if(copy&&!copy.querySelector('.review-mode-note.top-review-note'))copy.insertAdjacentHTML('afterbegin','<div class="review-mode-note top-review-note">Review mode: câu sai có giải thích và evidence ngay bên dưới. Bấm “Đối chiếu trong bài đọc” để đưa đoạn bằng chứng ở cột trái vào vị trí xem.</div>');markPassage(p);}
}

function restore(p){for(const q of questions.filter(x=>x.p===p)){const v=ssGet('q'+q.n)||'';if(q.type==='text'||q.type==='select'){const e=document.getElementById('q'+q.n);if(e)e.value=v}else if(v){const e=[...document.querySelectorAll(`input[name="q${q.n}"]`)].find(x=>x.value===v);if(e)e.checked=true}}}
function bindTrack(){document.querySelectorAll('.ans').forEach(e=>{e.oninput=e.onchange=()=>save(+e.dataset.q,e.value)});document.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>save(+e.closest('.option').dataset.q,e.value))}
function save(n,v){ssSet('q'+n,v);const e=document.getElementById('nav'+n);if(e)e.classList.toggle('answered',String(v).trim()!=='')}
function buildNav(){document.getElementById('nav').innerHTML=questions.map(q=>`<button class="nq" id="nav${q.n}" onclick="goQ(${q.n})">${q.n}</button>`).join('')}
function goQ(n){const q=questions.find(x=>x.n===n);if(q.p!==current)showPassage(q.p);setTimeout(()=>{const target=document.getElementById('card'+n);target?.scrollIntoView({behavior:'smooth',block:'center'});const control=document.getElementById('q'+n);if(control&&(control.tagName==='SELECT'||control.type==='text'))control.focus({preventScroll:true})},60)}
function correct(q,u){return q.type==='text'?q.ans.map(norm).includes(norm(u)):norm(u)===norm(q.ans)}
function inlineReviewHTML(q,user){
  const r=answerReview[q.n];
  return `<div class="inline-review${q.type==='text'||q.type==='select'?' integrated':''}" data-inline-review="${q.n}">
    <div class="inline-review-title">
      <span class="inline-review-badge">Q${q.n}</span>
      <span>Giải thích câu trả lời sai</span>
    </div>
    <div class="inline-review-row">
      <div class="inline-review-label">Bạn trả lời</div>
      <div class="inline-review-student">${esc(displayAnswer(q,user))}</div>
    </div>
    <div class="inline-review-row">
      <div class="inline-review-label">Đáp án đúng</div>
      <div class="inline-review-correct">${esc(displayKey(q))}</div>
    </div>
    <div class="inline-review-explain"><b>Vì sao?</b> ${esc(r.explain)}</div>
    <div class="inline-review-evidence">
      <div class="inline-review-evidence-label">Evidence · Passage ${q.p}, đoạn ${r.para}</div>
      <div class="inline-review-quote">“${esc(r.evidence)}”</div>
    </div>
    <button type="button" class="inline-review-btn" onclick="focusEvidence(${q.n})">↗ Đối chiếu trong bài đọc</button>
  </div>`;
}

function removeInlineReview(n){
  document.querySelectorAll(`[data-inline-review="${n}"]`).forEach(e=>e.remove());
}

function renderInlineReview(q,user,ok){
  removeInlineReview(q.n);
  if(ok)return;

  const card=document.getElementById('card'+q.n);
  if(!card)return;

  // Standard IELTS question cards: explanation sits directly under the options.
  if(card.classList.contains('card')){
    card.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
    return;
  }

  // Completion tasks: place review under the sentence/step/note containing the blank.
  const host=card.closest('.flow-step,li,.completion-text') || card.parentElement;
  if(!host)return;

  // Several blanks may live in the same summary paragraph; keep each explanation labelled by Q number.
  host.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
}

function lockSubmittedAnswers(){
  if(!submitted)return;
  document.querySelectorAll('#questionsCopy input,#questionsCopy select').forEach(e=>e.disabled=true);
}

function focusEvidence(n){
  const q=questions.find(x=>x.n===n);
  const r=answerReview[n];
  if(!q||!r)return;

  const reveal=()=>{
    const copy=document.getElementById('passageCopy');
    const ps=copy?[...copy.querySelectorAll('p')]:[];
    const target=ps[r.para-1];
    if(!target)return;
    target.scrollIntoView({behavior:'smooth',block:'center'});
    target.classList.add('evidence-pulse');
    setTimeout(()=>target.classList.remove('evidence-pulse'),3200);
  };

  if(q.p!==current){
    showPassage(q.p);
    setTimeout(reveal,150);
  }else{
    reveal();
  }
}

function markPassage(p){
  for(const q of questions.filter(x=>x.p===p)){
    const u=ssGet('q'+q.n)||'';
    const ok=correct(q,u);
    const fb=document.getElementById('fb'+q.n);

    if(q.type==='text'||q.type==='select'){
      const e=document.getElementById('q'+q.n);
      if(e){
        e.classList.remove('correct','wrong');
        e.classList.add(ok?'correct':'wrong');
      }
    }else{
      document.querySelectorAll(`label[data-q="${q.n}"]`).forEach(l=>{
        l.classList.remove('correct','wrong');
        if(norm(l.dataset.val)===norm(q.ans))l.classList.add('correct');
        else if(u&&norm(l.dataset.val)===norm(u))l.classList.add('wrong');
      });
    }

    if(fb){
      const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
      fb.className='feedback '+(ok?'good':'bad');
      fb.textContent=ok?'✓ Correct':'Correct answer: '+key;
    }

    if(submitted)renderInlineReview(q,u,ok);
  }

  lockSubmittedAnswers();
}

function displayAnswer(q,user){
  if(!String(user).trim())return 'Không trả lời';
  if(q.type==='select'||(q.type==='choice'&&/^[A-H1-4]$/.test(String(user)))){
    const found=(q.opts||[]).find(x=>String(x).startsWith(String(user)+' '));
    return found||user;
  }
  return user;
}
function displayKey(q){
  const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
  if(q.type==='select'||(q.type==='choice'&&/^[A-H1-4]$/.test(String(key)))){
    const found=(q.opts||[]).find(x=>String(x).startsWith(String(key)+' '));
    return found||key;
  }
  return key;
}
function renderWrongReview(details){
  const box=document.getElementById('wrongReview');
  const wrong=details.filter(x=>!x.correct);
  if(!wrong.length){
    box.innerHTML='<h3 class="review-title">Review đáp án</h3><div class="perfect-review">🎉 Không có câu sai. Bạn đã trả lời đúng cả 40 câu!</div>';
    return;
  }
  box.innerHTML=`<h3 class="review-title">${wrong.length} câu cần xem lại</h3>
    <div class="review-mode-note">Đóng bảng điểm để xem <b>giải thích + evidence được ghim trực tiếp ngay dưới từng câu sai</b>. Khi chuyển Passage, phần giải thích vẫn còn để bạn đối chiếu với bài đọc.</div>`;
}
function gotoEvidence(n){
  document.getElementById('overlay').classList.add('hidden');
  focusEvidence(n);
}

async function submitExam(auto=false){if(submitted)return;saveCurrentMarkups();const unanswered=questions.filter(q=>!(ssGet('q'+q.n)||'').trim()).length;if(!auto&&unanswered&& !confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;submitted=true;clearInterval(timerHandle);let total=0,s=[0,0,0,0],details=[];for(const q of questions){const u=ssGet('q'+q.n)||'',ok=correct(q,u);if(ok){total++;s[q.p]++}details.push({q:q.n,answer:u,correct:ok,key:Array.isArray(q.ans)?q.ans.join(' / '):q.ans});const ne=document.getElementById('nav'+q.n);if(ne){ne.classList.remove('answered');ne.classList.add(ok?'correct':'wrong')}}markPassage(current);saveZoneMarkup('questions');const name=document.getElementById('studentName').value.trim(),cls=document.getElementById('studentClass').value.trim(),dur=Math.round((Date.now()-startedAt)/1000);document.getElementById('rstudent').textContent=`${name} — ${cls}`;document.getElementById('rscore').textContent=`${total} / 40`;document.getElementById('rpercent').textContent=`${Math.round(total/40*100)}% correct`;document.getElementById('p1s').textContent=`${s[1]} / 13`;document.getElementById('p2s').textContent=`${s[2]} / 13`;document.getElementById('p3s').textContent=`${s[3]} / 14`;renderWrongReview(details);document.getElementById('overlay').classList.remove('hidden');document.getElementById('status').textContent='Đang gửi kết quả về Google Sheet...';const p=new URLSearchParams({name,className:cls,total:String(total),maxScore:'40',durationSeconds:String(dur),activity:'IELTS Reading - Cane Toad / Farmers / Life on Mars',reading:String(s[1]),grammar:String(s[2]),ing:String(s[3]),writingA:JSON.stringify(details),submittedAt:new Date().toISOString()});try{await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p.toString()});document.getElementById('status').textContent='✓ Đã gửi kết quả về Google Sheet.'}catch(e){document.getElementById('status').textContent='Không gửi được kết quả về Google Sheet. Hãy kiểm tra Web App URL hoặc kết nối mạng.'}}
function closeResult(){document.getElementById('overlay').classList.add('hidden');markPassage(current);saveZoneMarkup('questions')}
</script></body></html>
