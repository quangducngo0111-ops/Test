<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Speaking Topics</title><style>
:root{--navy:#281260;--line:#e2e5ef;--muted:#6a7388}*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,Arial;background:radial-gradient(circle at top left,#ede9ff,#f5f7fb 44%);color:#242b3b}header{background:linear-gradient(110deg,#1c0e49,#39217d);color:white;padding:18px max(18px,calc((100% - 1080px)/2))}header a{color:white;text-decoration:none}main{max-width:1080px;margin:auto;padding:26px 18px 60px}.hero{background:linear-gradient(110deg,#fff,#f5f1ff,#edf6ff);border-radius:20px;padding:26px;border:1px solid white}.hero h1{color:var(--navy);margin:4px 0;font-size:30px}.hero p,.meta{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.card{display:flex;align-items:center;gap:14px;padding:18px;background:white;border:1px solid var(--line);border-radius:15px;text-decoration:none;color:inherit}.card:hover{border-color:#9780dc}.num{display:grid;place-items:center;flex:0 0 49px;height:49px;background:#eee9ff;color:#5135a6;border-radius:13px;font-weight:900}.card b{display:block;color:var(--navy)}.card small{color:var(--muted)}.error{color:#a32846}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header><a href="../">← Practice</a>　🎙️ Speaking Practice</header><main><section class="hero"><small>IELTS SPEAKING · GUIDED PRACTICE</small><h1>Speaking Topics</h1><p>Chọn chủ đề để trả lời bằng microphone và luyện mở rộng ý. Không cần API key.</p></section><h2>Danh sách chủ đề</h2><p id="status" class="meta">Đang tải danh sách…</p><section class="grid" id="grid"></section></main><script>
(async()=>{const status=document.getElementById('status'),grid=document.getElementById('grid');try{const r=await fetch('./topics/index.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data.topics))throw Error('Danh mục không hợp lệ');status.textContent=data.topics.length+' chủ đề';for(const topic of data.topics){if(!/^\d{2,5}$/.test(String(topic.id)))continue;const a=document.createElement('a');a.className='card';a.href='./practice.html?topic='+encodeURIComponent(topic.id);const num=document.createElement('span');num.className='num';num.textContent=topic.id;const body=document.createElement('span');const b=document.createElement('b');b.textContent=topic.title;const small=document.createElement('small');small.textContent=(topic.part||'Speaking Part 1')+' · '+(topic.description||'Luyện nói và mở rộng ý');body.append(b,small);a.append(num,body);grid.append(a)}}catch(e){status.className='error';status.textContent='Không tải được danh mục. Hãy kiểm tra topics/index.json và mở qua website HTTPS (không mở file trực tiếp).';console.error(e)}})();
</script></body></html>
