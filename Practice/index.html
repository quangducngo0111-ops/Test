<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kho Luyện Tập IELTS</title>
<style>
:root{
  --ink:#172033;--muted:#6e768a;--line:#e3e7ef;--bg:#f4f7fc;
  --purple:#6f51d6;--purple2:#8b6fec;--blue:#2d79e6
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--ink);background:
  radial-gradient(circle at 8% 0%,rgba(141,105,246,.12),transparent 24%),
  linear-gradient(180deg,#f8f8ff,#f3f7fc)
}
button{font:inherit;cursor:pointer}
.wrap{width:min(1200px,calc(100% - 24px));margin:auto}
.top{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)
}
.topin{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{
  text-decoration:none;color:#3c315e;border:1px solid var(--line);background:#fff;
  border-radius:10px;padding:8px 11px;font-size:11px;font-weight:900
}
.brand{font-weight:950;color:#21164b}.student{font-size:11px;color:#626a7d;font-weight:800}
main{padding:24px 0 50px}
.hero{
  padding:26px;border:1px solid rgba(255,255,255,.96);border-radius:28px;
  background:linear-gradient(115deg,#fff,#f7f3ff 55%,#eef7ff);
  box-shadow:0 14px 34px rgba(48,42,90,.08);margin-bottom:18px
}
.eyebrow{
  display:inline-flex;padding:7px 11px;border-radius:999px;background:#eee8ff;
  color:#6048b6;font-size:10px;font-weight:950;letter-spacing:.09em;text-transform:uppercase
}
.hero h1{margin:10px 0 6px;font-size:36px;letter-spacing:-.04em;color:#21164b}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.mode-note{
  margin-top:14px;display:inline-flex;gap:8px;align-items:center;padding:9px 11px;border-radius:11px;
  background:#fff;border:1px solid #e7e2fa;color:#554582;font-size:11px;font-weight:800
}
.tabs{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 16px;
  padding:7px;background:#eceff5;border-radius:15px
}
.tab{
  border:0;background:transparent;border-radius:10px;padding:12px 10px;text-align:left;
  color:#4f576a;font-size:11px;font-weight:900
}
.tab small{display:block;margin-top:3px;color:#9399a7;font-weight:700}
.tab.active{background:#fff;color:#5d43b0;box-shadow:0 5px 15px rgba(41,35,80,.08)}
.head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:12px}
.head h2{margin:0;font-size:24px;color:#21164b}.head p{margin:4px 0 0;color:var(--muted);font-size:11px}
.count{font-size:11px;font-weight:900;color:#676e80}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{
  display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:15px;
  background:#fff;box-shadow:0 5px 13px rgba(50,55,90,.035);text-decoration:none;color:inherit;transition:.16s ease
}
.card:hover{transform:translateY(-2px);border-color:#cabdfa;box-shadow:0 10px 22px rgba(61,50,105,.08)}
.badge{
  flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:#edf3ff;color:#2f6fdf;
  display:grid;place-items:center;font-size:10px;font-weight:950
}
.copy{min-width:0;flex:1}.copy b{display:block;font-size:12.5px;color:#1f2637;margin-bottom:3px}
.copy span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{font-size:16px;color:#9ca2b1}
.empty{grid-column:1/-1;padding:38px;text-align:center;border:1px dashed #d7dce6;border-radius:16px;background:#fff;color:#7d8493}
.footer{padding:24px 0;text-align:center;color:#9aa0ad;font-size:10.5px}
@media(max-width:850px){.tabs{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topin">
    <div style="display:flex;align-items:center;gap:10px">
      <a class="back" href="../">← Trang chủ</a>
      <div class="brand">🎯 Kho Luyện Tập</div>
    </div>
    <div class="student" id="studentInfo"></div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Luyện tập</div>
    <h1>Kho luyện tập IELTS</h1>
    <p>Chọn kỹ năng và bài muốn luyện.</p>
  </section>

  <div class="tabs" id="tabs"></div>

  <div class="head">
    <div><h2 id="title">Reading</h2><p id="subtitle">Chọn một bài để bắt đầu luyện tập.</p></div>
    <div class="count" id="count">0 mục</div>
  </div>

  <section class="grid" id="grid"></section>
  <div class="footer">IELTS Practice</div>
</main>

<script>
const TREE='https://api.github.com/repos/quangducngo0111-ops/Test/git/trees/main?recursive=1';
const CACHE_KEY='IELTS_PRACTICE_CATALOG_V4';
const CACHE_TTL=6*60*60*1000;

const CATS={
  reading:{label:'Reading',root:'Practice/Reading/',sub:'Passage & dạng bài'},
  listening:{label:'Listening',root:'Practice/Listening/',sub:'Part & dạng bài'},
  writing1:{label:'Writing Task 1',root:'Practice/WritingTask1/',sub:'Task 1'},
  writing2:{label:'Writing Task 2',root:'Practice/WritingTask2/',sub:'Task 2'},
  vocabulary:{label:'Vocabulary',root:'Practice/Vocabulary/',sub:'Từ vựng & trò chơi'}
};

/* Fallback chỉ dùng khi GitHub API tạm lỗi / rate limit. */
const FALLBACK={
  reading:[
    {title:'Reading Passage 1',desc:'Reading practice',url:'./Reading/ReadingPassage1/'},
    {title:'Reading Passage 2',desc:'Reading practice',url:'./Reading/ReadingPassage2/'}
  ],
  listening:[
    {title:'Listening Part 1',desc:'IELTS Listening Part 1',url:'./Listening/Part1/'},
    {title:'Listening Part 2',desc:'IELTS Listening Part 2',url:'./Listening/Part2/'},
    {title:'Intensive Listening',desc:'Gap-fill + Dictation',url:'./Listening/IntensiveListening/'}
  ],
  writing1:[
    {title:'Dynamic Datasets',desc:'Writing Task 1 practice',url:'./WritingTask1/DynamicDatasets/'}
  ],
  writing2:[],
  vocabulary:[
    {title:'Vocabulary Practice',desc:'Từ vựng & trò chơi',url:'./Vocabulary/'}
  ]
};

let catalog=cloneCatalog(FALLBACK);
let current='reading';

function cloneCatalog(source){
  return Object.fromEntries(Object.keys(CATS).map(k=>[k,(source[k]||[]).map(x=>({...x}))]));
}
function student(){
  try{
    const s=JSON.parse(localStorage.getItem('IELTS_PRACTICE_STUDENT')||'null');
    if(s?.name) document.getElementById('studentInfo').textContent=s.name+(s.className?` · ${s.className}`:'');
  }catch(e){}
}
function num(s){const m=String(s||'').match(/\d+/);return m?Number(m[0]):9999}
function pretty(s){
  return String(s||'')
   .replace(/[_-]+/g,' ')
   .replace(/([a-z])([A-Z])/g,'$1 $2')
   .replace(/^Passage(\d+)$/i,'Passage $1')
   .replace(/^Part(\d+)$/i,'Part $1')
   .replace(/^Reading(\d+)$/i,'Reading $1')
   .replace(/^Practice(\d+)$/i,'Practice $1')
   .replace(/\b\w/g,m=>m.toUpperCase());
}
function item(path,root){
  const rel=path.slice(root.length).replace(/\/index\.html$/i,'');
  const parts=rel.split('/').filter(Boolean);
  if(parts.length!==1)return null;
  const raw=parts[0];
  if(/^README_TEMPLATE$/i.test(raw)) return null;
  const labels={
    ReadingPassage1:'Reading Passage 1',ReadingPassage2:'Reading Passage 2',
    Part1:'Listening Part 1',Part2:'Listening Part 2',IntensiveListening:'Intensive Listening',
    TrueFalseNotGiven:'True / False / Not Given',YesNoNotGiven:'Yes / No / Not Given',
    MatchingHeadings:'Matching Headings',MatchingInformation:'Matching Information',MatchingFeatures:'Matching Features',
    MatchingSentenceEndings:'Matching Sentence Endings',SentenceCompletion:'Sentence Completion',SummaryCompletion:'Summary Completion',
    TableCompletion:'Table Completion',NoteCompletion:'Note Completion',FlowChartCompletion:'Flow-chart Completion',
    ShortAnswerQuestions:'Short Answer Questions',MultipleChoice:'Multiple Choice',DiagramLabelling:'Diagram Labelling',
    DynamicDatasets:'Dynamic Datasets'
  };
  return{
    title:labels[raw]||pretty(raw),
    desc:'Dạng bài luyện tập',
    url:'./'+path.replace(/^Practice\//,'').replace(/index\.html$/i,''),
    depth:1,
    sort:[num(raw),raw]
  };
}
function renderTabs(){
  tabs.innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="tab ${k===current?'active':''}" data-cat="${k}">${v.label}<small>${v.sub}</small></button>`).join('');
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{current=b.dataset.cat;render()});
}
function render(){
  renderTabs();
  const c=CATS[current],list=catalog[current]||[];
  title.textContent=c.label;
  subtitle.textContent=`${list.length} mục luyện tập`;
  count.textContent=`${list.length} mục`;
  grid.innerHTML=list.length?list.map((x,i)=>`
    <a class="card" href="${x.url}?practice=1">
      <div class="badge">${String(i+1).padStart(2,'0')}</div>
      <div class="copy"><b>${x.title}</b><span>${x.desc}</span></div>
      <div class="arrow">→</div>
    </a>`).join(''):'<div class="empty">Chưa có mục luyện tập trong nhóm này.</div>';
}
function readCache(){
  try{
    const raw=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(raw?.catalog && raw?.savedAt){
      catalog=raw.catalog;
      render();
      return raw;
    }
  }catch(e){}
  return null;
}
function saveCache(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),catalog}));}catch(e){}
}
async function loadRemote(){
  const cached=readCache();
  if(cached && Date.now()-cached.savedAt<CACHE_TTL) return;

  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),5000);
  try{
    const r=await fetch(TREE,{cache:'no-store',signal:controller.signal});
    if(!r.ok) throw new Error(`GitHub API ${r.status}`);
    const d=await r.json();
    if(!Array.isArray(d.tree)) throw new Error('GitHub tree không hợp lệ');
    const paths=d.tree.filter(x=>x.type==='blob'&&/index\.html$/i.test(x.path)).map(x=>x.path);
    const next=cloneCatalog(FALLBACK);
    for(const [k,c] of Object.entries(CATS)){
      const found=paths
        .filter(p=>p.startsWith(c.root)&&p!==c.root+'index.html')
        .map(p=>item(p,c.root)).filter(Boolean)
        .sort((a,b)=>(a.sort?.[0]??9999)-(b.sort?.[0]??9999)||String(a.title).localeCompare(String(b.title),undefined,{numeric:true}));
      if(found.length) next[k]=found;
    }
    /* Vocabulary có trang chính ở root, giữ card ổn định thay vì liệt kê asset/game con. */
    next.vocabulary=FALLBACK.vocabulary;
    catalog=next;
    saveCache();
    render();
  }catch(e){
    console.warn('Không tải được GitHub tree, giữ danh sách cache/fallback:',e);
    render();
  }finally{
    clearTimeout(timeout);
  }
}

student();
render();          // hiện fallback ngay, không bao giờ trắng
loadRemote();      // cập nhật nền nếu GitHub API hoạt động
</script>
</body>
</html>
