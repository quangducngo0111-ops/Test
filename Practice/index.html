<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Kho Luyện Tập IELTS</title>

<style>
:root{
  --ink:#172033;
  --muted:#6e768a;
  --line:#e3e7ef;
  --bg:#f4f7fc;
  --purple:#6f51d6;
  --purple2:#8b6fec;
  --blue:#2d79e6;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    "Segoe UI",
    Arial,
    sans-serif;

  color:var(--ink);

  background:
    radial-gradient(
      circle at 8% 0%,
      rgba(141,105,246,.12),
      transparent 24%
    ),
    linear-gradient(
      180deg,
      #f8f8ff,
      #f3f7fc
    );
}

button{
  font:inherit;
  cursor:pointer;
}

.wrap{
  width:min(
    1200px,
    calc(100% - 24px)
  );

  margin:auto;
}


/* =========================================================
   HEADER
========================================================= */

.top{
  position:sticky;
  top:0;
  z-index:30;

  background:
    rgba(255,255,255,.9);

  backdrop-filter:
    blur(14px);

  border-bottom:
    1px solid var(--line);
}

.topin{
  min-height:62px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;
}

.back{
  text-decoration:none;

  color:#3c315e;

  border:
    1px solid var(--line);

  background:#fff;

  border-radius:10px;

  padding:
    8px 11px;

  font-size:11px;
  font-weight:900;
}

.brand{
  font-weight:950;
  color:#21164b;
}

.student{
  font-size:11px;
  color:#626a7d;
  font-weight:800;
}


/* =========================================================
   MAIN
========================================================= */

main{
  padding:
    24px 0 50px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  padding:26px;

  border:
    1px solid
    rgba(255,255,255,.96);

  border-radius:28px;

  background:
    linear-gradient(
      115deg,
      #fff,
      #f7f3ff 55%,
      #eef7ff
    );

  box-shadow:
    0 14px 34px
    rgba(48,42,90,.08);

  margin-bottom:18px;
}

.eyebrow{
  display:inline-flex;

  padding:
    7px 11px;

  border-radius:999px;

  background:#eee8ff;

  color:#6048b6;

  font-size:10px;
  font-weight:950;

  letter-spacing:.09em;
  text-transform:uppercase;
}

.hero h1{
  margin:
    10px 0 6px;

  font-size:36px;

  letter-spacing:-.04em;

  color:#21164b;
}

.hero p{
  margin:0;

  color:var(--muted);

  font-size:13px;
  line-height:1.6;
}


/* =========================================================
   TABS
========================================================= */

.tabs{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:8px;

  margin:
    18px 0 16px;

  padding:7px;

  background:#eceff5;

  border-radius:15px;
}

.tab{
  border:0;

  background:transparent;

  border-radius:10px;

  padding:
    12px 10px;

  text-align:left;

  color:#4f576a;

  font-size:11px;
  font-weight:900;
}

.tab small{
  display:block;

  margin-top:3px;

  color:#9399a7;

  font-weight:700;
}

.tab.active{
  background:#fff;

  color:#5d43b0;

  box-shadow:
    0 5px 15px
    rgba(41,35,80,.08);
}


/* =========================================================
   SECTION HEAD
========================================================= */

.head{
  display:flex;

  align-items:end;
  justify-content:space-between;

  gap:15px;

  margin-bottom:12px;
}

.head h2{
  margin:0;

  font-size:24px;

  color:#21164b;
}

.head p{
  margin:
    4px 0 0;

  color:var(--muted);

  font-size:11px;
}

.count{
  font-size:11px;
  font-weight:900;

  color:#676e80;
}


/* =========================================================
   CARDS
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}

.card{
  display:flex;

  align-items:center;

  gap:12px;

  padding:13px;

  border:
    1px solid var(--line);

  border-radius:15px;

  background:#fff;

  box-shadow:
    0 5px 13px
    rgba(50,55,90,.035);

  text-decoration:none;

  color:inherit;

  transition:.16s ease;
}

.card:hover{
  transform:
    translateY(-2px);

  border-color:#cabdfa;

  box-shadow:
    0 10px 22px
    rgba(61,50,105,.08);
}

.badge{
  flex:
    0 0 42px;

  width:42px;
  height:42px;

  border-radius:12px;

  background:#edf3ff;

  color:#2f6fdf;

  display:grid;

  place-items:center;

  font-size:10px;
  font-weight:950;
}

.badge.vocab{
  background:#f0ebff;

  color:#6546bd;

  font-size:21px;
}

.copy{
  min-width:0;

  flex:1;
}

.copy b{
  display:block;

  font-size:12.5px;

  color:#1f2637;

  margin-bottom:3px;
}

.copy span{
  display:block;

  font-size:10.5px;

  color:var(--muted);

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.arrow{
  font-size:16px;

  color:#9ca2b1;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
  grid-column:
    1 / -1;

  padding:38px;

  text-align:center;

  border:
    1px dashed #d7dce6;

  border-radius:16px;

  background:#fff;

  color:#7d8493;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
  padding:
    24px 0;

  text-align:center;

  color:#9aa0ad;

  font-size:10.5px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

  .tabs{
    grid-template-columns:
      1fr 1fr;
  }

  .grid{
    grid-template-columns:
      1fr;
  }

}
</style>
</head>


<body>


<header class="top">

  <div class="wrap topin">

    <div
      style="
        display:flex;
        align-items:center;
        gap:10px;
      "
    >

      <a
        class="back"
        href="../"
      >
        ← Trang chủ
      </a>


      <div class="brand">
        🎯 Kho Luyện Tập
      </div>

    </div>


    <div
      class="student"
      id="studentInfo"
    ></div>

  </div>

</header>


<main class="wrap">


  <section class="hero">

    <div class="eyebrow">
      Luyện tập
    </div>


    <h1>
      Kho luyện tập IELTS
    </h1>


    <p>
      Chọn kỹ năng và bài muốn luyện.
    </p>

  </section>


  <div
    class="tabs"
    id="tabs"
  ></div>


  <div class="head">

    <div>

      <h2 id="title">
        Reading
      </h2>


      <p id="subtitle">
        Chọn một bài để bắt đầu luyện tập.
      </p>

    </div>


    <div
      class="count"
      id="count"
    >
      0 mục
    </div>

  </div>


  <section
    class="grid"
    id="grid"
  ></section>


  <div class="footer">
    IELTS Practice
  </div>

</main>


<script>

/* =========================================================
   GITHUB TREE
========================================================= */

const TREE =
'https://api.github.com/repos/quangducngo0111-ops/Test/git/trees/main?recursive=1';


/* =========================================================
   CATEGORIES
========================================================= */

const CATS = {

  reading:{
    label:'Reading',
    root:'Practice/Reading/',
    sub:'Passage & dạng bài'
  },

  listening:{
    label:'Listening',
    root:'Practice/Listening/',
    sub:'Part & dạng bài'
  },

  writing1:{
    label:'Writing Task 1',
    root:'Practice/WritingTask1/',
    sub:'Task 1'
  },

  writing2:{
    label:'Writing Task 2',
    root:'Practice/WritingTask2/',
    sub:'Task 2'
  },

  vocabulary:{
    label:'Vocabulary',
    root:null,
    sub:'Từ vựng & trò chơi'
  }

};


/* =========================================================
   CATALOG

   Vocabulary KHÔNG cần API.
========================================================= */

let catalog = {

  reading:[],

  listening:[],

  writing1:[],

  writing2:[]

};


let current =
'reading';


/* =========================================================
   STUDENT
========================================================= */

function student(){

  try{

    const s =
    JSON.parse(

      localStorage.getItem(
        'IELTS_PRACTICE_STUDENT'
      )

      ||

      'null'

    );


    if(
      s
      &&
      s.name
      &&
      s.className
    ){

      document
      .getElementById(
        'studentInfo'
      )
      .textContent =
      `${s.name} · ${s.className}`;

    }

  }

  catch(e){}

}


/* =========================================================
   HELPERS
========================================================= */

function num(s){

  const m =
  String(
    s || ''
  )
  .match(
    /\d+/
  );


  return m

  ?

  Number(
    m[0]
  )

  :

  9999;

}


function pretty(s){

  return String(
    s || ''
  )

  .replace(
    /[_-]+/g,
    ' '
  )

  .replace(
    /([a-z])([A-Z])/g,
    '$1 $2'
  )

  .replace(
    /^Passage(\d+)$/i,
    'Passage $1'
  )

  .replace(
    /^Part(\d+)$/i,
    'Part $1'
  )

  .replace(
    /^Reading(\d+)$/i,
    'Reading $1'
  )

  .replace(
    /^Practice(\d+)$/i,
    'Practice $1'
  )

  .replace(
    /\b\w/g,
    m =>
    m.toUpperCase()
  );

}


/* =========================================================
   ITEM
========================================================= */

function item(
  path,
  root
){

  const rel =
  path
  .slice(
    root.length
  )
  .replace(
    /\/index\.html$/i,
    ''
  );


  const parts =
  rel
  .split('/')
  .filter(Boolean);


  /*
   * Chỉ lấy folder cấp 1.
   */

  if(
    parts.length !==
    1
  ){

    return null;

  }


  const raw =
  parts[0];


  const labels = {

    TrueFalseNotGiven:
      'True / False / Not Given',

    YesNoNotGiven:
      'Yes / No / Not Given',

    MatchingHeadings:
      'Matching Headings',

    MatchingInformation:
      'Matching Information',

    MatchingFeatures:
      'Matching Features',

    MatchingSentenceEndings:
      'Matching Sentence Endings',

    SentenceCompletion:
      'Sentence Completion',

    SummaryCompletion:
      'Summary Completion',

    TableCompletion:
      'Table Completion',

    NoteCompletion:
      'Note Completion',

    FlowChartCompletion:
      'Flow-chart Completion',

    ShortAnswerQuestions:
      'Short Answer Questions',

    MultipleChoice:
      'Multiple Choice',

    DiagramLabelling:
      'Diagram Labelling',

    Part1:
      'Listening Part 1',

    Part2:
      'Listening Part 2',

    Part3:
      'Listening Part 3',

    Part4:
      'Listening Part 4'

  };


  return{

    title:
      labels[raw]
      ||
      pretty(raw),

    desc:
      'Dạng bài luyện tập',

    url:
      '../'
      +
      path.replace(
        /index\.html$/i,
        ''
      ),

    depth:
      1,

    sort:[
      num(raw),
      raw
    ]

  };

}


/* =========================================================
   TABS
========================================================= */

function renderTabs(){

  const tabs =
  document.getElementById(
    'tabs'
  );


  tabs.innerHTML =
  Object.entries(
    CATS
  )
  .map(
    (
      [
        key,
        value
      ]
    ) => {

      return`
        <button
          class="tab ${
            key === current
            ?
            'active'
            :
            ''
          }"
          data-cat="${key}"
        >

          ${value.label}

          <small>
            ${value.sub}
          </small>

        </button>
      `;

    }
  )
  .join('');


  document
  .querySelectorAll(
    '[data-cat]'
  )
  .forEach(
    button => {

      button.onclick =
      ()=>{

        current =
        button.dataset.cat;


        render();

      };

    }
  );

}


/* =========================================================
   VOCABULARY RENDER

   QUAN TRỌNG:
   Không dùng catalog.
   Không dùng GitHub API.
   Không kiểm tra folder.
   Luôn trỏ trực tiếp sang link đang hoạt động.
========================================================= */

function renderVocabulary(){

  document
  .getElementById(
    'title'
  )
  .textContent =
  'Vocabulary';


  document
  .getElementById(
    'subtitle'
  )
  .textContent =
  'Học từ vựng theo kỹ năng, chủ đề và trò chơi.';


  document
  .getElementById(
    'count'
  )
  .textContent =
  '1 mục';


  document
  .getElementById(
    'grid'
  )
  .innerHTML =
  `
    <a
      class="card"
      href="/Test/Practice/Vocabulary/"
    >

      <div class="badge vocab">
        🎮
      </div>


      <div class="copy">

        <b>
          Vocabulary Practice
        </b>

        <span>
          Reading · Listening · Speaking · Writing · Chủ đề · Game
        </span>

      </div>


      <div class="arrow">
        →
      </div>

    </a>
  `;

}


/* =========================================================
   NORMAL RENDER
========================================================= */

function renderNormal(){

  const category =
  CATS[current];


  const list =
  catalog[current]
  ||
  [];


  document
  .getElementById(
    'title'
  )
  .textContent =
  category.label;


  document
  .getElementById(
    'subtitle'
  )
  .textContent =
  `${list.length} mục luyện tập`;


  document
  .getElementById(
    'count'
  )
  .textContent =
  `${list.length} mục`;


  document
  .getElementById(
    'grid'
  )
  .innerHTML =

  list.length

  ?

  list
  .map(
    (
      x,
      index
    ) => {

      return`
        <a
          class="card"
          href="${x.url}?practice=1"
        >

          <div class="badge">
            ${String(
              index+1
            )
            .padStart(
              2,
              '0'
            )}
          </div>


          <div class="copy">

            <b>
              ${x.title}
            </b>

            <span>
              ${x.desc}
            </span>

          </div>


          <div class="arrow">
            →
          </div>

        </a>
      `;

    }
  )
  .join('')

  :

  `
    <div class="empty">
      Chưa có bài trong mục này.
      Hãy tạo folder và index.html theo cấu trúc Practice.
    </div>
  `;

}


/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

  renderTabs();


  /*
   * QUAN TRỌNG:
   *
   * Vocabulary thoát hoàn toàn khỏi catalog/API.
   */

  if(
    current ===
    'vocabulary'
  ){

    renderVocabulary();

    return;

  }


  renderNormal();

}


/* =========================================================
   LOAD GITHUB TREE

   Chỉ dùng cho:
   Reading
   Listening
   Writing 1
   Writing 2
========================================================= */

async function load(){

  try{

    const response =
    await fetch(
      TREE,
      {
        cache:
          'no-store'
      }
    );


    if(
      !response.ok
    ){

      throw new Error(
        response.status
      );

    }


    const data =
    await response.json();


    const paths =
    data.tree
    .filter(
      item =>
      item.type ===
      'blob'

      &&

      /index\.html$/i
      .test(
        item.path
      )
    )
    .map(
      item =>
      item.path
    );


    /*
     * Chỉ load 4 category này.
     *
     * KHÔNG CÓ VOCABULARY.
     */

    const apiCategories = [
      'reading',
      'listening',
      'writing1',
      'writing2'
    ];


    apiCategories
    .forEach(
      key => {

        const category =
        CATS[key];


        catalog[key] =
        paths

        .filter(
          path =>
          path.startsWith(
            category.root
          )

          &&

          path !==
          category.root
          +
          'index.html'
        )

        .map(
          path =>
          item(
            path,
            category.root
          )
        )

        .filter(Boolean)

        .sort(
          (
            a,
            b
          ) => {

            return(
              a.depth
              -
              b.depth

              ||

              a.sort[0]
              -
              b.sort[0]

              ||

              String(
                a.sort[1]
              )
              .localeCompare(
                String(
                  b.sort[1]
                ),
                undefined,
                {
                  numeric:true
                }
              )
            );

          }
        );

      }
    );

  }

  catch(error){

    console.warn(
      'GitHub API error:',
      error
    );

  }


  /*
   * Nếu hiện đang ở Vocabulary,
   * render vẫn luôn ra Vocabulary.
   */

  render();

}


/* =========================================================
   INIT
========================================================= */

student();


render();


load();

</script>

</body>
</html>
