
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho Luyện Tập IELTS</title>
<style>
:root{
  --ink:#172033;--muted:#6e768a;--line:#e3e7ef;
  --purple:#6f51d6;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:radial-gradient(circle at 8% 0%,#eae6ff,transparent 28%),#f4f7fc;
}
button{font:inherit;cursor:pointer}
.wrap{width:min(1200px,calc(100% - 24px));margin:auto}
.top{
  position:sticky;top:0;z-index:30;background:#ffffffef;
  border-bottom:1px solid var(--line);backdrop-filter:blur(12px)
}
.topin{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{
  text-decoration:none;color:#3c315e;border:1px solid var(--line);
  background:#fff;border-radius:10px;padding:8px 11px;font-size:11px;font-weight:900
}
.brand{font-weight:950;color:#21164b}
.student{font-size:11px;color:#626a7d;font-weight:800}
main{padding:24px 0 50px}
.hero{
  padding:26px;border:1px solid white;border-radius:25px;
  background:linear-gradient(115deg,#fff,#f7f3ff 55%,#eef7ff);
  box-shadow:0 14px 34px #302a5a14;margin-bottom:18px
}
.eyebrow{
  display:inline-flex;padding:7px 11px;border-radius:99px;background:#eee8ff;
  color:#6048b6;font-size:10px;font-weight:950;letter-spacing:.09em
}
.hero h1{margin:10px 0 6px;font-size:clamp(25px,4vw,36px);color:#21164b}
.hero p{margin:0;color:var(--muted);font-size:13px}
.tabs{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0;
  padding:7px;background:#eceff5;border-radius:15px
}
.tab{
  border:0;background:transparent;border-radius:12px;padding:11px;
  text-align:left;color:#4f576a;font-size:11px;font-weight:900;
  display:flex;align-items:center;gap:9px
}
.tab-icon{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;
  display:grid;place-items:center;background:#ffffffb0;font-size:16px
}
.tab small{display:block;margin-top:3px;color:#9399a7;font-weight:700}
.tab.active{background:#fff;color:#5d43b0;box-shadow:0 5px 15px #29235014}
.tab.active .tab-icon{background:#eee8ff}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px;gap:12px}
.head h2{margin:0;font-size:24px;color:#21164b}
.head p{margin:4px 0 0;color:var(--muted);font-size:11px}
.count{font-size:11px;font-weight:900;color:#676e80}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{
  position:relative;display:flex;align-items:center;gap:14px;
  min-height:96px;padding:16px;border:1px solid var(--line);
  border-radius:17px;background:#fff;box-shadow:0 6px 16px #32375a0a;
  text-decoration:none;color:inherit;transition:.16s ease
}
.card:hover{transform:translateY(-2px);border-color:#cabdfa;box-shadow:0 11px 24px #3d32691a}
.item-icon{
  flex:0 0 54px;width:54px;height:54px;border-radius:15px;
  background:linear-gradient(135deg,#f0ecff,#edf5ff);
  display:grid;place-items:center;font-size:25px;border:1px solid #e6e0fb
}
.item-no{position:absolute;top:11px;right:42px;font-size:9px;font-weight:950;color:#a1a6b3}
.copy{min-width:0;flex:1}
.copy b{display:block;font-size:14px;color:#1f2637;margin-bottom:5px}
.copy span{display:block;font-size:10.5px;color:var(--muted);line-height:1.45}
.arrow{font-size:17px;color:#9ca2b1}
.empty{grid-column:1/-1;padding:38px;text-align:center;background:white;border-radius:16px}
.footer{padding:24px;text-align:center;color:#9aa0ad;font-size:11px}
@media(max-width:850px){
 .tabs{grid-template-columns:1fr 1fr}
 .grid{grid-template-columns:1fr}
 .student{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="wrap topin">
  <div style="display:flex;align-items:center;gap:10px">
    <a class="back" href="../">← Trang chủ</a>
    <div class="brand">🎯 Kho Luyện Tập</div>
  </div>
  <div class="student" id="studentInfo"></div>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">LUYỆN TẬP</div>
    <h1>Kho luyện tập IELTS</h1>
    <p>Chọn kỹ năng và bài muốn luyện.</p>
  </section>
  <div class="tabs" id="tabs"></div>
  <div class="head">
    <div><h2 id="title"></h2><p id="subtitle"></p></div>
    <div class="count" id="count"></div>
  </div>
  <section class="grid" id="grid"></section>
  <div class="footer">IELTS Practice</div>
</main>
<script>
'use strict';

const TREE='https://api.github.com/repos/quangducngo0111-ops/Test/git/trees/main?recursive=1';
const CACHE_KEY='IELTS_PRACTICE_CATALOG_V11';
const ACTIVE_KEY='IELTS_PRACTICE_ACTIVE_TAB_V1';
const TTL=6*60*60*1000;

const CATS={
  reading:{label:'Reading',icon:'📖',root:'Practice/Reading/',sub:'Passage & dạng bài'},
  listening:{label:'Listening',icon:'🎧',root:'Practice/Listening/',sub:'Part & dạng bài'},
  writing1:{label:'Writing Task 1',icon:'✍️',root:'Practice/WritingTask1/',sub:'Task 1'},
  writing2:{label:'Writing Task 2',icon:'📝',root:'Practice/WritingTask2/',sub:'Task 2'},
  vocabulary:{label:'Vocabulary',icon:'🎮',root:'Practice/Vocabulary/',sub:'Từ vựng & trò chơi'}
};

const FALLBACK={
  reading:[
    {title:'Reading Passage 1',icon:'📘',desc:'Reading practice',url:'./Reading/ReadingPassage1/'},
    {title:'Reading Passage 2',icon:'📗',desc:'Reading practice',url:'./Reading/ReadingPassage2/'}
  ],
  listening:[
    {title:'Listening Part 1',icon:'🎧',desc:'IELTS Listening Part 1',url:'./Listening/Part1/'},
    {title:'Listening Part 2',icon:'🎧',desc:'IELTS Listening Part 2',url:'./Listening/Part2/'},
    {title:'Listening Part 3',icon:'🎧',desc:'IELTS Listening Part 3',url:'./Listening/Part3/'},
    {title:'Listening Part 3 + 4',icon:'🎧',desc:'Bài nghe tổng hợp · Questions 21–40',url:'./Listening/3+4/'},
    {title:'Intensive Listening',icon:'🎙️',desc:'Gap-fill + Dictation',url:'./Listening/IntensiveListening/'}
  ],
  writing1:[
    {title:'Dynamic Datasets',icon:'📈',desc:'Biểu đồ thay đổi theo thời gian',url:'./WritingTask1/DynamicDatasets/'},
    {title:'Process',icon:'✍️',desc:'Luyện viết Process theo từng bước',url:'./WritingTask1/Process/'},
    {title:'Maps',icon:'🗺️',desc:'Luyện viết bản đồ theo từng bước',url:'./WritingTask1/Maps/'}
  ],
  writing2:[
    {title:'Translation Practice',icon:'🔤',desc:'Dịch Việt–Anh · Grammar & Spelling Feedback',url:'./WritingTask2/TranslationPractice/'}
  ],
  vocabulary:[
    {title:'Vocabulary Practice',icon:'🎮',desc:'Từ vựng & trò chơi',url:'./Vocabulary/'}
  ]
};

const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const clone=x=>JSON.parse(JSON.stringify(x));
const merge=(a=[],b=[])=>{
  const m=new Map();
  [...a,...b].forEach(x=>{
    if(!x)return;
    const key=String(x.url||x.title).toLowerCase();
    const old=m.get(key)||{};
    const next={...old,...x};
    if(old.icon&&(!x.icon||x.icon==='📚'))next.icon=old.icon;
    if(old.desc&&x.desc==='Dạng bài luyện tập')next.desc=old.desc;
    m.set(key,next);
  });
  return [...m.values()];
};
function mergeCatalog(source){
 const out=clone(FALLBACK);
 Object.keys(CATS).forEach(k=>out[k]=merge(FALLBACK[k],source?.[k]||[]));
 return out;
}

let catalog=clone(FALLBACK);
let current=localStorage.getItem(ACTIVE_KEY)||'reading';
if(!CATS[current])current='reading';

const NAMES={
 ReadingPassage1:['Reading Passage 1','📘'],
 ReadingPassage2:['Reading Passage 2','📗'],
 Part1:['Listening Part 1','🎧'],
 Part2:['Listening Part 2','🎧'],
 Part3:['Listening Part 3','🎧'],
 '3+4':['Listening Part 3 + 4','🎧'],
 IntensiveListening:['Intensive Listening','🎙️'],
 DynamicDatasets:['Dynamic Datasets','📈'],
 Process:['Process','✍️'],
 Maps:['Maps','🗺️'],
 TranslationPractice:['Translation Practice','🔤']
};

function makeItem(path,root){
 const relative=path.slice(root.length).replace(/\/index\.html$/i,'');
 const parts=relative.split('/').filter(Boolean);
 if(parts.length!==1||parts[0]==='README_TEMPLATE')return null;
 const raw=parts[0];
 const info=NAMES[raw];
 const label=info?.[0]||raw.replace(/([a-z])([A-Z])/g,'$1 $2');
 return {
   title:label,
   icon:info?.[1]||'🎧',
   desc:raw==='3+4'?'Bài nghe tổng hợp · Questions 21–40':'Dạng bài luyện tập',
   url:'./'+path.replace(/^Practice\//,'').replace(/index\.html$/i,'')
 };
}

function render(){
 $('tabs').innerHTML=Object.entries(CATS).map(([key,c])=>`
   <button class="tab ${key===current?'active':''}" data-tab="${key}">
     <span class="tab-icon">${c.icon}</span>
     <span>${c.label}<small>${c.sub}</small></span>
   </button>`).join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
   current=b.dataset.tab;
   localStorage.setItem(ACTIVE_KEY,current);
   render();
 });
 const list=catalog[current]||[];
 $('title').textContent=CATS[current].label;
 $('subtitle').textContent=`${list.length} mục luyện tập`;
 $('count').textContent=`${list.length} mục`;
 $('grid').innerHTML=list.length?list.map((x,i)=>`
  <a class="card" href="${escapeHTML(x.url)}?practice=1">
    <div class="item-icon">${x.icon||'📚'}</div>
    <div class="copy">
      <b>${escapeHTML(x.title)}</b>
      <span>${escapeHTML(x.desc)}</span>
    </div>
    <span class="item-no">${String(i+1).padStart(2,'0')}</span>
    <div class="arrow">→</div>
  </a>`).join(''):'<div class="empty">Chưa có bài luyện.</div>';
}

try{
 const s=JSON.parse(localStorage.getItem('IELTS_PRACTICE_STUDENT')||'null');
 if(s?.name)$('studentInfo').textContent=s.name+(s.className?' · '+s.className:'');
}catch(e){}

let cached=null;
try{
 cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
 if(cached?.catalog)catalog=mergeCatalog(cached.catalog);
}catch(e){}
render();

async function refresh(){
 if(cached?.savedAt&&Date.now()-cached.savedAt<TTL)return;
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),6000);
 try{
  const r=await fetch(TREE,{cache:'no-store',signal:controller.signal});
  if(!r.ok)throw Error('GitHub '+r.status);
  const d=await r.json();
  if(!Array.isArray(d.tree))throw Error('Invalid tree');
  const paths=d.tree.filter(x=>x.type==='blob'&&/index\.html$/i.test(x.path)).map(x=>x.path);
  const next=clone(FALLBACK);
  for(const [key,c] of Object.entries(CATS)){
   const found=paths.filter(p=>p.startsWith(c.root)&&p!==c.root+'index.html')
     .map(p=>makeItem(p,c.root)).filter(Boolean);
   next[key]=merge(FALLBACK[key],found);
  }
  next.vocabulary=FALLBACK.vocabulary;
  catalog=next;
  localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),catalog}));
  render();
 }catch(e){
  console.warn('Giữ danh mục dự phòng:',e);
 }finally{clearTimeout(timeout)}
}
refresh();
</script>
</body>
</html>
