const LESSON={"n": 5, "name": "Bookstore (2000–now)", "short": "Bookstore", "prompt": "The map shows a bookstore in 2000 and now.", "unchanged": ["Main entrance on the western side", "Service desk in south-west", "Travel and new books sections", "Fiction section on the eastern wall"], "changes": ["Non-fiction area → café", "Art, hobbies and cookery moved to upper wall", "Three seating tables added", "Fiction distribution rearranged", "Travel section shifted slightly"], "intro": "The two floor plans compare the layout of a bookstore in 2000 with its current arrangement.", "overview": "Overall, the bookstore has been reorganised to provide more space for customers, particularly through the introduction of a café and seating areas. Several book sections have been relocated, while the entrance and service desk have remained in their original positions.", "body1": "In 2000, the bookstore had an entrance on the western side and a service desk in the south-west corner. Fiction occupied much of the northern wall as well as the eastern section. Travel books were placed near the entrance, whereas art, hobbies and cookery sections were arranged in narrow aisles in the centre-right. A new books display stood towards the middle, and the non-fiction section was located along the southern wall.", "body2": "At present, the non-fiction section has been replaced by a café, and three tables have been introduced in the central area. The art, hobbies and cookery shelves have been relocated to the northern wall, alongside a smaller fiction section. Fiction books still occupy the eastern side. The travel and new books sections remain near their former locations, while the entrance and service desk are unchanged.", "vocabulary": [[["show", "illustrate", "Diễn đạt lại động từ mô tả sơ đồ"], ["changes", "transformations", "Các thay đổi theo thời gian"], ["the maps below", "the two maps", "Chỉ hai bản đồ được cung cấp"], ["from ... to ...", "between ... and ...", "Cách diễn đạt khoảng thời gian"], ["floor plans", "sơ đồ mặt bằng", "Chỉ sơ đồ nội thất"], ["current arrangement", "cách bố trí hiện tại", "Diễn đạt now"]], [["underwent redevelopment", "trải qua quá trình tái phát triển", "Dùng cho Overview"], ["remained unchanged", "vẫn không thay đổi", "Nhấn mạnh đặc điểm giữ nguyên"], ["was replaced by", "được thay thế bằng", "Đặc điểm cũ thành công trình mới"], ["new facilities", "cơ sở vật chất mới", "Khái quát các công trình được bổ sung"], ["reorganised", "được bố trí lại", "Thay đổi vị trí các quầy"], ["seating areas", "khu vực chỗ ngồi", "Các bàn mới"]], [["was situated", "được đặt tại", "Mô tả vị trí quá khứ"], ["to the north of", "về phía bắc của", "Vị trí tương đối"], ["along", "dọc theo", "Mô tả vị trí đường, sông"], ["occupied", "chiếm vị trí", "Mô tả công trình và đất"], ["service desk", "quầy dịch vụ", "Góc tây nam"], ["aisles", "lối đi giữa các kệ", "Dùng để miêu tả bố cục"]], [["has been converted into", "đã được chuyển đổi thành", "Mô tả công năng thay đổi"], ["has been constructed", "đã được xây dựng", "Thêm công trình mới"], ["has been removed", "đã bị loại bỏ", "Loại bỏ đặc điểm cũ"], ["while", "trong khi", "Nối hai thay đổi tương phản"], ["relocated", "được chuyển vị trí", "Art/hobbies/cookery"], ["café", "quán cà phê", "Thay non-fiction"]]]};
const KEY='IELTS_MAPS_LESSON_'+LESSON.n+'_V3';
let state={answers:{},passed:{},step:0,phase:{}};
try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');state={...state,...old,answers:old.answers||{},passed:old.passed||{},phase:old.phase||{}}}catch(e){}
const names=['Phân tích','Introduction','Overview','Body 1','Body 2','Bài hoàn chỉnh'];
const $=x=>document.getElementById(x);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(n){state.step=n;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function vocab(n){return LESSON.vocabulary[n-1]}
function stage(n){return state.phase[n]||'learn'}
function setStage(n,x){state.phase[n]=x;save();render()}
function next(n){if(n===5)return;go(n+1)}
function render(){
 $('stepnav').innerHTML=names.map((s,i)=>`<button class="${state.step===i?'active':''}" onclick="go(${i})">${i}. ${s}${state.passed[i]?' ✓':''}</button>`).join('');
 $('progressbar').style.width=(Object.keys(state.passed).length/4*100)+'%';
 $('page').innerHTML=state.step===0?analysis():state.step===5?final():lesson(state.step);
 document.querySelectorAll('textarea[data-answer]').forEach(el=>{el.value=state.answers[el.dataset.answer]||'';el.addEventListener('input',()=>{state.answers[el.dataset.answer]=el.value;save();updateCount(el)}) ; updateCount(el)});
}
function analysis(){return `<h2>Bước 1 · Phân tích bản đồ</h2><p>Quan sát hai thời điểm và phân nhóm thông tin trước khi viết. Không tự suy diễn sự thay đổi không thể hiện trên bản đồ.</p><div class="card"><h3>Những gì giữ nguyên?</h3><ul>${LESSON.unchanged.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></div><div class="card"><h3>Những gì thay đổi?</h3><ul>${LESSON.changes.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></div><p class="muted">Hãy thử tự xác định từng vị trí trên bản đồ, sau đó chuyển sang Introduction.</p><button class="primary" onclick="next(0)">Tiếp tục học Introduction →</button>`}
function lesson(n){const part=names[n],phase=stage(n),rows=vocab(n),prompt=n===1?'Paraphrase đề bài bằng một câu.':n===2?'Nêu 2 thay đổi nổi bật nhất, không liệt kê chi tiết.':n===3?'Mô tả sơ đồ ban đầu theo trình tự vị trí rõ ràng.':'Mô tả sơ đồ sau và so sánh với trước.';
 let top=`<h2>Bước ${n+1} · ${part}</h2><p>${prompt}</p><div class="row"><span class="pill">1. Học từ</span><span>→</span><span class="pill">2. Kiểm tra</span><span>→</span><span class="pill">3. Viết</span></div>`;
 if(phase==='learn')return top+`<h3>Học từ vựng & cấu trúc</h3><p class="muted">Học từng cặp diễn đạt và cách dùng. Sau khi học, làm bài kiểm tra để mở khóa viết.</p><div class="vocab">${rows.map((r,i)=>`<div class="word"><strong>${i+1}. ${escapeHTML(r[0])}</strong><p style="margin:5px 0">${escapeHTML(r[1])}</p><em>${escapeHTML(r[2])}</em></div>`).join('')}</div><div class="row"><button class="primary" onclick="setStage(${n},'quiz')">Đã học → Kiểm tra từ vựng</button></div>`;
 if(phase==='quiz')return top+quiz(n,rows);
 return top+`<div class="status success">✓ Đã vượt qua bài kiểm tra từ vựng của phần này.</div><h3>Thực hành viết ${part}</h3><p class="muted">Dựa vào bản đồ và từ vựng vừa học để tự diễn đạt, tránh sao chép mẫu.</p><ul class="criteria">${(n===1?['Chỉ giới thiệu đối tượng và mốc thời gian','Không thêm chi tiết hay nhận xét']:n===2?['Nêu mức độ thay đổi chung','Chỉ ra đặc điểm nổi bật hoặc không đổi','Không liệt kê toàn bộ công trình']:n===3?['Giới thiệu tình trạng ban đầu','Mô tả theo một trình tự nhất quán','Sử dụng giới từ vị trí chính xác']:['Dùng đúng cấu trúc thay thế / bổ sung','Giữ cùng trật tự miêu tả với Body 1','Nêu cả thay đổi và đặc điểm còn nguyên']).map(x=>`<li>${x}</li>`).join('')}</ul><textarea data-answer="${part}" placeholder="Write your ${part} here..." rows="${n<3?5:11}"></textarea><p class="muted" id="counter-${part.replaceAll(' ','')}"></p><div class="row"><button onclick="setStage(${n},'learn')">Ôn lại từ vựng</button><button class="primary" onclick="next(${n})">Lưu và sang bước tiếp →</button></div><details><summary>Gợi ý bài viết tham khảo (chỉ xem sau khi tự viết)</summary><p>${escapeHTML(LESSON[part==='Introduction'?'intro':part==='Overview'?'overview':part==='Body 1'?'body1':'body2'])}</p></details>`;
}
function quiz(n,rows){const questions=rows.slice(0,6);return `<h3>Kiểm tra từ vựng – ${questions.length} câu</h3><p>Chọn đúng cách diễn đạt hoặc nghĩa tương ứng với từ đã học. Yêu cầu đạt <b>${questions.length}/${questions.length}</b>; có thể ôn lại và làm lại.</p><div id="quizlist">${questions.map((r,i)=>{const options=[r[1],rows[(i+2)%rows.length][1],rows[(i+4)%rows.length][1]];const shuffled=[options[(i+1)%3],options[(i+2)%3],options[i%3]];return `<div class="q"><b>Câu ${i+1}: ${escapeHTML(r[0])}</b>${shuffled.map(o=>`<label><input type="radio" name="q${i}" value="${escapeHTML(o)}"> ${escapeHTML(o)}</label>`).join('')}</div>`}).join('')}</div><div id="quizfeedback"></div><div class="row"><button onclick="setStage(${n},'learn')">← Ôn từ vựng</button><button class="primary" onclick="grade(${n})">Nộp kiểm tra</button></div>`}
function grade(n){let total=6,score=0;let wrong=[];vocab(n).slice(0,6).forEach((r,i)=>{const chosen=document.querySelector(`input[name=q${i}]:checked`);if(chosen&&chosen.value===r[1])score++;else wrong.push(`${i+1}. ${r[0]} → ${r[1]}`)});if(score===total){state.passed[n]=true;state.phase[n]='write';save();render()}else{$('quizfeedback').innerHTML=`<div class="status error"><b>Kết quả ${score}/${total}.</b> Ôn lại: ${wrong.map(x=>escapeHTML(x)).join('; ')}. Bạn có thể chọn lại và kiểm tra tiếp.</div>`}}
function updateCount(el){const words=(el.value.trim().match(/\S+/g)||[]).length;const target=$('counter-'+el.dataset.answer.replaceAll(' ',''));if(target)target.textContent=words+' từ đã viết'}
function final(){const sections=['Introduction','Overview','Body 1','Body 2'];let draft=sections.map(s=>state.answers[s]||'').filter(Boolean).join('\n\n');return `<h2>Bước 6 · Bài hoàn chỉnh</h2><p>Ghép 4 phần đã viết, đọc soát và chỉnh sửa. IELTS Writing Task 1 yêu cầu tối thiểu 150 từ.</p><div class="status">${sections.map(s=>`${s}: ${state.answers[s]?.trim()?'Đã viết':'Chưa viết'}`).join(' · ')}</div><textarea data-answer="Final" rows="19" placeholder="Nhấn Ghép bài để tổng hợp 4 đoạn"></textarea><div class="row"><button class="primary" onclick="assemble()">Ghép 4 phần</button><button onclick="copyFinal()">Sao chép bài</button><button onclick="checkFinal()">Kiểm tra sơ bộ</button></div><div id="finalFeedback"></div><details><summary>Bài viết tham khảo</summary><p style="white-space:pre-line">${escapeHTML([LESSON.intro,LESSON.overview,LESSON.body1,LESSON.body2].join('\n\n'))}</p></details>`}
function assemble(){state.answers.Final=['Introduction','Overview','Body 1','Body 2'].map(s=>state.answers[s]||'').filter(Boolean).join('\n\n');save();render()}
function copyFinal(){navigator.clipboard?.writeText(state.answers.Final||'').then(()=>alert('Đã sao chép'))}
function checkFinal(){const a=(state.answers.Final||'').trim(),cnt=(a.match(/\S+/g)||[]).length;$('finalFeedback').innerHTML=`<div class="status ${cnt>=150?'success':'error'}">${cnt} từ · ${cnt>=150?'Đạt yêu cầu độ dài tối thiểu.':'Cần ít nhất 150 từ.'} Đây chỉ là kiểm tra số từ, chưa phải AI chấm IELTS.</div>`}
function openMap(){$('zoom').classList.add('show')};function closeMap(){$('zoom').classList.remove('show')};
render();
</script></body></html>
