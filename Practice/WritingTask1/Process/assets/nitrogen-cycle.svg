<?xml version="1.0" encoding="UTF-8"?>
 <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-label="The Nitrogen Cycle diagram">
 <defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fcfcff"/><stop offset="1" stop-color="#eafafa"/></linearGradient>
 <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24154d" flood-opacity=".10"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#149aae"/></marker>
 </defs>
 <rect width="1280" height="860" rx="26" fill="url(#bg)"/>
 <circle cx="0" cy="0" r="210" fill="#087889" opacity=".035"/><circle cx="1280" cy="860" r="260" fill="#087889" opacity=".035"/>
 <text x="640" y="60" text-anchor="middle" font-size="34" font-weight="900" fill="#20234b">The Nitrogen Cycle</text>
 <text x="640" y="99" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2.6" fill="#087889">CYCLICAL PROCESS · 8 STAGES</text>
 <path d="M747.7,183.8 L 818.7,204.2" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M983.9,331.1 L 987.4,336.9" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M987.4,529.1 L 983.9,534.9" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M818.7,661.8 L 747.7,682.2" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M532.3,682.2 L 461.3,661.8" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M296.1,534.9 L 292.6,529.1" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M347.0,433.0 Q575,463 933.0,433.0" fill="none" stroke="#149aae" stroke-width="3" stroke-dasharray="9 6" opacity="0.72" marker-end="url(#arrow)"/><path d="M834.3,567.3 Q710,408 445.7,298.7" fill="none" stroke="#149aae" stroke-width="3" stroke-dasharray="9 6" opacity="0.72" marker-end="url(#arrow)"/><path d="M461.3,204.2 L 532.3,183.8" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="535.0" y="82.0" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="562.0" cy="109.0" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="562.0" y="115.0" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">1</text>
 <text x="640.0" y="128.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Atmospheric</text><text x="640.0" y="148.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">nitrogen</text>
 <text x="640.0" y="180.0" text-anchor="middle" font-size="12.9" fill="#536179">Nitrogen gas (N₂) is</text><text x="640.0" y="197.0" text-anchor="middle" font-size="12.9" fill="#536179">present in the atmosphere.</text><g filter="url(#shadow)"><rect x="821.4" y="164.0" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="848.4" cy="191.0" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="848.4" y="197.0" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">2</text>
 <text x="926.4" y="221.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Nitrogen fixation</text>
 <text x="926.4" y="253.0" text-anchor="middle" font-size="12.9" fill="#536179">Certain bacteria convert</text><text x="926.4" y="270.0" text-anchor="middle" font-size="12.9" fill="#536179">nitrogen gas into</text><text x="926.4" y="287.0" text-anchor="middle" font-size="12.9" fill="#536179">ammonium.</text><g filter="url(#shadow)"><rect x="940.0" y="362.0" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="967.0" cy="389.0" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="967.0" y="395.0" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">3</text>
 <text x="1045.0" y="419.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Soil ammonium</text>
 <text x="1045.0" y="451.0" text-anchor="middle" font-size="12.9" fill="#536179">Ammonium becomes available</text><text x="1045.0" y="468.0" text-anchor="middle" font-size="12.9" fill="#536179">in the soil.</text><g filter="url(#shadow)"><rect x="821.4" y="560.0" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="848.4" cy="587.0" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="848.4" y="593.0" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">4</text>
 <text x="926.4" y="617.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Nitrification</text>
 <text x="926.4" y="649.0" text-anchor="middle" font-size="12.9" fill="#536179">Bacteria turn ammonium</text><text x="926.4" y="666.0" text-anchor="middle" font-size="12.9" fill="#536179">into nitrites and then</text><text x="926.4" y="683.0" text-anchor="middle" font-size="12.9" fill="#536179">nitrates.</text><g filter="url(#shadow)"><rect x="535.0" y="642.0" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="562.0" cy="669.0" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="562.0" y="675.0" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">5</text>
 <text x="640.0" y="699.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Plant uptake</text>
 <text x="640.0" y="731.0" text-anchor="middle" font-size="12.9" fill="#536179">Plants absorb available</text><text x="640.0" y="748.0" text-anchor="middle" font-size="12.9" fill="#536179">nitrogen compounds from</text><text x="640.0" y="765.0" text-anchor="middle" font-size="12.9" fill="#536179">the soil.</text><g filter="url(#shadow)"><rect x="248.6" y="560.0" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="275.6" cy="587.0" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="275.6" y="593.0" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">6</text>
 <text x="353.6" y="617.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Organic nitrogen</text>
 <text x="353.6" y="649.0" text-anchor="middle" font-size="12.9" fill="#536179">Nitrogen enters animals</text><text x="353.6" y="666.0" text-anchor="middle" font-size="12.9" fill="#536179">and organic matter through</text><text x="353.6" y="683.0" text-anchor="middle" font-size="12.9" fill="#536179">feeding.</text><g filter="url(#shadow)"><rect x="130.0" y="362.0" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="157.0" cy="389.0" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="157.0" y="395.0" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">7</text>
 <text x="235.0" y="419.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Ammonification</text>
 <text x="235.0" y="451.0" text-anchor="middle" font-size="12.9" fill="#536179">Decomposers return organic</text><text x="235.0" y="468.0" text-anchor="middle" font-size="12.9" fill="#536179">nitrogen to soil ammonium.</text><g filter="url(#shadow)"><rect x="248.6" y="164.0" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="275.6" cy="191.0" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="275.6" y="197.0" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">8</text>
 <text x="353.6" y="221.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Denitrification</text>
 <text x="353.6" y="253.0" text-anchor="middle" font-size="12.9" fill="#536179">Other bacteria convert</text><text x="353.6" y="270.0" text-anchor="middle" font-size="12.9" fill="#536179">soil nitrate back into</text><text x="353.6" y="287.0" text-anchor="middle" font-size="12.9" fill="#536179">atmospheric N₂.</text><circle cx="640" cy="433" r="145" fill="#eafafa" stroke="#149aae" stroke-opacity=".35" stroke-width="2"/>
  <text x="640" y="408" text-anchor="middle" font-size="75">🧪</text>
  <text x="640" y="452" text-anchor="middle" font-size="26" font-weight="900" fill="#087889">CYCLICAL PROCESS</text>
  <text x="640" y="486" text-anchor="middle" font-size="17" fill="#34405c">Linked pathways · not a single chain</text>
 <text x="640" y="827" font-size="15" text-anchor="middle" fill="#657187">Original Smartcom IELTS practice diagram · simplified for learning · references listed with the exercise</text>
 </svg>