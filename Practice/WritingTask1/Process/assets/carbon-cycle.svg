 </defs>
 <rect width="1280" height="860" rx="26" fill="url(#bg)"/>
 <circle cx="0" cy="0" r="210" fill="#087889" opacity=".035"/><circle cx="1280" cy="860" r="260" fill="#087889" opacity=".035"/>
 <text x="640" y="60" text-anchor="middle" font-size="34" font-weight="900" fill="#20234b">The Carbon Cycle</text>
 <text x="640" y="99" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2.6" fill="#087889">CYCLICAL PROCESS · 7 STAGES</text>
 <path d="M746.3,188.4 L 850.4,223.0" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M991.8,364.8 L 999.7,389.0" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M950.2,568.7 L 900.3,611.9" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M703.7,685.3 L 576.3,685.3" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M379.7,611.9 L 329.8,568.7" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M280.3,389.0 L 288.2,364.8" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M429.6,223.0 L 533.7,188.4" fill="none" stroke="#149aae" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="535.0" y="82.0" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="562.0" cy="109.0" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="562.0" y="115.0" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">1</text>
 <text x="640.0" y="139.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Atmospheric CO₂</text>
 <text x="640.0" y="171.0" text-anchor="middle" font-size="12.9" fill="#536179">Carbon dioxide is present</text><text x="640.0" y="188.0" text-anchor="middle" font-size="12.9" fill="#536179">in the atmosphere.</text><g filter="url(#shadow)"><rect x="851.6" y="187.4" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="878.6" cy="214.4" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="878.6" y="220.4" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">2</text>
 <text x="956.6" y="244.4" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Photosynthesis</text>
 <text x="956.6" y="276.4" text-anchor="middle" font-size="12.9" fill="#536179">Plants absorb carbon</text><text x="956.6" y="293.4" text-anchor="middle" font-size="12.9" fill="#536179">dioxide during</text><text x="956.6" y="310.4" text-anchor="middle" font-size="12.9" fill="#536179">photosynthesis.</text><g filter="url(#shadow)"><rect x="929.8" y="424.3" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="956.8" cy="451.3" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="956.8" y="457.3" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">3</text>
 <text x="1034.8" y="481.3" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Plant biomass</text>
 <text x="1034.8" y="513.3" text-anchor="middle" font-size="12.9" fill="#536179">Carbon is stored in</text><text x="1034.8" y="530.3" text-anchor="middle" font-size="12.9" fill="#536179">growing plant tissues.</text><g filter="url(#shadow)"><rect x="710.7" y="614.3" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="737.7" cy="641.3" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="737.7" y="647.3" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">4</text>
 <text x="815.7" y="671.3" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Consumption</text>
 <text x="815.7" y="703.3" text-anchor="middle" font-size="12.9" fill="#536179">Animals obtain carbon by</text><text x="815.7" y="720.3" text-anchor="middle" font-size="12.9" fill="#536179">feeding on plants.</text><g filter="url(#shadow)"><rect x="359.3" y="614.3" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="386.3" cy="641.3" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="386.3" y="647.3" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">5</text>
 <text x="464.3" y="671.3" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Organic remains</text>
 <text x="464.3" y="703.3" text-anchor="middle" font-size="12.9" fill="#536179">Dead organisms and waste</text><text x="464.3" y="720.3" text-anchor="middle" font-size="12.9" fill="#536179">enter the soil.</text><g filter="url(#shadow)"><rect x="140.2" y="424.3" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="167.2" cy="451.3" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="167.2" y="457.3" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">6</text>
 <text x="245.2" y="481.3" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Decomposition</text>
 <text x="245.2" y="513.3" text-anchor="middle" font-size="12.9" fill="#536179">Decomposers break down the</text><text x="245.2" y="530.3" text-anchor="middle" font-size="12.9" fill="#536179">organic material.</text><g filter="url(#shadow)"><rect x="218.4" y="187.4" rx="17" width="210" height="142" fill="#fff" stroke="#087889" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="245.4" cy="214.4" r="17" fill="#eafafa" stroke="#087889" stroke-width="1.2"/>
 <text x="245.4" y="220.4" font-size="16" font-weight="900" text-anchor="middle" fill="#087889">7</text>
 <text x="323.4" y="244.4" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Return to air</text>
 <text x="323.4" y="276.4" text-anchor="middle" font-size="12.9" fill="#536179">Respiration by living</text><text x="323.4" y="293.4" text-anchor="middle" font-size="12.9" fill="#536179">things and decomposers</text><text x="323.4" y="310.4" text-anchor="middle" font-size="12.9" fill="#536179">releases CO₂.</text><circle cx="640" cy="433" r="145" fill="#eafafa" stroke="#149aae" stroke-opacity=".35" stroke-width="2"/>
  <text x="640" y="408" text-anchor="middle" font-size="75">🌿</text>
  <text x="640" y="452" text-anchor="middle" font-size="26" font-weight="900" fill="#087889">CYCLICAL PROCESS</text>
  <text x="640" y="486" text-anchor="middle" font-size="17" fill="#34405c">A continuous natural cycle</text>
 <text x="640" y="827" font-size="15" text-anchor="middle" fill="#657187">Original Smartcom IELTS practice diagram · simplified for learning · references listed with the exercise</text>
