<?xml version="1.0" encoding="UTF-8"?>
 <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-label="Producing Olive Oil diagram">
 <defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fcfcff"/><stop offset="1" stop-color="#f5efff"/></linearGradient>
 <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24154d" flood-opacity=".10"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8062ca"/></marker>
 </defs>
 <rect width="1280" height="860" rx="26" fill="url(#bg)"/>
 <circle cx="0" cy="0" r="210" fill="#5a3db3" opacity=".035"/><circle cx="1280" cy="860" r="260" fill="#5a3db3" opacity=".035"/>
 <text x="640" y="60" text-anchor="middle" font-size="34" font-weight="900" fill="#20234b">Producing Olive Oil</text>
 <text x="640" y="99" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2.6" fill="#5a3db3">LINEAR PROCESS · 8 STAGES</text>
 <path d="M304.0,284.0 L335.5,284.0" fill="none" stroke="#8062ca" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M623.5,284.0 L655.0,284.0" fill="none" stroke="#8062ca" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M943.0,284.0 L974.5,284.0" fill="none" stroke="#8062ca" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1118.5,379.0 L1118.5,515.0" fill="none" stroke="#8062ca" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M974.5,610.0 L943.0,610.0" fill="none" stroke="#8062ca" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M655.0,610.0 L623.5,610.0" fill="none" stroke="#8062ca" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M335.5,610.0 L304.0,610.0" fill="none" stroke="#8062ca" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="27.5" y="191.5" rx="17" width="265" height="185" fill="#fff" stroke="#5a3db3" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="54.5" cy="218.5" r="17" fill="#f5efff" stroke="#5a3db3" stroke-width="1.2"/>
 <text x="54.5" y="224.5" font-size="16" font-weight="900" text-anchor="middle" fill="#5a3db3">1</text>
 <text x="160.0" y="263.5" text-anchor="middle" font-size="21" font-weight="800" fill="#17264c">Harvesting</text>
 <text x="160.0" y="299.5" text-anchor="middle" font-size="16" fill="#536179">Ripe olives are picked from trees</text><text x="160.0" y="321.5" text-anchor="middle" font-size="16" fill="#536179">and transported to a mill.</text><g filter="url(#shadow)"><rect x="347.0" y="191.5" rx="17" width="265" height="185" fill="#fff" stroke="#5a3db3" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="374.0" cy="218.5" r="17" fill="#f5efff" stroke="#5a3db3" stroke-width="1.2"/>
 <text x="374.0" y="224.5" font-size="16" font-weight="900" text-anchor="middle" fill="#5a3db3">2</text>
 <text x="479.5" y="263.5" text-anchor="middle" font-size="21" font-weight="800" fill="#17264c">Cleaning</text>
 <text x="479.5" y="299.5" text-anchor="middle" font-size="16" fill="#536179">Leaves are removed and the olives</text><text x="479.5" y="321.5" text-anchor="middle" font-size="16" fill="#536179">are washed.</text><g filter="url(#shadow)"><rect x="666.5" y="191.5" rx="17" width="265" height="185" fill="#fff" stroke="#5a3db3" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="693.5" cy="218.5" r="17" fill="#f5efff" stroke="#5a3db3" stroke-width="1.2"/>
 <text x="693.5" y="224.5" font-size="16" font-weight="900" text-anchor="middle" fill="#5a3db3">3</text>
 <text x="799.0" y="263.5" text-anchor="middle" font-size="21" font-weight="800" fill="#17264c">Crushing</text>
 <text x="799.0" y="299.5" text-anchor="middle" font-size="16" fill="#536179">The cleaned fruit is crushed into</text><text x="799.0" y="321.5" text-anchor="middle" font-size="16" fill="#536179">olive paste.</text><g filter="url(#shadow)"><rect x="986.0" y="191.5" rx="17" width="265" height="185" fill="#fff" stroke="#5a3db3" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="1013.0" cy="218.5" r="17" fill="#f5efff" stroke="#5a3db3" stroke-width="1.2"/>
 <text x="1013.0" y="224.5" font-size="16" font-weight="900" text-anchor="middle" fill="#5a3db3">4</text>
 <text x="1118.5" y="263.5" text-anchor="middle" font-size="21" font-weight="800" fill="#17264c">Malaxation</text>
 <text x="1118.5" y="299.5" text-anchor="middle" font-size="16" fill="#536179">The paste is mixed slowly to help</text><text x="1118.5" y="321.5" text-anchor="middle" font-size="16" fill="#536179">oil droplets combine.</text><g filter="url(#shadow)"><rect x="986.0" y="517.5" rx="17" width="265" height="185" fill="#fff" stroke="#5a3db3" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="1013.0" cy="544.5" r="17" fill="#f5efff" stroke="#5a3db3" stroke-width="1.2"/>
 <text x="1013.0" y="550.5" font-size="16" font-weight="900" text-anchor="middle" fill="#5a3db3">5</text>
 <text x="1118.5" y="589.5" text-anchor="middle" font-size="21" font-weight="800" fill="#17264c">Centrifugation</text>
 <text x="1118.5" y="625.5" text-anchor="middle" font-size="16" fill="#536179">A centrifuge separates the oil from</text><text x="1118.5" y="647.5" text-anchor="middle" font-size="16" fill="#536179">water and solids.</text><g filter="url(#shadow)"><rect x="666.5" y="517.5" rx="17" width="265" height="185" fill="#fff" stroke="#5a3db3" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="693.5" cy="544.5" r="17" fill="#f5efff" stroke="#5a3db3" stroke-width="1.2"/>
 <text x="693.5" y="550.5" font-size="16" font-weight="900" text-anchor="middle" fill="#5a3db3">6</text>
 <text x="799.0" y="589.5" text-anchor="middle" font-size="21" font-weight="800" fill="#17264c">Clarification</text>
 <text x="799.0" y="625.5" text-anchor="middle" font-size="16" fill="#536179">The oil is clarified, for example</text><text x="799.0" y="647.5" text-anchor="middle" font-size="16" fill="#536179">through filtration.</text><g filter="url(#shadow)"><rect x="347.0" y="517.5" rx="17" width="265" height="185" fill="#fff" stroke="#5a3db3" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="374.0" cy="544.5" r="17" fill="#f5efff" stroke="#5a3db3" stroke-width="1.2"/>
 <text x="374.0" y="550.5" font-size="16" font-weight="900" text-anchor="middle" fill="#5a3db3">7</text>
 <text x="479.5" y="589.5" text-anchor="middle" font-size="21" font-weight="800" fill="#17264c">Storage</text>
 <text x="479.5" y="625.5" text-anchor="middle" font-size="16" fill="#536179">The finished oil is held in suitable</text><text x="479.5" y="647.5" text-anchor="middle" font-size="16" fill="#536179">storage tanks.</text><g filter="url(#shadow)"><rect x="27.5" y="517.5" rx="17" width="265" height="185" fill="#fff" stroke="#5a3db3" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="54.5" cy="544.5" r="17" fill="#f5efff" stroke="#5a3db3" stroke-width="1.2"/>
 <text x="54.5" y="550.5" font-size="16" font-weight="900" text-anchor="middle" fill="#5a3db3">8</text>
 <text x="160.0" y="589.5" text-anchor="middle" font-size="21" font-weight="800" fill="#17264c">Bottling</text>
 <text x="160.0" y="625.5" text-anchor="middle" font-size="16" fill="#536179">The oil is filled into bottles and</text><text x="160.0" y="647.5" text-anchor="middle" font-size="16" fill="#536179">prepared for sale.</text>
 <text x="640" y="827" font-size="15" text-anchor="middle" fill="#657187">Original Smartcom IELTS practice diagram · simplified for learning · references listed with the exercise</text>
 </svg>