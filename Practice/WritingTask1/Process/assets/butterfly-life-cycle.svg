<?xml version="1.0" encoding="UTF-8"?>
 <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-label="The Butterfly Life Cycle diagram">
 <defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fcfcff"/><stop offset="1" stop-color="#effaf1"/></linearGradient>
 <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24154d" flood-opacity=".10"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#43a46e"/></marker>
 </defs>
 <rect width="1280" height="860" rx="26" fill="url(#bg)"/>
 <circle cx="0" cy="0" r="210" fill="#218050" opacity=".035"/><circle cx="1280" cy="860" r="260" fill="#218050" opacity=".035"/>
 <text x="640" y="60" text-anchor="middle" font-size="34" font-weight="900" fill="#20234b">The Butterfly Life Cycle</text>
 <text x="640" y="99" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2.6" fill="#218050">LIFE CYCLE · 6 STAGES</text>
 <path d="M744.0,194.5 L 886.7,251.5" fill="none" stroke="#43a46e" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M990.7,405.0 L 990.7,461.0" fill="none" stroke="#43a46e" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M886.7,614.5 L 744.0,671.5" fill="none" stroke="#43a46e" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M536.0,671.5 L 393.3,614.5" fill="none" stroke="#43a46e" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M289.3,461.0 L 289.3,405.0" fill="none" stroke="#43a46e" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/><path d="M393.3,251.5 L 536.0,194.5" fill="none" stroke="#43a46e" stroke-width="4" stroke-dasharray="none" opacity="0.9" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="535.0" y="82.0" rx="17" width="210" height="142" fill="#fff" stroke="#218050" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="562.0" cy="109.0" r="17" fill="#effaf1" stroke="#218050" stroke-width="1.2"/>
 <text x="562.0" y="115.0" font-size="16" font-weight="900" text-anchor="middle" fill="#218050">1</text>
 <text x="640.0" y="139.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Eggs on leaves</text>
 <text x="640.0" y="171.0" text-anchor="middle" font-size="12.9" fill="#536179">An adult butterfly lays</text><text x="640.0" y="188.0" text-anchor="middle" font-size="12.9" fill="#536179">eggs on a suitable host</text><text x="640.0" y="205.0" text-anchor="middle" font-size="12.9" fill="#536179">plant.</text><g filter="url(#shadow)"><rect x="885.7" y="222.0" rx="17" width="210" height="142" fill="#fff" stroke="#218050" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="912.7" cy="249.0" r="17" fill="#effaf1" stroke="#218050" stroke-width="1.2"/>
 <text x="912.7" y="255.0" font-size="16" font-weight="900" text-anchor="middle" fill="#218050">2</text>
 <text x="990.7" y="279.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Hatching</text>
 <text x="990.7" y="311.0" text-anchor="middle" font-size="12.9" fill="#536179">Young caterpillars hatch</text><text x="990.7" y="328.0" text-anchor="middle" font-size="12.9" fill="#536179">from the eggs.</text><g filter="url(#shadow)"><rect x="885.7" y="502.0" rx="17" width="210" height="142" fill="#fff" stroke="#218050" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="912.7" cy="529.0" r="17" fill="#effaf1" stroke="#218050" stroke-width="1.2"/>
 <text x="912.7" y="535.0" font-size="16" font-weight="900" text-anchor="middle" fill="#218050">3</text>
 <text x="990.7" y="559.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Larval growth</text>
 <text x="990.7" y="591.0" text-anchor="middle" font-size="12.9" fill="#536179">Caterpillars feed on</text><text x="990.7" y="608.0" text-anchor="middle" font-size="12.9" fill="#536179">leaves and grow, moulting</text><text x="990.7" y="625.0" text-anchor="middle" font-size="12.9" fill="#536179">as needed.</text><g filter="url(#shadow)"><rect x="535.0" y="642.0" rx="17" width="210" height="142" fill="#fff" stroke="#218050" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="562.0" cy="669.0" r="17" fill="#effaf1" stroke="#218050" stroke-width="1.2"/>
 <text x="562.0" y="675.0" font-size="16" font-weight="900" text-anchor="middle" fill="#218050">4</text>
 <text x="640.0" y="699.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Pupa</text>
 <text x="640.0" y="731.0" text-anchor="middle" font-size="12.9" fill="#536179">The mature larva forms a</text><text x="640.0" y="748.0" text-anchor="middle" font-size="12.9" fill="#536179">chrysalis, or pupa.</text><g filter="url(#shadow)"><rect x="184.3" y="502.0" rx="17" width="210" height="142" fill="#fff" stroke="#218050" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="211.3" cy="529.0" r="17" fill="#effaf1" stroke="#218050" stroke-width="1.2"/>
 <text x="211.3" y="535.0" font-size="16" font-weight="900" text-anchor="middle" fill="#218050">5</text>
 <text x="289.3" y="559.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Emergence</text>
 <text x="289.3" y="591.0" text-anchor="middle" font-size="12.9" fill="#536179">A new adult butterfly</text><text x="289.3" y="608.0" text-anchor="middle" font-size="12.9" fill="#536179">emerges from the</text><text x="289.3" y="625.0" text-anchor="middle" font-size="12.9" fill="#536179">chrysalis.</text><g filter="url(#shadow)"><rect x="184.3" y="222.0" rx="17" width="210" height="142" fill="#fff" stroke="#218050" stroke-opacity=".34" stroke-width="1.7"/></g>
 <circle cx="211.3" cy="249.0" r="17" fill="#effaf1" stroke="#218050" stroke-width="1.2"/>
 <text x="211.3" y="255.0" font-size="16" font-weight="900" text-anchor="middle" fill="#218050">6</text>
 <text x="289.3" y="279.0" text-anchor="middle" font-size="17" font-weight="800" fill="#17264c">Reproduction</text>
 <text x="289.3" y="311.0" text-anchor="middle" font-size="12.9" fill="#536179">The adult mates and lays</text><text x="289.3" y="328.0" text-anchor="middle" font-size="12.9" fill="#536179">eggs to begin another</text><text x="289.3" y="345.0" text-anchor="middle" font-size="12.9" fill="#536179">generation.</text><circle cx="640" cy="433" r="145" fill="#effaf1" stroke="#43a46e" stroke-opacity=".35" stroke-width="2"/>
  <text x="640" y="408" text-anchor="middle" font-size="75">🦋</text>
  <text x="640" y="452" text-anchor="middle" font-size="26" font-weight="900" fill="#218050">LIFE CYCLE</text>
  <text x="640" y="486" text-anchor="middle" font-size="17" fill="#34405c">Next generation begins again</text>
 <text x="640" y="827" font-size="15" text-anchor="middle" fill="#657187">Original Smartcom IELTS practice diagram · simplified for learning · references listed with the exercise</text>
 </svg>