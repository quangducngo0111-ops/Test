<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening Practice</title><style>
:root{--ink:#21164b;--purple:#6540cc;--muted:#697590;--line:#e0e6f2;--bg:#f5f7fc;--good:#16734b;--bad:#ba415b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#242c41;background:radial-gradient(circle at 3% 0%,#e9e5ff,transparent 30%),linear-gradient(120deg,#faf9ff,#f1f7ff)}a{text-decoration:none;color:inherit}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1160px;margin:auto;padding:0 17px}.top{background:#fffc;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;backdrop-filter:blur(12px)}.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px}.back,.softbtn{background:white;border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:#34226a;font-weight:800;font-size:12px}.brand{font-size:15px;font-weight:900;color:var(--ink)}.hero{margin:26px 0 19px;padding:27px;border:1px solid white;border-radius:24px;background:linear-gradient(115deg,#fff,#f6f2ff,#ecf6ff);box-shadow:0 12px 30px #20124e10}.eyebrow{font-size:11px;font-weight:900;color:var(--purple);letter-spacing:.1em}.hero h1{color:var(--ink);font-size:clamp(27px,3.5vw,36px);margin:8px 0 6px}.hero p,.hint{font-size:13px;color:var(--muted);line-height:1.7}.cards{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile,.panel{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px #21184b07}.tile{padding:20px}.tile h3{margin:0 0 6px;color:var(--ink)}.tile p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.pill{background:#ede8ff;color:#6240c5;padding:5px 10px;border-radius:40px;font-size:11px;font-weight:800}.panel{padding:22px;margin:17px 0}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:space-between}.section-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.section-tabs button{padding:11px 14px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;font-weight:800;font-size:12px}.section-tabs button.active{background:var(--purple);border-color:var(--purple);color:white}.audio{border:1px solid var(--line);border-radius:13px;background:#f8f8ff;padding:14px;margin:17px 0}.audio audio{width:100%;margin-top:10px}.notice{border:1px dashed #d6cafa;background:#fbfaff;border-radius:12px;padding:12px;color:#6d6293;font-size:12px;line-height:1.6}.question{padding:16px;margin:13px 0;border:1px solid var(--line);border-radius:14px;background:#fff}.question h4{margin:0 0 10px;font-size:14px;color:var(--ink);line-height:1.7}.question .n{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:#f0ebff;color:var(--purple);font-weight:900;margin-right:8px}.q-input{padding:12px;border:1px solid #cdd4e4;border-radius:10px;width:100%;max-width:450px;font-size:14px}.options{display:grid;gap:8px;margin-top:11px}.option{display:flex;gap:10px;align-items:start;border:1px solid #e4e6ee;border-radius:10px;padding:10px;cursor:pointer;font-size:13px;line-height:1.55}.option:has(input:checked){border-color:#8d73d9;background:#f7f3ff}.option input{margin-top:3px;accent-color:#6440cb}.rowactions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:20px 0 45px}.primary{background:var(--purple);color:white;padding:12px 17px;border:1px solid var(--purple);border-radius:11px;font-weight:850}.primary:disabled{opacity:.5}.status{font-size:12px;color:var(--muted)}.result{border-radius:18px;border:1px solid #cde8d7;background:#f4fbf7;padding:20px}.score{color:var(--good);font-size:36px;font-weight:950}.correct{border-color:#afe4ca;background:#f8fffb}.wrong{border-color:#f0c3cc;background:#fffafb}.answerLine{font-size:12px;margin-top:10px;line-height:1.65}.answerLine b{color:#19734d}.transcript{white-space:pre-wrap;line-height:1.75;font-size:13px;max-height:540px;overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fafbff;padding:18px}.transcript mark{background:#fff1ac;color:inherit;border-radius:3px}.transcriptbox{margin-top:15px}.transcriptbox summary{cursor:pointer;font-weight:800;color:#473185}.footer{margin-top:40px;text-align:center;color:#8992a7;font-size:11px} .hide{display:none!important}@media(max-width:720px){.cards{grid-template-columns:1fr}.panel{padding:15px}.hero{padding:20px}.topin{min-height:58px}.brand{font-size:12px}}
</style></head><body><header class="top"><div class="wrap topin"><a class="back" href="../">← Practice</a><div class="brand">🎧 Listening Practice</div><span class="status" id="student"></span></div></header><main class="wrap"><section class="hero"><div class="eyebrow">🎧 IELTS PRACTICE</div><h1>Listening</h1><p>Chọn dạng bài Listening và bắt đầu luyện tập.</p></section><div class="toolbar" style="margin:26px 0 13px"><div><h2 style="color:#21164b;margin:0">Chọn dạng bài</h2><p class="hint" style="margin:4px 0">Mỗi mục gồm các bài luyện riêng.</p></div><span class="hint" id="count"></span></div><section class="cards" id="list"></section></main><script>
'use strict';const TREE='https://api.github.com/repos/quangducngo0111-ops/Test/git/trees/main?recursive=1';const ROOT='Practice/Listening/';
const BASE=[{slug:'Part1',name:'Listening Part 1',description:'IELTS Listening Part 1',icon:'🎧'},{slug:'Part2',name:'Listening Part 2',description:'IELTS Listening Part 2',icon:'🎧'},{slug:'Part3',name:'Listening Part 3',description:'IELTS Listening Part 3',icon:'🎧'},{slug:'3+4',name:'Listening Part 3 + 4',description:'Bài nghe tổng hợp · Questions 21–40',icon:'🎧'},{slug:'FullTest',name:'Listening Full Test',description:'4 Parts · 40 câu · Chọn bài 01, 02...',icon:'🎧'},{slug:'IntensiveListening',name:'Intensive Listening',description:'Gap-fill + Dictation',icon:'🎙️'}];
const OTHER={NoteCompletion:['Note Completion','📝'],FormCompletion:['Form Completion','📋'],TableCompletion:['Table Completion','▦'],SentenceCompletion:['Sentence Completion','✍️'],SummaryCompletion:['Summary Completion','📑'],MultipleChoice:['Multiple Choice','☑️'],Matching:['Matching','🔗'],MapLabelling:['Map Labelling','🗺️'],PlanLabelling:['Plan Labelling','🧭'],DiagramLabelling:['Diagram Labelling','📐'],ShortAnswerQuestions:['Short Answer Questions','💬']};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(slugs){slugs=slugs.filter(x=>x.toLowerCase()!=='fulltest02');document.getElementById('count').textContent=slugs.length+' dạng bài';document.getElementById('list').innerHTML=slugs.map(slug=>{const x=BASE.find(z=>z.slug===slug)||{slug,name:OTHER[slug]?.[0]||slug.replace(/([a-z])([A-Z])/g,'$1 $2'),description:'Luyện tập dạng bài Listening này.',icon:OTHER[slug]?.[1]||'🎧'};return `<a class="tile" href="./${encodeURIComponent(slug)}/" style="display:flex;align-items:center;gap:14px;min-height:92px"><span style="font-size:25px;min-width:52px;background:#f0ebff;padding:12px;border-radius:14px">${x.icon}</span><span style="flex:1"><b style="display:block;color:#21164b;font-size:14px">${esc(x.name)}</b><small class="hint">${esc(x.description)}</small></span><span style="color:#8b81a4">→</span></a>`}).join('')}
try{let s=JSON.parse(localStorage.getItem('IELTS_PRACTICE_STUDENT')||'null');if(s?.name)document.getElementById('student').textContent=s.name}catch(e){}
render(BASE.map(x=>x.slug));(async()=>{try{const r=await fetch(TREE,{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();const found=new Set(BASE.map(x=>x.slug));for(const x of d.tree||[]){if(x.type!=='blob'||!x.path.startsWith(ROOT))continue;const m=x.path.slice(ROOT.length).match(/^([^/]+)\/index\.html$/i);if(m && m[1].toLowerCase()!=='fulltest02')found.add(m[1])}const priority=BASE.map(x=>x.slug);render([...found].sort((a,b)=>{const ai=priority.indexOf(a),bi=priority.indexOf(b);return ai>=0&&bi>=0?ai-bi:ai>=0?-1:bi>=0?1:a.localeCompare(b)}))}catch(e){console.warn('Không tải được danh mục mới:',e)}})();
</script></body></html>
