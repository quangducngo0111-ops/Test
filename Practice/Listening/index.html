<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  http-equiv="Cache-Control"
  content="no-cache, no-store, must-revalidate"
>

<meta
  http-equiv="Pragma"
  content="no-cache"
>

<meta
  http-equiv="Expires"
  content="0"
>

<title>Listening Practice</title>

<style>

:root{
  --purple:#281260;
  --purple2:#5b43b5;
  --ink:#172033;
  --muted:#6f7890;
  --line:#e3e7ef;
  --bg:#f5f7fb;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    "Segoe UI",
    Arial,
    sans-serif;

  color:var(--ink);

  background:
    radial-gradient(
      circle at 8% 0%,
      rgba(141,105,246,.11),
      transparent 24%
    ),
    radial-gradient(
      circle at 92% 6%,
      rgba(101,174,255,.09),
      transparent 22%
    ),
    linear-gradient(
      180deg,
      #f9f8ff,
      #f3f7fc
    );
}


/* ========================================
   GENERAL
======================================== */

.wrap{
  width:
    min(
      1120px,
      calc(100% - 24px)
    );

  margin:auto;
}


/* ========================================
   HEADER
======================================== */

.top{
  position:sticky;

  top:0;

  z-index:30;

  background:
    rgba(255,255,255,.94);

  backdrop-filter:
    blur(12px);

  border-bottom:
    1px solid var(--line);
}

.topin{
  min-height:64px;

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:12px;
}

.back{
  display:inline-flex;

  align-items:center;

  gap:5px;

  color:#3b315e;

  text-decoration:none;

  border:
    1px solid var(--line);

  background:#fff;

  border-radius:10px;

  padding:
    8px 11px;

  font-size:11px;

  font-weight:900;

  transition:.15s ease;
}

.back:hover{
  border-color:#cfc5f3;

  background:#faf9ff;
}

.brand{
  color:#21164b;

  font-size:14px;

  font-weight:950;
}

.student{
  color:var(--muted);

  font-size:11px;

  font-weight:800;
}


/* ========================================
   MAIN
======================================== */

main{
  padding:
    28px 0 55px;
}


/* ========================================
   HERO
======================================== */

.hero{
  position:relative;

  overflow:hidden;

  padding:
    27px 27px;

  border:
    1px solid
    rgba(255,255,255,.95);

  border-radius:23px;

  background:
    linear-gradient(
      120deg,
      #ffffff 0%,
      #f8f5ff 55%,
      #edf7ff 100%
    );

  box-shadow:
    0 12px 30px
    rgba(35,25,75,.055);
}

.hero::after{
  content:"🎧";

  position:absolute;

  right:30px;

  top:50%;

  transform:
    translateY(-50%);

  font-size:72px;

  opacity:.08;

  pointer-events:none;
}

.eyebrow{
  display:inline-flex;

  align-items:center;

  gap:6px;

  color:#6a4db4;

  font-size:10px;

  font-weight:950;

  letter-spacing:.11em;

  text-transform:uppercase;
}

.hero h1{
  margin:
    8px 0 7px;

  color:#21164b;

  font-size:
    clamp(
      29px,
      4vw,
      38px
    );

  line-height:1.08;

  letter-spacing:-.04em;
}

.hero p{
  max-width:650px;

  margin:0;

  color:var(--muted);

  font-size:12px;

  line-height:1.65;
}


/* ========================================
   SECTION HEADER
======================================== */

.section-head{
  display:flex;

  align-items:end;

  justify-content:
    space-between;

  gap:14px;

  margin:
    24px 0 12px;
}

.section-head h2{
  margin:0;

  color:#21164b;

  font-size:22px;

  letter-spacing:-.02em;
}

.section-head p{
  margin:
    4px 0 0;

  color:var(--muted);

  font-size:11px;
}

.count{
  color:#6c7383;

  font-size:11px;

  font-weight:900;

  white-space:nowrap;
}


/* ========================================
   GRID
======================================== */

.grid{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:11px;
}


/* ========================================
   CARD
======================================== */

.card{
  position:relative;

  display:flex;

  align-items:center;

  gap:14px;

  min-height:92px;

  padding:
    15px;

  color:inherit;

  text-decoration:none;

  border:
    1px solid var(--line);

  border-radius:16px;

  background:#fff;

  box-shadow:
    0 5px 15px
    rgba(35,25,75,.035);

  transition:
    transform .16s ease,
    border-color .16s ease,
    box-shadow .16s ease;
}

.card:hover{
  transform:
    translateY(-2px);

  border-color:#cbbdf7;

  box-shadow:
    0 11px 25px
    rgba(35,25,75,.08);
}

.icon{
  flex:
    0 0 52px;

  width:52px;

  height:52px;

  display:grid;

  place-items:center;

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      #eee9ff,
      #e8f2ff
    );

  font-size:23px;
}

.copy{
  flex:1;

  min-width:0;
}

.copy b{
  display:block;

  margin-bottom:4px;

  color:#21164b;

  font-size:13.5px;

  font-weight:950;
}

.copy span{
  display:block;

  color:var(--muted);

  font-size:10.5px;

  line-height:1.45;
}

.arrow{
  flex:
    0 0 auto;

  color:#9ca3b2;

  font-size:18px;

  font-weight:900;
}


/* ========================================
   EMPTY
======================================== */

.empty{
  grid-column:
    1 / -1;

  padding:38px 20px;

  text-align:center;

  border:
    1px dashed
    #d7dbe5;

  border-radius:16px;

  background:
    rgba(255,255,255,.8);

  color:#7b8292;

  font-size:12px;
}


/* ========================================
   LOADING
======================================== */

.loading{
  grid-column:
    1 / -1;

  padding:30px;

  text-align:center;

  color:#7b8292;

  font-size:11px;
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:760px){

  .grid{
    grid-template-columns:
      1fr;
  }

  .student{
    display:none;
  }

  .hero{
    padding:
      23px 20px;
  }

  .hero::after{
    right:16px;

    font-size:58px;
  }

  .section-head{
    align-items:flex-start;

    flex-direction:column;

    gap:5px;
  }

}


/* ========================================
   SMALL MOBILE
======================================== */

@media(max-width:430px){

  .brand{
    font-size:12px;
  }

  .back{
    padding:
      7px 9px;
  }

  .card{
    min-height:82px;

    padding:12px;
  }

  .icon{
    flex-basis:46px;

    width:46px;

    height:46px;
  }

}

</style>
</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header class="top">

  <div class="wrap topin">

    <a
      class="back"
      href="../"
    >
      ← Practice
    </a>


    <div class="brand">
      🎧 Listening Practice
    </div>


    <div
      class="student"
      id="studentInfo"
    ></div>

  </div>

</header>


<!-- ========================================
     MAIN
======================================== -->

<main class="wrap">


  <!-- HERO -->

  <section class="hero">

    <div class="eyebrow">
      🎧 IELTS Practice
    </div>


    <h1>
      Listening
    </h1>


    <p>
      Luyện từng dạng câu hỏi Listening.
      Chọn dạng bài muốn luyện và bắt đầu với các bài tập tương ứng.
    </p>

  </section>


  <!-- SECTION HEADER -->

  <div class="section-head">

    <div>

      <h2>
        Chọn dạng bài
      </h2>

      <p>
        Mỗi dạng bài gồm nhiều bài luyện riêng.
      </p>

    </div>


    <div
      class="count"
      id="count"
    >
      Đang tải...
    </div>

  </div>


  <!-- CATEGORY GRID -->

  <section
    class="grid"
    id="grid"
  >

    <div class="loading">
      Đang tải danh sách dạng bài...
    </div>

  </section>


</main>


<script>

/* =========================================================
   CONFIG
========================================================= */

const TREE_URL =
'https://api.github.com/repos/quangducngo0111-ops/Test/git/trees/main?recursive=1';


const ROOT =
'Practice/Listening/';


/* =========================================================
   DISPLAY CONFIG
========================================================= */

const CATEGORY_DATA = {

  NoteCompletion:{
    name:
    'Note Completion',

    description:
    'Nghe và hoàn thành ghi chú bằng từ hoặc số.',

    icon:
    '📝'
  },


  FormCompletion:{
    name:
    'Form Completion',

    description:
    'Nghe và hoàn thành thông tin trong biểu mẫu.',

    icon:
    '📋'
  },


  TableCompletion:{
    name:
    'Table Completion',

    description:
    'Nghe và hoàn thành các thông tin còn thiếu trong bảng.',

    icon:
    '▦'
  },


  SentenceCompletion:{
    name:
    'Sentence Completion',

    description:
    'Nghe và hoàn thành câu bằng thông tin chính xác.',

    icon:
    '✍️'
  },


  SummaryCompletion:{
    name:
    'Summary Completion',

    description:
    'Nghe và hoàn thành phần tóm tắt của nội dung.',

    icon:
    '📑'
  },


  MultipleChoice:{
    name:
    'Multiple Choice',

    description:
    'Nghe và lựa chọn đáp án phù hợp nhất.',

    icon:
    '☑️'
  },


  MapLabelling:{
    name:
    'Map Labelling',

    description:
    'Nghe chỉ dẫn và xác định vị trí trên bản đồ.',

    icon:
    '🗺️'
  },


  PlanLabelling:{
    name:
    'Plan Labelling',

    description:
    'Nghe và điền nhãn vào sơ đồ mặt bằng.',

    icon:
    '🧭'
  },


  DiagramLabelling:{
    name:
    'Diagram Labelling',

    description:
    'Nghe và hoàn thành nhãn cho sơ đồ.',

    icon:
    '📐'
  },


  Matching:{
    name:
    'Matching',

    description:
    'Nghe và nối thông tin với lựa chọn phù hợp.',

    icon:
    '🔗'
  },


  ShortAnswerQuestions:{
    name:
    'Short Answer Questions',

    description:
    'Nghe và trả lời câu hỏi bằng câu trả lời ngắn.',

    icon:
    '💬'
  }

};


/* =========================================================
   STUDENT
========================================================= */

function loadStudent(){

  try{

    const student =
    JSON.parse(

      localStorage.getItem(
        'IELTS_PRACTICE_STUDENT'
      )

      ||

      'null'

    );


    if(
      student
      &&
      student.name
      &&
      student.className
    ){

      studentInfo.textContent =
      `${student.name} · ${student.className}`;

    }

  }

  catch(error){

    console.warn(
      'Không đọc được thông tin học sinh.',
      error
    );

  }

}


/* =========================================================
   FALLBACK CATEGORY NAME
========================================================= */

function prettifySlug(slug){

  return String(
    slug || ''
  )

  .replace(
    /([a-z])([A-Z])/g,
    '$1 $2'
  )

  .replace(
    /[_-]+/g,
    ' '
  )

  .replace(
    /\s+/g,
    ' '
  )

  .trim();

}


/* =========================================================
   CATEGORY INFO
========================================================= */

function categoryInfo(slug){

  if(
    CATEGORY_DATA[slug]
  ){

    return CATEGORY_DATA[slug];

  }


  return{

    name:
    prettifySlug(slug),

    description:
    'Luyện tập dạng bài Listening này.',

    icon:
    '🎧'

  };

}


/* =========================================================
   LOAD CATEGORIES
========================================================= */

async function loadCategories(){

  try{

    const response =
    await fetch(

      TREE_URL,

      {
        cache:'no-store'
      }

    );


    if(
      !response.ok
    ){

      throw new Error(
        `GitHub API ${response.status}`
      );

    }


    const data =
    await response.json();


    /*
     * Chỉ lấy:
     *
     * Practice/Listening/NoteCompletion/index.html
     * Practice/Listening/MultipleChoice/index.html
     *
     * Không lấy:
     *
     * Practice/Listening/NoteCompletion/01/index.html
     */

    const escapedRoot =
    ROOT.replace(

      /[.*+?^${}()|[\]\\]/g,

      '\\$&'

    );


    const pattern =
    new RegExp(

      '^'
      +
      escapedRoot
      +
      '([^/]+)/index\\.html$',

      'i'

    );


    const found =
    [];


    data.tree
    .forEach(

      item => {

        if(
          item.type !== 'blob'
        ){

          return;

        }


        const match =
        item.path.match(
          pattern
        );


        if(
          !match
          ||
          !match[1]
        ){

          return;

        }


        const slug =
        match[1];


        if(
          !found.includes(
            slug
          )
        ){

          found.push(
            slug
          );

        }

      }

    );


    /*
     * Ưu tiên thứ tự các dạng phổ biến.
     */

    const priority = [

      'NoteCompletion',

      'FormCompletion',

      'TableCompletion',

      'SentenceCompletion',

      'SummaryCompletion',

      'MultipleChoice',

      'Matching',

      'MapLabelling',

      'PlanLabelling',

      'DiagramLabelling',

      'ShortAnswerQuestions'

    ];


    found.sort(

      (a,b) => {

        const ai =
        priority.indexOf(a);


        const bi =
        priority.indexOf(b);


        if(
          ai !== -1
          &&
          bi !== -1
        ){

          return ai-bi;

        }


        if(
          ai !== -1
        ){

          return -1;

        }


        if(
          bi !== -1
        ){

          return 1;

        }


        return a.localeCompare(
          b
        );

      }

    );


    renderCategories(
      found
    );

  }

  catch(error){

    console.warn(
      'Không tải được danh sách Listening:',
      error
    );


    grid.innerHTML =
    `
      <div class="empty">

        Không tải được danh sách dạng bài.
        Hãy tải lại trang sau ít phút.

      </div>
    `;


    count.textContent =
    '0 dạng bài';

  }

}


/* =========================================================
   RENDER
========================================================= */

function renderCategories(categories){

  count.textContent =
  `${categories.length} dạng bài`;


  if(
    !categories.length
  ){

    grid.innerHTML =
    `
      <div class="empty">

        Chưa có dạng bài Listening nào.

      </div>
    `;


    return;

  }


  grid.innerHTML =
  categories

  .map(

    slug => {

      const info =
      categoryInfo(
        slug
      );


      return`
        <a
          class="card"
          href="./${encodeURIComponent(slug)}/"
        >

          <div class="icon">
            ${info.icon}
          </div>


          <div class="copy">

            <b>
              ${escapeHTML(info.name)}
            </b>

            <span>
              ${escapeHTML(info.description)}
            </span>

          </div>


          <div class="arrow">
            →
          </div>

        </a>
      `;

    }

  )

  .join('');

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(
    value
  )
  .replace(

    /[&<>"']/g,

    character => ({

      '&':'&amp;',

      '<':'&lt;',

      '>':'&gt;',

      '"':'&quot;',

      "'":'&#39;'

    })[character]

  );

}


/* =========================================================
   INIT
========================================================= */

loadStudent();

loadCategories();

</script>

</body>
</html>
