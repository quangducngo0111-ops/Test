
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listening Practice</title>
<style>
:root{
 --purple:#281260;--muted:#6f7890;--line:#e3e7ef
}
*{box-sizing:border-box}
body{
 margin:0;font-family:Inter,system-ui,Arial,sans-serif;
 background:radial-gradient(circle at 8% 0%,#e9e5fc,transparent 28%),#f5f7fb;
 color:#172033
}
.wrap{width:min(1120px,calc(100% - 24px));margin:auto}
.top{position:sticky;top:0;z-index:30;background:#ffffffed;border-bottom:1px solid var(--line)}
.topin{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{
 color:#3b315e;text-decoration:none;border:1px solid var(--line);
 padding:8px 11px;border-radius:10px;background:white;font-size:11px;font-weight:900
}
.brand{font-size:14px;color:#21164b;font-weight:950}
.student{font-size:11px;color:var(--muted)}
main{padding:28px 0 55px}
.hero{
 padding:27px;border-radius:23px;border:1px solid white;
 background:linear-gradient(120deg,#fff,#f8f5ff,#edf7ff);
 box-shadow:0 12px 30px #23194b0e
}
.eyebrow{color:#6a4db4;font-size:10px;font-weight:950;letter-spacing:.1em}
.hero h1{font-size:clamp(28px,4vw,38px);color:#21164b;margin:8px 0}
.hero p{color:var(--muted);font-size:12px;line-height:1.7}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:24px 0 12px;gap:12px}
.section-head h2{margin:0;color:#21164b;font-size:22px}
.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}
.count{font-size:11px;font-weight:900;color:#6c7383}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{
 display:flex;align-items:center;gap:14px;min-height:92px;padding:15px;
 border:1px solid var(--line);border-radius:16px;background:white;
 text-decoration:none;color:inherit;box-shadow:0 5px 15px #23194b09;transition:.16s
}
.card:hover{transform:translateY(-2px);border-color:#cbbdf7}
.icon{
 flex:0 0 52px;width:52px;height:52px;display:grid;place-items:center;
 border-radius:15px;background:linear-gradient(145deg,#eee9ff,#e8f2ff);font-size:23px
}
.copy{flex:1;min-width:0}
.copy b{display:block;color:#21164b;font-size:13.5px;margin-bottom:5px}
.copy span{color:var(--muted);font-size:11px;line-height:1.5}
.arrow{color:#9ca3b2;font-size:19px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.student{display:none}}
</style>
</head>
<body>
<header class="top">
 <div class="wrap topin">
  <a class="back" href="../">← Practice</a>
  <div class="brand">🎧 Listening Practice</div>
  <div class="student" id="studentInfo"></div>
 </div>
</header>
<main class="wrap">
 <section class="hero">
  <div class="eyebrow">🎧 IELTS PRACTICE</div>
  <h1>Listening</h1>
  <p>Chọn dạng bài Listening và bắt đầu luyện tập.</p>
 </section>
 <div class="section-head">
  <div><h2>Chọn dạng bài</h2><p>Mỗi mục gồm các bài luyện riêng.</p></div>
  <div class="count" id="count"></div>
 </div>
 <section class="grid" id="grid"></section>
</main>
<script>
'use strict';
const TREE='https://api.github.com/repos/quangducngo0111-ops/Test/git/trees/main?recursive=1';
const ROOT='Practice/Listening/';
const BASE=[
 {slug:'Part1',name:'Listening Part 1',description:'IELTS Listening Part 1',icon:'🎧'},
 {slug:'Part2',name:'Listening Part 2',description:'IELTS Listening Part 2',icon:'🎧'},
 {slug:'Part3',name:'Listening Part 3',description:'IELTS Listening Part 3',icon:'🎧'},
 {slug:'3+4',name:'Listening Part 3 + 4',description:'Bài nghe tổng hợp · Questions 21–40',icon:'🎧'},
 {slug:'IntensiveListening',name:'Intensive Listening',description:'Gap-fill + Dictation',icon:'🎙️'}
];
const OTHER={
 NoteCompletion:['Note Completion','📝'],
 FormCompletion:['Form Completion','📋'],
 TableCompletion:['Table Completion','▦'],
 SentenceCompletion:['Sentence Completion','✍️'],
 SummaryCompletion:['Summary Completion','📑'],
 MultipleChoice:['Multiple Choice','☑️'],
 Matching:['Matching','🔗'],
 MapLabelling:['Map Labelling','🗺️'],
 PlanLabelling:['Plan Labelling','🧭'],
 DiagramLabelling:['Diagram Labelling','📐'],
 ShortAnswerQuestions:['Short Answer Questions','💬']
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
function info(slug){
 const core=BASE.find(x=>x.slug===slug);
 if(core)return core;
 return{
  slug,
  name:OTHER[slug]?.[0]||slug.replace(/([a-z])([A-Z])/g,'$1 $2'),
  description:'Luyện tập dạng bài Listening này.',
  icon:OTHER[slug]?.[1]||'🎧'
 };
}
function render(slugs){
 $('count').textContent=slugs.length+' dạng bài';
 $('grid').innerHTML=slugs.map(slug=>{
  const x=info(slug);
  return `<a class="card" href="./${encodeURIComponent(slug)}/">
   <div class="icon">${x.icon}</div>
   <div class="copy"><b>${esc(x.name)}</b><span>${esc(x.description)}</span></div>
   <span class="arrow">→</span>
  </a>`;
 }).join('');
}
try{
 const s=JSON.parse(localStorage.getItem('IELTS_PRACTICE_STUDENT')||'null');
 if(s?.name)$('studentInfo').textContent=s.name+(s.className?' · '+s.className:'');
}catch(e){}
render(BASE.map(x=>x.slug));

(async()=>{
 try{
  const r=await fetch(TREE,{cache:'no-store'});
  if(!r.ok)throw Error('GitHub '+r.status);
  const d=await r.json();
  if(!Array.isArray(d.tree))throw Error('Invalid tree');
  const found=new Set(BASE.map(x=>x.slug));
  for(const x of d.tree){
   if(x.type!=='blob')continue;
   if(!x.path.startsWith(ROOT))continue;
   const relative=x.path.slice(ROOT.length);
   const match=relative.match(/^([^/]+)\/index\.html$/i);
   if(match)found.add(match[1]);
  }
  const priority=BASE.map(x=>x.slug);
  const sorted=[...found].sort((a,b)=>{
   const ai=priority.indexOf(a),bi=priority.indexOf(b);
   if(ai>=0&&bi>=0)return ai-bi;
   if(ai>=0)return -1;
   if(bi>=0)return 1;
   return a.localeCompare(b);
  });
  render(sorted);
 }catch(e){console.warn('Giữ danh mục dự phòng:',e)}
})();
</script>
</body>
</html>
