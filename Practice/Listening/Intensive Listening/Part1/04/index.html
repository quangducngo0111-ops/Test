"Yes of course."},{"speaker":"AUDIO","text":"Okay."},{"speaker":"AUDIO","text":"Then let's start with a couple of events especially for children."},{"speaker":"AUDIO","text":"The Art Gallery is holding an event called Family Welcome that day when there are [[activities]] and trails to use throughout the gallery."},{"speaker":"AUDIO","text":"That sounds interesting."},{"speaker":"AUDIO","text":"What time does it start?"},{"speaker":"AUDIO","text":"The gallery opens at 10 and the Family Welcome event runs from 10.30 until 2 o'clock."},{"speaker":"AUDIO","text":"The gallery stays open until 5 and several times during the day they're going to show a short film that the gallery has [[produced]]."},{"speaker":"AUDIO","text":"It demonstrates how ceramics are made and there'll be [[equipment]] and materials for children to have a go themselves."},{"speaker":"AUDIO","text":"Last time they ran the event there was a film about [[painting]] which went down very well with the children and they're now working on one about sculpture."},{"speaker":"AUDIO","text":"I like the sound of that and what other events happen in Burnham."},{"speaker":"AUDIO","text":"Well do you all enjoy listening to music?"},{"speaker":"AUDIO","text":"Oh yes."},{"speaker":"AUDIO","text":"Well there are several free [[concerts]] taking place at different times, one or two in the morning,"},{"speaker":"AUDIO","text":"the [[majority]] at lunchtime and a couple in the evening and they range from pop music to Latin American."},{"speaker":"AUDIO","text":"The Latin American could be fun, what time is that?"},{"speaker":"AUDIO","text":"It's been repeated several times in different places."},{"speaker":"AUDIO","text":"They're [[performing]] in the central library at one o'clock, then at four it's in the city museum,"},{"speaker":"AUDIO","text":"and in the [[evening]] at 730 there's a longer concert in the theatre."},{"speaker":"AUDIO","text":"Right, I'll [[suggest]] that to the rest of the family."},{"speaker":"AUDIO","text":"Something else you might be [[interested]] in is the boat race along the river."},{"speaker":"AUDIO","text":"Oh yes, do you tell me about that?"},{"speaker":"AUDIO","text":"The race starts at Offord Marina to the north of Burnham and goes as far as Summer Pool."},{"speaker":"AUDIO","text":"The best place to watch it from is Charlesworth Bridge, though that does get rather crowded."},{"speaker":"AUDIO","text":"And who's taking part?"},{"speaker":"AUDIO","text":"Well local boat clubs, but the standard is very high."},{"speaker":"AUDIO","text":"One of them came first in the West of England Regional [[Championship]] in May this year."},{"speaker":"AUDIO","text":"It was the first time a team from Burnham has won."},{"speaker":"AUDIO","text":"It means that next year they'll be [[representing]] the region in the National Championship."},{"speaker":"AUDIO","text":"Before you hear the rest of the conversation, you have some time to look at questions 7-10."},{"speaker":"AUDIO","text":"Now I've heard something about Paxton Nature Reserve."},{"speaker":"AUDIO","text":"It's a good place for spotting unusual birds, isn't it?"},{"speaker":"AUDIO","text":"That's right, [[throughout]] the year."},{"speaker":"AUDIO","text":"There is a lake there as well as a river, and they provide a very attractive [[habitat]]."},{"speaker":"AUDIO","text":"So it's a good idea to bring [[binoculars]] if you have them."},{"speaker":"AUDIO","text":"And just at the moment you can see various flowers that are pretty unusual."},{"speaker":"AUDIO","text":"The [[soil]] at Paxton isn't very common."},{"speaker":"AUDIO","text":"They're looking good right now."},{"speaker":"AUDIO","text":"Right!"},{"speaker":"AUDIO","text":"My husband will be particularly interested in that."},{"speaker":"AUDIO","text":"And there's going to be a talk and a slideshow about mushrooms,"},{"speaker":"AUDIO","text":"and you'll be able to go out and pick some afterwards and study the different [[varieties]]."},{"speaker":"AUDIO","text":"Uh-huh."},{"speaker":"AUDIO","text":"And is it possible for children to swim in the river?"},{"speaker":"AUDIO","text":"Yes."},{"speaker":"AUDIO","text":"Part of it has been fenced off to make it safe for children to swim in."},{"speaker":"AUDIO","text":"It's very shallow, and there's a [[lifeguard]] on duty whenever it's open."},{"speaker":"AUDIO","text":"The lake is too deep, so swimming isn't allowed there."},{"speaker":"AUDIO","text":"OK, we must remember to bring their swimming things in case we go to Paxton."},{"speaker":"AUDIO","text":"How long does it take to get there by car from Burnham?"},{"speaker":"AUDIO","text":"About 20 minutes, but parking is very [[limited]], so it's usually much easier to go by bus, and it takes about the same time."},{"speaker":"AUDIO","text":"Right."},{"speaker":"AUDIO","text":"Well, I'll discuss the [[options]] with the rest of the family."},{"speaker":"AUDIO","text":"Thanks very much for all your help."},{"speaker":"AUDIO","text":"You're welcome."},{"speaker":"AUDIO","text":"Goodbye."}],"gapAnswers":["poster","activities","produced","equipment","painting","concerts","majority","performing","evening","suggest","interested","Championship","representing","throughout","habitat","binoculars","soil","varieties","lifeguard","limited","options"],"dictations":["Good morning, this is Burnham Tourist Office Martin speaking.","I'm coming to Burnham with my husband and two children for a few days on June 27th or possibly the 28th and I'd like some ideas for things to do on the 29th.","The Art Gallery is holding an event called Family Welcome that day when there are activities and trails to use throughout the gallery.","The gallery stays open until 5 and several times during the day they're going to show a short film that the gallery has produced.","Last time they ran the event there was a film about painting which went down very well with the children and they're now working on one about sculpture.","Well there are several f
