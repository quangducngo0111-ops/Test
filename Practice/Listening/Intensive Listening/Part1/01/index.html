xt":"A-R-D-L-E-I-G-H Road."},{"speaker":"TRAVEL AGENT","text":"Postcode?"},{"speaker":"ANDREA","text":"BH5 2OP"},{"speaker":"TRAVEL AGENT","text":"Thanks. And can I have your phone number?"},{"speaker":"ANDREA","text":"Is a [[mobile]] alright?"},{"speaker":"TRAVEL AGENT","text":"Fine."},{"speaker":"ANDREA","text":"It’s 07786643091."},{"speaker":"TRAVEL AGENT","text":"Thank you. And can I ask you where you heard about World Tours? From a friend? Or did you see an advert somewhere?"},{"speaker":"ANDREA","text":"No, I read about you in the newspaper."},{"speaker":"TRAVEL AGENT","text":"OK, I’ll get the brochures in the post to you but can I give you some [[information]] over the phone. What kinds of things do you want to do on your holiday?"},{"speaker":"ANDREA","text":"I’m [[interested]] in going to California with my [[family]]. I’ve got two children and we want to [[hire]] a car."},{"speaker":"TRAVEL AGENT","text":"OK. We have a couple of self-drive tours there visiting [[different]] places of interest in California. The first one begins in Los Angeles and there’s plenty of time to visit some of the theme parks there."},{"speaker":"ANDREA","text":"That’s something on my children’s list so I’d want to include that."},{"speaker":"TRAVEL AGENT","text":"Good. Then you [[drive]] to San Francisco. From San Francisco you can drive to Yosemite Park where you [[spend]] a couple of nights. You can [[choose]] to stay in a lodge or on the [[campsite]]."},{"speaker":"ANDREA","text":"I don’t like the idea of staying in a tent. It’d be too hot."},{"speaker":"TRAVEL AGENT","text":"Right. And the tour ends in Las Vegas."},{"speaker":"ANDREA","text":"OK."},{"speaker":"TRAVEL AGENT","text":"The other trip we can arrange is [[slightly]] different. It starts in San Francisco. Then you drive [[south]] to Cambria."},{"speaker":"ANDREA","text":"Someone told me there’s a really nice castle near Cambria. Will we go near that?"},{"speaker":"TRAVEL AGENT","text":"Hearst Castle is on that road so you could stop there."},{"speaker":"ANDREA","text":"Good. I’d like to do that. Does this trip also go into the [[desert]]?"},{"speaker":"TRAVEL AGENT","text":"No, it [[continues]] to Santa Monica where most people like to stop and do some [[shopping]]."},{"speaker":"ANDREA","text":"We have enough of that at home so that doesn’t interest us."},{"speaker":"TRAVEL AGENT","text":"OK. Well you could go straight on to San Diego."},{"speaker":"ANDREA","text":"That’s good for beaches isn’t it?"},{"speaker":"TRAVEL AGENT","text":"That’s right, that’s a good place to [[relax]] and your children might like to [[visit]] the zoo before flying home."},{"speaker":"ANDREA","text":"I don’t think so. We want some time for [[sunbathing]] and swimming."},{"speaker":"ANDREA","text":"So how many days are the trips and how much do they [[cost]]?"},{"speaker":"TRAVEL AGENT","text":"The first one I told you about is a self-drive tour through California which lasts twelve days and [[covers]] 2,020 kilometres. The shortest [[journey]] is 206 km and the [[longest]] is 632 kilometres. The cost is £525 per person. That [[includes]] accommodation, car [[rental]] and a flight but no meals."},{"speaker":"ANDREA","text":"OK. And the other trip?"},{"speaker":"TRAVEL AGENT","text":"That lasts nine days but you spend only three days on the road. You cover about 980 kilometres altogether."},{"speaker":"ANDREA","text":"So is that [[cheaper]] then?"},{"speaker":"TRAVEL AGENT","text":"Yes, it’s almost a hundred pounds cheaper. It’s £429 per person, which is a good deal."},{"speaker":"ANDREA","text":"So that covers accommodation and car hire. What about flights?"},{"speaker":"TRAVEL AGENT","text":"They aren’t included. But these hotels offer dinner in the [[price]]."},{"speaker":"ANDREA","text":"OK. Well, thank you very much. I’ll be in touch when I’ve had a chance to look at the brochure."},{"speaker":"TRAVEL AGENT","text":"I’m pleased to help. Goodbye."},{"speaker":"ANDREA","text":"Goodbye."}],"gapAnsw
