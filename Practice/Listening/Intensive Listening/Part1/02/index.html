 us?"},{"speaker":"EDITH","text":"It was my friend May Hampton (Example) … you did some [[excellent]] work for her a couple of years ago. Do you [[remember]]?"},{"speaker":"MR THORNDYKE","text":"Oh, yes, that was in West Park Flats, lovely lady."},{"speaker":"EDITH","text":"Yes, she is."},{"speaker":"MR THORNDYKE","text":"And what’s your name, please?"},{"speaker":"EDITH","text":"It’s Edith Pargetter."},{"speaker":"MR THORNDYKE","text":"Edith … can you spell your surname, please?"},{"speaker":"EDITH","text":"It’s P-A-R-G-E-double T-E-R."},{"speaker":"MR THORNDYKE","text":"Double T, right. And do you live in West Park Flats as well?"},{"speaker":"EDITH","text":"No, actually it’s East Park, Flat 4."},{"speaker":"MR THORNDYKE","text":"Oh, right, that’s over the road, I seem to [[remember]] - quite difficult to get to."},{"speaker":"EDITH","text":"Yes, it’s at the back of the library."},{"speaker":"MR THORNDYKE","text":"Right, I know. And what’s your phone number?"},{"speaker":"EDITH","text":"875934 but I’m out a great deal in the afternoons and evenings."},{"speaker":"MR THORNDYKE","text":"So would the best time to ring you be in the morning?"},{"speaker":"EDITH","text":"Yes."},{"speaker":"MR THORNDYKE","text":"Fine. I’ve made a note of that. Can I just ask, I’ll be in a van and I know parking’s rather [[difficult]] round your flats. Where would you [[recommend]]?"},{"speaker":"EDITH","text":"Well, I always tell people in larger vehicles to park by the postbox on the other side of the road from the entrance."},{"speaker":"MR THORNDYKE","text":"Good, thanks."},{"speaker":"EDITH","text":"And will you be [[able]] to give me a full itemised quote?"},{"speaker":"MR THORNDYKE","text":"Oh, yes, I’ll list all the jobs [[separately]] with individual prices."},{"speaker":"EDITH","text":"That’d be a great [[help]]."},{"speaker":"MR THORNDYKE","text":"No problem."},{"speaker":"MR THORNDYKE","text":"Now, what would you like me to do?"},{"speaker":"EDITH","text":"Firstly and most [[urgently]] is in the kitchen. With all the weather damage, the glass in the door has [[cracked]] and I’d need that [[fixing]] …"},{"speaker":"MR THORNDYKE","text":"I presume you mean [[replacing]]?"},{"speaker":"EDITH","text":"Oh, yes. And as soon as possible …"},{"speaker":"MR THORNDYKE","text":"What I’ll do is [[come round]] tomorrow morning and do that [[immediately]]."},{"speaker":"EDITH","text":"Thank you so much. The other things aren’t so urgent but …"},{"speaker":"MR THORNDYKE","text":"Now, I’ll make a note of everything you want doing."},{"speaker":"EDITH","text":"Well, in the kitchen I’d like some [[painting]] doing."},{"speaker":"MR THORNDYKE","text":"All the kitchen walls?"},{"speaker":"EDITH","text":"Just the area over the cooker. It’s very [[greasy]] …"},{"speaker":"MR THORNDYKE","text":"Right … it does tend to get that way!"},{"speaker":"EDITH","text":"Yes!"},{"speaker":"MR THORNDYKE","text":"Well, if you want a [[proper]] job done what I’d need to do is [[strip]] the old paint and plaster it about a week before I paint it."},{"speaker":"EDITH","text":"Of course. Now, May tells me you also do work in the garden."},{"speaker":"MR THORNDYKE","text":"That’s right."},{"speaker":"EDITH","text":"Well, I’d like you to replace a fence."},{"speaker":"MR THORNDYKE","text":"Just one?"},{"speaker":"EDITH","text":"Yes, at the far end."},{"speaker":"MR THORNDYKE","text":"Fine. Shouldn’t be a problem."},{"speaker":"EDITH","text":"And that’s the lot."},{"speaker":"MR THORNDYKE","text":"Fine. Yeah, as I say I can [[come round]] tomorrow morning to look over things with you."},{"speaker":"EDITH","text":"That’s great, thank you."},{"speaker":"MR THORNDYKE","text":"So, I’ll look forward to seeing you tomorrow at …"}],"gapAnswers":["help","painting","able","able","excellent","remember","remember","difficult","recommend","able","separately","help","urgently","cracked","fixing","replacing","come round","immediately","painting","greasy","proper","strip","come round"],"dictat
