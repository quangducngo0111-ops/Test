dding:11px 15px;font-weight:850;margin:8px 8px 8px 0}.secondary{background:white;color:#281260;border:1px solid #d6cfee}.score,.review{padding:12px;border-radius:9px;background:#f4f0ff;margin:12px 0}.right{color:#197653}.wrong{color:#b33c54}.audio-box label{display:inline-block;padding:7px}.audio-box input{max-width:220px}.audio-box select{border:1px solid #d6d3e2;border-radius:6px;padding:5px}@media(max-width:700px){.tabs{grid-template-columns:1fr}.turn{grid-template-columns:1fr;gap:0}.wrap{margin-top:14px}.hero,.panel,.audio-box{padding:16px}}</style></head><body><header class="top"><a href="../">← Danh sách bài</a><b>🎧 Intensive Listening</b><span id="student"></span></header><main class="wrap"><section class="hero"><div style="font-weight:900;color:#6046ba;font-size:12px">INTENSIVE LISTENING</div><h1 id="heading"></h1><p>Nghe điền từ → Dictation → Listening · cần đạt 80% Dictation mới được mở khóa bài chính.</p></section><section class="audio-box"><b>Audio bài luyện</b><audio id="audio" controls></audio><div><label>Nạp MP3 kiểm thử: <input type="file" accept="audio/*" id="audioFile"></label><label>Tốc độ <select id="speed"><option value="0.75">0.75×</option><option selected value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label></div><p id="audioStatus">Chưa có file audio được cung cấp. File chọn trên máy chỉ phát cục bộ trong phiên hiện tại.</p></section><nav class="tabs" id="steps"></nav><section class="panel" id="panel"></section><p id="progress"></p></main><script>window.INTENSIVE_LESSON={"id":"P1_03_SHETLAND","part":1,"number":3,"title":"Ferry to Shetland Islands","audio":"./audio.ogg","turns":[{"speaker":"TAMMY","text":"You know when you went to the Shetland Islands last year, Paul? Did you go by ferry or did you fly?"},{"speaker":"PAUL","text":"We went by [[ferry]], Tammy. I prefer driving to flying – the journey feels like part of the holiday."},{"speaker":"TAMMY","text":"Mmm. Which ferry company did you use?"},{"speaker":"PAUL","text":"There's only one – it's called [[Northern]] Ferries. The ferries all leave from Aberdeen."},{"speaker":"TAMMY","text":"How frequent are they?"},{"speaker":"PAUL","text":"The service is pretty limited – there's only one ferry leaving every evening in summer anyway, seven days a [[week]] – I'm not sure about the winter months. They may only run on four or five days then."},{"speaker":"TAMMY","text":"OK. So it's an overnight trip. I quite like that idea. Leaving at night and waking up as you arrive on the island. Can you remember how much you paid for your tickets?"},{"speaker":"PAUL","text":"They were really cheap and four people and a car worked out at just under £[[250]]."},{"speaker":"TAMMY","text":"Really? I was expecting it to be more like £400 during the peak season."},{"speaker":"PAUL","text":"So was I. It's great value. It's a good idea to book in advance because I think they get booked up quite quickly – especially during the school holidays."},{"speaker":"TAMMY","text":"Yes, I suppose so. I'm just not 100% sure of our plans yet. What if I had to cancel?"},{"speaker":"PAUL","text":"That could be a problem. I don't think it's their policy to give refunds – just a [[voucher]] – which you can use at a later date. But you have to cancel a month in advance to get that."},{"speaker":"TAMMY","text":"Right. Well we need to make up our minds quickly then."},{"speaker":"PAUL","text":"You'd want to book a cabin too. We booked too late to get a cabin with a [[window]]. They're more expensive but much nicer than the inner cabins. You don't have to book a cabin at all but I think it's worth paying for. They also have luxury cabins, which are only for two people and have a TV – but I wouldn't bother with those."},{"speaker":"TAMMY","text":"No, I agree."},{"speaker":"PAUL","text":"The only other thing I can think of is to make sure you bring snacks for the kids. The selection on board is quite limited and not that healthy either."},{"speaker":"TAMMY","text":"Mmm. What about wifi on board? Is that any good?"},{"speaker":"PAUL","text":"Not really. So it's best to bring some [[books]] for them."},{"speaker":"TAMMY","text":"OK. We may need to bring the dog if I can't get anyone to look after him."},{"speaker":"PAUL","text":"We brought ours and it was fine. The kennels on board are OK – they're quite big – you just need to provide a [[blanket]]."},{"speaker":"TAMMY","text":"Uhuh. Sounds good."},{"speaker":"PAUL","text":"It was all very easy really – and it was quite an adventure for the kids. They loved being on the sea at night and in the morning keeping a lookout for [[dolphins]] – we saw loads."},{"speaker":"TAMMY","text":"Oh, the kids would love that!"},{"speaker":"PAUL","text":"One other thing. We arrived in Aberdeen hours before the ferry was due to leave so we decided to go somewhere else rather than hang around at the port for so long."},{"speaker":"TAMMY","text":"Where did you go?"},{"speaker":"PAUL","text":"[[Drum]] Castle."},{"speaker":"TAMMY","text":"I've never heard of it. Is that spelt like the instrument?"},{"speaker":"PAUL","text":"Yeah. It's really worth visiting. It's got an impressive tower and beautiful gardens and ancient woodland."},{"speaker":"TAMMY","text":"Sounds lovely. Does it have a restaurant?"},{"speaker":"PAUL","text":"It's only got a coffee shop – no restaurant. We looked up restaurants in the area and found an [[Italian]] one in a village nearby. I can check the name of it for you if you're interested."}],"gapAnswers":["ferry","Northern","week","250","voucher","window","books","blanket","dolphins","Drum","Italian"],"dictations":["There's only one – it's called Northern Ferries. The ferries all leave from Aberdeen.","There's only one ferry leaving every evening in summer anyway, seven days a week.","They were really cheap and four people and a car worked out at just under £250.","I don't think it's their policy to give refunds – just a voucher – which you can use at a later date.","We booked too late to get a cabin with a window.","They also have luxury cabins, which are only for two people and have a TV.","The only other thing I can think of is to make sure you bring snacks for the kids.","Not really. So it's best to bring some books for them.","The kennels on board are OK – they're quite big – you just need to provide a blanket.","They loved being on the sea at night and in the morning keeping a lookout for dolphins – we saw loads.","Drum Castle. It's really worth visiting.","We looked up restaurants in the area and found an Italian one in a village nearby."],"exam":[{"n":1,"type":"blank","text":"Name of ferry company: _____ Ferries","answers":["Northern"],"cue":{"start":52,"end":66},"evidence":"There's only one – it's called Northern Ferries.","explanation":"Hãng được gọi là Northern Ferries → điền Northern."},{"n":2,"type":"blank","text":"Ferries depart seven times per _____ in summer","answers":["week"],"cue":{"start":69,"end":84},"evidence":"seven days a week","explanation":"Bảy ngày một tuần tương đương seven times per week → week."},{"n":3,"type":"blank","text":"Cost for four people with car: a little less than £_____","answers":["250","two hundred and fifty"],"cue":{"start":83,"end":96},"evidence":"four people and a car worked out at just under £250","explanation":"Just under £250 = a little less than £250 → 250."},{"n":4,"type":"blank","text":"Cancellation policy: receive a _____ (if cancelled a month in advance)","answers":["voucher"],"cue":{"start":111,"end":140},"evidence":"just a voucher – which you can use at a later date","explanation":"Không trả lại tiền, thay bằng voucher; cần hủy trước một tháng."},{"n":5,"type":"blank","text":"Cabins: book one with a _____","answers":["window"],"cue":{"start":211,"end":239},"evidence":"We booked too late to get a cabin with a window.","explanation":"Nên chọn cabin có window thay vì cabin bên trong."},{"n":6,"type":"blank","text":"Bring snacks and _____ for the children","answers":["books"],"cue":{"start":244,"end":258},"evidence":"So it's best to bring some books for them.","explanation":"Wi-Fi không tốt, nên mang sách cho trẻ → books."},{"n":7,"type":"blank","text":"A _____ is required for the dog kennels","answers":["blanket"],"cue":{"start":257,"end":269},"evidence":"you just need to provide a blanket.","explanation":"Cũi chó có sẵn nhưng chủ phải mang blanket."},{"n":8,"type":"blank","text":"Try to see _____ in the morning","answers":["dolphins"],"cue":{"start":270,"end":288},"evidence":"keeping a lookout for dolphins – we saw loads.","explanation":"Sáng đến có thể thấy dolphins."},{"n":9,"type":"blank","text":"If time, visit _____ Castle","answers":["Drum"],"cue":{"start":287,"end":304},"evidence":"Drum Castle.","explanation":"Địa danh được đọc trực tiếp là Drum Castle."},{"n":10,"type":"blank","text":"The _____ restaurant in a nearby village is recommended","answers":["Italian"],"cue":{"start":303,"end":322},"evidence":"found an Italian one in a village nearby.","explanation":"Nhà hàng ở làng gần đó là nhà hàng Italian."}]};</script><script src="../../shared/lesson.js"></script></body></html>
