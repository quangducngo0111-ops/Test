ning in summer anyway, seven days a week – I'm not sure about the winter months. They may only run on four or five days then."},{"speaker":"TAMMY","text":"OK. So it's an [[overnight]] trip. I quite like that idea. Leaving at night and waking up as you [[arrive]] on the island. Can you [[remember]] how much you paid for your tickets?"},{"speaker":"PAUL","text":"They were really [[cheap]] and four people and a car [[worked out]] at just under £250."},{"speaker":"TAMMY","text":"Really? I was expecting it to be more like £400 during the peak season."},{"speaker":"PAUL","text":"So was I. It's great value. It's a good idea to book in [[advance]] because I think they get [[booked up]] quite quickly – especially during the school holidays."},{"speaker":"TAMMY","text":"Yes, I suppose so. I'm just not 100% sure of our plans yet. What if I had to [[cancel]]?"},{"speaker":"PAUL","text":"That could be a problem. I don't think it's their policy to give refunds – just a voucher – which you can use at a later date. But you have to cancel a month in advance to get that."},{"speaker":"TAMMY","text":"Right. Well we need to make up our minds [[quickly]] then."},{"speaker":"PAUL","text":"You'd want to book a cabin too. We booked too late to get a cabin with a window. They're more [[expensive]] but much nicer than the inner cabins. You don't have to book a cabin at all but I think it's worth paying for. They also have luxury cabins, which are only for two people and have a TV – but I wouldn't bother with those."},{"speaker":"TAMMY","text":"No, I agree."},{"speaker":"PAUL","text":"The only other thing I can think of is to make sure you [[bring]] snacks for the kids. The selection on board is quite limited and not that [[healthy]] either."},{"speaker":"TAMMY","text":"Mmm. What about wifi on board? Is that any good?"},{"speaker":"PAUL","text":"Not really. So it's best to bring some books for them."},{"speaker":"TAMMY","text":"OK. We may need to bring the dog if I can't get anyone to [[look after]] him."},{"speaker":"PAUL","text":"We brought ours and it was fine. The kennels on board are OK – they're quite big – you just need to provide a blanket."},{"speaker":"TAMMY","text":"Uhuh. Sounds good."},{"speaker":"PAUL","text":"It was all very easy really – and it was quite an adventure for the kids. They loved being on the sea at night and in the morning keeping a lookout for dolphins – we saw loads."},{"speaker":"TAMMY","text":"Oh, the kids would love that!"},{"speaker":"PAUL","text":"One other thing. We arrived in Aberdeen hours before the ferry was due to leave so we decided to go somewhere else rather than hang around at the port for so long."},{"speaker":"TAMMY","text":"Where did you go?"},{"speaker":"PAUL","text":"Drum Castle."},{"speaker":"TAMMY","text":"I've never heard of it. Is that spelt like the instrument?"},{"speaker":"PAUL","text":"Yeah. It's really worth visiting. It's got an impressive tower and beautiful gardens and ancient woodland."},{"speaker":"TAMMY","text":"Sounds lovely. Does it have a restaurant?"},{"speaker":"PAUL","text":"It's only got a coffee shop – no restaurant. We looked up restaurants in the area and found an Italian one in a village nearby. I can check the name of it for you if you're interested."}],"gapAnswers":["frequent","limited","overnight","arrive","remember","cheap","worked out","advance","booked up","cancel","quickly","expensive","bring","healthy","look after"],"dictations":["I quite like that idea, leaving at night and waking up as you arrive on the island.","Can you remember how much you paid for your tickets?","They were really cheap, and four people and a car worked out at just under 250 pounds.","So was I. It's great value. It's a good idea to book in advance because I think they get booked up quite quickly, especially during the school holidays.","Yes, I suppose so. I'm just not 100% sure of our plans yet.","I don't think it's their policy to give refunds, just a voucher, which you can use at a later date, but
