used them [[frequently]], but not now,"},{"speaker":"AUDIO","text":"because the bus companies [[concentrate]] on just the routes that attract most passengers."},{"speaker":"AUDIO","text":"So parts of the town are no longer served by buses."},{"speaker":"AUDIO","text":"Even [[replacing]] old uncomfortable buses with smart new ones has had little impact on passenger numbers."},{"speaker":"AUDIO","text":"It's sometimes said that bus fares are too high,"},{"speaker":"AUDIO","text":"but in relation to [[average]] incomes fares are not much higher than they were 50 years ago."},{"speaker":"AUDIO","text":"Changes in the road network are affecting the town."},{"speaker":"AUDIO","text":"The centre was recently closed to traffic on a [[trial]] basis, making it much safer for pedestrians."},{"speaker":"AUDIO","text":"The impact of this is being [[measured]]."},{"speaker":"AUDIO","text":"The new cycle paths [[separating]] bikes from cars in most main roads are being used far more than was expected,"},{"speaker":"AUDIO","text":"reducing [[traffic]] and improving air quality."},{"speaker":"AUDIO","text":"And although the council's attempts to have a bypass constructed have failed,"},{"speaker":"AUDIO","text":"we haven't given up hope of [[persuading]] the government to change its mind."},{"speaker":"AUDIO","text":"Shopping in the town centre has changed over the years."},{"speaker":"AUDIO","text":"Many of us can remember when the town was [[crowded]] with people going shopping."},{"speaker":"AUDIO","text":"Numbers have been falling for several years, despite efforts to attract [[shoppers]], for instance by opening new car parks."},{"speaker":"AUDIO","text":"Some people combine shopping with visits to the town's restaurants and cafes."},{"speaker":"AUDIO","text":"Most shops are small [[independent]] stores, which is good,"},{"speaker":"AUDIO","text":"but many people prefer to use [[supermarkets]] and department stores in nearby large towns,"},{"speaker":"AUDIO","text":"as there are so few well-known chain stores here."},{"speaker":"AUDIO","text":"Turning now to medical facilities, the town is served by family doctors in several medical practices, fewer than 50 years ago,"},{"speaker":"AUDIO","text":"but each catering for far more patients."},{"speaker":"AUDIO","text":"Our hospital closed 15 years ago, which means journeys to other towns are unavoidable."},{"speaker":"AUDIO","text":"On the other hand, there are more dentists than there used to be."},{"speaker":"AUDIO","text":"Employment patterns have changed along with almost everything else."},{"speaker":"AUDIO","text":"The number of schools and colleges has increased, making that the main employment sector."},{"speaker":"AUDIO","text":"Services such as website design and [[accountancy]] have grown in importance and surprisingly perhaps manufacturing hasn't seen the decline that has affected it in other parts of the country."},{"speaker":"AUDIO","text":"Before you hear the rest of the talk, you have some time to look at questions 16 to 20."},{"speaker":"AUDIO","text":"Now I'll very quickly outline current plans for some of the town's facilities, before asking for your comments."},{"speaker":"AUDIO","text":"As you'll know if you regularly use the car park at the railway station, it's usually full."},{"speaker":"AUDIO","text":"The railway company applied for [[permission]] to replace it with a multi-story car park, but that was refused."},{"speaker":"AUDIO","text":"Instead, the company has bought some [[adjoining]] land and this will be used to increase the number of parking spaces."},{"speaker":"AUDIO","text":"The Grand, the old cinema in the High Street will close at the end of the year and reopen on a different site."},{"speaker":"AUDIO","text":"You've probably seen the building under construction."},{"speaker":"AUDIO","text":"The plan is to have three screens with fewer seats rather than just the one large [[auditorium]] in the old cinema."},{"speaker":"AUDIO","text":"I expect many of you shop in the indoor market."},{"speaker":"AUDIO","text":"It's become more and more shabby looking and because of fears about safety it was threatened with [[demolition]]."},{"speaker":"AUDIO","text":"The good news is that it will close for six weeks to be made safe and [[redecorated]] and the improved building will open in July."},{"speaker":"AUDIO","text":"Lots of people use the library, including school and college students who go there to study."},{"speaker":"AUDIO","text":"The council has managed to [[secure]] funding to keep the library open later into the evening twice a week."},{"speaker":"AUDIO","text":"We would like to enlarge the building in the not too distant future, but this is by no means definite."},{"speaker":"AUDIO","text":"There is no limit on access to the nature reserve on the edge of town, and this will continue to be the case."},{"speaker":"AUDIO","text":"What will change, though, is that the council will no longer be in charge of the area."},{"speaker":"AUDIO","text":"Instead, it will become the [[responsibility]] of a national body that administers most nature reserves in the country."}],"gapAnswers":["background","developments","neighbouring","frequently","concentrate","replacing","average","trial","measured","separating","traffic","persuading","crowded","shoppers","independent","supermarkets","accountancy","permission","adjoining","auditorium","demolition","redecorated","secure","responsibility"],"dictations":["First of all, let me thank you all for coming to this public meeting to discuss the future of our town.","Well, as you don't need me to tell you, Barford has changed a great deal in the last 50 years.","So parts of the town are no longer served by buses.","but in relation to average incomes fares are not much higher than they were 50 years ago.","The new cycle paths separating bikes from cars in most main roads are being used far more than was expected,","Shopping in the town centre has changed over the years.","Some people combine sh
