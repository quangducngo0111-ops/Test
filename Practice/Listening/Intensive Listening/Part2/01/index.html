<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intensive Listening · Street Food Businesses</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(125deg,#f3efff,#f3f7ff);font:14px/1.65 Inter,system-ui,Segoe UI,Arial,sans-serif;color:#27314d}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e0e3ef;padding:15px max(15px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;gap:12px}.top a{color:#412785;font-weight:800;text-decoration:none}.wrap{width:min(1100px,calc(100% - 26px));margin:27px auto 70px}.hero,.audio-box,.panel{background:white;border:1px solid #e1e3f0;border-radius:20px;padding:23px;margin-bottom:14px;box-shadow:0 8px 24px #29135c09}.hero{background:linear-gradient(110deg,#fff,#f0eaff,#eaf5ff)}h1,h2,h3{color:#281260}h1{font-size:30px;margin:8px 0}p{color:#63718a}audio{width:100%}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.tabs button{padding:13px;text-align:left;border:1px solid #dcdceb;border-radius:12px;background:white;font-weight:800;color:#4d3785}.tabs button.active{background:#efe9ff;border:2px solid #7954dd}.turn{display:grid;grid-template-columns:90px 1fr;gap:10px;border-bottom:1px solid #e8eaf3;padding:12px 0;line-height:2}.turn b{font-size:11px;color:#6445aa}.gap,.inline{width:145px;max-width:100%;border:1px solid #a59add;border-bottom:2px solid #6948dd;border-radius:7px;padding:6px 9px;color:#281260}.card{border:1px solid #e1e3f0;border-radius:12px;padding:15px;margin:12px 0}.card textarea{width:100%;min-height:100px;border:1px solid #cad0e1;border-radius:9px;padding:10px}.card .option{display:block;padding:7px;border:1px solid #e7e9f1;border-radius:8px;margin:6px 0}.primary,.secondary{background:#6948dd;border:0;color:white;border-radius:9px;padding:11px 15px;font-weight:850;margin:8px 8px 8px 0}.secondary{background:white;color:#281260;border:1px solid #d6cfee}.score,.review{padding:12px;border-radius:9px;background:#f4f0ff;margin:12px 0}.right{color:#197653}.wrong{color:#b33c54}.audio-box label{display:inline-block;padding:7px}.audio-box input{max-width:220px}.audio-box select{border:1px solid #d6d3e2;border-radius:6px;padding:5px}@media(max-width:700px){.tabs{grid-template-columns:1fr}.turn{grid-template-columns:1fr;gap:0}.wrap{margin-top:14px}.hero,.panel,.audio-box{padding:16px}}</style></head><body><header class="top"><a href="../">← Danh sách bài</a><b>🎧 Intensive Listening</b><span id="student"></span></header><main class="wrap"><section class="hero"><div style="font-weight:900;color:#6046ba;font-size:12px">INTENSIVE LISTENING</div><h1 id="heading"></h1><p>Nghe điền từ → Dictation → Listening · cần đạt 80% Dictation mới được mở khóa bài chính.</p></section><section class="audio-box"><b>Audio bài luyện</b><audio id="audio" controls></audio><div><label>Nạp MP3 kiểm thử: <input type="file" accept="audio/*" id="audioFile"></label><label>Tốc độ <select id="speed"><option value="0.75">0.75×</option><option selected value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label></div><p id="audioStatus">Chưa có file audio được cung cấp. File chọn trên máy chỉ phát cục bộ trong phiên hiện tại.</p></section><nav class="tabs" id="steps"></nav><section class="panel" id="panel"></section><p id="progress"></p></main><script>window.INTENSIVE_LESSON={"id":"P2_01_STREET_FOOD","part":2,"number":1,"title":"Street Food Businesses","audio":"","turns":[{"speaker":"JON","text":"Good evening everyone. My name's Jon and I run Veg Out, a street food business selling [[vegan]] food. Since 2012 I've been travelling all around the country cooking vegan food in my converted van and selling it at all kinds of outdoor events. I'm here to give you some advice based on my experience."},{"speaker":"JON","text":"The good news is that there's never been a better time to start your own street food business. Street food continues to grow in popularity. I think there are a couple of reasons for this."},{"speaker":"JON","text":"The first is that street food is a reaction against fast food. Street food ranges from high quality burgers to vegan curries and everything in between. But while fast food is cheap and easy to find, it's not particularly good for you. It's also the same everywhere."},{"speaker":"JON","text":"What you get with street food on the other hand is something [[different]]. People like the idea of trying something they can't get anywhere else. They also like seeing food [[prepared]] in front of them and which hasn't come straight out of a freezer."},{"speaker":"JON","text":"You need to think about the best place to sell your street food. People always think music festivals are an obvious place to start but the cost of renting a space can be huge. And there's always a lot of competition."},{"speaker":"JON","text":"Food [[markets]], on the other hand, are great because customers are always really interested in food and give great feedback. And if you can get a spot in your local [[park]] – fantastic. Usually very relaxed but with lots of customers passing by."},{"speaker":"JON","text":"Once you get established you'll start getting asked to do parties – which can be really challenging but lots of fun. Having street food at weddings has become quite fashionable too – but you need to really know what you're doing as everything needs to be perfect."},{"speaker":"JON","text":"Setting up a street food business costs a lot less than opening a restaurant or café but you'll have to buy some basic equipment. I'd try to get things like hobs and fridges [[second]] hand if you can. You can replace them with better quality stuff if your business takes off. Renting is another option but you'll end up spending more money rather than saving it."},{"speaker":"JON","text":"You've probably got a good idea about the food you're planning to sell. I expect you've done some research to find out if anyone else is selling a similar product. And you'll have thought about any possible allergies to nuts or eggs etc."},{"speaker":"JON","text":"But there's one thing people don't always think about and that's how you're going to [[serve]] it. On a plate? In a bag? Will you provide a fork? Will it all be easily recyclable or reusable? It's got to be easy to eat and look [[attractive]] or customers won't come back."},{"speaker":"JON","text":"Once you get started, you should be prepared for things to go wrong. Every business faces problems and here are a few examples from street food businesses that I know."},{"speaker":"JON","text":"My friends who run Thai Basil started by juggling their street food business with their day jobs in a restaurant. Their work-life balance was non-existent as they were working til [[midnight]] in the restaurant all week and then took their food truck to markets on their days off."},{"speaker":"JON","text":"The owners of Basque found it was hard to make a profit because the price of [[fish]] – essential for some of their dishes – was so high. And it was hard to charge customers a lot more for those dishes. So they had to stop focussing on fish dishes and include more vegetarian food."},{"speaker":"JON","text":"The owners of Lou's kitchen were making salads to order from their van and some of their dishes were quite complicated. At one of their first events they ended up with people standing in a long [[queue]] for more than 15 minutes – and many of them lost patience. So make sure whatever you offer can be served quickly and efficiently."},{"speaker":"JON","text":"The owners of Chip Chop had found a perfect venue near a beach where there weren't any other street food trucks. But what they hadn't realised was that they'd need a special [[licence]] – which individual businesses don't need at markets or festivals. It was a complicated process and in the end they gave up."}],"gapAnswers":["vegan","different","prepared","markets","park","second","serve","attractive","midnight","fish","queue","licence"],"dictations":["Good evening everyone. My name's Jon and I run Veg Out, a street food business selling vegan food.","Street food ranges from high quality burgers to vegan curries and everything in between.","People like the idea of trying something they can't get anywhere else.","They also like seeing food prepared in front of them and which hasn't come straight out of a freezer.","Food markets, on the other hand, are great because customers are always really interested in food and give great feedback.","If you can get a spot in your local park – fantastic. Usually very relaxed but with lots of customers passing by.","I'd try to get things like hobs and fridges second hand if you can.","It's got to be easy to eat and look attractive or customers won't come back.","Their work-life balance was non-existent as they were working til midnight in the restaurant all week.","The price of fish – essential for some of their dishes – was so high.","They ended up with people standing in a long queue for more than 15 minutes.","They'd need a special licence – which individual businesses don't need at markets or festivals."],"matchOptions":["Some ingredients were too expensive.","The meals took a long time to prepare.","They had no money for marketing.","It was difficult to get a permit to sell food.","A competitor was selling similar food in their area.","They worked very long hours."],"exam":[{"n":11,"type":"two","text":"Which TWO explanations for the popularity of street food are given?","options":["low price","locally sourced","freshly made","convenience","unusual food"],"answers":["C","E"]},{"n":13,"type":"two","text":"Which TWO places are recommended for new street food businesses?","options":["music festivals","food markets","weddings","parties","parks"],"answers":["B","E"]},{"n":15,"type":"mc","text":"What does the speaker say about getting equipment for a street food business?","options":["High quality equipment is a good investment.","It's best to buy second-hand equipment.","Renting equipment can be cheap."],"answers":["B"]},{"n":16,"type":"mc","text":"What advice is given about creating a product for a street food business?","options":["Provide information about the ingredients.","It is important to have an original product.","The presentation is an important factor."],"answers":["C"]},{"n":17,"type":"match","text":"Thai Basil","answers":["F"]},{"n":18,"type":"match","text":"Basque","answers":["A"]},{"n":19,"type":"match","text":"Lou's kitchen","answers":["B"]},{"n":20,"type":"match","text":"Chip Chop","answers":["D"]}]};</script><script src="../../shared/lesson.js"></script></body></html>
