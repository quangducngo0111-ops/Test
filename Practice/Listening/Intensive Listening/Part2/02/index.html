g:11px 15px;font-weight:850;margin:8px 8px 8px 0}.secondary{background:white;color:#281260;border:1px solid #d6cfee}.score,.review{padding:12px;border-radius:9px;background:#f4f0ff;margin:12px 0}.right{color:#197653}.wrong{color:#b33c54}.audio-box label{display:inline-block;padding:7px}.audio-box input{max-width:220px}.audio-box select{border:1px solid #d6d3e2;border-radius:6px;padding:5px}@media(max-width:700px){.tabs{grid-template-columns:1fr}.turn{grid-template-columns:1fr;gap:0}.wrap{margin-top:14px}.hero,.panel,.audio-box{padding:16px}}</style><link rel="stylesheet" href="../../shared/unified.css?v=20261112-b"></head><body><header class="top"><a href="../">← Danh sách bài</a><b>🎧 Intensive Listening</b><span id="student"></span></header><main class="wrap"><section class="hero"><div style="font-weight:900;color:#6046ba;font-size:12px">INTENSIVE LISTENING</div><h1 id="heading"></h1><p>Nghe điền từ → Dictation → Listening · cần đạt 80% Dictation mới được mở khóa bài chính.</p></section><div class="intensive-audio-source" hidden><audio id="audio" preload="metadata"></audio><span id="audioStatus" hidden></span></div><nav class="tabs" id="steps"></nav><section class="panel" id="panel"></section><p id="progress"></p></main><script>window.INTENSIVE_LESSON={"id":"INTENSIVE_LISTENING_02_CITY_DEVELOPMENTS_V1","part":2,"number":2,"title":"New city developments","audio":"../../02/Cam10-Test2-Section2.mp3","turns":[{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"Good morning. I’m very pleased to have this [[opportunity]] to say a little about two exciting new [[developments]] in the city: the Brackenside Open-Air Swimming Pool and the children’s Adventure Playground in Central Park. As many of you may know, the idea for these initiatives came from you, the [[public]], in the extensive [[consultation]] exercise which the City Council conducted last year. And they have been realised using [[money]] from the SWRDC - the South West Regional Development Commission."},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"First of all, Brackenside Pool. As many of the older members of the audience will [[remember]], there used to be a wonderful open-air pool on the sea front 30 years ago but it had to close when it was judged to be [[unsafe]]. For the design of this new [[heated]] pool, we were very happy to secure the talents of internationally renowned [[architect]] Ellen Wendon, who has managed to combine a charming 1930s design, which fits is so well with many of the other buildings in the area, with up-to-the-minute features such as a [[recycling]] system - the only one of its kind in the world - which [[enables]] seawater to be used in the pool."},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"Now, there has been quite a bit of [[discussion]] in the local press about whether there would be enough room for the number of [[visitors]] we’re hoping to [[attract]], but the design is deceptive and there have been rigorous checks about [[capacity]]. Also, just in case you were wondering, we’re on [[schedule]] for a June 15th opening date and well within [[budget]]: a testimony to the excellent work of local [[contractors]] Hickman’s."},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"We hope that as many people as possible will be there on June 15th. We have engaged award-winning [[actress]] Coral White to declare the pool open and there’ll be drinks and snacks available at the pool side. There’ll also be a [[competition]] for the public to decide on the [[sculpture]] we plan to have at the entrance: you will decide which famous [[historical]] figure from the city we should have."},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"And now, moving on the Central Park Playground, which we’re pleased to announce has just won the Douglas [[Award]] for [[safety]]: the news came through only last week. The [[unique]] design is based on the [[concept]] of the Global Village, with the playground being [[divided]] into sex areas showing different parts of the world - each with a representative feature."},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"For example, there is a section on Asia, and this is [[represented]] by rides and [[equipment]] in the shape of snakes, orang-utans, tigers and so on - fauna [[native]] to the forests of the region."},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"Moving south to the Antarctic - we couldn’t run to an ice rink I’m afraid but opted instead for climbing blocks in the shape of [[mountains]] - I thought they could have had slides for the glaciers but the [[designers]] did want to avoid being too literal!"},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"Then on to South America - and here the [[theme]] is El Dorado - games replicating the search for mines full of [[precious]] stones."},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"And then moving up to North America, here there was considerable [[debate]] - I know the [[contribution]] of cinema and jazz was considered but the designers finally opted for [[rockets]] and the international Space Station."},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"Eastwards to Europe then, and perhaps the most [[traditional]] choice of all the areas: medieval castles and other [[fortifications]]."},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"Then last, but not least, moving south to Africa and a whole set of wonderful mosaics and trails to represent the great [[rivers]] of this fascinating and varied continent."},{"speaker":"CITY COUNCIL REPRESENTATIVE","text":"Now, the opening date for our Global Playground is 10th July. And again we’d love to see you there - so make a date and come and see this magnificent, [[original]] new amenity right in the [[heart]] of the city."}],"gapAnswers":["opportunity","developments","public","consultation","money","remember","unsafe","heated","architect","recycling","enables","discussion","visitors","attract","capacity","schedule","budget","contractors","actress","competition","sculpture","his
