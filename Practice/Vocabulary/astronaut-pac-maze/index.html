<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Astronaut Pac-Maze 3D</title>

  <link
    rel="stylesheet"
    href="./style.css"
  />
</head>

<body>

  <main id="game">

    <!-- =========================
         HUD
    ========================== -->
    <section id="hud">

      <div class="question-card">

        <span class="hud-label">
          TÌM ĐÁP ÁN ĐÚNG
        </span>

        <strong id="question">
          —
        </strong>

      </div>


      <div class="hud-stats">

        <div class="stat">
          <span>Điểm</span>
          <b id="score">0</b>
        </div>

        <div class="stat">
          <span>Mạng</span>
          <b id="lives">5</b>
        </div>

        <div class="stat">
          <span>Alien</span>
          <b id="alienCount">3</b>
        </div>

      </div>

    </section>


    <!-- Message đúng / sai -->
    <div
      id="message"
      aria-live="polite"
    ></div>


    <!-- Error -->
    <div
      id="bootError"
      class="boot-error hidden"
    ></div>


    <!-- =========================
         MOBILE CONTROLS
    ========================== -->
    <section
      id="mobileControls"
      aria-label="Điều khiển astronaut"
    >

      <button
        class="up"
        data-dir="up"
        type="button"
      >
        ↑
      </button>

      <button
        class="left"
        data-dir="left"
        type="button"
      >
        ←
      </button>

      <button
        class="down"
        data-dir="down"
        type="button"
      >
        ↓
      </button>

      <button
        class="right"
        data-dir="right"
        type="button"
      >
        →
      </button>

    </section>


    <!-- Game over -->
    <section
      id="gameOver"
      class="modal hidden"
    >

      <div class="modal-card">

        <h2>
          Kết thúc
        </h2>

        <p id="gameOverText"></p>

        <button
          id="restartBtn"
          type="button"
        >
          Chơi lại
        </button>

      </div>

    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"
  ></script>

  <script src="./game.js"></script>

</body>
</html>
