<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astronaut Escape 3D</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game">
    <section id="hud">
      <div class="question-card">
        <span class="eyebrow">ASTRONAUT ESCAPE</span>
        <small>CHẠY TỚI TELEPORT PAD ĐÚNG</small>
        <strong id="question">—</strong>
      </div>

      <div class="stats">
        <div class="stat"><span>Điểm</span><b id="score">0</b></div>
        <div class="stat"><span>Mạng</span><b id="lives">5</b></div>
        <div class="stat"><span>Alien</span><b id="alienCount">4</b></div>
      </div>
    </section>

    <div id="message" aria-live="polite"></div>

    <section id="mobileControls" aria-label="Điều khiển astronaut">
      <button class="up" data-dir="up" type="button">↑</button>
      <button class="left" data-dir="left" type="button">←</button>
      <button class="down" data-dir="down" type="button">↓</button>
      <button class="right" data-dir="right" type="button">→</button>
    </section>

    <div id="bootError" class="boot-error hidden" role="alert"></div>

    <section id="gameOver" class="modal hidden">
      <div class="modal-card">
        <span class="eyebrow">MISSION FAILED</span>
        <h2>Hết mạng</h2>
        <p id="gameOverText"></p>
        <button id="restartBtn" type="button">Chơi lại</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
  <script src="./game.js"></script>
</body>
</html>
