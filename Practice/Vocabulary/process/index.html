<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Vocabulary · Writing Task 1 · Process</title>
<style>
:root{--purple:#281260;--purple2:#6648d2;--ink:#211a45;--muted:#70788d;--line:#e1e5ee;--bg:#f5f7fb;--good:#16845b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 5% 0,#efeaff 0,transparent 28%),var(--bg)}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.topin{width:min(1180px,calc(100% - 24px));height:64px;margin:auto;display:flex;align-items:center;gap:12px}.back{text-decoration:none;color:#4d358e;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-weight:850;font-size:12px}.brand{font-weight:950;font-size:17px}main{width:min(1180px,calc(100% - 24px));margin:auto;padding:26px 0 50px}.hero{background:linear-gradient(120deg,#fff,#f0edff);border:1px solid #ded8f7;border-radius:22px;padding:26px;margin-bottom:18px}h1{margin:0;font-size:32px;color:#24125f}.hero p{margin:7px 0 0;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 9px 25px rgba(40,18,96,.06);transition:.18s}.card:hover{transform:translateY(-2px);border-color:#8f7ee5}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{font-size:11px;font-weight:950;color:#684ec2;background:#efeaff;padding:6px 9px;border-radius:999px}.card h2{font-size:18px;margin:10px 0 6px;color:#26145f}.meta{color:var(--muted);font-size:12px}.groups{margin-top:13px;display:flex;flex-wrap:wrap;gap:6px}.groups span{font-size:10px;padding:5px 7px;background:#f7f8fc;border:1px solid var(--line);border-radius:999px}.status{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;font-weight:800;color:#755eaa}.status.pass{color:var(--good)}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:26px}}
</style></head><body><header class="top"><div class="topin"><a class="back" href="../index.html?skill=writing-task-1">← Writing Task 1</a><div class="brand">⚙️ Vocabulary · Process</div></div></header><main><section class="hero"><h1>Writing Task 1 · Process</h1><p>Chọn một bộ từ vựng. Mỗi bộ đi theo 3 giai đoạn: <b>Học từ qua game → Kiểm tra → Luyện viết câu</b>.</p></section><div id="grid" class="grid"></div></main>
<script>
const SETS={"process-01-bricks": {"number": "01", "title": "Manufacturing Bricks", "icon": "🧱", "groups": ["Raw materials", "Production process", "Heating & finishing"], "count": 20}, "process-02-instant-noodles": {"number": "02", "title": "Manufacturing Instant Noodles", "icon": "🍜", "groups": ["Raw materials & preparation", "Production process", "Packaging"], "count": 21}, "process-03-tomato-ketchup": {"number": "03", "title": "Manufacturing Tomato Ketchup", "icon": "🍅", "groups": ["Raw materials", "Preparation", "Cooking process", "Final stages"], "count": 20}, "process-04-frog-life-cycle": {"number": "04", "title": "Frog Life Cycle", "icon": "🐸", "groups": ["Stages & organisms", "Development & transformation"], "count": 23}, "process-05-bee-life-cycle": {"number": "05", "title": "Bee Life Cycle", "icon": "🐝", "groups": ["Egg laying & hatching", "Moulting & maturity"], "count": 14}, "process-06-plastic-bottles": {"number": "06", "title": "Recycling Plastic Bottles", "icon": "♻️", "groups": ["Collection & sorting", "Processing", "Manufacturing"], "count": 14}};
function scope(){try{const s=JSON.parse(localStorage.getItem('IELTS_PRACTICE_STUDENT')||'null');if(s?.name)return encodeURIComponent((s.name+'|'+(s.className||'')).toLowerCase())}catch(e){}return 'guest'}
function testRecord(key){try{const store=JSON.parse(localStorage.getItem('VOCABULARY_TESTED_V1_'+scope())||'{}');return store['writing-task-1::'+key]||null}catch(e){return null}}
function phase3Count(key){try{const x=JSON.parse(localStorage.getItem('PROCESS_SENTENCE_V1_'+scope()+'::'+key)||'null');return Array.isArray(x?.completed)?x.completed.length:0}catch(e){return 0}}
const grid=document.getElementById('grid');
grid.innerHTML=Object.entries(SETS).map(([key,s])=>{const rec=testRecord(key);const passed=!!rec?.passed;const done=phase3Count(key);return `<a class="card" href="../index.html?skill=writing-task-1&set=${encodeURIComponent(key)}"><div class="toprow"><div style="font-size:30px">${s.icon}</div><span class="badge">BỘ ${s.number}</span></div><h2>${s.title}</h2><div class="meta">${s.count} từ/cụm từ · 3 giai đoạn</div><div class="groups">${s.groups.map(g=>`<span>${g}</span>`).join('')}</div><div class="status ${passed?'pass':''}">${passed?'✓ Đã đạt kiểm tra · Phase 3: '+done+' câu hoàn thành':'Mở bộ từ vựng →'}</div></a>`}).join('');
</script></body></html>
