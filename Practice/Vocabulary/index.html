<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta
  http-equiv="Cache-Control"
  content="no-cache, no-store, must-revalidate"
>

<title>Vocabulary Practice</title>

<script
  src="./vocab-data.js?v=20260917-6games"
  onerror="window.VOCABULARY_LOAD_ERROR=true"
></script>

<style>
:root{
  --purple:#281260;
  --purple2:#6042c3;
  --blue:#3378e5;
  --green:#20a568;
  --red:#df4d60;
  --orange:#ee922d;
  --yellow:#ffd95d;
  --ink:#1e2741;
  --muted:#737c90;
  --line:#e3e7ef;
  --bg:#f4f7fb;
  --shadow:0 14px 34px rgba(38,29,82,.09);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 4% 0%,rgba(139,99,237,.13),transparent 25%),
    radial-gradient(circle at 96% 0%,rgba(74,168,255,.12),transparent 26%),
    var(--bg);
}

button,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.top-inner{
  width:min(1240px,calc(100% - 20px));
  min-height:62px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.back{
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:#50388e;
  text-decoration:none;
  font-size:10.5px;
  font-weight:900;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  color:#24154d;
  font-weight:950;
}

.logo-icon{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:linear-gradient(135deg,#5b3ac2,#8c70e9);
  color:#fff;
  font-size:18px;
}

.student{
  color:#747d8e;
  font-size:10.5px;
  font-weight:850;
}

.page{
  width:min(1240px,calc(100% - 20px));
  margin:auto;
  padding:23px 0 60px;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  padding:28px 30px;
  border:1px solid rgba(255,255,255,.92);
  border-radius:25px;
  background:linear-gradient(120deg,#fff,#fbf8ff 55%,#eef7ff);
  box-shadow:var(--shadow);
}

.hero::after{
  content:"🧠";
  position:absolute;
  right:28px;
  bottom:-17px;
  font-size:125px;
  opacity:.055;
}

.eyebrow{
  color:#684bb6;
  font-size:9.5px;
  font-weight:950;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.hero h1{
  margin:8px 0 5px;
  color:#21144c;
  font-size:clamp(35px,5vw,56px);
  line-height:1;
  letter-spacing:-.05em;
}

.hero p{
  margin:0;
  max-width:730px;
  color:var(--muted);
  font-size:11.5px;
  line-height:1.65;
}

/* REVIEW */

.review-banner{
  margin-top:14px;
  padding:15px 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  border:1px solid #f2d8bb;
  border-radius:16px;
  background:linear-gradient(120deg,#fff9ef,#fff);
}

.review-main{
  display:flex;
  align-items:center;
  gap:12px;
}

.review-icon{font-size:33px}

.review-banner b{
  display:block;
  color:#654019;
  font-size:13px;
}

.review-banner span{
  display:block;
  margin-top:2px;
  color:#8b735d;
  font-size:10px;
}

.review-btn{
  padding:9px 13px;
  border:0;
  border-radius:9px;
  background:#df8629;
  color:#fff;
  font-size:10px;
  font-weight:950;
}

/* COMMON */

.section-head{margin:25px 0 12px}
.section-head h2{
  margin:0;
  color:#202946;
  font-size:22px;
  letter-spacing:-.03em;
}
.section-head p{
  margin:4px 0 0;
  color:#7d8595;
  font-size:10.5px;
}

/* CATEGORIES */

.category-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.category{
  padding:17px;
  min-height:183px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  border:1px solid var(--line);
  border-radius:17px;
  background:#fff;
  box-shadow:0 7px 18px rgba(38,29,82,.04);
  text-align:left;
  transition:.17s ease;
}

.category:hover{
  transform:translateY(-3px);
  border-color:#cec4ec;
  box-shadow:0 12px 27px rgba(38,29,82,.08);
}

.category-icon{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:#f0edff;
  font-size:22px;
}

.category h3{
  margin:11px 0 2px;
  color:#29204e;
  font-size:14px;
}

.category-count{
  color:#8b92a0;
  font-size:9.5px;
}

.mastery-line{
  width:100%;
  margin-top:auto;
  padding-top:13px;
}

.mastery-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  color:#758093;
  font-size:9px;
  font-weight:850;
}

.mastery-bar{
  height:6px;
  overflow:hidden;
  border-radius:999px;
  background:#e9ecf2;
}

.mastery-bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#5c3ac2,#4d82e5);
  border-radius:inherit;
}

/* COLLECTION */

.collection-head{
  margin-bottom:15px;
}

.collection-back{
  margin-bottom:8px;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:#533a8f;
  font-size:9.5px;
  font-weight:900;
}

.collection-head h1{
  margin:0;
  color:#241650;
  font-size:30px;
  letter-spacing:-.04em;
}

.collection-head p{
  margin:5px 0 0;
  color:#777f90;
  font-size:10.5px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:15px;
}

.stat{
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  text-align:center;
}

.stat small{
  display:block;
  color:#959ba7;
  font-size:8px;
  font-weight:950;
  text-transform:uppercase;
}

.stat b{
  display:block;
  margin-top:3px;
  color:#2d3350;
  font-size:19px;
}

.game-settings{
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

.game-settings span{
  color:#6e7689;
  font-size:10px;
  font-weight:850;
}

.game-settings select{
  padding:8px 10px;
  border:1px solid #dce0e9;
  border-radius:8px;
  background:#fff;
  color:#403268;
  font-size:10px;
  font-weight:900;
}

/* GAME CARDS */

.game-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-top:12px;
}

.game-card{
  min-height:220px;
  padding:18px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  border:1px solid var(--line);
  border-radius:17px;
  background:#fff;
  box-shadow:0 7px 18px rgba(38,29,82,.04);
  transition:.16s;
}

.game-card:hover{
  transform:translateY(-3px);
  border-color:#c9beeb;
}

.game-icon{font-size:44px}

.game-card h3{
  margin:10px 0 5px;
  color:#271a50;
  font-size:17px;
}

.game-card p{
  margin:0;
  color:#747d8d;
  font-size:10px;
  line-height:1.55;
}

.game-meta{
  margin-top:9px;
  color:#9198a7;
  font-size:8.5px;
  font-weight:850;
}

.game-play{
  margin-top:auto;
  padding:9px 12px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,#432594,#7253d4);
  color:#fff;
  font-size:10px;
  font-weight:950;
}

/* TOPICS */

.topic-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}

.topic-card{
  padding:15px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  text-align:left;
}

.topic-card b{
  display:block;
  color:#29204d;
  font-size:12px;
}

.topic-card span{
  display:block;
  margin-top:4px;
  color:#8a91a0;
  font-size:9px;
}

.topic-progress{
  height:5px;
  margin-top:10px;
  overflow:hidden;
  border-radius:999px;
  background:#eaedf3;
}

.topic-progress i{
  display:block;
  height:100%;
  background:#6042c3;
}

/* WORD LIST */

.word-list{
  margin-top:14px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}

.word-row{
  display:grid;
  grid-template-columns:1fr 1.3fr 110px;
  gap:10px;
  align-items:center;
  padding:10px 13px;
  border-bottom:1px solid #edf0f4;
  font-size:10px;
}

.word-row:last-child{border-bottom:0}

.word{
  color:#2d2452;
  font-size:11px;
  font-weight:950;
}

.meaning{color:#596274}

.word-status{
  justify-self:end;
  padding:5px 8px;
  border-radius:999px;
  font-size:8.5px;
  font-weight:950;
}

.word-status.new{
  background:#f0f1f4;
  color:#7e8593;
}

.word-status.learning{
  background:#fff2da;
  color:#a66513;
}

.word-status.mastered{
  background:#e3f6ec;
  color:#168054;
}

/* GAME COMMON */

.game-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}

.game-header h2{
  margin:0;
  color:#25164e;
  font-size:22px;
}

.quit{
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:#674f85;
  font-size:9.5px;
  font-weight:900;
}

.hud{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-bottom:9px;
}

.hud-box{
  padding:9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  text-align:center;
}

.hud-box small{
  display:block;
  color:#969daa;
  font-size:7.5px;
  font-weight:950;
  text-transform:uppercase;
}

.hud-box b{
  display:block;
  margin-top:2px;
  color:#302550;
  font-size:15px;
}

.target{
  padding:14px;
  margin-bottom:9px;
  border-radius:13px;
  background:linear-gradient(125deg,#2a1769,#6244ba);
  color:#fff;
  text-align:center;
}

.target small{
  display:block;
  opacity:.67;
  font-size:8px;
  font-weight:950;
  text-transform:uppercase;
}

.target b{
  display:block;
  margin-top:4px;
  font-size:clamp(20px,4vw,31px);
}

/* WHACK */

.whack-board{
  min-height:470px;
  padding:15px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  border:1px solid var(--line);
  border-radius:17px;
  background:linear-gradient(180deg,#e1f7d6,#bce4a7);
}

.hole{
  position:relative;
  min-height:135px;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.ground{
  position:absolute;
  bottom:3px;
  width:90%;
  height:31px;
  border-radius:50%;
  background:#79583d;
}

.mole{
  position:relative;
  z-index:2;
  width:90%;
  max-width:175px;
  min-height:105px;
  padding:9px 7px 15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  border:0;
  border-radius:50% 50% 27% 27%;
  background:linear-gradient(#ad774b,#80502f);
  transform:translateY(150%);
  transition:transform .22s ease;
}

.mole.show{transform:translateY(0)}
.mole .face{font-size:34px}

.mole .word-label{
  max-width:100%;
  padding:5px 7px;
  border-radius:7px;
  background:#fff;
  color:#33261e;
  text-align:center;
  font-size:10px;
  font-weight:950;
}

/* LANE GAMES */

.lane-board{
  position:relative;
  height:520px;
  overflow:hidden;
  border-radius:18px;
  border:1px solid var(--line);
  user-select:none;
  touch-action:none;
}

.catch-board{
  background:
    linear-gradient(#bee8ff 0 68%,#d6efb8 69%,#b5db90 100%);
}

.road-board{
  background:#43464e;
}

.road-board::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      transparent 32%,
      rgba(255,255,255,.6) 32%,
      rgba(255,255,255,.6) 33%,
      transparent 33%,
      transparent 66%,
      rgba(255,255,255,.6) 66%,
      rgba(255,255,255,.6) 67%,
      transparent 67%
    );
  opacity:.6;
}

.lanes{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.driver-lanes{
  grid-template-columns:repeat(3,1fr);
}

.lane-object{
  position:absolute;
  top:-110px;
  transform:translateX(-50%);
  z-index:5;
  text-align:center;
  animation:fallObject 2.7s linear forwards;
}

@keyframes fallObject{
  from{top:-110px}
  to{top:410px}
}

.fruit-icon{
  font-size:46px;
}

.object-label{
  max-width:145px;
  padding:5px 8px;
  border-radius:8px;
  background:#fff;
  color:#303850;
  font-size:9px;
  font-weight:950;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
}

.basket{
  position:absolute;
  bottom:10px;
  transform:translateX(-50%);
  z-index:10;
  font-size:65px;
  transition:left .16s ease;
}

.driver-car{
  position:absolute;
  bottom:10px;
  transform:translateX(-50%);
  z-index:10;
  transition:left .16s ease;
  text-align:center;
}

.driver-car-icon{
  font-size:62px;
}

.driver-car-label{
  max-width:135px;
  margin:auto;
  padding:4px 7px;
  border-radius:7px;
  background:#fff;
  color:#281260;
  font-size:8.5px;
  font-weight:950;
}

.road-answer{
  min-width:125px;
  padding:10px 8px;
  border:3px solid #fff;
  border-radius:10px;
  background:#ffd85d;
  color:#242b3c;
  font-size:10px;
  font-weight:950;
  box-shadow:0 6px 15px rgba(0,0,0,.2);
}

.mobile-controls{
  display:flex;
  justify-content
