<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dungeon of Words</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#0c1730;color:#fff4dc;font-family:"Baloo 2",system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffdd87}
main{max-width:1100px;margin:auto;padding:15px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#fff5d9;text-decoration:none;border:1px solid #a99fc4;border-radius:12px;padding:8px}
h1{font-size:clamp(30px,5vw,50px);text-align:center;color:#ffdfa5;margin:7px}p.sub{text-align:center;margin:0 0 12px;color:#d0c5e6}
.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px}.hud span{background:#29375e;padding:7px 13px;border-radius:12px;border:1px solid #9587bb}
.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.map{position:relative;min-height:535px;border:4px solid #927dab;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#3c7774,#243856 53%,#101b35)}
.map:before{content:"";position:absolute;inset:0;opacity:.5;background-image:radial-gradient(#ffe9ab 1px,transparent 1px);background-size:44px 48px}
.area{text-align:center;position:relative;padding:18px;color:#ffdf9c;font-size:23px;font-weight:800}.rooms{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:22px}
.room{min-height:112px;border:2px solid #ada0c2;border-radius:15px;background:linear-gradient(#655477,#24324e);color:#fff6e4;font-size:25px;box-shadow:0 7px #0d1732}.room small{display:block;font-size:12px}.room.active{border-color:#fff1ab;box-shadow:0 0 30px #ffdc8888;cursor:pointer}.room.active:hover{filter:brightness(1.3);transform:translateY(-3px)}.room:disabled{opacity:.45;cursor:default}.room.done{background:#306256;opacity:.9}
.lantern{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);font-size:44px;animation:bob 2s infinite ease-in-out}@keyframes bob{50%{transform:translate(-50%,-9px)}}
.side{background:linear-gradient(140deg,#fff8e9,#e8e1f4);color:#2c3650;border:3px solid #c6a977;border-radius:21px;padding:19px;min-height:535px}.side h2{margin:2px 0;font-size:24px}.hero{display:flex;align-items:center;gap:12px;background:#fffaf0;border-radius:14px;padding:13px}.hero span{font-size:46px}
.meter{height:12px;border-radius:50px;background:#dbcddc;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#a4e6b0,#369a72)}
.inventory{display:flex;gap:7px;flex-wrap:wrap;padding:9px 0}.inventory span{font-size:12px;background:#fff;border:1px solid #dfcda9;border-radius:9px;padding:6px}.log{padding:12px;background:#fff8ee;border-radius:12px;min-height:75px}
.action{border-radius:12px;padding:10px 14px;border:2px solid #b38d62;background:linear-gradient(#ffe9b0,#ebc678);color:#3b3255;font-weight:800}.action.secondary{background:linear-gradient(#fff,#e3dbf7);border-color:#9b8abb}
.modal{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:15px;background:#071329dc;backdrop-filter:blur(5px)}[hidden]{display:none!important}
.dialog{background:linear-gradient(140deg,#fffaf0,#e8e1f7);color:#293653;border:3px solid #d8bc80;border-radius:22px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:23px;box-shadow:0 25px 70px #0009}.dialog h2{font-size:30px;margin:0;color:#4f3b75}.dialog p{line-height:1.5}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.options button{padding:13px;border:2px solid #ac9cc7;border-radius:12px;background:#fff;color:#253757;font-weight:800}.options button:hover{background:#fff1c9}.options input{grid-column:1/-1;border:2px solid #9f91c0;border-radius:12px;padding:12px;font:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}.feedback{padding:10px;background:#e0f2df;color:#366a4a;border-radius:12px}.feedback.bad{background:#ffeede;color:#926a37}.clock{height:10px;background:#e2dbe6;border-radius:20px;overflow:hidden}.clock i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#7edac0,#f5bc79)}
.classes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.classes button{background:#fff;border:2px solid #cfb9dd;border-radius:12px;padding:10px;font:inherit;color:#483c65}.classes button.selected{background:#fff0b7;border-color:#aa803b}
@media(max-width:700px){.layout{grid-template-columns:1fr}.map,.side{min-height:auto}.rooms{gap:7px;padding:12px}.room{min-height:80px;font-size:21px}.side{padding:13px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><header><a href="../">← Vocabulary</a><b>🏮 HỘI THÁM HIỂM ĐÈN LỒNG</b><button id="help" class="action secondary">? Cách chơi</button></header><h1>🏰 DUNGEON OF WORDS</h1><p class="sub">Lexiconia · Phá Khiên Chữ · Khôi phục Thư Viện Vĩnh Cửu</p><div class="hud"><span id="floor">⛏️ Tầng 1</span><span id="hp">❤️ 100</span><span id="gems">💎 0</span><span id="combo">✨ Combo 0</span><span id="roomCounter">🗝️ Phòng 1 / 9</span></div>
<div class="layout"><section class="map"><div class="area" id="area">🍃 HANG RÊU XANH</div><div class="rooms" id="rooms"></div><div class="lantern">🏮</div></section><aside class="side"><h2>🏕️ Trại Thám Hiểm</h2><div class="hero"><span id="avatar">🛡️</span><div><b id="heroName">Kael · Chiến binh</b><p id="heroAbility">Khiên Từ</p></div></div><b>❤️ Sinh lực</b><div class="meter"><i id="hpMeter"></i></div><h2>🎒 Trang bị</h2><div class="inventory" id="inventory"></div><h2>📜 Nhật ký</h2><p class="log" id="log">Chọn nhân vật để bắt đầu.</p><div class="actions"><button id="switch" class="action secondary">Đổi lớp</button><button id="restart" class="action">Chuyến đi mới</button></div></aside></div></main>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalContent"></div><div class="options" id="options"></div><div class="clock" id="clock" hidden><i id="clockBar"></i></div><div id="feedback"></div><div class="actions" id="modalActions"></div></div></div>
<script>
(function(){"use strict";
const $=id=>document.getElementById(id),sample=[["protect","bảo vệ"],["knowledge","kiến thức"],["progress","tiến bộ"],["sustainable","bền vững"],["environment","môi trường"],["language","ngôn ngữ"],["resource","tài nguyên"],["develop","phát triển"],["community","cộng đồng"],["challenge","thử thách"]].map(p=>({word:p[0],meaning:p[1]}));
let words=[];try{words=JSON.parse(sessionStorage.getItem("DUNGEON_WORDS_WORDS")||"[]")}catch(e){}words=(Array.isArray(words)?words:[]).filter(w=>w&&w.word&&w.meaning);if(words.length<4)words=sample;words=[...new Map(words.map(w=>[String(w.word).toLowerCase(),w])).values()];
const chars=[["🛡️","Kael · Chiến binh",110,"Khiên Từ: combo 3 giúp đỡ một đòn"],["🪄","Lyra · Pháp sư",80,"Tạo Phép: rèn chính tả"],["🏹","Finn · Cung thủ",90,"Tai Thính: luyện nghe"],["🧪","Zuri · Giả kim sư",100,"Pha Chế: hồi máu khi đúng"]];
const icons={battle:"👾",riddle:"📜",treasure:"🎁",camp:"🔥",merchant:"🛒",trap:"🕸️",boss:"🐉"},labels={battle:"Chiến đấu",riddle:"Câu đố",treasure:"Kho báu",camp:"Lửa trại",merchant:"Cửa hàng",trap:"Bẫy",boss:"Boss"};
let s={floor:1,character:0,max:110,hp:110,gems:0,combo:0,room:0,rooms:[],gear:["🏮 Đèn lồng"],missed:[],active:false,completed:0};
try{const o=JSON.parse(localStorage.getItem("DUNGEON_WORDS_PROGRESS")||"null");if(o){s.gems=o.gems||0;s.gear=Array.isArray(o.gear)?o.gear:s.gear;s.missed=Array.isArray(o.missed)?o.missed:[];s.floor=Math.max(1,Math.min(10,o.floor||1))}}catch(e){}
function save(){try{localStorage.setItem("DUNGEON_WORDS_PROGRESS",JSON.stringify({gems:s.gems,gear:s.gear,missed:s.missed.slice(-40),floor:s.floor}))}catch(e){}}
const choose=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5),safe=x=>String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(title,content,buttons){$("modal").hidden=false;$("modalTitle").textContent=title;$("modalContent").innerHTML=content;$("options").innerHTML="";$("feedback").innerHTML="";$("clock").hidden=true;$("modalActions").innerHTML="";(buttons||[]).forEach(b=>{const btn=document.createElement("button");btn.className="action"+(b.secondary?" secondary":"");btn.textContent=b.title;btn.onclick=b.click;$("modalActions").appendChild(btn)});$("modalActions").querySelector("button")?.focus()}
const close=()=>{$("modal").hidden=true},log=t=>{$("log").textContent=t};
function area(){return s.floor<=3?"🍃 HANG RÊU XANH":s.floor<=5?"📚 THƯ VIỆN CHÌM":s.floor<=7?"🔥 LÒ RÈN DUNG NHAM":s.floor<=9?"❄️ PHÁO ĐÀI BĂNG":"👑 NGAI VÀNG QUÊN LÃNG"}
function render(){const c=chars[s.character];$("area").textContent=area();$("floor").textContent="⛏️ Tầng "+s.floor+"/10";$("hp").textContent="❤️ "+Math.max(0,s.hp)+"/"+s.max;$("gems").textContent="💎 "+s.gems;$("combo").textContent="✨ Combo "+s.combo;$("roomCounter").textContent="🗝️ Phòng "+(s.room+1)+"/9";$("avatar").textContent=c[0];$("heroName").textContent=c[1];$("heroAbility").textContent=c[3];$("hpMeter").style.width=Math.max(0,s.hp/s.max*100)+"%";$("inventory").innerHTML=s.gear.slice(-8).map(x=>"<span>"+safe(x)+"</span>").join("");
 $("rooms").innerHTML="";s.rooms.forEach((kind,i)=>{const b=document.createElement("button");b.className="room "+(i<s.room?"done":i===s.room&&s.active?"active":"");b.disabled=i!==s.room||!s.active;b.innerHTML=(i<s.room?"✅":icons[kind])+"<small>"+labels[kind]+"</small>";b.onclick=()=>visit(kind);$("rooms").appendChild(b)})}
function newFloor(){s.rooms=[...shuffle(["battle","riddle","treasure","battle","camp","trap","battle","merchant"]),"boss"];s.room=0;s.active=true;log("Chọn phòng sáng để khám phá. Glim sẽ dẫn đường!");render()}
function run(){s.max=chars[s.character][2];s.hp=s.max;s.combo=0;newFloor()}
function advance(){s.room++;if(s.room>=9){if(s.floor===10){s.active=false;save();show("👑 Thư viện Vĩnh Cửu hồi sinh!","<p>Bạn đã cứu các mảnh chữ ở Lexiconia. Tổng đá quý: "+s.gems+"</p>",[{title:"Chơi lại",click:()=>{close();s.floor=1;run()}}]);render();return}s.floor++;save();newFloor()}else{s.active=true;render();log("Hoàn tất phòng! Chọn phòng kế tiếp.")}}
function hurt(n){if(s.character===0&&s.combo>=3){log("🛡️ Khiên Từ đã chặn đòn!");return true}s.hp-=n;render();if(s.hp>0)return true;s.hp=0;s.active=false;save();show("🏕️ Trở về trại","<p>Hết sinh lực! Bạn vẫn giữ đá quý và trang bị. Những từ sai sẽ xuất hiện lại.</p>",[{title:"Chuyến đi mới",click:()=>{close();s.floor=1;run()}}]);return false}
function word(){return s.missed.length&&Math.random()<.4?choose(s.missed):choose(words)}
function ask(title,w,callback,mode="meaning"){
 const input=mode==="spell";show(title,"<p>"+(input?"Viết từ tiếng Anh mang nghĩa: <b>"+safe(w.meaning)+"</b>":"Chọn nghĩa đúng của <b>“"+safe(w.word)+"”</b>")+" để phá Khiên Chữ.</p>");
 $("clock").hidden=false;const started=performance.now();let done=false;let interval=setInterval(()=>{$("clockBar").style.width=Math.max(4,100-(performance.now()-started)/180)+"%"},150);
 function finish(ok){if(done)return;done=true;clearInterval(interval);$("options").querySelectorAll("button,input").forEach(x=>x.disabled=true);$("clock").hidden=true;if(ok){s.combo++;s.gems+=3}else{s.combo=0;s.missed.push(w)}save();$("feedback").innerHTML='<p class="feedback '+(ok?"":"bad")+'">'+(ok?"✨ Chính xác!":"💡 Đáp án: "+safe(w.word)+" — "+safe(w.meaning))+"</p>";$("modalActions").innerHTML="";const speed=Math.max(.25,1-(performance.now()-started)/18000);setTimeout(()=>{close();callback(ok,speed);render()},700)}
 if(input){const e=document.createElement("input");e.placeholder="Nhập từ tiếng Anh";$("options").appendChild(e);const b=document.createElement("button");b.className="action";b.textContent="✨ Kích hoạt";b.onclick=()=>{if(e.value.trim())finish(e.value.trim().toLowerCase()===String(w.word).toLowerCase())};$("modalActions").appendChild(b);e.onkeydown=k=>{if(k.key==="Enter")b.click()};e.focus()}
 else{shuffle([w,...shuffle(words.filter(x=>x.word!==w.word&&x.meaning!==w.meaning)).slice(0,3)]).forEach(x=>{const b=document.createElement("button");b.textContent=x.meaning;b.onclick=()=>finish(x.word===w.word);$("options").appendChild(b)})}
}
function visit(kind){if(!s.active)return;s.active=false;render();
 if(kind==="battle"||kind==="boss"){let hits=0,total=kind==="boss"?3:2;const fight=()=>ask((kind==="boss"?"🐉 Boss":"👾 Quái vật")+" · Khiên "+(total-hits)+"/"+total,word(),ok=>{if(ok){hits++;if(s.character===3)s.hp=Math.min(s.max,s.hp+6)}else if(!hurt(kind==="boss"?17:10))return;
 if(hits>=total){const earn=kind==="boss"?28:12;s.gems+=earn;save();show("✨ Phá Khiên Chữ thành công!","<p>Quái tan biến. Bạn thu được "+earn+" 💎.</p>",[{title:"Tiếp tục →",click:()=>{close();advance()}}])}
 else show("⚔️ Quái vẫn còn khiên","<p>Còn "+(total-hits)+" lớp Khiên Chữ. Sẵn sàng trả lời tiếp?</p>",[{title:"Tiếp tục →",click:fight}])},hits===0&&s.character===1?"spell":"meaning");fight()}
 else if(kind==="riddle"||kind==="trap"){ask(kind==="riddle"?"📜 Cửa đá cổ":"🕸️ Bẫy chữ",word(),ok=>{if(ok)s.gems+=7;else if(kind==="trap"&&!hurt(12))return;advance()},kind==="riddle"?"spell":"meaning")}
 else if(kind==="treasure"){const prize=choose(["⚔️ Kiếm Từ","🏹 Cung Âm Thanh","🛡️ Giáp Cổ Tự","💍 Nhẫn Tinh Tú","📖 Sách Phép"]);s.gear.push(prize);s.gems+=18;save();show("🎁 Kho báu!","<p>Nhặt được "+prize+" và 18 💎.</p>",[{title:"Nhặt và đi tiếp",click:()=>{close();advance()}}])}
 else if(kind==="merchant"){show("🛒 Thương nhân","<p>Mua thuốc hồi 30 ❤️ bằng 12 💎?</p>",[{title:"Mua thuốc (12 💎)",click:()=>{if(s.gems<12){$("feedback").textContent="Không đủ đá quý";return}s.gems-=12;s.hp=Math.min(s.max,s.hp+30);save();close();advance()}},{title:"Bỏ qua",secondary:true,click:()=>{close();advance()}}])}
 else if(kind==="camp"){show("🔥 Lửa trại","<p>Ôn từ đã sai để hồi 32 ❤️ và nhận 7 💎; hoặc nghỉ để hồi 20 ❤️.</p>",[{title:"📖 Ôn từ",click:()=>{const w=s.missed.length?s.missed[s.missed.length-1]:word();ask("🔥 Ôn tập bên lửa trại",w,ok=>{s.hp=Math.min(s.max,s.hp+(ok?32:20));if(ok){s.gems+=7;s.missed=s.missed.filter(x=>x.word!==w.word)}save();advance()})}},{title:"Nghỉ ngơi",secondary:true,click:()=>{s.hp=Math.min(s.max,s.hp+20);close();advance()}}])}
}
function classes(){show("🏕️ Chọn nhân vật","<p>Giả kim sư mở khi đạt tầng 4.</p><div class='classes' id='charButtons'>"+chars.map((c,i)=>'<button data-i="'+i+'" '+(i===3&&s.floor<4?"disabled":"")+">"+c[0]+" "+safe(c[1])+"<br><small>"+safe(c[3])+"</small></button>").join("")+"</div>",[{title:"Bắt đầu thám hiểm →",click:()=>{close();run()}}]);$("charButtons").querySelectorAll("button").forEach(b=>b.onclick=()=>{s.character=Number(b.dataset.i);$("charButtons").querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));render()})}
function tutorial(){show("📖 Hướng dẫn Dungeon of Words","<ol><li>Chọn một trong các lớp nhân vật, mỗi lớp có kỹ năng khác nhau.</li><li>Chạm phòng <b>đang phát sáng</b> để khám phá mê cung.</li><li>Trả lời đúng câu hỏi từ vựng để phá Khiên Chữ và đánh quái. Trả lời nhanh để tăng sức mạnh.</li><li>Nhặt trang bị, mở kho báu, mua thuốc và ôn từ sai ở lửa trại.</li><li>Đánh bại boss, vượt 10 tầng. Thất bại vẫn giữ được đá quý và trang bị.</li></ol>",[{title:"Chọn nhân vật →",click:classes}])}
$("help").onclick=tutorial;$("switch").onclick=classes;$("restart").onclick=()=>show("Chuyến đi mới?","<p>Tiến độ tầng hiện tại sẽ bắt đầu lại, nhưng giữ trang bị và đá quý.</p>",[{title:"Xác nhận",click:()=>{close();s.floor=1;run()}},{title:"Hủy",secondary:true,click:close}]);
s.rooms=["battle","riddle","treasure","camp","battle","trap","merchant","battle","boss"];render();tutorial();
})();
</script></body></html>
