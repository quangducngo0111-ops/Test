<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Game học từ vựng tiếng Anh 3D bằng Three.js" />
  <title>Vocabulary Racer 3D</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- Three.js tải trực tiếp qua CDN. Bản UMD này chạy được cả khi mở index.html trực tiếp. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
</head>
<body>
  <div id="game-shell">
    <div id="game-container" aria-label="Vocabulary Racer 3D"></div>

    <header class="hud">
      <div class="hud-card target-card">
        <span class="hud-label">TỪ MỤC TIÊU</span>
        <strong id="target-word">Loading...</strong>
        <span class="hint">← / → để đổi làn</span>
      </div>

      <div class="hud-row">
        <div class="hud-card mini">
          <span class="hud-label">ĐIỂM</span>
          <strong id="score">0</strong>
        </div>
        <div class="hud-card mini">
          <span class="hud-label">MẠNG</span>
          <strong id="lives">❤️❤️❤️</strong>
        </div>
        <div class="hud-card mini">
          <span class="hud-label">TỐC ĐỘ</span>
          <strong id="speed">0</strong>
        </div>
        <div class="hud-card mini">
          <span class="hud-label">COMBO</span>
          <strong id="combo">x0</strong>
        </div>
      </div>
    </header>

    <div id="feedback" class="feedback" aria-live="polite"></div>

    <div class="mobile-controls">
      <button id="left-btn" type="button" aria-label="Chuyển sang làn trái">←</button>
      <button id="right-btn" type="button" aria-label="Chuyển sang làn phải">→</button>
    </div>

    <section id="start-screen" class="modal-screen">
      <div class="modal-card">
        <div class="eyebrow">THREE.JS VOCABULARY GAME</div>
        <h1>🏎️ Vocabulary Racer 3D</h1>
        <p>
          Xe tự động lao về phía trước. Hãy đổi sang làn có
          <strong>nghĩa đúng</strong> trước khi đi qua cổng từ vựng.
        </p>
        <div class="instruction-grid">
          <div><b>← →</b><span>Đổi làn</span></div>
          <div><b>✅</b><span>Đúng: + điểm & boost</span></div>
          <div><b>💥</b><span>Sai: mất 1 mạng</span></div>
        </div>
        <button id="start-btn" class="primary-btn" type="button">BẮT ĐẦU ĐUA</button>
      </div>
    </section>

    <section id="game-over-screen" class="modal-screen hidden">
      <div class="modal-card">
        <div class="eyebrow">KẾT QUẢ</div>
        <h2 id="game-over-title">Game Over</h2>
        <p id="final-summary"></p>
        <button id="restart-btn" class="primary-btn" type="button">CHƠI LẠI</button>
      </div>
    </section>
  </div>

  <script src="./game.js"></script>
</body>
</html>
