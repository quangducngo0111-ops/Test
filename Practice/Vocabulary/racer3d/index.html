<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Vocabulary Racer 3D</title>

  <link
    rel="stylesheet"
    href="./style.css?v=3"
  >

  <!-- Three.js -->
  <script
    src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"
  ></script>
</head>

<body>

<div id="game-shell">

  <!-- Three.js -->
  <div id="game-container"></div>


  <!-- HUD -->
  <header class="hud">

    <div class="target-card">
      <span>TỪ MỤC TIÊU</span>

      <strong id="target-word">
        Ready
      </strong>

      <small>
        ← / → để đổi làn
      </small>
    </div>


    <div class="hud-row">

      <div class="hud-box">
        <span>ĐIỂM</span>
        <b id="score">0</b>
      </div>

      <div class="hud-box">
        <span>MẠNG</span>
        <b id="lives">❤️❤️❤️</b>
      </div>

      <div class="hud-box">
        <span>TỐC ĐỘ</span>
        <b id="speed">0 km/h</b>
      </div>

      <div class="hud-box">
        <span>COMBO</span>
        <b id="combo">x0</b>
      </div>

    </div>

  </header>


  <!-- Feedback -->
  <div
    id="feedback"
    class="feedback"
  ></div>


  <!-- Mobile -->
  <div class="mobile-controls">

    <button
      id="left-btn"
      type="button"
    >
      ←
    </button>

    <button
      id="right-btn"
      type="button"
    >
      →
    </button>

  </div>


  <!-- Start screen -->
  <section
    id="start-screen"
    class="modal-screen"
  >

    <div class="modal-card">

      <div class="eyebrow">
        THREE.JS VOCABULARY GAME
      </div>

      <h1>
        🏎️ Vocabulary Racer 3D
      </h1>

      <p>
        Bạn đang ngồi trong xe đua.
        Hãy chuyển sang làn có
        <strong>nghĩa đúng</strong>
        trước khi xe lao qua cổng từ vựng.
      </p>


      <div class="instruction-grid">

        <div>
          <b>← →</b>
          <span>Đổi làn</span>
        </div>

        <div>
          <b>✅</b>
          <span>Đúng: Boost</span>
        </div>

        <div>
          <b>💥</b>
          <span>Sai: mất mạng</span>
        </div>

      </div>


      <button
        id="start-btn"
        class="primary-btn"
        type="button"
      >
        BẮT ĐẦU ĐUA
      </button>

    </div>

  </section>


  <!-- Game over -->
  <section
    id="game-over-screen"
    class="modal-screen hidden"
  >

    <div class="modal-card">

      <div class="eyebrow">
        KẾT QUẢ
      </div>

      <h2 id="game-over-title">
        GAME OVER
      </h2>

      <p id="final-summary"></p>

      <button
        id="restart-btn"
        class="primary-btn"
        type="button"
      >
        CHƠI LẠI
      </button>

    </div>

  </section>

</div>


<script src="./game.js?v=3"></script>

</body>
</html>
