<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Street Word Racer 3D</title>

  <link
    rel="stylesheet"
    href="./style.css"
  />
</head>

<body>

  <main id="game">

    <!-- =========================
         HUD
    ========================== -->
    <section id="hud">

      <div class="target-box">
        <span class="hud-label">
          TỪ MỤC TIÊU
        </span>

        <strong id="targetWord">
          —
        </strong>
      </div>


      <div class="hud-stats">

        <div class="stat">
          <span>Điểm</span>
          <b id="score">0</b>
        </div>

        <div class="stat">
          <span>Mạng</span>
          <b id="lives">5</b>
        </div>

        <div class="stat">
          <span>Combo</span>
          <b id="combo">x0</b>
        </div>

        <div class="stat">
          <span>Tốc độ</span>
          <b id="speed">100</b>
        </div>

      </div>

    </section>


    <!-- Thông báo đúng / sai -->
    <div
      id="message"
      aria-live="polite"
    ></div>


    <!-- Báo lỗi nếu Three.js / WebGL lỗi -->
    <div
      id="bootError"
      class="boot-error hidden"
    ></div>


    <!-- Điều khiển mobile -->
    <section id="controls">

      <button
        id="leftBtn"
        type="button"
        aria-label="Sang trái"
      >
        ←
      </button>

      <div class="control-hint">
        ← / → đổi làn
      </div>

      <button
        id="rightBtn"
        type="button"
        aria-label="Sang phải"
      >
        →
      </button>

    </section>


    <!-- Game over -->
    <section
      id="gameOver"
      class="modal hidden"
    >

      <div class="modal-card">

        <h2>
          Kết thúc lượt đua
        </h2>

        <p id="gameOverText"></p>

        <button
          id="restartBtn"
          type="button"
        >
          Chơi lại
        </button>

      </div>

    </section>

  </main>


  <!--
    Three.js dạng global THREE.
    Dùng r159 để tránh vấn đề compatibility của một số build mới hơn.
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"
  ></script>

  <script src="./game.js"></script>

</body>
</html>
