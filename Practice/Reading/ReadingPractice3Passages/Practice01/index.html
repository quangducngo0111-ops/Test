kground:white;color:#211b35}select:focus,input:focus{outline:2px solid #b3a1fa}.feedback{margin-top:9px;padding:10px;border-radius:9px;font-size:12px;background:#f5f5fb}.good{color:var(--green)}.bad{color:var(--red)}.btn{border:1px solid var(--purple);background:var(--purple);color:white;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.secondary{color:var(--purple);background:white}.btn:hover{filter:brightness(.96)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.summary{background:#f3f0ff;border:1px solid #d9cfff;padding:15px;border-radius:12px;margin:13px 0}.reference{font-size:12px;background:#faf9ff;border:1px solid #e0dafa;padding:12px;border-radius:9px;margin:14px 0}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav a{font-size:11px;color:var(--purple);border:1px solid #d8cef4;text-decoration:none;border-radius:8px;padding:7px 9px}.nav a.active{background:#6945d9;color:white}.pill{font-size:12px;color:#6b518f;background:#f3eeff;border-radius:999px;padding:4px 10px}.small{font-size:11px;color:var(--muted)}@media(max-width:950px){.workspace{grid-template-columns:1fr}.reading{position:static;max-height:460px}.top{padding:9px}}

</style></head><body><header class="top"><a href="../../">← Reading · 3 Passages</a><strong>📖 IELTS Reading · Practice 01</strong><span id="student"></span></header><main class="page"><section class="hero"><h1>Reading Practice 01</h1><p>3 passages · Questions 1–40 · Tự lưu bài làm và chấm theo từng nhóm câu.</p></section><div class="lesson-tabs" id="passTabs"></div><div class="workspace"><div id="passageHost"></div><section class="card"><div id="questionHost"></div><div class="scoreboard" id="totalScore"></div></section></div></main><script>
const PASSAGES = [{"article": "<article class=\"card reading\" id=\"readingPanel\"><span class=\"eyebrow\">Bài đọc</span><p><em><strong>You should spend about 20 minutes on Questions 1-13, which are based on Reading Passage 1 below.</strong></em></p>\n<h2><strong>Ambergris - what is it and where does it come from?</strong></h2>\n<p><strong>In the ancient world, the waxy, grey substance we now refer to as ambergris was highly prized for its medicinal properties and was widely used as a spice, which was believed to be an aphrodisiac when added to food or wine. Ambergris itself is pleasantly aromatic, especially when warmed, and it was also highly valued as a fixing agent in the making of perfume, since it enabled a scent to retain its fragrance for much longer than might otherwise have been possible. Most ambergris was found in the form of lumps floating on the surface of the sea or washed up on the shores of tropical and temperate oceans. At one time, ambergris was worth its weight in gold, but there was much confusion about its origins.</strong></p>\n<p><strong>Ambergris was known to the Arabs as ‘anbar’ and was originally called amber in the West in the Middle Ages. This eventually led to further confusion in the popular mind between ambergris and true amber, the mineral known to mineralogists as succinite, which is actually fossilised tree resin, and generally yellow in colour. Both substances were rare and costly, and both were associated with the sea, largely because for Europeans, the most common source of amber was the shores of the Baltic. In Chapter 92 of Moby Dick, the American writer Herman Melville pours scorn on those who believed the two substances to be the same: ‘Though the word ambergris is the French compound for grey amber, yet the two substances are quite distinct. For amber, though at times found on the seacoast, is also dug up in some far inland soils, whereas ambergris is never found except upon the sea. Besides, amber is a hard, transparent, brittle, odorless substance, used for mouth-pieces to pipes, for beads and ornaments; but ambergris is soft, waxy, and so highly fragrant that it is largely used in perfumery.’</strong></p>\n<p><strong>Moby Dick was published in 1851, by which time the mystery of the origins of ambergris had been resolved by the scientific community. In 1783, the botanist Joseph Banks, who had accompanied Captain James Cook on his voyages of discovery in the Pacific, presented a paper to the Royal Society of London by the German physician Dr. Franz Xavier Schwediawer in which it was conclusively proved that ambergris came from sperm whales. In this, he was confirming an observation made in the 13th century by the great Venetian traveller Marco Polo, who, while on the island of Socotra in the Indian Ocean, had witnessed a sperm whale vomiting up ambergris. But whereas Marco Polo imagined that the whale had swallowed the lump in the depths of the sea, Schwediawer showed that the origin of the material was inside the whale itself.</strong></p>\n<p><strong>The sperm whale is the largest of the odontocetes, or toothed whales. Males can grow up to 20 meters in length. Melville described the sperm whale as ‘the king of whales’, and his novel Moby Dick is based on the pursuit of one such creature. Sperm whales are renowned for their ability to dive to great depths, possibly a far 3, 000 metres below the surface, and for remaining underwater for periods of two hours or more in pursuit of their favourite prey, the giant squid.</strong></p>\n<p><strong>It is from the problems the whales have in digesting the beaks of such creatures that ambergris has its origins. The beak is sharp and irritates the lower intestine, which responds by producing a black, foul-smelling liquid. It is not clear to scientists whether this secretion should be considered a normal response by the whale’s digestive system or a pathological one, but from time to time large quantities of the liquid are vomited up by the whale. Once outside the whale’s body and exposed to air, the substance hardens, acquiring the waxy, greyish and pleasantly aromatic characteristics of ambergris. Often, the beaks of squid are still found embedded in lumps of ambergris, some of which can weigh several hundred kilograms. Melville took some delight in contrasting the origins of ambergris with the high value placed upon it by refined society: „ Who would think, then, that such fine ladies and gentlemen should regale themselves with an essence found in the inglorious bowels of a sick whale!‟</strong></p>\n<p><strong>Sperm whales were ruthlessly pursued by commercial whalers in the 19th and 20th centuries. In 1963-64 alone, almost 30,000 individuals were killed, and only the imposition of a ban on the hunting of sperm whales in 1984 saved the species from extinction. Ambergris was by far the most valuable product to be extracted during the processing of</strong></p>\n<p><strong>the whales' carcasses, and over 90 per cent of the annual worldwide total was acquired in this way, as a by-product of commercial whaling. However, even before the ban on hunting sperm whales was imposed, the 1972 Marine Mammal Protection Act had prohibited trade in ambergris. Just as petroleum and plastic products were replacing other natural products of whaling, so ambergris was supplanted in the making of perfume by other materials, some natural and some synthetic in origin. Nevertheless, it is possible that, as sperm whale populations recover to their former numbers in the wild, so the sight of lumps of ambergris washed ashore along the tide line will once again become a familiar one to beachcombers the world over.</strong></p>\n</article>", "data": {"passage": 1, "title": "Ambergris – what is it and where does it come from?", "q": [{"n": 1, "text": "very expensive", "answer": "C", "accepted": ["C"]}, {"n": 2, "text": "a food flavouring", "answer": "A", "accepted": ["A"]}, {"n": 3, "text": "used as currency", "answer": "D", "accepted": ["D"]}, {"n": 4, "text": "sweet-smelling", "answer": "A", "accepted": ["A"]}, {"n": 5, "text": "referred to by Herman Melville", "answer": "C", "accepted": ["C"]}, {"n": 6, "text": "can be seen through", "answer": "B", "accepted": ["B"]}, {"n": 7, "text": "Ambergris is formed in whales because of problems digesting the _____ of giant squid.", "answer": "beaks", "accepted": ["beaks"]}, {"n": 8, "text": "Black liquid is produced and is _____ from time to time.", "answer": "vomited up", "accepted": ["vomited", "vomited up"]}, {"n": 9, "text": "The liquid _____ on contact with the air.", "answer": "hardens", "accepted": ["hardens"]}, {"n": 10, "text": "In the 20th century, most of the world's ambergris came from processing dead whales.", "answer": "TRUE", "accepted": ["TRUE"]}, {"n": 11, "text": "The value of ambergris has increased recently.", "answer": "NOT GIVEN", "accepted": ["NOT GIVEN"]}, {"n": 12, "text": "Ambergris remains an important ingredient in perfume.", "answer": "FALSE", "accepted": ["FALSE"]}, {"n": 13, "text": "New uses have recently been found for ambergris.", "answer": "NOT GIVEN", "accepted": ["NOT GIVEN"]}], "groups": [{"start": 1, "end": 6, "type": "classify", "title": "Questions 1–6 · Classify the facts", "instruction": "A — ambergris only; B — amber only; C — both; D — neither.", "options": ["A", "B", "C", "D"]}, {"start": 7, "end": 9, "type": "fill", "title": "Questions 7–9 · Flow-chart completion", "instruction": "NO MORE THAN TWO WORDS from the passage.", "options": null}, {"start": 10, "end": 13, "type": "tfn", "title": "Questions 10–13 · True / False / Not Given", "instruction": "Choose TRUE, FALSE or NOT GIVEN.", "options": ["TRUE", "FALSE", "NOT GIVEN"]}]}}, {"article": "<article class=\"card reading\" id=\"readingPanel\"><span class=\"eyebrow\">Bài đọc</span><p><em><strong>You should spend about 20 minutes on Questions 14–26, which are based on Reading Passage 2 below.</strong></em></p>\n<h2><strong>PHOTOGRAPHY</strong></h2>\n<p><em><strong>Photography emerged as part of a cluster of technical inventions</strong></em><strong> <em>and innovations around the middle of the nineteenth century.</em> <em>Hailed as a great technological invention, it immediately became</em> <em>the subject of debates concerning its</em> <em>aesthetic status and social</em> <em>uses.</em></strong></p>\n<p><strong>A</strong></p>\n<p><strong>Central to the nineteenth-century debate about the nature of photography as a new technology was the question of how far it could be considered as art. It was celebrated for its putative ability to produce accurate images of what was in front of the camera's lens: images which were seen as being mechanically produced and thus free of the selective discriminations of the human eye and hand. On precisely the same grounds, the medium was often regarded as falling outside the realm of art as its assumed power of accurate, dispassionate recording appeared to leave no room for the artist's compositional creativity.</strong></p>\n<p><strong>B</strong></p>\n<p><strong>Debates concerning the status of photography as art continued to take place in periodicals throughout the nineteenth century. The French poet Baudelaire linked ‘the invasion of photography and the great industrial madness of today’ and asserted that if photography is allowed to deputise for art in some of its activities, it will not be long before it has supplanted or corrupted art altogether. In his view, photography’s only function was to support intellectual enquiry.</strong></p>\n<p><strong>C</strong></p>\n<p><strong>Baudelaire was not alone in this view. Absolute material accuracy was seen as the hallmark of photography, and the nineteenth-century desire to explore, record and catalogue human experience, both at home and overseas, encouraged people to emphasise photography as a method of naturalistic documentation, rather than any type of art form.</strong></p>\n<p><strong>D</strong></p>\n<p><strong>Photographers responded to criticisms of this kind in two ways: either they accepted that photography was something different from art and sought to discover what the intrinsic properties of the medium were, or they pointed out that photography was more than a mechanical form of image-making, that it could be worked on and contrived so as to produce pictures which in some ways resembled paintings. ‘Pictorial’ photography from the 1850s onwards sought to overcome the problems of photography by careful arrangement of all the elements of the composition and by reducing the signifiers of technological production within the photograph. For example, they ensured that the image was somewhat blurred: they made pictures of allegorical subjects, including religious scenes, and those who worked with the gum bichromate process scratched their prints in an effort to imitate something of the appearance of a canvas.</strong></p>\n<p><strong>E</strong></p>\n<p><strong>In the other camp were those photographers who celebrated the qualities of straight photo-graphy (with an emphasis upon direct documentary typical of the Modern period in American photography) and did not want to treat the medium as a kind of monochrome painting. They were interested in photography's ability to provide apparently accurate records of the visual world and tried to give their images the formal status and finish of paintings while concentrating their attention on its intrinsic quality.</strong></p>\n<p><strong>F</strong></p>\n<p><strong>Photography in Britain and France was initially heralded for its technical recording abilities. With few exceptions, the emphasis was on picture-taking rather than picture-making – to echo a distinction made by Margaret Harker. She suggests that the development of the art of photography in the late 1850s can be partly accounted for through the increasing involvement of people trained as artists. They brought with them a concern for form and composition and, in particular, the use of light. Photography came to encroach very directly on genres of painting such as portraiture, not only taking over some of the work of painters, but also extending their work. For instance, while few could afford the time and cost of sitting for a painted portrait, the studio photographer could offer a similar service more cheaply. As such, portraiture became more democratically available. This did not prevent a continuing hierarchy: the painted portrait was still commissioned by the wealthy and the aristocracy. But it did allow a greater number of people the status of seeing themselves pictured.</strong></p>\n<p><strong>G</strong></p>\n<p><strong>Furthermore, photography provoked artists to re-examine the nature and potential of paint as a particular medium. Photography appeared to be more successful than painting in capturing likenesses. It had a sense of instantaneousness that painting lacked. It has been suggested that photography encouraged Impressionist painters to experiment with manners of painting which could also capture a sense of the moment, and the passage of light. It is a truism that photography released painting from its responsibility for literal depiction, allowing it to become more experimental. However, the developing relationship between the two was considerably more symbiotic.</strong></p>\n<p><strong>H</strong></p>\n<p><strong>Another respect in which photography may be said to have extended art was in its role as the re-presenter of art objects, It was no longer necessary to travel to Florence to see paintings of the Medici, or to Egypt to contemplate classical architecture or artefacts; you could visit an exhibition and view reproductions.</strong></p>\n</article>", "data": {"passage": 2, "title": "Photography", "q": [{"n": 14, "text": "fears voiced about the potential threat posed to art by photography", "answer": "B", "accepted": ["B"]}, {"n": 15, "text": "the skills of artists being used in photography", "answer": "F", "accepted": ["F"]}, {"n": 16, "text": "the attempts of photographers to imitate art", "answer": "D", "accepted": ["D"]}, {"n": 17, "text": "the influence of photography on artists and painting", "answer": "G", "accepted": ["G"]}, {"n": 18, "text": "Some photographers wanted photographs to resemble _____.", "answer": "paintings", "accepted": ["paintings"]}, {"n": 19, "text": "They arranged the different elements of the _____ before taking a photograph.", "answer": "composition", "accepted": ["composition"]}, {"n": 20, "text": "They made some images slightly _____.", "answer": "blurred", "accepted": ["blurred"]}, {"n": 21, "text": "Some photographers _____ their prints to resemble canvas.", "answer": "scratched", "accepted": ["scratched"]}, {"n": 22, "text": "Others objected to the idea that photography was a form of _____ painting.", "answer": "monochrome", "accepted": ["monochrome"]}, {"n": 23, "text": "In the 1850s, trained artists were reluctant to take up photography.", "answer": "FALSE", "accepted": ["FALSE"]}, {"n": 24, "text": "Many photographers felt the need to learn certain techniques from taking art courses.", "answer": "NOT GIVEN", "accepted": ["NOT GIVEN"]}, {"n": 25, "text": "Photography brought the demand for portrait painting to an end.", "answer": "FALSE", "accepted": ["FALSE"]}, {"n": 26, "text": "With the advent of photography, some painters no longer concerned themselves with accuracy.", "answer": "TRUE", "accepted": ["TRUE"]}], "groups": [{"start": 14, "end": 17, "type": "paragraph", "title": "Questions 14–17 · Matching information", "instruction": "Choose the paragraph A–H.", "options": ["A", "B", "C", "D", "E", "F", "G", "H"]}, {"start": 18, "end": 22, "type": "fill", "title": "Questions 18–22 · Summary completion", "instruction": "ONE WORD ONLY from paragraphs D and E.", "options": null}, {"start": 23, "end": 26, "type": "tfn", "title": "Questions 23–26 · True / False / Not Given", "instruction": "Choose TRUE, FALSE or NOT GIVEN.", "options": ["TRUE", "FALSE", "NOT GIVEN"]}]}}, {"article": "<article class=\"card reading\" id=\"readingPanel\"><span class=\"eyebrow\">Bài đọc</span><p><em><strong>You should spend about 20 minutes on Questions 27–40, which are based on Reading Passage 3 below.</strong></em></p>\n<h2><strong>The long view</strong></h2>\n<p><em><strong>Climate change, moon bases, cybercrime we all know the predictions, but how are they</strong></em><strong> <em>made? One expert explains the science of futurology</em></strong></p>\n<p><strong>The business of predicting the future has a long history. Several millennia ago in ancient Greece, people would consult Apollo, the god of prophecy, to learn if fortune favoured their chosen course of action. The tradition has changed considerably since then. Today, futurology is a science that drives a thriving business – its three main consumers being the military, big business, and national governments. Modern futurists do not predict that a certain event will occur at a particular time. Instead, they look at what is happening now to see what this may lead to further down the line. Alternatively, they start with a desired result and work out how people and organisations can be manoeuvred into realizing that ambition.</strong></p>\n<p><strong>The oil company Shell has been one of the major producers of future studies. It recently published a comprehensive study looking at how people may live in 2020 and 2050, given the type of energy which is purchased. Philip Watts from Shell says, “This is not an exercise in prophecy. Rather, it is designed to challenge our thinking so that we can make better choices in today’s business world.”</strong></p>\n<p><strong>The short-term attitudes and bureaucracy of many governments can be frustrating to futurists, but this mutual wariness is slowly changing. The Scottish Parliament recently hosted a conference of 150 futurists from across the globe. The parliament is setting up a forum to look at where Scotland is heading in the next 20 years. Among the issues are demographics and economic competition within Europe and with Asia. It’s a first for the United Kingdom, although not for Europe - this strategy has already been put into practice in Finland.</strong></p>\n<p><strong>Eamonn Kelly, head of the San Francisco-based Global Business Network futurist group, was one of those who attended the conference. According to Kelly, “There are many different tools a futurist can employ but essentially there are three main ingredients. First, there is the “science”, which can encompass everything from environmental studies to psychology. Then, there is the “craft”, which may include interviews and the creation of maps of cause and effect. Finally, there is the “art”, the intuitive ability to meld all this into a coherent whole.</strong></p>\n<p><strong>Dr James Canton is the founder of the San Francisco-based Institute for Global Futures and has been an adviser to leading US companies. Like many futurists, he started in the private sector but is also comfortable in academia and has an urge to change things for the better. “A futurist is an alchemist who mixes the qualitative,” he says. He needs</strong></p>\n<p><strong>intuition and has to work with people from a range of academic backgrounds, gathering primary evidence about what motivates people. Futurists are constantly discussing ideas with their peers, but they do not simply surf the net picking up on the latest fad.</strong></p>\n<p><strong>New Zealand futurist Robin Gunston says, “I don't believe you can train yourself to become a futurist. A certain amount of this is to do with how your brain is hard-wired, and we know this is difficult to change. Futurology requires extensive life experience and a broad education to test theories against. Much of modern teenage culture is about me, what I want, and what the world owes me – that does not make it easy to see different kinds of futures and pose the hard questions about how we will get there.”</strong></p>\n<p><strong>Those best able to respond to futurists are the most agile. “Large corporations beholden to shareholders and governments burdened by bureaucracy are often simply too slow. Asian companies tend to be better prepared because they take a longer perspective. Sony, for example, is very forward-looking,” Canton says. “There will be sunset and sunrise nations and corporations, in terms of prosperity in the 21st century. The winners will be those corporations and governments which conduct future studies and take steps to become future-proofed.”</strong></p>\n<p><strong>According to Alan Beckley, a former West Mercia chief inspector and past president of the Police Futurists International (PFI), getting public bodies in the UK future-proofed could be a long process. “People are concerned about the methodology and the reliability of future studies,‟ he says. They are more likely to follow their political masters than go to them and say. “We have done this scenario, and this is what we should do”. However, as the Scottish Parliament has shown, there are a few examples of government exercises. Also, in 2003, Britain’s Foreign and Commonwealth Office (FCO) published for the first time its strategic thinking for the next decade. This document was drawn up with the help of in-house and outside futurists. FCO minister Bill Rammell says,” We do occasionally look further ahead than the next ten years on issues such as demographics. But the period chosen for the strategy was deliberately a decade. Even assumptions about technology get very shaky beyond that.</strong></p>\n<p><strong>American futurist Steve Brant stresses the importance of remembering that the road ahead has yet to be chosen. “People can create the future they want using various points of leverage,” he says. “We have much more influence over what the future will be like than many of us realise”. Futurists used to be like firefighters – they tried to work out what to do if things went wrong. Now, the aim of this profession is to imagine the best possible future for society and start creating it today.</strong></p>\n</article>", "data": {"passage": 3, "title": "The long view", "q": [{"n": 27, "text": "Flexible organisations are in a better position to make use of futurology.", "answer": "B", "accepted": ["B"]}, {"n": 28, "text": "Predictions about any period beyond the next ten years cannot be trusted.", "answer": "E", "accepted": ["E"]}, {"n": 29, "text": "Only certain people are suited to becoming futurists.", "answer": "C", "accepted": ["C"]}, {"n": 30, "text": "Future studies are designed to inform current commercial decisions.", "answer": "A", "accepted": ["A"]}, {"n": 31, "text": "Futurology involves a broad exchange of information, but is not influenced by every new idea.", "answer": "B", "accepted": ["B"]}, {"n": 32, "text": "People are not aware of the extent to which they can determine the future.", "answer": "F", "accepted": ["F"]}, {"n": 33, "text": "A lack of confidence in futurology affects how widely it is used.", "answer": "D", "accepted": ["D"]}, {"n": 34, "text": "A report by Shell considered the impact of various kinds of _____ on future lifestyles.", "answer": "energy", "accepted": ["energy"]}, {"n": 35, "text": "The Scottish Parliament has decided to use futurists to advise on _____ from Asian and other European countries.", "answer": "economic competition", "accepted": ["economic competition"]}, {"n": 36, "text": "Dr James Canton is similar to other futurists in that he began his career in the _____.", "answer": "private sector", "accepted": ["private sector"]}, {"n": 37, "text": "Britain’s FCO sometimes studies developments in areas like _____ beyond 10 years.", "answer": "demographics", "accepted": ["demographics"]}, {"n": 38, "text": "Choose a statement that is true according to the passage. (Select one of the three correct letters.)", "answer": "A", "accepted": ["A"]}, {"n": 39, "text": "Choose another true statement. (Select one of the remaining correct letters.)", "answer": "D", "accepted": ["D"]}, {"n": 40, "text": "Choose the last true statement.", "answer": "G", "accepted": ["G"]}], "groups": [{"start": 27, "end": 33, "type": "people", "title": "Questions 27–33 · Matching people", "instruction": "A Philip Watts · B Dr James Canton · C Robin Gunston · D Alan Beckley · E Bill Rammell · F Steve Brant. Letters may repeat.", "options": ["A", "B", "C", "D", "E", "F"]}, {"start": 34, "end": 37, "type": "fill", "title": "Questions 34–37 · Sentence completion", "instruction": "NO MORE THAN TWO WORDS from the passage.", "options": null}, {"start": 38, "end": 40, "type": "multiselect", "title": "Questions 38–40 · Choose THREE letters", "instruction": "Choose THREE different letters A–G. Order does not matter.", "options": ["A", "B", "C", "D", "E", "F", "G"]}]}}];

const state=(()=>{try{return {...{active:0,answers:{},graded:{}},...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {active:0,answers:{},graded:{}}}})();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normal=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!?,;:]+$/g,'');
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn(e)}}
function right(q,a){if(q.n>=38&&q.n<=40)return ['A','D','G'].includes(String(a).toUpperCase());return (q.accepted||[q.answer]).some(v=>normal(v)===normal(a))}
function groupMark(p,g){const items=p.q.filter(x=>x.n>=g.start&&x.n<=g.end);if(g.type==='multiselect'){const selected=items.map(x=>String(state.answers[x.n]||'').toUpperCase());return selected.length===3&&new Set(selected).size===3&&selected.every(x=>['A','D','G'].includes(x))?3:0}return items.filter(q=>right(q,state.answers[q.n])).length}
function tabs(){ $('passTabs').innerHTML=PASSAGES.map((p,i)=>`<button type="button" class="${state.active===i?'active':''}" data-pass="${i}">Passage ${i+1} · ${p.data.q.length} câu</button>`).join('');document.querySelectorAll('[data-pass]').forEach(b=>b.onclick=()=>{state.active=Number(b.dataset.pass);persist();render();window.scrollTo({top:0,behavior:'smooth'})})}
function render(){tabs();const d=PASSAGES[state.active].data;$('passageHost').innerHTML=PASSAGES[state.active].article;$('questionHost').innerHTML=`<span class="eyebrow">Passage ${state.active+1} · Questions ${d.q[0].n}–${d.q.at(-1).n}</span><h2>${esc(d.title)}</h2><p class="small-muted">Chọn hoặc nhập đáp án. Nhấn “Kiểm tra nhóm” để xem kết quả và đáp án mẫu.</p>`+d.groups.map(g=>{
 const qs=d.q.filter(q=>q.n>=g.start&&q.n<=g.end);
 return `<section class="group"><h3>${esc(g.title||`Questions ${g.start}–${g.end}`)}</h3><p class="small-muted">${esc(g.instruction||'')}</p>`+qs.map(q=>{const opts=g.options||q.options||[];const a=state.answers[q.n]||'';const isChoice=Array.isArray(opts)&&opts.length>0;
 const input=isChoice?opts.map(opt=>`<label class="answer-choice"><input type="radio" name="q${q.n}" data-num="${q.n}" value="${esc(opt)}" ${normal(a)===normal(opt)?'checked':''}>${esc(opt)}</label>`).join(''):`<input type="text" data-num="${q.n}" placeholder="Nhập đáp án câu ${q.n}" value="${esc(a)}" autocomplete="off">`;
 const done=!!state.graded[g.start];const success=right(q,a);return `<div class="quiz-line"><strong>${q.n}. ${esc(q.text)}</strong><div>${input}</div>${done?`<div class="result ${success?'correct':'incorrect'}">${success?'✓ Đúng':'✗ Chưa đúng'} · Đáp án: <b>${esc(q.answer)}</b></div>`:''}</div>`}).join('')+`<div style="margin-top:12px"><button type="button" class="action-btn" data-grade="${g.start}">Kiểm tra nhóm ${g.start}–${g.end}</button>${state.graded[g.start]?`<span class="small-muted"> · ${groupMark(d,g)}/${qs.length} câu đúng</span>`:''}</div></section>`}).join('');
 document.querySelectorAll('[data-num]').forEach(el=>{const event=el.type==='text'?'input':'change';el.addEventListener(event,()=>{state.answers[el.dataset.num]=el.value;persist()})});document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{state.graded[b.dataset.grade]=true;persist();render();document.querySelector(`[data-grade="${b.dataset.grade}"]`)?.scrollIntoView({block:'center'})});showSummary()}
function showSummary(){let completed=0,total=0,correct=0;for(const p of PASSAGES){for(const g of p.data.groups){const qs=p.data.q.filter(q=>q.n>=g.start&&q.n<=g.end);total+=qs.length;if(state.graded[g.start]){completed+=qs.length;correct+=groupMark(p.data,g)}}}const done=completed===total;$('totalScore').innerHTML=`<strong>${done?'Kết quả toàn bài':'Tiến độ kiểm tra'}</strong><div style="font-size:22px;font-weight:900;color:#281260">${done?correct+'/'+total:completed+'/'+total+' câu đã kiểm tra'}</div><p class="small-muted">${done?'Đã kiểm tra toàn bộ 40 câu.':'Kiểm tra hết các nhóm ở cả 3 Passage để hiện tổng điểm /40.'}</p>`}
render();
</script></body></html>
