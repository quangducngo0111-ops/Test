<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  http-equiv="Cache-Control"
  content="no-cache, no-store, must-revalidate"
>

<title>Reading Passage 2</title>


<style>

:root{
  --ink:#172033;
  --muted:#6f7890;
  --line:#e3e7ef;
  --bg:#f5f7fb;
  --purple:#281260;
  --purple-main:#6257e6;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    "Segoe UI",
    Arial,
    sans-serif;

  color:var(--ink);

  background:
    radial-gradient(
      circle at 8% 0%,
      rgba(141,105,246,.1),
      transparent 24%
    ),
    linear-gradient(
      180deg,
      #f8f8ff,
      #f3f7fc
    );
}


.wrap{
  width:min(
    1100px,
    calc(100% - 24px)
  );

  margin:auto;
}


/* =========================================================
   HEADER
========================================================= */

.top{
  position:sticky;

  top:0;

  z-index:20;

  background:
    rgba(255,255,255,.94);

  backdrop-filter:
    blur(12px);

  border-bottom:
    1px solid var(--line);
}


.topin{
  min-height:62px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;
}


.back{
  color:#3b315e;

  text-decoration:none;

  border:
    1px solid var(--line);

  background:#fff;

  border-radius:10px;

  padding:
    8px 11px;

  font-size:11px;

  font-weight:900;
}


.brand{
  font-weight:950;

  color:#21164b;
}


.student{
  font-size:11px;

  color:var(--muted);

  font-weight:800;
}


/* =========================================================
   MAIN
========================================================= */

main{
  padding:
    26px 0 50px;
}


.hero{
  padding:24px;

  border:
    1px solid rgba(255,255,255,.95);

  border-radius:22px;

  background:
    linear-gradient(
      120deg,
      #fff,
      #f7f4ff 55%,
      #eef7ff
    );

  box-shadow:
    0 10px 28px
    rgba(35,25,75,.06);

  margin-bottom:16px;
}


.eyebrow{
  display:inline-block;

  font-size:10px;

  letter-spacing:.1em;

  text-transform:uppercase;

  color:#6a4db4;

  font-weight:950;
}


.hero h1{
  margin:
    7px 0 6px;

  font-size:31px;

  color:#21164b;

  letter-spacing:-.035em;
}


.hero p{
  margin:0;

  color:var(--muted);

  font-size:12px;
}


/* =========================================================
   LIST HEADER
========================================================= */

.head{
  display:flex;

  align-items:end;

  justify-content:space-between;

  gap:14px;

  margin:
    20px 0 11px;
}


.head h2{
  margin:0;

  font-size:22px;

  color:#21164b;
}


.head p{
  margin:
    4px 0 0;

  color:var(--muted);

  font-size:11px;
}


.count{
  font-size:11px;

  color:#6c7383;

  font-weight:900;
}


/* =========================================================
   GRID
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;
}


/* =========================================================
   CARD
========================================================= */

.card{
  min-height:160px;

  display:flex;

  flex-direction:column;

  text-decoration:none;

  color:inherit;

  padding:20px;

  border:
    1px solid var(--line);

  border-radius:18px;

  background:#fff;

  box-shadow:
    0 6px 18px
    rgba(35,25,75,.04);

  transition:
    .16s ease;
}


.card:hover{
  transform:
    translateY(-3px);

  border-color:
    #cdbff9;

  box-shadow:
    0 13px 30px
    rgba(35,25,75,.09);
}


.card-top{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:15px;
}


.badge{
  min-width:42px;

  height:42px;

  padding:
    0 10px;

  border-radius:12px;

  background:#eee9ff;

  color:#5c43b2;

  display:grid;

  place-items:center;

  font-size:11px;

  font-weight:950;
}


.practice-label{
  color:#5f57df;

  font-size:10px;

  font-weight:950;

  letter-spacing:.05em;
}


.copy{
  flex:1;

  min-width:0;
}


.copy b{
  display:block;

  margin-bottom:7px;

  color:#151b2a;

  font-size:19px;

  line-height:1.25;
}


.copy span{
  display:block;

  color:var(--muted);

  font-size:11px;

  line-height:1.45;
}


.meta-row{
  display:flex;

  flex-wrap:wrap;

  gap:6px;

  margin-top:14px;
}


.meta-chip{
  padding:
    6px 9px;

  border:
    1px solid #e1e5ed;

  border-radius:999px;

  background:#fff;

  color:#3d475b;

  font-size:9px;

  font-weight:850;
}


.start{
  margin-top:auto;

  padding-top:17px;

  color:#594cda;

  font-size:11px;

  font-weight:950;
}


.arrow{
  float:right;
}


/* =========================================================
   LOADING
========================================================= */

.skeleton{
  min-height:160px;

  padding:20px;

  border:
    1px solid var(--line);

  border-radius:18px;

  background:#fff;

  overflow:hidden;

  position:relative;
}


.skeleton::after{
  content:"";

  position:absolute;

  inset:0;

  transform:
    translateX(-100%);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(116,99,225,.07),
      transparent
    );

  animation:
    loading 1.15s infinite;
}


@keyframes loading{

  100%{
    transform:
      translateX(100%);
  }

}


.sk-line{
  height:10px;

  margin-bottom:10px;

  border-radius:99px;

  background:#edf0f5;
}


.sk-line.small{
  width:25%;
}


.sk-line.medium{
  width:65%;
}


.sk-line.large{
  width:90%;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
  grid-column:
    1 / -1;

  padding:34px;

  text-align:center;

  background:#fff;

  border:
    1px dashed #d8dce6;

  border-radius:14px;

  color:#7b8292;

  font-size:12px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:750px){

  .grid{
    grid-template-columns:
      1fr;
  }

  .student{
    display:none;
  }

}

</style>

</head>


<body>


<header class="top">

  <div class="wrap topin">

    <a
      class="back"
      href="../../"
    >
      ← Reading
    </a>


    <div class="brand">
      Reading Passage 2
    </div>


    <div
      class="student"
      id="studentInfo"
    ></div>

  </div>

</header>



<main class="wrap">


  <section class="hero">

    <div class="eyebrow">
      Reading Practice
    </div>

    <h1>
      Reading Passage 2
    </h1>

    <p>
      Chọn một bài để bắt đầu luyện tập.
    </p>

  </section>



  <div class="head">

    <div>

      <h2>
        Danh sách bài luyện
      </h2>

      <p>
        Các bài mới sẽ tự động xuất hiện khi được thêm vào hệ thống.
      </p>

    </div>


    <div
      id="count"
      class="count"
    >
      Đang tải...
    </div>

  </div>



  <section
    id="grid"
    class="grid"
  >

    <div class="skeleton">
      <div class="sk-line small"></div>
      <div class="sk-line large"></div>
      <div class="sk-line medium"></div>
    </div>

    <div class="skeleton">
      <div class="sk-line small"></div>
      <div class="sk-line large"></div>
      <div class="sk-line medium"></div>
    </div>

  </section>


</main>



<script>

const TREE =
  "https://api.github.com/repos/quangducngo0111-ops/Test/git/trees/main?recursive=1";


const ROOT =
  "Practice/Reading/ReadingPassage2/";



/* =========================================================
   STUDENT
========================================================= */

function loadStudent(){

  try{

    const s =
      JSON.parse(
        localStorage.getItem(
          "IELTS_PRACTICE_STUDENT"
        )
        ||
        "null"
      );


    if(
      s?.name &&
      s?.className
    ){

      document
        .getElementById(
          "studentInfo"
        )
        .textContent =
        `${s.name} · ${s.className}`;

    }

  }
  catch(e){}

}



/* =========================================================
   CLEAN TITLE
========================================================= */

function cleanTitle(
  value
){

  let title =
    String(
      value || ""
    )
    .trim();


  /*
    Ví dụ:

    Gifted children and learning · Reading Passage 2

    sẽ trở thành:

    Gifted children and learning
  */

  title =
    title.replace(
      /\s*[·|–—-]\s*Reading\s*Passage\s*2.*$/i,
      ""
    );


  title =
    title.replace(
      /\s*[·|–—-]\s*Practice\s*\d+.*$/i,
      ""
    );


  return title.trim();

}



/* =========================================================
   EXTRACT QUESTION COUNT
========================================================= */

function getQuestionCount(
  doc
){

  /*
    Cách 1:
    đếm các element data-question.
  */

  const numbered =
    new Set();


  doc
    .querySelectorAll(
      "[data-question]"
    )
    .forEach(
      el => {

        const value =
          el.getAttribute(
            "data-question"
          );


        if(value){

          numbered.add(
            value
          );

        }

      }
    );


  if(
    numbered.size
  ){

    return numbered.size;

  }


  /*
    Cách 2:
    cho phép mỗi bài khai báo thủ công bằng meta:

    <meta
      name="practice-questions"
      content="13"
    >
  */

  const meta =
    doc.querySelector(
      'meta[name="practice-questions"]'
    );


  if(
    meta?.content
  ){

    const number =
      Number(
        meta.content
      );


    if(
      Number.isFinite(number)
      &&
      number > 0
    ){

      return number;

    }

  }


  return null;

}



/* =========================================================
   READ PAGE METADATA
========================================================= */

async function readExerciseMeta(
  item
){

  const fallback = {

    ...item,

    title:
      `Reading Passage 2 — Bài ${
        String(
          item.number
        )
        .padStart(
          2,
          "0"
        )
      }`,

    description:
      "Full passage practice",

    questions:
      null

  };


  try{

    /*
      Fetch chính index.html của bài.

      ?v=... giúp tránh GitHub Pages
      trả metadata cũ do cache.
    */

    const response =
      await fetch(
        `${item.url}index.html?v=${Date.now()}`,
        {
          cache:
            "no-store"
        }
      );


    if(
      !response.ok
    ){

      return fallback;

    }


    const html =
      await response.text();


    const parser =
      new DOMParser();


    const doc =
      parser.parseFromString(
        html,
        "text/html"
      );


    /* ==============================================
       TITLE

       Ưu tiên:

       1. meta practice-title
       2. h1
       3. title
       4. fallback
    ============================================== */


    const metaTitle =
      doc.querySelector(
        'meta[name="practice-title"]'
      )
      ?.getAttribute(
        "content"
      );


    const h1Title =
      doc.querySelector(
        "h1"
      )
      ?.textContent;


    const documentTitle =
      doc.querySelector(
        "title"
      )
      ?.textContent;


    const title =

      cleanTitle(
        metaTitle
      )

      ||

      cleanTitle(
        h1Title
      )

      ||

      cleanTitle(
        documentTitle
      )

      ||

      fallback.title;


    /* ==============================================
       DESCRIPTION

       Nếu bài có:

       <meta
         name="practice-description"
         content="Matching Information + ..."
       >

       index sẽ tự lấy.
    ============================================== */


    const metaDescription =
      doc.querySelector(
        'meta[name="practice-description"]'
      )
      ?.getAttribute(
        "content"
      );


    let description =

      metaDescription
      ?.trim()

      ||

      "Full passage practice";


    /* ==============================================
       QUESTION COUNT
    ============================================== */


    const questions =
      getQuestionCount(
        doc
      );


    return {

      ...item,

      title,

      description,

      questions

    };

  }
  catch(error){

    console.warn(
      `Không đọc được metadata bài ${item.folder}`,
      error
    );


    return fallback;

  }

}



/* =========================================================
   CARD
========================================================= */

function renderCard(
  item
){

  const n =
    String(
      item.number
    )
    .padStart(
      2,
      "0"
    );


  const questionText =

    item.questions

    ?

    `${item.questions} câu`

    :

    "Reading";


  return `
    <a
      class="card"
      href="${item.url}"
    >

      <div class="card-top">

        <div class="badge">
          ${n}
        </div>

        <div class="practice-label">
          PRACTICE ${n}
        </div>

      </div>


      <div class="copy">

        <b>
          ${escapeHTML(item.title)}
        </b>

        <span>
          ${escapeHTML(item.description)}
        </span>

      </div>


      <div class="meta-row">

        <div class="meta-chip">
          Passage 2
        </div>

        <div class="meta-chip">
          ${questionText}
        </div>

        <div class="meta-chip">
          Reading
        </div>

      </div>


      <div class="start">

        Bắt đầu luyện

        <span class="arrow">
          →
        </span>

      </div>

    </a>
  `;

}



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(
  value
){

  return String(
    value || ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}



/* =========================================================
   LOAD EXERCISES
========================================================= */

async function loadExercises(){

  const grid =
    document.getElementById(
      "grid"
    );


  const count =
    document.getElementById(
      "count"
    );


  try{

    /*
      Bước 1:
      lấy danh sách toàn bộ file từ GitHub.
    */

    const response =
      await fetch(
        `${TREE}&v=${Date.now()}`,
        {
          cache:
            "no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        `GitHub API ${response.status}`
      );

    }


    const data =
      await response.json();


    const escapedRoot =

      ROOT.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );


    /*
      Chỉ lấy:

      ReadingPassage2/01/index.html
      ReadingPassage2/02/index.html
      ReadingPassage2/03/index.html
      ...

      Không lấy folder con linh tinh.
    */

    const regex =
      new RegExp(
        "^"
        +
        escapedRoot
        +
        "(\\d+)/index\\.html$",
        "i"
      );


    const found =
      [];


    for(
      const file
      of
      data.tree
    ){

      if(
        file.type !==
        "blob"
      ){

        continue;

      }


      const match =
        file.path.match(
          regex
        );


      if(
        !match
      ){

        continue;

      }


      const folder =
        match[1];


      found.push({

        number:
          Number(folder),

        folder,

        url:
          `./${folder}/`

      });

    }


    found.sort(
      (
        a,
        b
      ) =>
        a.number
        -
        b.number
    );


    count.textContent =
      `${found.length} bài`;


    if(
      !found.length
    ){

      grid.innerHTML =
        `
        <div class="empty">
          Chưa có bài trong Reading Passage 2.
        </div>
        `;


      return;

    }


    /*
      Bước 2:
      mở index.html của từng bài để đọc title.

      Promise.all giúp tải song song,
      nhanh hơn tải lần lượt từng bài.
    */

    const items =

      await Promise.all(

        found.map(
          readExerciseMeta
        )

      );


    /*
      Bước 3:
      render.
    */

    grid.innerHTML =

      items
      .map(
        renderCard
      )
      .join("");

  }
  catch(error){

    console.error(error);


    count.textContent =
      "—";


    grid.innerHTML =
      `
      <div class="empty">
        Không tải được danh sách bài.
        Hãy tải lại trang sau ít phút.
      </div>
      `;

  }

}



/* =========================================================
   START
========================================================= */

loadStudent();

loadExercises();

</script>


</body>
</html>
