<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>Writing Practice</title>

<style>
:root{
  --purple:#281260;
  --purple2:#5b43b5;
  --ink:#172033;
  --muted:#6f7890;
  --line:#e3e7ef;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 0%,rgba(141,105,246,.11),transparent 24%),
    radial-gradient(circle at 92% 6%,rgba(101,174,255,.08),transparent 22%),
    linear-gradient(180deg,#f9f8ff,#f3f7fc);
}

.wrap{
  width:min(1120px,calc(100% - 24px));
  margin:auto;
}

.top{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.topin{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.back{
  color:#3b315e;
  text-decoration:none;
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:8px 11px;
  font-size:11px;
  font-weight:900;
}

.brand{
  color:#21164b;
  font-weight:950;
}

.student{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

main{
  padding:28px 0 55px;
}

.hero{
  position:relative;
  overflow:hidden;
  padding:28px;
  border-radius:23px;
  background:linear-gradient(120deg,#fff,#f8f5ff 55%,#edf7ff);
  box-shadow:0 12px 30px rgba(35,25,75,.055);
}

.hero::after{
  content:"✍️";
  position:absolute;
  right:30px;
  top:50%;
  transform:translateY(-50%);
  font-size:72px;
  opacity:.08;
}

.eyebrow{
  color:#6a4db4;
  font-size:10px;
  font-weight:950;
  letter-spacing:.11em;
  text-transform:uppercase;
}

.hero h1{
  margin:8px 0 7px;
  color:#21164b;
  font-size:clamp(29px,4vw,38px);
  letter-spacing:-.04em;
}

.hero p{
  max-width:650px;
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.65;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:14px;
  margin:24px 0 12px;
}

.section-head h2{
  margin:0;
  color:#21164b;
  font-size:22px;
}

.section-head p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:11px;
}

.count{
  color:#6c7383;
  font-size:11px;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
}

.card{
  display:flex;
  align-items:center;
  gap:14px;
  min-height:92px;
  padding:15px;
  text-decoration:none;
  color:inherit;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  box-shadow:0 5px 15px rgba(35,25,75,.035);
  transition:.16s ease;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#cbbdf7;
  box-shadow:0 11px 25px rgba(35,25,75,.08);
}

.icon{
  flex:0 0 52px;
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(145deg,#eee9ff,#e8f2ff);
  font-size:23px;
}

.copy{
  flex:1;
}

.copy b{
  display:block;
  margin-bottom:4px;
  color:#21164b;
  font-size:13.5px;
  font-weight:950;
}

.copy span{
  display:block;
  color:var(--muted);
  font-size:10.5px;
}

.arrow{
  color:#9ca3b2;
  font-size:18px;
  font-weight:900;
}

.loading,
.empty{
  grid-column:1/-1;
  padding:34px 20px;
  text-align:center;
  border:1px dashed #d7dbe5;
  border-radius:16px;
  background:rgba(255,255,255,.8);
  color:#7b8292;
  font-size:11.5px;
}

@media(max-width:760px){
  .grid{
    grid-template-columns:1fr;
  }

  .student{
    display:none;
  }
}
</style>
</head>

<body>

<header class="top">

  <div class="wrap topin">

    <a class="back" href="../">
      ← Practice
    </a>

    <div class="brand">
      ✍️ Writing Practice
    </div>

    <div class="student" id="studentInfo"></div>

  </div>

</header>


<main class="wrap">

  <section class="hero">

    <div class="eyebrow">
      IELTS Practice
    </div>

    <h1>
      Writing
    </h1>

    <p>
      Luyện Writing theo từng dạng dữ liệu và dạng đề.
      Chọn dạng bài muốn luyện để bắt đầu.
    </p>

  </section>


  <div class="section-head">

    <div>

      <h2>
        Chọn dạng bài
      </h2>

      <p>
        Mỗi dạng gồm các bài luyện riêng.
      </p>

    </div>

    <div class="count" id="count">
      Đang tải...
    </div>

  </div>


  <section class="grid" id="grid">

    <div class="loading">
      Đang tải danh sách dạng bài...
    </div>

  </section>

</main>


<script>

const TREE_URL=
'https://api.github.com/repos/quangducngo0111-ops/Test/git/trees/main?recursive=1';

const ROOT=
'Practice/Writing/';


const CATEGORY_DATA={

  DynamicDatasets:{
    name:'Dynamic Datasets',
    description:'Luyện mô tả biểu đồ có sự thay đổi theo thời gian.',
    icon:'📈'
  },

  StaticDatasets:{
    name:'Static Datasets',
    description:'Luyện mô tả và so sánh số liệu tại một hoặc nhiều thời điểm cố định.',
    icon:'📊'
  },

  Maps:{
    name:'Maps',
    description:'Luyện mô tả sự thay đổi về địa điểm và bố cục.',
    icon:'🗺️'
  },

  Processes:{
    name:'Processes',
    description:'Luyện mô tả quy trình và các giai đoạn.',
    icon:'⚙️'
  }

};


function loadStudent(){

  try{

    const student=
    JSON.parse(
      localStorage.getItem('IELTS_PRACTICE_STUDENT')
      ||
      'null'
    );


    if(student?.name && student?.className){

      studentInfo.textContent=
      `${student.name} · ${student.className}`;

    }

  }catch(e){}

}


function prettifySlug(slug){

  return String(slug || '')
  .replace(/([a-z])([A-Z])/g,'$1 $2')
  .replace(/[_-]+/g,' ')
  .trim();

}


function categoryInfo(slug){

  return CATEGORY_DATA[slug]
  ||
  {
    name:prettifySlug(slug),
    description:'Writing practice',
    icon:'✍️'
  };

}


async function loadCategories(){

  try{

    const response=
    await fetch(
      TREE_URL,
      {cache:'no-store'}
    );


    if(!response.ok){

      throw new Error(response.status);

    }


    const data=
    await response.json();


    const escaped=
    ROOT.replace(
      /[.*+?^${}()|[\]\\]/g,
      '\\$&'
    );


    const regex=
    new RegExp(
      '^'+escaped+'([^/]+)/index\\.html$',
      'i'
    );


    const categories=[];


    data.tree.forEach(
      item=>{

        if(item.type!=='blob'){
          return;
        }


        const match=
        item.path.match(regex);


        if(!match){
          return;
        }


        const slug=
        match[1];


        if(!categories.includes(slug)){

          categories.push(slug);

        }

      }
    );


    const priority=[
      'DynamicDatasets',
      'StaticDatasets',
      'Maps',
      'Processes'
    ];


    categories.sort(
      (a,b)=>{

        const ai=
        priority.indexOf(a);

        const bi=
        priority.indexOf(b);


        if(ai!==-1 && bi!==-1){
          return ai-bi;
        }

        if(ai!==-1){
          return -1;
        }

        if(bi!==-1){
          return 1;
        }

        return a.localeCompare(b);

      }
    );


    renderCategories(categories);

  }

  catch(error){

    count.textContent='0 dạng bài';

    grid.innerHTML=
    `
      <div class="empty">
        Không tải được danh sách dạng bài.
      </div>
    `;

  }

}


function renderCategories(categories){

  count.textContent=
  `${categories.length} dạng bài`;


  if(!categories.length){

    grid.innerHTML=
    `
      <div class="empty">
        Chưa có dạng bài Writing nào.
      </div>
    `;

    return;

  }


  grid.innerHTML=
  categories.map(
    slug=>{

      const info=
      categoryInfo(slug);


      return`
        <a class="card" href="./${encodeURIComponent(slug)}/">

          <div class="icon">
            ${info.icon}
          </div>

          <div class="copy">

            <b>
              ${escapeHTML(info.name)}
            </b>

            <span>
              ${escapeHTML(info.description)}
            </span>

          </div>

          <div class="arrow">
            →
          </div>

        </a>
      `;

    }
  )
  .join('');

}


function escapeHTML(value){

  return String(value)
  .replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[c]
  );

}


loadStudent();
loadCategories();

</script>

</body>
</html>
