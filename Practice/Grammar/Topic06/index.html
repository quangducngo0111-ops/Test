<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Practice · Learn & Practice</title><style>
:root{--blue:#216cdf;--purple:#6848d8;--ink:#1c2440;--muted:#62718b;--line:#dce4f1;--bg:#f4f7fd;--green:#18815f}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f5f2ff,#eff7ff);font:15px/1.65 system-ui,Arial;color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px max(18px,calc((100vw - 1300px)/2));display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:4}
a{color:var(--purple);text-decoration:none;font-weight:800}button,textarea,input{font:inherit}button{cursor:pointer}
.wrap{max-width:1300px;margin:24px auto;padding:0 16px}.hero{background:#fff;border-radius:18px;padding:22px;border:1px solid var(--line);margin-bottom:18px}
.hero h1{margin:0;color:#281557}.hero p{margin:5px 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.sidebar{position:sticky;top:74px;background:#fff;padding:14px;border-radius:16px;border:1px solid var(--line);max-height:calc(100vh - 90px);overflow:auto}
.top-btn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:10px;border-radius:9px;margin:3px 0;font-weight:750;color:#293254}
.top-btn.active{background:#eee9ff;border-color:#9479ee;color:#4420a5}.top-btn small{display:block;font-weight:500;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:24px;min-width:0}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.step{border:1px solid #d5ddf0;border-radius:10px;padding:10px 15px;background:#fff;color:#4e5470;font-weight:800}
.step.active{background:var(--purple);color:#fff}.step:disabled{opacity:.5;cursor:not-allowed}
.lesson{border:1px solid #dce4f1;border-radius:13px;overflow:hidden;margin:14px 0;background:#fff}
.lesson-bar,.exercise-bar{background:var(--blue);color:white;font-weight:850;padding:10px 14px}
.lesson-body{padding:17px}.lesson-body p{white-space:pre-line;color:#3f4a66}.sample{background:#f1f7ff;border-left:4px solid var(--blue);padding:12px;margin:12px 0;border-radius:5px}
.btn{background:var(--purple);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:800}.btn.secondary{background:#fff;color:#402a8d;border:1px solid #b9aae5}.btn:disabled{opacity:.55;cursor:not-allowed}
.muted{font-size:12px;color:var(--muted)}.question{padding:13px 10px;border-bottom:1px solid #e6ecf6}.question b{display:block;margin-bottom:7px}
.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{background:#fff;border:1px solid #cdd8eb;border-radius:8px;padding:7px 11px}.choice.on{background:#eeeaff;border:2px solid #7754da}
.entry{width:100%;border:1px solid #c9d6e9;border-radius:8px;padding:10px;margin-top:7px}.entry.long{min-height:105px;resize:vertical}
.result{padding:11px;border-radius:10px;background:#f3f7ff;margin-top:9px;border:1px solid #d6e5ff;font-size:13px}
.result.good{background:#ecfaf2;border-color:#b2ddc5}.result.bad{background:#fff6f2;border-color:#f5c8b6}
.exercise{border:1px solid #bfd1ee;border-radius:12px;overflow:hidden;margin:18px 0}.exercise-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exbody{padding:8px 16px 16px}.exfooter{padding:12px;border-top:1px solid #e0e6f0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.summary{background:#f1f5ff;border:1px solid #bdcdef;border-radius:12px;padding:18px;margin:22px 0}.summary strong{font-size:24px;color:#3f26ab}
.progress{height:8px;background:#e5e9f1;border-radius:20px;overflow:hidden;margin:10px 0}.progress>span{height:100%;display:block;background:var(--purple)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none;display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.sidebar h3{grid-column:1/-1}.panel{padding:14px}}@media(max-width:520px){.sidebar{grid-template-columns:1fr}.exercise-bar{flex-wrap:wrap}}

.examples-title{font-weight:850;color:#174d98;margin:18px 0 8px}.example-card{border:1px solid #bfd7fa;background:#f8fbff;border-radius:10px;padding:12px 14px;margin:9px 0}.example-card>b{font-size:11px;color:#2369c6}.example-en{font-weight:800;font-size:15px;color:#172b4b;margin:4px 0}.example-vi{font-size:13px;color:#4c5c74}.example-why{margin-top:8px;padding:8px 10px;background:#ecf4ff;border-radius:7px;font-size:12px;color:#284c7e}
</style></head><body><header><a href="../../">← Kho luyện tập</a><strong>Grammar · Bài 06</strong></header><main class="wrap"><section class="hero"><h1>Bài 06 · Conditionals</h1><p>Học kiến thức theo từng chặng → Làm bài tập → Kiểm tra và chữa bài → Xem tổng kết.</p></section><div class="layout"><aside class="sidebar"><h3>Chủ điểm ngữ pháp</h3><div id="nav"></div></aside><section class="panel"><span class="muted">GRAMMAR LEARNING PATH</span><h2 id="heading"></h2><div id="body"></div></section></div></main><script>
'use strict';
const DATA=[{"title":"Subject–Verb Agreement","vi":"Hòa hợp chủ ngữ – động từ","questions":[{"q":"The number of students ___ increasing.","options":["is","are","be"],"answer":"is","explain":"The number of + danh từ số nhiều được xem là chủ ngữ số ít."},{"q":"Each student ___ access to a computer.","options":["have","has","having"],"answer":"has","explain":"Each + danh từ số ít đi với động từ số ít."},{"q":"Many teachers ___ technology in class.","options":["uses","use","using"],"answer":"use","explain":"Many teachers là chủ ngữ số nhiều."},{"q":"One of the main reasons ___ the cost.","options":["is","are","be"],"answer":"is","explain":"Chủ ngữ chính là One."},{"q":"Neither of the options ___ ideal.","options":["are","is","have"],"answer":"is","explain":"Trong văn phong trang trọng, neither of thường đi với động từ số ít."},{"type":"fill","q":"Neither the teacher nor the students ___ ready.","answers":["are"],"explain":"Động từ gần students (số nhiều) nên dùng are."},{"type":"correct","q":"Each of the students have a laptop.","answers":["Each of the students has a laptop."],"explain":"Each là chủ ngữ số ít, dùng has."},{"type":"order","q":"responsible / for / is / the teacher / the class","answers":["The teacher is responsible for the class."],"explain":"Trật tự: chủ ngữ + is + responsible for + noun."},{"type":"rewrite","q":"Rewrite using “There”: Many problems exist in large cities.","answers":["There are many problems in large cities."],"explain":"There are + plural noun."},{"type":"fill","q":"The quality of these lessons ___ improved.","answers":["has"],"explain":"The quality là chủ ngữ chính số ít."},{"type":"correct","q":"The number of applicants are rising.","answers":["The number of applicants is rising."],"explain":"The number of + danh từ số nhiều dùng động từ số ít."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: hòa hợp chủ ngữ – động từ.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"Each student has access to a library.","focus":"Subject–Verb Agreement"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Subject–Verb Agreement.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Each student has a different learning style. Many teachers adapt their lessons to meet these needs.","focus":"Subject–Verb Agreement"},{"type":"fill","q":"The students _____ ready.","answers":["are"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"The students is ready.","answers":["The students are ready."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"are / The / students / ready","answers":["The students are ready."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: The students is ready.","answers":["The students are ready."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"My teacher _____ two classes.","answers":["has"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"My teacher have two classes.","answers":["My teacher has two classes."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"has / two / classes / My / teacher","answers":["My teacher has two classes."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: My teacher have two classes.","answers":["My teacher has two classes."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"Each child _____ support.","answers":["needs"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"Each child need support.","answers":["Each child needs support."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"child / needs / support / Each","answers":["Each child needs support."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: Each child need support.","answers":["Each child needs support."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"order","q":"There / many / reasons / study / to / are","answers":["There are many reasons to study."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: There is many reasons to study.","answers":["There are many reasons to study."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"write","q":"Viết câu tiếng Anh về môi trường có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"Each child needs support.","focus":"Subject–Verb Agreement"},{"type":"write","q":"Viết câu tiếng Anh về trường học có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"There are many reasons to study.","focus":"Subject–Verb Agreement"},{"type":"write","q":"Viết đoạn 40–70 từ về lợi ích học tiếng Anh, dùng ít nhất hai cấu trúc vừa học.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"The quality of lessons is improving.","focus":"Subject–Verb Agreement"}]},{"title":"Tenses","vi":"Các thì thường gặp","questions":[{"q":"The school ___ online lessons since 2020.","options":["has offered","offered","offers"],"answer":"has offered","explain":"Since + mốc thời gian kéo dài đến hiện tại → present perfect."},{"q":"Last year, the government ___ new rules.","options":["introduces","has introduced","introduced"],"answer":"introduced","explain":"Last year là mốc quá khứ đã kết thúc."},{"q":"At the moment, the students ___ a test.","options":["take","are taking","took"],"answer":"are taking","explain":"At the moment gợi ý present continuous."},{"q":"By the time she arrived, the class ___.","options":["started","had started","starts"],"answer":"had started","explain":"Hành động xảy ra trước một mốc quá khứ khác → past perfect."},{"q":"Technology ___ rapidly over the past decade.","options":["has developed","develops","developed"],"answer":"has developed","explain":"Over the past decade (đến nay) → present perfect."},{"type":"fill","q":"By the time we arrived, the lecture ___ (begin).","answers":["had begun"],"explain":"Hành động xảy ra trước một mốc quá khứ: past perfect."},{"type":"correct","q":"I have visited Hanoi yesterday.","answers":["I visited Hanoi yesterday."],"explain":"Yesterday là thời điểm quá khứ xác định; dùng simple past."},{"type":"order","q":"has / since 2021 / worked / she / here","answers":["She has worked here since 2021."],"explain":"Present perfect + since."},{"type":"rewrite","q":"Rewrite with “since”: He started studying English in 2020 and still studies it.","answers":["He has studied English since 2020.","He has been studying English since 2020."],"explain":"Both present perfect and present perfect continuous are acceptable."},{"type":"fill","q":"Look! The children ___ (play) outside.","answers":["are playing"],"explain":"Look! cho thấy hành động đang diễn ra."},{"type":"correct","q":"She is knowing the answer.","answers":["She knows the answer."],"explain":"Know thường là stative verb, không dùng tiếp diễn trong nghĩa này."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: các thì thường gặp.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"The school has introduced new courses this year.","focus":"Tenses"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Tenses.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Education has changed rapidly in recent years. In the past, students relied mainly on printed books.","focus":"Tenses"},{"type":"fill","q":"She _____ to school every day.","answers":["goes"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"She go to school every day.","answers":["She goes to school every day."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"day / to / school / every / She / goes","answers":["She goes to school every day."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: She go to school every day.","answers":["She goes to school every day."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"I _____ Hanoi yesterday.","answers":["visited"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"I have visited Hanoi yesterday.","answers":["I visited Hanoi yesterday."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"I / yesterday / visited / Hanoi","answers":["I visited Hanoi yesterday."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: I have visited Hanoi yesterday.","answers":["I visited Hanoi yesterday."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"They were _____ when I arrived.","answers":["studying"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"They were study when I arrived.","answers":["They were studying when I arrived."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"They / arrived / were / studying / when / I","answers":["They were studying when I arrived."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: They were study when I arrived.","answers":["They were studying when I arrived."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"order","q":"lived / since / 2020 / here / He / has","answers":["He has lived here since 2020."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: He has live here since 2020.","answers":["He has lived here since 2020."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"write","q":"Viết câu tiếng Anh về môi trường có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"They were studying when I arrived.","focus":"Tenses"},{"type":"write","q":"Viết câu tiếng Anh về trường học có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"He has lived here since 2020.","focus":"Tenses"},{"type":"write","q":"Viết đoạn 40–70 từ về lợi ích học tiếng Anh, dùng ít nhất hai cấu trúc vừa học.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"By next year, she will have graduated.","focus":"Tenses"}]},{"title":"Articles","vi":"Mạo từ a/an/the","questions":[{"q":"She is ___ honest teacher.","options":["a","an","the"],"answer":"an","explain":"Honest bắt đầu bằng âm nguyên âm vì h câm."},{"q":"___ internet has changed education.","options":["A","The","An"],"answer":"The","explain":"Thường dùng the internet."},{"q":"Students need ___ reliable information.","options":["a","an","—"],"answer":"—","explain":"Information là danh từ không đếm được."},{"q":"He bought ___ laptop yesterday.","options":["a","an","—"],"answer":"a","explain":"Laptop là danh từ đếm được số ít, đề cập lần đầu."},{"q":"___ education plays an important role in society.","options":["The","An","—"],"answer":"—","explain":"Education nói chung không cần mạo từ."},{"type":"fill","q":"She bought ___ umbrella.","answers":["an"],"explain":"Umbrella bắt đầu bằng âm nguyên âm."},{"type":"fill","q":"___ pollution is a serious problem in many cities.","answers":["∅","-","none","zero"],"explain":"Pollution nói chung không cần mạo từ."},{"type":"correct","q":"He gave me an useful suggestion.","answers":["He gave me a useful suggestion."],"explain":"Useful bắt đầu bằng âm /j/ (phụ âm), dùng a."},{"type":"order","q":"is / an / honest / person / she","answers":["She is an honest person."],"explain":"Honest có h câm."},{"type":"rewrite","q":"Rewrite with an article if needed: She is engineer.","answers":["She is an engineer."],"explain":"Engineer là danh từ nghề nghiệp đếm được số ít."},{"type":"fill","q":"We visited ___ Netherlands last year.","answers":["the"],"explain":"Tên nước Netherlands dùng the."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: mạo từ a/an/the.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"A university offers many useful resources.","focus":"Articles"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Articles.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"An effective school provides a supportive learning environment. Students can access reliable information in the library.","focus":"Articles"},{"type":"fill","q":"He is _____ honest person.","answers":["an"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"He is a honest person.","answers":["He is an honest person."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"is / He / honest / an / person","answers":["He is an honest person."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: He is a honest person.","answers":["He is an honest person."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"She bought _____ university textbook.","answers":["a"],"explain": e of”: He shared advice with me.","answers":["He shared a piece of advice with me."],"explain":"A piece of advice chỉ một lời khuyên."},{"type":"fill","q":"The new campus has excellent ___. (facility)","answers":["facilities"],"explain":"Facilities là số nhiều."},{"type":"correct","q":"There are many furnitures in this room.","answers":["There is a lot of furniture in this room.","There is much furniture in this room."],"explain":"Furniture không đếm được."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: danh từ đếm được và không đếm được.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"Students need reliable information about careers.","focus":"Countable & Uncountable Nouns"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Countable & Uncountable Nouns.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Cities need better public transport and reliable information. Modern facilities can improve the quality of life.","focus":"Countable & Uncountable Nouns"},{"type":"fill","q":"The _____ was useful.","answers":["information"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"The informations were useful.","answers":["The information was useful."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"The / useful / information / was","answers":["The information was useful."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: The informations were useful.","answers":["The information was useful."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"There is a lot of _____ today.","answers":["traffic"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"There are many traffics today.","a "write","q":"Viết đoạn 40–70 từ về lợi ích học tiếng Anh, dùng ít nhất hai cấu trúc vừa học.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"The equipment is new.","focus":"Countable & Uncountable Nouns"}]},{"title":"Quantifiers","vi":"Từ chỉ lượng: many, much, a few, a little, a lot of","questions":[{"q":"There is too ___ noise in the city center at night.","options":["many","much","a few"],"answer":"much","explain":"Noise không đếm được; too much noise là cách dùng đúng."},{"q":"My town has ___ historical monuments that attract tourists.","options":["a little","much","a few"],"answer":"a few","explain":"Historical monuments là danh từ đếm được số nhiều; a few diễn tả có một vài công trình."},{"q":"There are only ___ bus routes operating after 10 PM.","options":["a few","a little","much"],"answer":"a few","explain":"Bus routes là danh từ đếm được số nhiều; only a few nhấn mạnh số lượng hạn chế."},{"q":"We need ___ more investment to improve local schools.","options":["many","a little","a few"],"answer":"a little","explain":"Investment ở đây chỉ nguồn vốn (không đếm được); a little more investment đúng ngữ pháp. A lot of more không tự nhiên; dùng a lot more investment."},{"q":"How ___ people live in your hometown?","options":["many","much","a little"],"answer":"many","explain":"People là danh từ đếm được số nhiều; How many people ...?"},{"q":"The city spends ___ money on public transport.","options":["a lot of","many","a few"],"answer":"a lot of","explain":"A lot of dùng được với cả danh từ đếm được số nhiều và không đếm được; money không đếm được."},{"type":"fill","q":"How ___ students joined the course?","answers":["many"],"explain":"How many + danh từ đếm được số nhiều."},{"type":"fill","q":"There is only ___ water left.","answers":["a little","little"],"explain":"Water không đếm được."},{"type":"correct","q":"There are much cars on the road.","answers":["There are many cars on the road."],"explain":"Cars đếm được số nhiều nên dùng many."},{"type":"order","q":"a few / attended / students / the workshop","answers":["A few students attended the workshop."],"explain":"A few + danh từ số nhiều."},{"type":"rewrite","q":"Rewrite using “a lot of”: There are many books in the library.","answers":["There are a lot of books in the library."],"explain":"A lot of dùng với danh từ đếm được số nhiều."},{"type":"fill","q":"We do not have ___ time to finish.","answers":["much","enough"],"explain":"Much time: lượng thời gian; enough time: đủ thời gian. Cả hai đều phù hợp trong câu phủ định."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: từ chỉ lượng: many, much, a few, a little, a lot of.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"Many students spend a little time reading every day.","focus":"Quantifiers"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Quantifiers.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Many students have a lot of assignments. However, a few hours of careful planning can reduce stress.","focus":"Quantifiers"},{"type":"fill","q":"I have _____ friends, so I am lucky to have people to talk to.","answers":["a few"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"I have few friends, so I am lucky to have many people to talk to.","answers":["I have a few friends, so I am lucky to have people to talk to."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"I / to / have / have / so / I / people / lucky / am / few / talk / a / to / to / friends,","answers":["I have a few friends, so I am lucky to have people to talk to."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: I have few friends, so I am lucky to have many people to talk to.","answers":["I have a few friends, so I am lucky to have people to talk to."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"There are _____ books on the shelf.","answers":["a few"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"There are a little books on the shelf.","answers":["There are a few books on the shelf."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"There / few / on / a / the / books / are / shelf","answers":["There are a few books on the shelf."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: There are a little books on the shelf.","answers":["There are a few books on the shelf."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"correct","q":"We have a few time before class.","answers":["We have a little time before class."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"class / a / little / before / We / have / time","answers":["We have a little time before class."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: We have a few time before class.","answers":["We have a little time before class."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"correct","q":"How much students came today?","answers":["How many students came today?"],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"How / students / many / today? / came","answers":["How many students came today?"],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: How much students came today?","answers":["How many students came today?"],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"write","q":"Viết câu tiếng Anh về môi trường có d get."],"explain":"Unless = if ... not."},{"type":"fill","q":"If it rains tomorrow, we ___ indoors. (stay)","answers":["will stay"],"explain":"Loại 1: will + V."},{"type":"correct","q":"If I have more money, I would travel abroad.","answers":["If I had more money, I would travel abroad."],"explain":"Loại 2: if + past simple, would + V."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: câu điều kiện.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"If students study consistently, they will improve.","focus":"Conditionals"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Conditionals.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"If cities invest in public transport, traffic congestion will decrease. If I were a city planner, I would expand bus services.","focus":"Conditionals"},{"type":"fill","q":"If I _____, I will pass.","answers":["study"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"If I will study, I will pass.","answers":["If I study, I will pass."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"study, / If / I / pass / will / I","answers":["If I study, I will pass."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: If I will study, I will pass.","answers":["If I study, I will pass."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"If she knew, she _____ help.","answers":["would"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"If she knew, she will help.","answers":["If she knew, she would help."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"help / she / If / would / she / knew,","answers":["If she knew, she would help."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: If she knew, she will help.","answers":["If she knew, she would help."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"If it rains tomorrow, we _____ stay home.","answers":["will"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"If it rains tomorrow, we stayed home.","answers":["If it rains tomorrow, we will stay home."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"stay / tomorrow, / If / home / will / it / rains / we","answers":["If it rains tomorrow, we will stay home."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: If it rains tomorrow, we stayed home.","answers":["If it rains tomorrow, we will stay home."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"order","q":"I / I / travel / more / would / were / If / rich,","answers":["If I were rich, I would travel more."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: If I were rich, I will travel more.","answers":["If I were rich, I would travel more."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"write","q":"Viết câu tiếng Anh về môi trường có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"If it rains tomorrow, we will stay home.","focus":"Conditionals"},{"type":"write","q":"Viết câu tiếng Anh về trường học có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"If I were rich, I would travel more.","focus":"Conditionals"},{"type":"write","q":"Viết đoạn 40–70 từ về lợi ích học tiếng Anh, dùng ít nhất hai cấu trúc vừa học.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"If he had prepared, he would have succeeded.","focus":"Conditionals"}]},{"title":"Relative Clauses","vi":"Mệnh đề quan hệ","questions":[{"q":"The teacher ___ helped me was patient.","options":["which","who","where"],"answer":"who","explain":"Who thay thế người làm chủ ngữ."},{"q":"The book ___ I bought was useful.","options":["who","that","where"],"answer":"that","explain":"That có thể thay thế vật."},{"q":"This is the school ___ I studied.","options":["which","where","who"],"answer":"where","explain":"Where chỉ địa điểm."},{"q":"The student ___ essay won the prize is absent.","options":["whose","who","which"],"answer":"whose","explain":"Whose biểu thị sở hữu."},{"q":"The app, ___ is free, has many features.","options":["that","which","who"],"answer":"which","explain":"Mệnh đề quan hệ không xác định dùng which, không dùng that."},{"type":"fill","q":"The student ___ laptop was stolen reported it.","answers":["whose"],"explain":"Whose diễn đạt sở hữu."},{"type":"correct","q":"My brother, that works in London, is a doctor.","answers":["My brother, who works in London, is a doctor."],"explain":"Non-defining relative clause dùng who, không dùng that."},{"type":"order","q":"was / the school / built / where / I studied / recently","answers":["The school where I studied was built recently."],"explain":"Where nối mệnh đề quan hệ nơi chốn."},{"type":"rewrite","q":"Combine: I met a woman. She is a scientist.","answers":["I met a woman who is a scientist.","I met a woman that is a scientist."],"explain":"Who/that thay thế người trong mệnh đề xác định."},{"type":"fill","q":"This is the book ___ I told you about.","answers":["that","which"],"explain":"Which hoặc that đều dùng được trong mệnh đề quan hệ xác định."},{"type":"correct","q":"The place which I live is noisy.","answers":["The place where I live is noisy.","The place in which I live is noisy."],"explain":"Where / in which chỉ nơi chốn."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: mệnh đề quan hệ.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"The teacher who helped me was very patient.","focus":"Relative Clauses"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Relative Clauses.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Students who receive feedback often improve faster. A school that offers personalised support can help them succeed.","focus":"Relative Clauses"},{"type":"fill","q":"The man _____ teaches us is kind.","answers":["who"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"The man which teaches us is kind.","answers":["The man who teaches us is kind."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"us / kind / who / teaches / The / is / man","answers":["The man who teaches us is kind."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: The man which teaches us is kind.","answers":["The man who teaches us is kind."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"This is the book _____ I bought.","answers":["that"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"This is the book who I bought.","answers":["This is the book that I bought."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"bought / the / book / I / is / that / This","answers":["This is the book that I bought."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: This is the book who I bought.","answers":["This is the book that I bought."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"My sister, _____ lives in Hue, is a doctor.","answers":["who"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"My sister, that lives in Hue, is a doctor.","answers":["My sister, who lives in Hue, is a doctor."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"sister, / who / a / lives / My / Hue, / doctor / in / is","answers":["My sister, who lives in Hue, is a doctor."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: My sister, that lives in Hue, is a doctor.","answers":["My sister, who lives in Hue, is a doctor."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"order","q":"school / is / The / where / study / I / large","answers":["The school where I study is large."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: The school which I study is large.","answers":["The school where I study is large."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"write","q":"Viết câu tiếng Anh về môi trường có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"My sister, who lives in Hue, is a doctor.","focus":"Relative Clauses"},{"type":"write","q":"Viết câu tiếng Anh về trường học có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"The school where I study is large.","focus":"Relative Clauses"},{"type":"write","q":"Viết đoạn 40–70 từ về lợi ích học tiếng Anh, dùng ít nhất hai cấu trúc vừa học.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"I met a teacher who speaks French.","focus":"Relative Clauses"}]},{"title":"Gerunds & Infinitives","vi":"V-ing và to V","questions":[{"q":"Teachers should encourage students ___ questions.","options":["ask","to ask","asking"],"answer":"to ask","explain":"Encourage somebody to do something."},{"q":"She enjoys ___ English podcasts.","options":["listen","to listen","listening to"],"answer":"listening to","explain":"Enjoy + V-ing; listen cần giới từ to."},{"q":"By ___ regularly, learners improve.","options":["practise","practising","to practise"],"answer":"practising","explain":"By + V-ing."},{"q":"They decided ___ the programme.","options":["join","joining","to join"],"answer":"to join","explain":"Decide + to V."},{"q":"This enables students ___ independently.","options":["study","studying","to study"],"answer":"to study","explain":"Enable + somebody + to V."},{"type":"fill","q":"By ___ (practise) every day, learners improve.","answers":["practising","practicing"],"explain":"Sau by dùng V-ing."},{"type":"correct","q":"They decided joining the programme.","answers":["They decided to join the programme."],"explain":"Decide + to V."},{"type":"order","q":"to / enables / students / technology / learn / independently","answers":["Technology enables students to learn independently."],"explain":"Enable somebody to V."},{"type":"rewrite","q":"Rewrite using “by”: Students improve by regular practice.","answers":["Students improve by practising regularly.","Students improve by practicing regularly."],"explain":"By + V-ing."},{"type":"fill","q":"She is interested in ___ (study) abroad.","answers":["studying"],"explain":"Sau interested in dùng V-ing."},{"type":"correct","q":"He suggested to take a break.","answers":["He suggested taking a break."],"explain":"Suggest + V-ing."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: v-ing và to v.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"By practising every day, students can improve their speaking skills.","focus":"Gerunds & Infinitives"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Gerunds & Infinitives.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"By practising regularly, students improve their confidence. Teachers encourage learners to ask questions.","focus":"Gerunds & Infinitives"},{"type":"fill","q":"She enjoys _____ novels.","answers":["reading"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"She enjoys to read novels.","answers":["She enjoys reading novels."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"enjoys / She / novels / reading","answers":["She enjoys reading novels."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: She enjoys to read novels.","answers":["She enjoys reading novels."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"I decided _____ home.","answers":["to go"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"I decided going home.","answers":["I decided to go home."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"home / decided / to / I / go","answers":["I decided to go home."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: I decided going home.","answers":["I decided to go home."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"He avoided _____.","answers":["answering"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"He avoided to answer.","answers":["He avoided answering."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"answering / avoided / He","answers":["He avoided answering."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: He avoided to answer.","answers":["He avoided answering."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"order","q":"the / test / to / pass / They / hope","answers":["They hope to pass the test."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: They hope passing the test.","answers":["They hope to pass the test."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"write","q":"Viết câu tiếng Anh về môi trường có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"He avoided answering.","focus":"Gerunds & Infinitives"},{"type":"write","q":"Viết câu tiếng Anh về trường học có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"They hope to pass the test.","focus":"Gerunds & Infinitives"},{"type":"write","q":"Viết đoạn 40–70 từ về lợi ích học tiếng Anh, dùng ít nhất hai cấu trúc vừa học.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"We look forward to meeting you.","focus":"Gerunds & Infinitives"}]},{"title":"Linking & Clauses","vi":"Từ nối và mệnh đề","questions":[{"q":"___ technology is useful, it cannot replace teachers.","options":["Despite","Although","Because of"],"answer":"Although","explain":"Although + mệnh đề."},{"q":"___ the rain, the match continued.","options":["Although","Despite","Because"],"answer":"Despite","explain":"Despite + danh từ/cụm danh từ."},{"q":"She studied hard; ___, she passed.","options":["however","therefore","although"],"answer":"therefore","explain":"Therefore nối kết quả."},{"q":"The lessons were interactive, ___ students more engaged.","options":["making","make","made"],"answer":"making","explain":"V-ing rút gọn nêu kết quả."},{"q":"The policy aims to reduce costs ___ improving access.","options":["while","despite","although"],"answer":"while","explain":"While + V-ing để chỉ hai hành động song song."},{"type":"fill","q":"___ it was raining, they continued.","answers":["although","even though","though"],"explain":"Although/even though + clause."},{"type":"correct","q":"Although the course is difficult, but I enjoy it.","answers":["Although the course is difficult, I enjoy it."],"explain":"Không dùng although ... but đồng thời."},{"type":"order","q":"therefore / costs increased / the company / raised prices","answers":["Costs increased; therefore, the company raised prices."],"explain":"Therefore nối quan hệ nguyên nhân – kết quả."},{"type":"rewrite","q":"Rewrite using “despite”: Although it rained, they played football.","answers":["Despite the rain, they played football.","Despite raining, they played football."],"explain":"Despite + noun/V-ing; không theo sau trực tiếp bởi mệnh đề."},{"type":"fill","q":"The lessons were interactive, ___ students more engaged. (make)","answers":["making"],"explain":"V-ing result clause."},{"type":"correct","q":"Despite he was tired, he kept studying.","answers":["Although he was tired, he kept studying.","Despite being tired, he kept studying."],"explain":"Despite + noun/V-ing hoặc Although + clause."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: từ nối và mệnh đề.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"Although online lessons are convenient, teachers remain important.","focus":"Linking & Clauses"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Linking & Clauses.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Although technology is convenient, it cannot replace all classroom interaction. Therefore, teachers continue to play an important role.","focus":"Linking & Clauses"},{"type":"fill","q":"Although _____ was tired, he studied.","answers":["he"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"Although he was tired, but he studied.","answers":["Although he was tired, he studied."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"Although / tired, / was / studied / he / he","answers":["Although he was tired, he studied."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: Although he was tired, but he studied.","answers":["Although he was tired, he studied."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"Despite _____, we went out.","answers":["the rain"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"Despite it rained, we went out.","answers":["Despite the rain, we went out."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"went / out / rain, / we / the / Despite","answers":["Despite the rain, we went out."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: Despite it rained, we went out.","answers":["Despite the rain, we went out."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"She stayed home _____ she was ill.","answers":["because"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"She stayed home because of she was ill.","answers":["She stayed home because she was ill."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"because / was / She / home / ill / stayed / she","answers":["She stayed home because she was ill."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: She stayed home because of she was ill.","answers":["She stayed home because she was ill."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"order","q":"was / he / missed / the / therefore, / bus / late; / He","answers":["He was late; therefore, he missed the bus."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: He was late, therefore he missed the bus.","answers":["He was late; therefore, he missed the bus."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"write","q":"Viết câu tiếng Anh về môi trường có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"She stayed home because she was ill.","focus":"Linking & Clauses"},{"type":"write","q":"Viết câu tiếng Anh về trường học có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"He was late; therefore, he missed the bus.","focus":"Linking & Clauses"},{"type":"write","q":"Viết đoạn 40–70 từ về lợi ích học tiếng Anh, dùng ít nhất hai cấu trúc vừa học.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"I like tea, but I also enjoy coffee.","focus":"Linking & Clauses"}]},{"title":"Passive Voice","vi":"Câu bị động","questions":[{"q":"The research ___ in 2024.","options":["conducted","was conducted","is conduct"],"answer":"was conducted","explain":"Bị động quá khứ: was/were + V3."},{"q":"New rules ___ every year.","options":["introduce","are introduced","introduced"],"answer":"are introduced","explain":"Bị động hiện tại đơn: am/is/are + V3."},{"q":"The results have ___ published.","options":["been","be","being"],"answer":"been","explain":"Present perfect passive: have/has been + V3."},{"q":"This problem can ___ solved.","options":["be","being","been"],"answer":"be","explain":"Modal passive: can be + V3."},{"q":"English ___ widely around the world.","options":["speaks","is spoken","is speaking"],"answer":"is spoken","explain":"Chủ ngữ chịu tác động, dùng bị động."},{"type":"fill","q":"The reports ___ (publish) yesterday.","answers":["were published"],"explain":"Passive past: were + V3."},{"type":"correct","q":"English speaks in many countries.","answers":["English is spoken in many countries."],"explain":"English là đối tượng được sử dụng; passive."},{"type":"order","q":"will / published / the results / be / tomorrow","answers":["The results will be published tomorrow."],"explain":"Will be + past participle."},{"type":"rewrite","q":"Change to passive: Researchers conducted the survey.","answers":["The survey was conducted by researchers.","The survey was conducted."],"explain":"Was + V3."},{"type":"fill","q":"A new hospital is ___ (build) right now.","answers":["being built"],"explain":"Present continuous passive: is being + V3."},{"type":"correct","q":"The school was build in 2010.","answers":["The school was built in 2010."],"explain":"Bị động dùng past participle: built."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: câu bị động.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"New classrooms were built last year.","focus":"Passive Voice"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Passive Voice.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"New classrooms were built last year. More educational resources will be provided next term.","focus":"Passive Voice"},{"type":"fill","q":"The letter was _____ yesterday.","answers":["sent"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"The letter send yesterday.","answers":["The letter was sent yesterday."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"The / sent / letter / yesterday / was","answers":["The letter was sent yesterday."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: The letter send yesterday.","answers":["The letter was sent yesterday."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"The room is _____ every day by staff.","answers":["cleaned"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"The room is clean every day by staff.","answers":["The room is cleaned every day by staff."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"is / room / day / staff / cleaned / The / every / by","answers":["The room is cleaned every day by staff."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: The room is clean every day by staff.","answers":["The room is cleaned every day by staff."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"fill","q":"The bridge was _____ in 1990.","answers":["built"],"explain":"Điền hình thức phù hợp theo quy tắc của chủ điểm."},{"type":"correct","q":"The bridge was build in 1990.","answers":["The bridge was built in 1990."],"explain":"Sửa dạng từ/cấu trúc sai để hoàn thành câu."},{"type":"order","q":"was / 1990 / in / built / bridge / The","answers":["The bridge was built in 1990."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: The bridge was build in 1990.","answers":["The bridge was built in 1990."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"order","q":"English / countries / spoken / many / in / is","answers":["English is spoken in many countries."],"explain":"Sắp xếp thành câu hoàn chỉnh và dùng đúng cấu trúc."},{"type":"rewrite","q":"Viết lại câu sau cho đúng ngữ pháp, giữ nguyên ý: English speak in many countries.","answers":["English is spoken in many countries."],"explain":"Diễn đạt lại câu chính xác, không đổi nội dung."},{"type":"write","q":"Viết câu tiếng Anh về môi trường có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"The bridge was built in 1990.","focus":"Passive Voice"},{"type":"write","q":"Viết câu tiếng Anh về trường học có dùng chủ điểm này.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"English is spoken in many countries.","focus":"Passive Voice"},{"type":"write","q":"Viết đoạn 40–70 từ về lợi ích học tiếng Anh, dùng ít nhất hai cấu trúc vừa học.","hint":"Viết đầy đủ chủ ngữ, động từ; kiểm tra ngữ pháp và chính tả.","sample":"The test will be checked tomorrow.","focus":"Passive Voice"}]}];
const LESSONS=[[["Chủ ngữ số ít", "He/she/it và các cụm each, every, the number of thường dùng động từ số ít ở hiện tại đơn.", "Each student **has** a textbook. / The number of pupils **is** rising."], ["Chủ ngữ số nhiều", "They, many, several và danh từ số nhiều thường dùng are/have/động từ nguyên mẫu.", "The students **are** ready. / Many teachers **work** here."]], [["Hiện tại và quá khứ", "Hiện tại đơn diễn tả thói quen; quá khứ đơn diễn tả việc đã kết thúc tại thời điểm xác định.", "She **studies** every day. / I **visited** Hanoi yesterday."], ["Tiếp diễn và hoàn thành", "Quá khứ tiếp diễn mô tả việc đang xảy ra; hiện tại hoàn thành diễn tả trải nghiệm hoặc sự kéo dài đến hiện tại.", "I **was reading**. / She **has lived** here since 2020."]], [["A và an", "Dùng a/an trước danh từ đếm được số ít. Chọn theo âm đầu: an hour, a university.", "An **honest** person; a **useful** book."], ["The và không dùng mạo từ", "The cho đối tượng cụ thể/duy nhất; không dùng mạo từ khi nói chung về danh từ số nhiều hoặc danh từ không đếm được.", "**The** sun; **water** is important."]], [["Danh từ đếm được", "Đếm được: one book, two books; dùng many, a few, several.", "There are **many facilities**."], ["Danh từ không đếm được", "Information, advice, traffic, furniture, equipment... không thêm -s khi mang nghĩa không đếm được.", "Some **information**; a piece of **advice**."]], [["Few và a few", "**Few** = gần như không có, hàm ý thiếu; **a few** = có một ít, vẫn có. Cả hai đi với danh từ đếm được số nhiều.", "**Few** students came (rất ít, đáng tiếc). / **A few** students came (có một số)."], ["Little và a little", "**Little** = hầu như không có, hàm ý thiếu; **a little** = một ít, vẫn còn. Cả hai đi với danh từ không đếm được.", "We have **little** time (không đủ). / We have **a little** time (vẫn còn ít thời gian)."], ["Many, much và a lot of", "Many + danh từ đếm được số nhiều; much + danh từ không đếm được; a lot of dùng với cả hai.", "**Many** cars; **much** noise; **a lot of** water/books."]], [["Điều kiện loại 1", "If + hiện tại đơn, will + V để nói về khả năng có thật trong tương lai.", "If it **rains**, we **will stay** home."], ["Điều kiện loại 2 và 3", "Loại 2: If + quá khứ đơn, would + V. Loại 3: If + had + V3, would have + V3.", "If I **were** rich, I **would travel**. / If I **had known**, I **would have helped**."]], [["Who / which / that", "Who chỉ người, which chỉ vật, that có thể thay thế trong nhiều mệnh đề quan hệ xác định.", "The teacher **who** helped me; the book **that** I read."], ["Where và mệnh đề không xác định", "Where chỉ nơi chốn; mệnh đề không xác định sau dấu phẩy không dùng that.", "The school **where** I study. / My sister, **who** lives in Hue, ..."]], [["Động từ theo sau V-ing", "Enjoy, avoid, finish, suggest thường đi với V-ing.", "I enjoy **reading**."], ["Động từ theo sau to V", "Decide, hope, plan, want thường đi với to V. Sau giới từ to của look forward to dùng V-ing.", "We decided **to leave**. / I look forward to **meeting** you."]], [["Because, although, but", "Because + mệnh đề nguyên nhân; although + mệnh đề nhượng bộ; không dùng although...but... cùng mệnh đề.", "Although it rained, we went out."], ["Despite và therefore", "Despite + danh từ/V-ing; therefore diễn đạt kết quả, cần dấu câu phù hợp khi nối hai mệnh đề độc lập.", "Despite **the rain**, ... / It rained; **therefore**, ..."]], [["Bị động hiện tại và quá khứ", "Be + V3. Hiện tại: am/is/are + V3; quá khứ: was/were + V3.", "English **is spoken**. / The bridge **was built**."], ["Bị động tương lai và chia thì", "Will be + V3; have/has been + V3.", "The tests **will be checked**. / The work **has been finished**."]]];
const NAMES={choice:'Chọn đáp án đúng',fill:'Điền từ vào chỗ trống',correct:'Tìm và sửa lỗi',order:'Sắp xếp từ thành câu',rewrite:'Viết lại câu',write:'Tự viết câu và đoạn'};
const GROUPS=['choice','fill','correct','order','rewrite','write'];

const LESSON_EXAMPLES=[[[["Each student needs support.","Mỗi học sinh đều cần được hỗ trợ.","Each student là chủ ngữ số ít nên dùng needs."],["The number of applicants is increasing.","Số lượng ứng viên đang tăng.","The number of + danh từ số nhiều vẫn dùng động từ số ít."]],[["Many students use computers at school.","Nhiều học sinh dùng máy tính ở trường.","Many students là chủ ngữ số nhiều nên dùng use."],["The teachers have new materials.","Các giáo viên có tài liệu mới.","The teachers là số nhiều nên dùng have, không dùng has."]]],[[["She studies English every day.","Cô ấy học tiếng Anh mỗi ngày.","Thói quen hằng ngày → hiện tại đơn."],["They visited the museum last week.","Họ đã thăm bảo tàng tuần trước.","Last week là thời gian đã kết thúc → quá khứ đơn."]],[["She has lived here since 2020.","Cô ấy đã sống ở đây từ năm 2020.","Since + mốc thời gian kéo dài đến hiện tại → hiện tại hoàn thành."],["I was studying when he called.","Tôi đang học thì anh ấy gọi.","Hành động đang diễn ra tại thời điểm trong quá khứ → quá khứ tiếp diễn."]]],[[["I bought a book yesterday.","Hôm qua tôi mua một cuốn sách.","A đứng trước âm phụ âm /b/."],["She waited for an hour.","Cô ấy đã đợi một giờ.","Hour có h câm, bắt đầu bằng âm nguyên âm → an."]],[["The sun rises in the east.","Mặt trời mọc ở hướng đông.","The dùng với đối tượng duy nhất."],["Water is essential for life.","Nước thiết yếu cho sự sống.","Water nói chung là danh từ không đếm được nên không cần a/an/the."]]],[[["There are many facilities in my city.","Thành phố tôi có nhiều cơ sở vật chất.","Facilities là danh từ đếm được số nhiều."],["I have three books.","Tôi có ba cuốn sách.","Book là danh từ đếm được, thêm -s khi số nhiều."]],[["The city has heavy traffic.","Thành phố có giao thông đông đúc.","Traffic không đếm được, không viết traffics."],["The teacher gave us useful information.","Giáo viên cung cấp cho chúng tôi thông tin hữu ích.","Information không đếm được, không viết informations."]]],[[["Few students attended the meeting.","Rất ít học sinh tham dự cuộc họp.","Few mang sắc thái thiếu hụt, gần như không có."],["A few students attended the meeting.","Có một vài học sinh tham dự cuộc họp.","A few nhấn mạnh vẫn có một số học sinh."]],[["We have little time left.","Chúng ta gần như không còn thời gian.","Little mang sắc thái không đủ."],["We have a little time left.","Chúng ta vẫn còn một chút thời gian.","A little nhấn mạnh vẫn còn một lượng nhất định."]],[["Many cars use this road.","Có nhiều xe sử dụng con đường này.","Many + danh từ đếm được số nhiều."],["There is much noise here, but there are a lot of parks nearby.","Ở đây có nhiều tiếng ồn nhưng gần đó có nhiều công viên.","Much + danh từ không đếm được; a lot of dùng được với số nhiều."]]],[[["If it rains, we will stay home.","Nếu trời mưa, chúng tôi sẽ ở nhà.","If + hiện tại đơn, mệnh đề chính will + V."],["If she studies harder, she will improve.","Nếu cô ấy học chăm hơn, cô ấy sẽ tiến bộ.","Không đặt will ngay sau if trong điều kiện loại 1 thông thường."]],[["If I had more time, I would read more.","Nếu tôi có nhiều thời gian hơn, tôi sẽ đọc nhiều hơn.","Điều kiện loại 2 diễn tả tình huống giả định ở hiện tại."],["If I had studied, I would have passed.","Nếu tôi đã học, tôi đã đỗ.","Điều kiện loại 3 diễn tả giả định trái với quá khứ."]]],[[["The teacher who helped me is kind.","Giáo viên đã giúp tôi rất tốt bụng.","Who thay thế người."],["The book that I borrowed is useful.","Cuốn sách tôi mượn rất hữu ích.","That thay thế vật trong mệnh đề xác định."]],[["This is the school where I studied.","Đây là ngôi trường tôi từng học.","Where thay thế địa điểm."],["My sister, who lives in Hue, is a doctor.","Chị gái tôi, người sống ở Huế, là bác sĩ.","Mệnh đề không xác định ngăn bằng dấu phẩy và không dùng that."]]],[[["I enjoy reading books.","Tôi thích đọc sách.","Enjoy + V-ing."],["We avoid making noise.","Chúng tôi tránh gây tiếng ồn.","Avoid + V-ing."]],[["She decided to study abroad.","Cô ấy quyết định đi du học.","Decide + to V."],["I look forward to meeting you.","Tôi mong được gặp bạn.","To ở look forward to là giới từ, theo sau bằng V-ing."]]],[[["Because it rained, we stayed home.","Vì trời mưa nên chúng tôi ở nhà.","Because nêu nguyên nhân."],["Although it rained, we went out.","Mặc dù trời mưa, chúng tôi vẫn ra ngoài.","Although nêu sự nhượng bộ; không thêm but ở mệnh đề sau."]],[["Despite the rain, we went out.","Dù trời mưa, chúng tôi vẫn ra ngoài.","Despite + danh từ/cụm danh từ."],["It was raining; therefore, we stayed home.","Trời đang mưa; vì vậy, chúng tôi ở nhà.","Therefore liên kết kết quả; có thể dùng dấu chấm phẩy."]]],[[["English is spoken in many countries.","Tiếng Anh được sử dụng ở nhiều quốc gia.","Hiện tại bị động: am/is/are + V3."],["The bridge was built in 1990.","Cây cầu được xây năm 1990.","Quá khứ bị động: was/were + V3."]],[["The tests will be checked tomorrow.","Các bài kiểm tra sẽ được chấm vào ngày mai.","Tương lai bị động: will be + V3."],["The work has been completed.","Công việc đã được hoàn thành.","Hiện tại hoàn thành bị động: has/have been + V3."]]]];
const KEY='GRAMMAR_KNOWLEDGE_FIRST_V1';
let storage;try{storage=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){storage={}};
let topic=5,phase='learn';
const $=q=>document.querySelector(q);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=x=>String(x??'').toLowerCase().normalize('NFKC').replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'').trim();
function record(){storage[topic]??={seen:0,ans:{},graded:{}};return storage[topic]}
function save(){localStorage.setItem(KEY,JSON.stringify(storage))}
function type(q){return q.type||'choice'}
function group(t){return DATA[topic].questions.map((q,i)=>({...q,id:i})).filter(q=>type(q)===t)}
function chooseTopic(i){topic=i;phase=record().seen>=LESSONS[i].length?'exercise':'learn';render()}
function grade(q,v){if(type(q)==='write')return {write:true,issues:writingReview(v,q.focus||DATA[topic].title),sample:q.sample||'',empty:!String(v||'').trim()};
  const correct=(q.answers||[q.answer]).some(a=>norm(a)===norm(v));return {correct,accepted:q.answers||[q.answer],explain:q.explain||'Kiểm tra cách dùng cấu trúc trong câu.'}}
function writingReview(raw,focus){const s=String(raw||'').trim(),issues=[];function add(before,after,why){if(!issues.some(x=>x.before===before))issues.push({before,after,why})}if(!s)return[{before:'Chưa nhập bài',after:'Viết câu trả lời',why:'Cần có nội dung để kiểm tra.'}];if(!/^[A-Z]/.test(s))add('Chữ đầu câu','Viết hoa chữ đầu câu','Câu tiếng Anh cần bắt đầu bằng chữ hoa.');if(!/[.!?]$/.test(s))add('Dấu câu cuối','Thêm dấu chấm hoặc dấu câu phù hợp','Kiểm tra dấu kết thúc câu.');const spell={teh:'the',becuase:'because',becouse:'because',studnets:'students',techonology:'technology',educaters:'educators',improvment:'improvement',confidance:'confidence',personlised:'personalised',recieve:'receive',knowlege:'knowledge',enviroment:'environment',seperate:'separate',definately:'definitely',neccessary:'necessary',adress:'address',diffrent:'different',writting:'writing',grammer:'grammar',becaming:'becoming'};for(const m of s.matchAll(/\b(?:teh|becuase|becouse|studnets|techonology|educaters|improvment|confidance|personlised|recieve|knowlege|enviroment|seperate|definately|neccessary|adress|diffrent|writting|grammer|becaming)\b/gi))add(m[0],spell[m[0].toLowerCase()],'Lỗi chính tả thường gặp.');const rules=[[/\b(?:students|teachers|people|children)\s+(?:is|was|has|does)\b/gi,'Chủ ngữ số nhiều cần are/were/have/do','Kiểm tra hòa hợp chủ ngữ–động từ.'],[/\b(?:this|it|technology|education)\s+(?:are|have|do)\b/gi,'Chủ ngữ số ít cần is/has/does','Kiểm tra hòa hợp chủ ngữ–động từ.'],[/\b(?:this|it|technology|education)\s+(?:allow|enable|help|provide|improve)\b/gi,'Chia động từ số ít: allows/enables/helps/provides/improves','Hiện tại đơn với chủ ngữ số ít.'],[/\b(?:can|could|should|must|might|may|will|would)\s+(?:helps|allows|enables|improves|provides|studies|makes|goes)\b/gi,'Modal + động từ nguyên mẫu','Sau động từ khuyết thiếu dùng bare infinitive.'],[/\b(?:can|could|should|will|would)\s+to\s+\w+/gi,'Bỏ to sau modal','Modal + V không có to.'],[/\bby\s+(?:practice|practise|use|learn|study|teach|provide|read|work|improve)\b/gi,'By + V-ing','Sau by dùng danh động từ.'],[/\b(?:a|an)\s+(?:information|advice|furniture|traffic|money|pollution|homework)\b/gi,'Bỏ a/an hoặc dùng a piece of (tùy danh từ)','Các danh từ này không đếm được.'],[/\b(?:many|a few)\s+(?:information|advice|traffic|money|pollution|homework)\b/gi,'Dùng much / a little / a lot of','Danh từ không đếm được không dùng many/a few.'],[/\b(?:much|a little)\s+(?:students|teachers|books|cars|lessons)\b/gi,'Dùng many / a few / a lot of','Danh từ số nhiều đếm được không dùng much/a little.'],[/\b(?:a|an)\s+(?:students|teachers|books|cars|lessons)\b/gi,'Bỏ mạo từ hoặc chuyển sang số ít','A/an không đi với danh từ đếm được số nhiều.'],[/\balthough\b[^.!?]{0,130},\s*but\b/gi,'Although ..., ... (bỏ but)','Không kết hợp although và but trong cùng cấu trúc.'],[/\b(?:despite|in spite of)\s+(?:he|she|they|it|we)\s+(?:is|are|was|were|can|will)\b/gi,'Dùng although + clause hoặc despite + N/V-ing','Despite không đi trực tiếp trước một mệnh đề hữu hạn.'],[/\b(?:allows?|enables?)\s+(?:they|he|she|we|i)\s+to\b/gi,'Dùng them/him/her/us/me','Sau allow/enable dùng tân ngữ.'],[/\b(?:allows?|enables?)\s+(?:students|people|learners|them|him|her)\s+(?:learn|improve|study|access|develop)\b/gi,'Allows/enables + somebody + to V','Thiếu to trong cấu trúc.'],[/\b(?:is|are|was|were)\s+(?:build|write|make|conduct|publish)\b/gi,'Be + past participle (built/written/made/conducted/published)','Cấu trúc bị động.'],[/\b(?:decide|decided|want|wants|hope|hoped)\s+(?:join|joining|study|studying)\b/gi,'Decide/want/hope + to V','Kiểm tra dạng động từ sau động từ chính.'],[/\b(?:enjoy|enjoys|suggest|suggests)\s+to\s+\w+/gi,'Enjoy/suggest + V-ing','Các động từ này đi với V-ing.'],[/\b(?:informations|advices|furnitures|homeworks|traffics)\b/gi,'Dùng danh từ không đếm được, không thêm -s','Kiểm tra dạng số nhiều.'],[/\bif\s+(?:he|she|it|they|we|i)\s+will\s+\w+/gi,'Mệnh đề if loại 1 dùng hiện tại đơn','Không dùng will trong mệnh đề điều kiện loại 1.']];for(const [re,after,why] of rules){for(const m of s.matchAll(re))add(m[0],after,why)}if(focus==='Relative Clauses' && /,\s*that\b/i.test(s))add('Mệnh đề quan hệ , that','Dùng , who / , which','Mệnh đề quan hệ không xác định không dùng that.');if(focus==='Passive Voice' && /\b(?:is|are|was|were)\s+\w+ing\b/i.test(s)){};if(focus==='Conditionals' && /\bif\b/i.test(s)===false)add('Chưa thấy if','Thử dùng một mệnh đề điều kiện','Đây là gợi ý kiểm tra chủ điểm, không nhất thiết là lỗi.');if(focus==='Linking & Clauses' && !/\b(?:although|because|therefore|however|while|despite|as a result)\b/i.test(s))add('Chưa thấy từ nối','Thử thêm từ nối phù hợp với ý nghĩa','Gợi ý để luyện liên kết câu.');return issues;}

function feedback(r){
 if(r.write)return `<div class="result ${r.issues.length?'bad':'good'}"><b>${r.empty?'Chưa có bài viết':r.issues.length?'Những điểm cần xem lại':'Chưa phát hiện lỗi theo các quy tắc hiện có'}</b>${r.issues.length?`<ul>${r.issues.map(i=>`<li><b>${esc(i.before)}</b> → ${esc(i.after)}. ${esc(i.why)}</li>`).join('')}</ul>`:''}<div class="muted">Ví dụ tham khảo: ${esc(r.sample)}. Bài tự viết cần giáo viên xem thêm về ý nghĩa và độ tự nhiên; không chấm đúng/sai tuyệt đối bằng cách so với một câu mẫu.</div></div>`;
 return `<div class="result ${r.correct?'good':'bad'}"><b>${r.correct?'Chính xác':'Cần xem lại'}</b>${r.correct?'':`<div>Đáp án tham khảo: <b>${r.accepted.map(esc).join(' / ')}</b></div>`}<div>${esc(r.explain)}</div></div>`}
function renderNav(){$('#nav').innerHTML=`<div class="top-btn active">Bài 06 · ${esc(DATA[5].title)}<small>Học kiến thức → Bài tập → Chữa bài</small></div><p class="muted"><a href="../../">← Danh sách 10 bài Grammar</a></p>`;}
function renderLearn(){
 let r=record(),index=Math.min(r.seen,LESSONS[topic].length-1),l=LESSONS[topic][index];
 const progress=LESSONS[topic].map((_,i)=>`<span style="display:inline-block;margin-right:8px;color:${i<r.seen?'#18815f':'#6b7290'}">${i<r.seen?'✓':'○'} Phần ${i+1}</span>`).join('');
 $('#body').innerHTML=`<h2>Học kiến thức: ${esc(DATA[topic].title)}</h2><p class="muted">Đọc lần lượt từng phần và chọn “Đã hiểu” để mở phần tiếp theo.</p>${progress}<div class="lesson"><div class="lesson-bar">KIẾN THỨC ${index+1} — ${esc(l[0])}</div><div class="lesson-body"><p>${esc(l[1]).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')}</p><div class="sample"><b>Ví dụ nhanh:</b> ${esc(l[2]).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')}</div><div class="examples-title">Ví dụ minh họa & giải thích</div>${(LESSON_EXAMPLES[topic]?.[index]||[]).map((ex,j)=>`<div class="example-card"><b>Ví dụ ${j+1}</b><div class="example-en">${esc(ex[0])}</div><div class="example-vi">${esc(ex[1])}</div><div class="example-why"><b>Giải thích:</b> ${esc(ex[2])}</div></div>`).join('')}<button class="btn" id="understand">✓ Đã hiểu — ${index+1<LESSONS[topic].length?'học phần tiếp theo':'chuyển sang bài tập'}</button></div></div><p class="muted">Bạn có thể chọn lại chủ điểm để xem kiến thức trước khi làm bài.</p>`;
 $('#understand').onclick=()=>{r.seen=Math.min(LESSONS[topic].length,r.seen+1);save();if(r.seen>=LESSONS[topic].length)phase='exercise';render()}
}
function renderExercise(){
 const r=record();
 let total=0,passed=0,reviewed=0,all=true;
 let blocks=GROUPS.map((t,k)=>{
  const qs=group(t),graded=r.graded[t];
  if(!graded)all=false;
  if(graded)for(const q of qs){const a=graded[q.id];if(a?.write){if(!a.empty)reviewed++;}else{total++;if(a?.correct)passed++;}}
  return `<section class="exercise"><div class="exercise-bar"><span>EXERCISE ${k+1} — ${NAMES[t]}</span><span>${qs.length} câu</span></div><div class="exbody">${qs.map((q,j)=>{
    const result=graded?.[q.id],v=r.ans[q.id]||'';
    return `<div class="question"><b>${j+1}. ${esc(q.q)}</b>${t==='choice'?`<div class="choices">${q.options.map(o=>`<button class="choice ${v===o?'on':''}" data-pick="${q.id}" data-value="${esc(o)}">${esc(o)}</button>`).join('')}</div>`:t==='write'?`<textarea class="entry long" data-input="${q.id}" placeholder="Tự viết câu hoặc đoạn văn...">${esc(v)}</textarea>`:`<input class="entry" data-input="${q.id}" value="${esc(v)}" placeholder="${t==='order'?'Nhập câu đã sắp xếp':'Nhập câu trả lời'}">`}${result?feedback(result):''}</div>`
   }).join('')}</div><div class="exfooter"><button class="btn" data-grade="${t}">Kiểm tra bài ${k+1}</button>${graded?`<span class="muted">${t==='write'?'Đã nhận xét các bài tự viết':`${qs.filter(q=>graded[q.id]?.correct).length}/${qs.length} câu đúng`}</span>`:''}</div></section>`
 }).join('');
 $('#body').innerHTML=`<h2>${esc(DATA[topic].title)} — Luyện tập</h2><p class="muted">Mỗi dạng có ít nhất 5 câu. Kiểm tra từng bài để xem đáp án và giải thích ngay bên dưới câu.</p><div class="steps"><button class="step" id="relearn">← Ôn lại kiến thức</button><button class="step active">Luyện tập</button></div>${blocks}${all?`<div class="summary"><h3>Tổng kết bài tập</h3><strong>${passed}/${total} câu đúng</strong><p>Đã kiểm tra ${total} câu có đáp án xác định. ${reviewed} bài tự viết đã được nhận xét riêng, không tính vào điểm đúng/sai.</p><div class="progress"><span style="width:${total?100*passed/total:0}%"></span></div><button class="btn secondary" id="retry">Làm lại toàn bộ bài tập</button></div>`:`<div class="summary"><b>Chưa hoàn thành toàn bộ bài tập</b><p>Đã kiểm tra ${GROUPS.filter(t=>r.graded[t]).length}/${GROUPS.length} dạng. Hãy làm và kiểm tra đủ các dạng để xem tổng kết.</p></div>`}`;
 $('#relearn').onclick=()=>{r.seen=0;phase='learn';save();render()};
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{r.ans[b.dataset.pick]=b.dataset.value;delete r.graded[GROUPS.find(t=>group(t).some(q=>q.id==b.dataset.pick))];save();render()});
 document.querySelectorAll('[data-input]').forEach(el=>el.oninput=()=>{r.ans[el.dataset.input]=el.value;const t=GROUPS.find(t=>group(t).some(q=>q.id==el.dataset.input));delete r.graded[t];save()});
 document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-input]').forEach(el=>r.ans[el.dataset.input]=el.value);const t=b.dataset.grade;r.graded[t]={};group(t).forEach(q=>r.graded[t][q.id]=grade(q,r.ans[q.id]||''));save();render();document.querySelector(`[data-grade="${t}"]`)?.closest('.exercise')?.scrollIntoView({behavior:'smooth',block:'start'})});
 if($('#retry'))$('#retry').onclick=()=>{r.ans={};r.graded={};save();render()};
}
function render(){renderNav();$('#heading').textContent=DATA[topic].title;const r=record();if(phase==='exercise'&&r.seen>=LESSONS[topic].length)renderExercise();else renderLearn()}
chooseTopic(5);
</script></body></html>
