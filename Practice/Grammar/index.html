<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Practice | IELTS</title><style>
:root{--p:#6743d8;--ink:#211747;--muted:#69738e;--line:#e2e5f2;--good:#188364;--bad:#b74752}*{box-sizing:border-box}body{margin:0;font:14px/1.65 system-ui,Arial;background:linear-gradient(140deg,#f6f2ff,#edf7ff);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:14px max(20px,calc((100vw - 1250px)/2));display:flex;align-items:center;gap:20px}a{color:var(--p);font-weight:750;text-decoration:none}.wrap{max-width:1250px;margin:25px auto;padding:0 18px}h1{font-size:32px;margin:4px 0}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.topic{background:#fff;text-align:left;border:1px solid var(--line);border-radius:13px;padding:13px;cursor:pointer;min-height:104px}.topic b{display:block;font-size:14px;margin-top:5px}.topic small{color:var(--muted)}.topic.active{border:2px solid var(--p);background:#f5f1ff}.number{display:inline-flex;background:var(--p);color:#fff;border-radius:7px;padding:3px 9px;font-weight:800}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:17px}.question{border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0}.question b{font-size:15px}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.choice{border:1px solid #d9d6ed;border-radius:8px;background:white;padding:7px 12px;cursor:pointer}.choice.chosen{background:#ede8ff;border-color:var(--p)}.type{font-size:11px;color:#5941ab;font-weight:800;margin-bottom:5px}.answer{display:block;width:100%;max-width:800px;padding:11px;border:1px solid #ccd2e2;border-radius:8px;margin:10px 0;font:inherit}.long{min-height:100px;resize:vertical}.btn{background:var(--p);border:0;border-radius:9px;color:#fff;font-weight:800;padding:10px 16px;cursor:pointer}.btn.alt{background:white;border:1px solid var(--line);color:var(--ink)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.feedback{margin-top:10px;padding:11px 13px;border:1px solid #d3dfeb;background:#f5f8fd;border-radius:9px}.feedback.good{background:#f0fbf5;border-color:#b9e7d0}.feedback.bad{background:#fff7f4;border-color:#f0c4bb}.feedback p{margin:5px 0;color:inherit}.small{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.score{font-weight:800;color:var(--good)}.explanation{font-size:12px;margin-top:7px}.suggest{padding-left:18px;margin:7px 0}.question.correct{border-color:#b9e7d0}.question.incorrect{border-color:#f0c4bb}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{margin:16px auto}h1{font-size:25px}}
</style></head><body><header><a href="../">← Kho luyện tập</a><strong>Grammar Practice</strong></header><main class="wrap"><h1>Grammar Practice</h1><p>Luyện đa dạng dạng bài: chọn đáp án, điền từ, sắp xếp câu, sửa lỗi, viết lại câu và tự viết. Hệ thống đưa ra cách sửa và giải thích theo từng câu.</p><div id="topics" class="grid"></div><section class="panel" id="work"></section></main><script>
const DATA=[{"title":"Subject–Verb Agreement","vi":"Hòa hợp chủ ngữ – động từ","questions":[{"q":"The number of students ___ increasing.","options":["is","are","be"],"answer":"is","explain":"The number of + danh từ số nhiều được xem là chủ ngữ số ít."},{"q":"Each student ___ access to a computer.","options":["have","has","having"],"answer":"has","explain":"Each + danh từ số ít đi với động từ số ít."},{"q":"Many teachers ___ technology in class.","options":["uses","use","using"],"answer":"use","explain":"Many teachers là chủ ngữ số nhiều."},{"q":"One of the main reasons ___ the cost.","options":["is","are","be"],"answer":"is","explain":"Chủ ngữ chính là One."},{"q":"Neither of the options ___ ideal.","options":["are","is","have"],"answer":"is","explain":"Trong văn phong trang trọng, neither of thường đi với động từ số ít."},{"type":"fill","q":"Neither the teacher nor the students ___ ready.","answers":["are"],"explain":"Động từ gần students (số nhiều) nên dùng are."},{"type":"correct","q":"Each of the students have a laptop.","answers":["Each of the students has a laptop."],"explain":"Each là chủ ngữ số ít, dùng has."},{"type":"order","q":"responsible / for / is / the teacher / the class","answers":["The teacher is responsible for the class."],"explain":"Trật tự: chủ ngữ + is + responsible for + noun."},{"type":"rewrite","q":"Rewrite using “There”: Many problems exist in large cities.","answers":["There are many problems in large cities."],"explain":"There are + plural noun."},{"type":"fill","q":"The quality of these lessons ___ improved.","answers":["has"],"explain":"The quality là chủ ngữ chính số ít."},{"type":"correct","q":"The number of applicants are rising.","answers":["The number of applicants is rising."],"explain":"The number of + danh từ số nhiều dùng động từ số ít."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: hòa hợp chủ ngữ – động từ.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"Each student has access to a library.","focus":"Subject–Verb Agreement"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Subject–Verb Agreement.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Each student has a different learning style. Many teachers adapt their lessons to meet these needs.","focus":"Subject–Verb Agreement"}]},{"title":"Tenses","vi":"Các thì thường gặp","questions":[{"q":"The school ___ online lessons since 2020.","options":["has offered","offered","offers"],"answer":"has offered","explain":"Since + mốc thời gian kéo dài đến hiện tại → present perfect."},{"q":"Last year, the government ___ new rules.","options":["introduces","has introduced","introduced"],"answer":"introduced","explain":"Last year là mốc quá khứ đã kết thúc."},{"q":"At the moment, the students ___ a test.","options":["take","are taking","took"],"answer":"are taking","explain":"At the moment gợi ý present continuous."},{"q":"By the time she arrived, the class ___.","options":["started","had started","starts"],"answer":"had started","explain":"Hành động xảy ra trước một mốc quá khứ khác → past perfect."},{"q":"Technology ___ rapidly over the past decade.","options":["has developed","develops","developed"],"answer":"has developed","explain":"Over the past decade (đến nay) → present perfect."},{"type":"fill","q":"By the time we arrived, the lecture ___ (begin).","answers":["had begun"],"explain":"Hành động xảy ra trước một mốc quá khứ: past perfect."},{"type":"correct","q":"I have visited Hanoi yesterday.","answers":["I visited Hanoi yesterday."],"explain":"Yesterday là thời điểm quá khứ xác định; dùng simple past."},{"type":"order","q":"has / since 2021 / worked / she / here","answers":["She has worked here since 2021."],"explain":"Present perfect + since."},{"type":"rewrite","q":"Rewrite with “since”: He started studying English in 2020 and still studies it.","answers":["He has studied English since 2020.","He has been studying English since 2020."],"explain":"Both present perfect and present perfect continuous are acceptable."},{"type":"fill","q":"Look! The children ___ (play) outside.","answers":["are playing"],"explain":"Look! cho thấy hành động đang diễn ra."},{"type":"correct","q":"She is knowing the answer.","answers":["She knows the answer."],"explain":"Know thường là stative verb, không dùng tiếp diễn trong nghĩa này."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: các thì thường gặp.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"The school has introduced new courses this year.","focus":"Tenses"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Tenses.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Education has changed rapidly in recent years. In the past, students relied mainly on printed books.","focus":"Tenses"}]},{"title":"Articles","vi":"Mạo từ a/an/the","questions":[{"q":"She is ___ honest teacher.","options":["a","an","the"],"answer":"an","explain":"Honest bắt đầu bằng âm nguyên âm vì h câm."},{"q":"___ internet has changed education.","options":["A","The","An"],"answer":"The","explain":"Thường dùng the internet."},{"q":"Students need ___ reliable information.","options":["a","an","—"],"answer":"—","explain":"Information là danh từ không đếm được."},{"q":"He bought ___ laptop yesterday.","options":["a","an","—"],"answer":"a","explain":"Laptop là danh từ đếm được số ít, đề cập lần đầu."},{"q":"___ education plays an important role in society.","options":["The","An","—"],"answer":"—","explain":"Education nói chung không cần mạo từ."},{"type":"fill","q":"She bought ___ umbrella.","answers":["an"],"explain":"Umbrella bắt đầu bằng âm nguyên âm."},{"type":"fill","q":"___ pollution is a serious problem in many cities.","answers":["∅","-","none","zero"],"explain":"Pollution nói chung không cần mạo từ."},{"type":"correct","q":"He gave me an useful suggestion.","answers":["He gave me a useful suggestion."],"explain":"Useful bắt đầu bằng âm /j/ (phụ âm), dùng a."},{"type":"order","q":"is / an / honest / person / she","answers":["She is an honest person."],"explain":"Honest có h câm."},{"type":"rewrite","q":"Rewrite with an article if needed: She is engineer.","answers":["She is an engineer."],"explain":"Engineer là danh từ nghề nghiệp đếm được số ít."},{"type":"fill","q":"We visited ___ Netherlands last year.","answers":["the"],"explain":"Tên nước Netherlands dùng the."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: mạo từ a/an/the.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"A university offers many useful resources.","focus":"Articles"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Articles.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"An effective school provides a supportive learning environment. Students can access reliable information in the library.","focus":"Articles"}]},{"title":"Countable & Uncountable Nouns","vi":"Danh từ đếm được và không đếm được","questions":[{"q":"My city has a lot of ___ during peak hours.","options":["traffic","traffics","a traffic"],"answer":"traffic","explain":"Traffic là danh từ không đếm được; không thêm -s và không dùng a/an trước traffic khi nói chung."},{"q":"There are many modern ___ in my neighborhood.","options":["facility","facilities","facilitys"],"answer":"facilities","explain":"Facility là danh từ đếm được; sau many cần danh từ số nhiều: facilities."},{"q":"The city council provided useful ___ about public transport.","options":["informations","an information","information"],"answer":"information","explain":"Information là danh từ không đếm được; không dùng informations hoặc an information."},{"q":"Living in a big city requires a lot of ___.","options":["moneys","money","a money"],"answer":"money","explain":"Money thường là danh từ không đếm được khi chỉ tiền bạc nói chung."},{"q":"There is ___ near the industrial zone.","options":["a severe pollution","severe pollution","many pollution"],"answer":"severe pollution","explain":"Pollution là danh từ không đếm được; không dùng a severe pollution trong ngữ cảnh này."},{"type":"fill","q":"There is too ___ traffic in the city.","answers":["much"],"explain":"Traffic không đếm được."},{"type":"correct","q":"She gave me three useful advices.","answers":["She gave me three useful pieces of advice.","She gave me some useful advice."],"explain":"Advice không đếm được; dùng pieces of advice."},{"type":"order","q":"received / some / useful / information / we","answers":["We received some useful information."],"explain":"Information không đếm được."},{"type":"rewrite","q":"Rewrite using “a piece of”: He shared advice with me.","answers":["He shared a piece of advice with me."],"explain":"A piece of advice chỉ một lời khuyên."},{"type":"fill","q":"The new campus has excellent ___. (facility)","answers":["facilities"],"explain":"Facilities là số nhiều."},{"type":"correct","q":"There are many furnitures in this room.","answers":["There is a lot of furniture in this room.","There is much furniture in this room."],"explain":"Furniture không đếm được."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: danh từ đếm được và không đếm được.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"Students need reliable information about careers.","focus":"Countable & Uncountable Nouns"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Countable & Uncountable Nouns.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Cities need better public transport and reliable information. Modern facilities can improve the quality of life.","focus":"Countable & Uncountable Nouns"}]},{"title":"Quantifiers","vi":"Từ chỉ lượng: many, much, a few, a little, a lot of","questions":[{"q":"There is too ___ noise in the city center at night.","options":["many","much","a few"],"answer":"much","explain":"Noise không đếm được; too much noise là cách dùng đúng."},{"q":"My town has ___ historical monuments that attract tourists.","options":["a little","much","a few"],"answer":"a few","explain":"Historical monuments là danh từ đếm được số nhiều; a few diễn tả có một vài công trình."},{"q":"There are only ___ bus routes operating after 10 PM.","options":["a few","a little","much"],"answer":"a few","explain":"Bus routes là danh từ đếm được số nhiều; only a few nhấn mạnh số lượng hạn chế."},{"q":"We need ___ more investment to improve local schools.","options":["many","a little","a few"],"answer":"a little","explain":"Investment ở đây chỉ nguồn vốn (không đếm được); a little more investment đúng ngữ pháp. A lot of more không tự nhiên; dùng a lot more investment."},{"q":"How ___ people live in your hometown?","options":["many","much","a little"],"answer":"many","explain":"People là danh từ đếm được số nhiều; How many people ...?"},{"q":"The city spends ___ money on public transport.","options":["a lot of","many","a few"],"answer":"a lot of","explain":"A lot of dùng được với cả danh từ đếm được số nhiều và không đếm được; money không đếm được."},{"type":"fill","q":"How ___ students joined the course?","answers":["many"],"explain":"How many + danh từ đếm được số nhiều."},{"type":"fill","q":"There is only ___ water left.","answers":["a little","little"],"explain":"Water không đếm được."},{"type":"correct","q":"There are much cars on the road.","answers":["There are many cars on the road."],"explain":"Cars đếm được số nhiều nên dùng many."},{"type":"order","q":"a few / attended / students / the workshop","answers":["A few students attended the workshop."],"explain":"A few + danh từ số nhiều."},{"type":"rewrite","q":"Rewrite using “a lot of”: There are many books in the library.","answers":["There are a lot of books in the library."],"explain":"A lot of dùng với danh từ đếm được số nhiều."},{"type":"fill","q":"We do not have ___ time to finish.","answers":["much","enough"],"explain":"Much time: lượng thời gian; enough time: đủ thời gian. Cả hai đều phù hợp trong câu phủ định."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: từ chỉ lượng: many, much, a few, a little, a lot of.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"Many students spend a little time reading every day.","focus":"Quantifiers"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Quantifiers.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Many students have a lot of assignments. However, a few hours of careful planning can reduce stress.","focus":"Quantifiers"}]},{"title":"Conditionals","vi":"Câu điều kiện","questions":[{"q":"If students practise regularly, they ___ improve.","options":["will","would","had"],"answer":"will","explain":"If + present simple, will + V (loại 1)."},{"q":"If I had more time, I ___ read more.","options":["will","would","had"],"answer":"would","explain":"Điều kiện giả định hiện tại → loại 2."},{"q":"If she had studied, she ___ passed.","options":["will have","would have","would"],"answer":"would have","explain":"Điều kiện trái quá khứ → loại 3."},{"q":"Unless you ___ carefully, you may make mistakes.","options":["read","will read","reading"],"answer":"read","explain":"Unless + present simple."},{"q":"If water reaches 100°C at standard pressure, it ___.","options":["boils","will boiling","boiled"],"answer":"boils","explain":"Sự thật khoa học → loại 0."},{"type":"fill","q":"If I ___ you, I would apologise.","answers":["were"],"explain":"If I were you: điều kiện loại 2."},{"type":"correct","q":"If she will study, she will pass.","answers":["If she studies, she will pass."],"explain":"Không dùng will trong mệnh đề if loại 1."},{"type":"order","q":"had / if / studied / he / passed / would have / he","answers":["If he had studied, he would have passed."],"explain":"Điều kiện loại 3."},{"type":"rewrite","q":"Rewrite using unless: If you do not revise, you will forget.","answers":["Unless you revise, you will forget."],"explain":"Unless = if ... not."},{"type":"fill","q":"If it rains tomorrow, we ___ indoors. (stay)","answers":["will stay"],"explain":"Loại 1: will + V."},{"type":"correct","q":"If I have more money, I would travel abroad.","answers":["If I had more money, I would travel abroad."],"explain":"Loại 2: if + past simple, would + V."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: câu điều kiện.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"If students study consistently, they will improve.","focus":"Conditionals"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Conditionals.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"If cities invest in public transport, traffic congestion will decrease. If I were a city planner, I would expand bus services.","focus":"Conditionals"}]},{"title":"Relative Clauses","vi":"Mệnh đề quan hệ","questions":[{"q":"The teacher ___ helped me was patient.","options":["which","who","where"],"answer":"who","explain":"Who thay thế người làm chủ ngữ."},{"q":"The book ___ I bought was useful.","options":["who","that","where"],"answer":"that","explain":"That có thể thay thế vật."},{"q":"This is the school ___ I studied.","options":["which","where","who"],"answer":"where","explain":"Where chỉ địa điểm."},{"q":"The student ___ essay won the prize is absent.","options":["whose","who","which"],"answer":"whose","explain":"Whose biểu thị sở hữu."},{"q":"The app, ___ is free, has many features.","options":["that","which","who"],"answer":"which","explain":"Mệnh đề quan hệ không xác định dùng which, không dùng that."},{"type":"fill","q":"The student ___ laptop was stolen reported it.","answers":["whose"],"explain":"Whose diễn đạt sở hữu."},{"type":"correct","q":"My brother, that works in London, is a doctor.","answers":["My brother, who works in London, is a doctor."],"explain":"Non-defining relative clause dùng who, không dùng that."},{"type":"order","q":"was / the school / built / where / I studied / recently","answers":["The school where I studied was built recently."],"explain":"Where nối mệnh đề quan hệ nơi chốn."},{"type":"rewrite","q":"Combine: I met a woman. She is a scientist.","answers":["I met a woman who is a scientist.","I met a woman that is a scientist."],"explain":"Who/that thay thế người trong mệnh đề xác định."},{"type":"fill","q":"This is the book ___ I told you about.","answers":["that","which"],"explain":"Which hoặc that đều dùng được trong mệnh đề quan hệ xác định."},{"type":"correct","q":"The place which I live is noisy.","answers":["The place where I live is noisy.","The place in which I live is noisy."],"explain":"Where / in which chỉ nơi chốn."},{"type":"write","q":"Viết 1 câu tiếng Anh về trường học hoặc cuộc sống, sử dụng đúng: mệnh đề quan hệ.","hint":"Viết một câu hoàn chỉnh, có chủ ngữ và động từ; kết thúc bằng dấu câu.","sample":"The teacher who helped me was very patient.","focus":"Relative Clauses"},{"type":"write","q":"Viết đoạn 2–3 câu (35–60 từ) về giáo dục hoặc đô thị; sử dụng ít nhất một cấu trúc thuộc chủ điểm Relative Clauses.","hint":"Tạo các câu liên kết về một ý, chú ý ngữ pháp và chính tả.","sample":"Students who receive feedback often improve faster. A school that offers personalised support can help them succeed.","focus":"Relative Clauses"}]},{"title":"Gerunds & Infinitives","vi":"V-ing và to V","questi const KEY='IELTS_GRAMMAR_EXPANDED_V1';let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let topic=0,section='all',answers={},report=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').replace(/[.!?]+$/,'').trim();function save(){state[topic]=answers;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function setTopic(i){topic=i;answers={...(state[i]||{})};report=null;section='all';render();$('#work').scrollIntoView({behavior:'smooth',block:'start'})}function types(q){return q.type||'choice'}const names={choice:'Chọn đáp án',fill:'Điền từ',correct:'Sửa lỗi',order:'Sắp xếp từ',rewrite:'Viết lại câu',write:'Tự viết'};function activeQuestions(){return DATA[topic].questions.map((q,i)=>({...q,index:i})).filter(q=>section==='all'||types(q)===section)}

function writingReview(raw,focus){const s=String(raw||'').trim(),issues=[];function add(before,after,why){if(!issues.some(x=>x.before===before))issues.push({before,after,why})}if(!s)return[{before:'Chưa nhập bài',after:'Viết câu trả lời',why:'Cần có nội dung để kiểm tra.'}];if(!/^[A-Z]/.test(s))add('Chữ đầu câu','Viết hoa chữ đầu câu','Câu tiếng Anh cần bắt đầu bằng chữ hoa.');if(!/[.!?]$/.test(s))add('Dấu câu cuối','Thêm dấu chấm hoặc dấu câu phù hợp','Kiểm tra dấu kết thúc câu.');const spell={teh:'the',becuase:'because',becouse:'because',studnets:'students',techonology:'technology',educaters:'educators',improvment:'improvement',confidance:'confidence',personlised:'personalised',recieve:'receive',knowlege:'knowledge',enviroment:'environment',seperate:'separate',definately:'definitely',neccessary:'necessary',adress:'address',diffrent:'different',writting:'writing',grammer:'grammar',becaming:'becoming'};for(const m of s.matchAll(/\b(?:teh|becuase|becouse|studnets|techonology|educaters|improvment|confidance|personlised|recieve|knowlege|enviroment|seperate|definately|neccessary|adress|diffrent|writting|grammer|becaming)\b/gi))add(m[0],spell[m[0].toLowerCase()],'Lỗi chính tả thường gặp.');const rules=[[/\b(?:students|teachers|people|children)\s+(?:is|was|has|does)\b/gi,'Chủ ngữ số nhiều cần are/were/have/do','Kiểm tra hòa hợp chủ ngữ–động từ.'],[/\b(?:this|it|technology|education)\s+(?:are|have|do)\b/gi,'Chủ ngữ số ít cần is/has/does','Kiểm tra hòa hợp chủ ngữ–động từ.'],[/\b(?:this|it|technology|education)\s+(?:allow|enable|help|provide|improve)\b/gi,'Chia động từ số ít: allows/enables/helps/provides/improves','Hiện tại đơn với chủ ngữ số ít.'],[/\b(?:can|could|should|must|might|may|will|would)\s+(?:helps|allows|enables|improves|provides|studies|makes|goes)\b/gi,'Modal + động từ nguyên mẫu','Sau động từ khuyết thiếu dùng bare infinitive.'],[/\b(?:can|could|should|will|would)\s+to\s+\w+/gi,'Bỏ to sau modal','Modal + V không có to.'],[/\bby\s+(?:practice|practise|use|learn|study|teach|provide|read|work|improve)\b/gi,'By + V-ing','Sau by dùng danh động từ.'],[/\b(?:a|an)\s+(?:information|advice|furniture|traffic|money|pollution|homework)\b/gi,'Bỏ a/an hoặc dùng a piece of (tùy danh từ)','Các danh từ này không đếm được.'],[/\b(?:many|a few)\s+(?:information|advice|traffic|money|pollution|homework)\b/gi,'Dùng much / a little / a lot of','Danh từ không đếm được không dùng many/a few.'],[/\b(?:much|a little)\s+(?:students|teachers|books|cars|lessons)\b/gi,'Dùng many / a few / a lot of','Danh từ số nhiều đếm được không dùng much/a little.'],[/\b(?:a|an)\s+(?:students|teachers|books|cars|lessons)\b/gi,'Bỏ mạo từ hoặc chuyển sang số ít','A/an không đi với danh từ đếm được số nhiều.'],[/\balthough\b[^.!?]{0,130},\s*but\b/gi,'Although ..., ... (bỏ but)','Không kết hợp although và but trong cùng cấu trúc.'],[/\b(?:despite|in spite of)\s+(?:he|she|they|it|we)\s+(?:is|are|was|were|can|will)\b/gi,'Dùng although + clause hoặc despite + N/V-ing','Despite không đi trực tiếp trước một mệnh đề hữu hạn.'],[/\b(?:allows?|enables?)\s+(?:they|he|she|we|i)\s+to\b/gi,'Dùng them/him/her/us/me','Sau allow/enable dùng tân ngữ.'],[/\b(?:allows?|enables?)\s+(?:students|people|learners|them|him|her)\s+(?:learn|improve|study|access|develop)\b/gi,'Allows/enables + somebody + to V','Thiếu to trong cấu trúc.'],[/\b(?:is|are|was|were)\s+(?:build|write|make|conduct|publish)\b/gi,'Be + past participle (built/written/made/conducted/published)','Cấu trúc bị động.'],[/\b(?:decide|decided|want|wants|hope|hoped)\s+(?:join|joining|study|studying)\b/gi,'Decide/want/hope + to V','Kiểm tra dạng động từ sau động từ chính.'],[/\b(?:enjoy|enjoys|suggest|suggests)\s+to\s+\w+/gi,'Enjoy/suggest + V-ing','Các động từ này đi với V-ing.'],[/\b(?:informations|advices|furnitures|homeworks|traffics)\b/gi,'Dùng danh từ không đếm được, không thêm -s','Kiểm tra dạng số nhiều.'],[/\bif\s+(?:he|she|it|they|we|i)\s+will\s+\w+/gi,'Mệnh đề if loại 1 dùng hiện tại đơn','Không dùng will trong mệnh đề điều kiện loại 1.']];for(const [re,after,why] of rules){for(const m of s.matchAll(re))add(m[0],after,why)}if(focus==='Relative Clauses' && /,\s*that\b/i.test(s))add('Mệnh đề quan hệ , that','Dùng , who / , which','Mệnh đề quan hệ không xác định không dùng that.');if(focus==='Passive Voice' && /\b(?:is|are|was|were)\s+\w+ing\b/i.test(s)){};if(focus==='Conditionals' && /\bif\b/i.test(s)===false)add('Chưa thấy if','Thử dùng một mệnh đề điều kiện','Đây là gợi ý kiểm tra chủ điểm, không nhất thiết là lỗi.');if(focus==='Linking & Clauses' && !/\b(?:although|because|therefore|however|while|despite|as a result)\b/i.test(s))add('Chưa thấy từ nối','Thử thêm từ nối phù hợp với ý nghĩa','Gợi ý để luyện liên kết câu.');return issues;}
function gradeQuestion(q,value){const type=types(q),raw=String(value||'').trim();if(type==='write'){return {kind:'review',issues:writingReview(raw,q.focus),sample:q.sample}}const acceptable=type==='choice'?[q.answer]:q.answers||[];const ok=acceptable.some(a=>norm(a)===norm(raw));return {kind:'exact',ok,acceptable,explain:q.explain}}
function feedbackHTML(result){if(result.kind==='review'){return `<div class="feedback ${result.issues.length?'bad':'good'}"><b>${result.issues.length?'Những điểm cần xem lại':'Chưa phát hiện lỗi theo các quy tắc hiện có'}</b>${result.issues.length?`<ul class="suggest">${result.issues.map(i=>`<li><b>${esc(i.before)}</b> → ${esc(i.after)}. ${esc(i.why)}</li>`).join('')}</ul>`:''}<p class="small">Gợi ý tham khảo: ${esc(result.sample)}. Bài viết tự do cần giáo viên đọc thêm để đánh giá đầy đủ ý nghĩa, cấu trúc phức tạp và cách diễn đạt; hệ thống không tự kết luận bài đúng tuyệt đối.</p></div>`}return `<div class="feedback ${result.ok?'good':'bad'}"><b>${result.ok?'Chính xác':'Cần sửa'}</b>${result.ok?'':`<p><b>Đáp án tham khảo:</b> ${result.acceptable.map(esc).join(' / ')}</p>`}<p class="explanation">${esc(result.explain)}</p></div>`}
function render(){const data=DATA[topic],qs=activeQuestions();$('#topics').innerHTML=DATA.map((t,i)=>`<button class="topic ${i===topic?'active':''}" data-topic="${i}"><span class="number">${String(i+1).padStart(2,'0')}</span><b>${esc(t.title)}</b><small>${esc(t.vi)} · ${t.questions.length} bài</small></button>`).join('');$('#work').innerHTML=`<h2>${esc(data.title)}</h2><p>${esc(data.vi)} · ${data.questions.length} bài · Chọn loại bài hoặc luyện tất cả.</p><div class="toolbar"><label for="filter">Loại bài: </label><select id="filter"><option value="all">Tất cả dạng bài</option>${Object.entries(names).map(([k,v])=>`<option value="${k}" ${k===section?'selected':''}>${v}</option>`).join('')}</select><span class="small">${qs.length} bài đang hiển thị</span></div>${qs.map((q,j)=>{let typ=types(q),rv=report&&report[q.index];return `<div class="question ${rv?.kind==='exact'?(rv.ok?'correct':'incorrect'):''}"><div class="type">${esc(names[typ])} · Bài ${q.index+1}</div><b>${esc(q.q)}</b>${typ==='choice'?`<div class="choices">${q.options.map(o=>`<button type="button" class="choice ${answers[q.index]===o?'chosen':''}" data-pick="${q.index}" data-value="${esc(o)}">${esc(o)}</button>`).join('')}</div>`:typ==='write'?`<textarea class="answer long" data-entry="${q.index}" placeholder="${esc(q.hint||'Viết câu trả lời bằng tiếng Anh...')}">${esc(answers[q.index]||'')}</textarea><div class="small">${esc(q.hint||'')}</div>`:`<input class="answer" data-entry="${q.index}" value="${esc(answers[q.index]||'')}" placeholder="Nhập câu trả lời bằng tiếng Anh...">`}${rv?feedbackHTML(rv):''}</div>`}).join('')}<div class="actions"><button class="btn" id="checkAll">Chấm / chữa các bài đang hiển thị</button><button class="btn alt" id="reset">Làm lại chủ điểm</button></div>${report?`<div class="score">${qs.filter(q=>report[q.index]?.kind==='exact'&&report[q.index].ok).length}/${qs.filter(q=>types(q)!=='write').length} bài có đáp án cố định đúng · Bài tự viết nhận góp ý riêng</div>`:''}<p class="small">Bài viết lại/sửa lỗi được đối chiếu với các đáp án tham khảo. Một cách diễn đạt khác vẫn có thể đúng nhưng chưa được nhận diện; hệ thống không tự động kết luận sai ngữ pháp chỉ vì khác mẫu.</p>`;document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>setTopic(+b.dataset.topic));$('#filter').onchange=e=>{section=e.target.value;report=null;render()};document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{answers[b.dataset.pick]=b.dataset.value;report=null;save();render()});document.querySelectorAll('[data-entry]').forEach(el=>el.oninput=()=>{answers[el.dataset.entry]=el.value;save()});$('#checkAll').onclick=()=>{document.querySelectorAll('[data-entry]').forEach(el=>answers[el.dataset.entry]=el.value);save();report={};activeQuestions().forEach(q=>report[q.index]=gradeQuestion(q,answers[q.index]));render()};$('#reset').onclick=()=>{answers={};save();report=null;render()}}answers={...(state[topic]||{})};render();
</script></body></html>
