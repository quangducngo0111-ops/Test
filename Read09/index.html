ne);border-radius:9px;padding:14px 15px;margin:10px 0;scroll-margin:100px}.card-head{display:flex;gap:10px;align-items:flex-start}.qtext{flex:1;line-height:1.45}.option{display:block;border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:7px 0;cursor:pointer}.option.correct{border-color:var(--good);background:#edf7f1}.option.wrong{border-color:var(--bad);background:#fff1ee}.bank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 14px;background:#f3f6f8;border:1px solid var(--line);border-radius:8px;padding:11px;margin:9px 0 13px;font-size:.9rem}.match-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}.match-label{flex:1;min-width:240px;line-height:1.5}.diagram{width:100%;max-width:850px;display:block;margin:10px auto;border:1px solid var(--line);border-radius:8px;background:#fff}.diagram-answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.multi-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px 15px;margin:10px 0}.multi-score-note{font-size:.88rem;color:var(--muted);margin-top:7px}.nq.partial{background:#fff0c9!important;border-color:#d6a534!important}.feedback{font-size:.87rem;margin-top:6px}.good{color:var(--good)}.bad{color:var(--bad)}.inline-review{margin:11px 0 4px;padding:12px 13px;border:1px solid #e3c8c1;border-left:4px solid var(--bad);border-radius:8px;background:#fffaf8;font-size:.91rem;line-height:1.5}.inline-review-title{font-weight:800;color:var(--navy);margin-bottom:7px}.review-row{display:grid;grid-template-columns:105px 1fr;gap:5px 8px;margin:3px 0}.review-label{color:var(--muted);font-weight:700}.student-wrong{color:var(--bad);font-weight:700}.correct-answer{color:var(--good);font-weight:800}.explain{margin-top:8px;background:#fff;border-left:3px solid var(--blue);padding:8px 9px;border-radius:4px}.evidence{margin-top:8px;background:#f2f7fa;border:1px solid #d7e3ea;padding:8px 9px;border-radius:7px}.evidence-btn{margin-top:8px;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:6px;padding:6px 9px;font-size:.83rem;font-weight:700;cursor:pointer}.evidence-pulse{outline:3px solid rgba(231,121,78,.45);background:#fff8e8;border-radius:5px}.review-note{background:#eef5f9;color:var(--navy);padding:9px 11px;border-radius:7px;font-size:.9rem;font-weight:700;margin-bottom:10px}.bottom{border-top:1px solid var(--line);padding:9px 10px;background:#fff;display:flex;gap:9px;align-items:center}.nav{display:flex;gap:4px;overflow:auto;flex:1}.nav button{min-width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:5px;font-size:11px;font-weight:800;cursor:pointer}.nav button.answered{background:#dceaf5}.nav button.correct{background:#dff0e7;border-color:var(--good)}.nav button.wrong{background:#f4ddd8;border-color:var(--bad)}.submit{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:10px 15px;font-weight:800;cursor:pointer}.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,20,30,.72);display:flex;align-items:center;justify-content:center;padding:20px}.result{background:#fff;border-radius:14px;padding:25px;width:min(620px,100%);max-height:90vh;overflow:auto}.score{font-size:2.5rem;color:var(--navy);font-weight:800}.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.breakdown div{background:#f3f6f8;padding:10px;border-radius:8px;text-align:center}@media(max-width:850px){.workspace{grid-template-columns:1fr}.pane{height:48vh}.passage-pane{border-right:0;border-bottom:1px solid var(--line)}.bank,.diagram-answers{grid-template-columns:1fr}}</style></head><body>

<script>const STORAGE_PREFIX="READ_AHEAD_NOISE_TEC_";
const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwfwWjJ7Q3VTJEF5ldKGnFKYoziQdntAzRjq1Yqy6HSmbZSc69ijSdOvMCC_Zogbpcm/exec";
const passages={"1": {"title": "Ahead of its time", "subtitle": "A chance discovery in New Zealand has challenged the country's recorded history", "text": "<p data-para=\"1\">One October afternoon, a young New Zealander, Sam Tobin, called his dogs and went for a walk down to the nearby Ruamahanga River. Having been very high for days, the river had at last fallen, and Tobin was eager to see what changes the floods had brought. The family farm borders the river and a four-metre-high flood bank testifies to its natural tendency to flood.</p><p data-para=\"2\">Tobin stepped out onto a broad shoulder of river sand, where he noticed what he initially took to be a whitish rock, lit by the sun. Then, getting closer, he realised it was a bone. Such a thing was not uncommon in these parts - he had often come across bone fragments, or even whole skeletons, of cows and sheep. But as he scraped aside the stones he realised it was a human bone, something quite new in his experience. As he picked it up, he saw it was a skull, discoloured with age.</p><p data-para=\"3\">Tobin replaced the skull and hurried home to tell his mother what the river had delivered to their doorstep. It would prove to be a spectacular find, setting in motion an investigation by some of the country's most respected specialists, and ultimately challenging our most firmly held assertions about the human settlement of New Zealand.</p><p data-para=\"4\">The police were immediately called, but despite a thorough search could find nothing that might shed light on the identity of the Ruamahanga skull, or the circumstances of its sudden appearance. The skull was then taken north to be examined by forensic pathologist Dr Ferris, at Auckland Hospital. Despite being hampered by its damaged and incomplete condition - the jawbone and lower left portion of the cranium were missing - Dr Ferris determined that the skull was that of a female. He then consulted with a colleague, Dr Koelmeyer, who believed that the deterioration of the bone placed the time of death 'before living memory' and, most significantly as it would turn out, the skull appeared to be European in origin.</p><p data-para=\"5\">Wellington-based forensic anthropologist Dr Watt also examined the skull, and suggested it belonged to a 40-45 year-old. He believed that it could be the remains of an old farm burial, but was not certain, and proposed the use of radiocarbon dating to make sure it wasn't a recent death. As a result, the Institute of Geological and Nuclear Sciences (GNS) in Lower Hutt was contacted, and provided with a sample of bone that had originated in the top of the skull. In a little over three weeks the seemingly astonishing results from the GNS laboratory came back. Cutting through the bewildering complexity of the scientific analysis was a single line reading: conventional radiocarbon age approximately 296 years. This was staggering, for the skull was about 200 years older than Dr Koelmeyer had believed.</p><p data-para=\"6\">Of course, a skull of this age wasn't particularly unusual in New Zealand. The Maori people have been living in the country for at least 800 years and scientists frequently come across human remains of considerable age. The fascinating question, however, was how a skull of this race, let alone this gender, had reached these remote islands in the South Pacific at such a time, long before the arrival of the explorer Captain Cook in 1769, and perhaps even before the very first European landfall - the fleeting visit of the Dutch explorer Tasman in 1642 - neither of whom had women among their crews.</p><p data-para=\"7\">The first known European women in the Pacific came with a doomed colonising venture which sailed from Peru in 1595 under the command of Spanish captain Mendana. However, it is unlikely the Ruamahanga skull originated from this expedition because no evidence of Mendana's ships has ever been found in New Zealand, while a team of archaeologists working in the Solomon Islands in 1970 did discover the remains of European vessels dating from the 16th century.</p><p data-para=\"8\">Two centuries were to pass before the first recorded European females arrived in New Zealand, both having escaped from prison in Australia. Kathleen Hagerty and Charlotte Edgar are known to have reached the country in 1806. How then do we account for the Ruamahanga skull, which appears to be about 100 years older than that? It is impossible to say with certainty, but the most likely explanation is that a Spanish or Portuguese trading-hip was washed onto these wild shores as a result of a shipwreck and a woman got ashore. Implausible, perhaps, but the Ruamahanga skull, today resting in the Wellington Museum, could be the kind of concrete evidence that demands such a drastic re-evaluation of history.</p>"}, "2": {"title": "REMOVING UNWANTED NOISE", "subtitle": "", "text": "<div class=\"section-label\">Section 1</div><p data-para=\"1\">A noisy restaurant, a busy road, or a windy day are all situations that can be intensely frustrating for the hearing impaired when trying to understand what other people are saying. Some 10 million people in the UK suffer from hearing difficulties and, helpful as hearing aids are, those who wear them often complain that background noise continues to interfere with their understanding. But what if hearing aid wearers could choose to filter out all the troublesome sounds and focus just on the voices they want to hear? Engineer Dr Richard Turner believes that this is fast becoming a possibility. He is developing a system that identifies the distracting noise and ‘rubs it out’. ‘The poor performance in noise of current hearing devices is a major reason why six million people in the UK who would benefit from hearing aids do not use them,’ he said. Moreover, as the population ages, a greater number of people will be hindered by the inability to hear clearly. In addition, hearing-impaired patients who have been fitted with cochlear implants – devices implanted to help those whose auditory hair cells have died – suffer from similar limitations.</p><div class=\"section-label\">Section 2</div><p data-para=\"2\">The solution lies in the statistics of sound, as Turner explained: ‘Many interfering noises are immediately recognisable. Raindrops patter on a surface, a fire crackles, talkers babble at a party and the wind howls. But what makes these different noises sound the way they do? No two rain sounds are identical because the precise arrangement of falling water droplets is never repeated. Nonetheless, there must be statistical similarities in the sounds of these raindrops compared with, say, the crackle of a fire.’ He believes that for this reason, the brain may be able to group similar types of sounds together based on their specific characteristics. Turner and his colleagues have analysed this process mathematically and then developed algorithms that mimic what the brain is doing. The mathematical system that they have developed is capable of being ‘trained’ – a process that uses new methods from the field of machine learning – so that it can recognise new sounds. ‘Rather surprisingly, it seems that a relatively small set of statistics is sufficient to describe a large number of sounds’ he says. Crucially, the system that Turner and his team have come up with is capable of telling the difference between speech and other types of sound.</p><div class=\"section-label\">Section 3</div><p data-para=\"3\">‘What we can now do is to erase background noise and pass these cleaned-up sounds to a listener to improve their perception in difficult surroundings,’ said Turner. The idea is that future devices will have several different modes in which they can operate. These might include a mode for travelling in a car or on a train, a mode for places like a noisy party or a busy restaurant, a mode that can be used outdoors in windy weather, and so on. The device might intelligently select an appropriate mode based on the characteristics of the incoming sound.</p><div class=\"section-label\">Section 4</div><p data-para=\"4\">‘In a sense we are developing the technology to underpin intelligent hearing devices,’ said Turner. An additional possibility would be for users to override the selection made by the device and select a processing mode based upon what sorts of noise they wish to erase. They could even guide the processing on their device using an interface on a mobile phone through wireless communication. Turner anticipates that his team will need two more years of simulating the effect of modifications that clean up sound before they start to work with device specialists. ‘If these preliminary tests go well, then we’ll be looking to work with hearing device companies to try to adapt their processing in order to incorporate these machine learning techniques.’</p><div class=\"section-label\">Section 5</div><p data-para=\"5\">Tinnitus sufferers, who are plagued by a constant ringing in their ears, could also benefit from the technology. At present, people with tinnitus sometimes use environmental sound generators as a distraction from the ringing in their ears. But such generators offer only a limited selection of sounds – a gently flowing stream, waves lapping on the seashore, or leaves rustling. With the new technology, individual patients could select the best sound to distract them from their tinnitus.</p><div class=\"section-label\">Section 6</div><p data-para=\"6\">The technology not only holds promise for helping the hearing impaired, but it also has the potential to improve phone calls – anyone who has ever tried to hold a conversation with someone phoning from a crowded room will recognise the possible benefits of such a facility. Systems that can deal with unwanted audio content would also be welcomed by the increasing numbers of people using video-sharing websites. For example, a video containing a conversation that takes place by a busy roadside on a windy day could be made more intelligible by isolating the speech from the noises – users could even be offered the chance to de-noise their video during the upload process.</p>"}, "3": {"title": "An enterprise education programme in Hong Kong", "subtitle": "", "text": "<p data-para=\"1\">The Teen Entrepreneurs Competition (TEC) is an enterprise education programme developed by the Business Studies Division at the Hong Kong Institute of Education (HKIED) - the major training body for school teachers in Hong Kong. It has the following key objectives: to enable secondary school business students to integrate their conceptual learning with real business practices; to promote a collaborative approach to enterprise education; and to build up formal links between HKIEd, schools and entrepreneurs.</p><p data-para=\"2\">Among the various enterprise programmes in Hong Kong, TEC is unique as it is principally organised by pre-service teachers on their B.Ed course. At the beginning of the academic year, these pre-service teachers form an executive committee. They are advised by tutors in the Business Studies Division and some of them are selected to act as TEC instructors. These instructors attend a series of training sessions that cover the concepts of entrepreneurship and practical skills for business start-ups. They are then sent to the schools to co-work with teachers and meet the competition teams.</p><p data-para=\"3\">Over a three-month period, the teams are required to brainstorm an innovative business start-up that is suitable for the Chinese New Year. They then draft a business proposal, turn this into a real business by sourcing or creating their products, and set up a market stall at the HKIEd campus. The teams' business ideas and sales performance are assessed by an adjudicating panel that is made up of entrepreneurs, school principals, teachers, students and customers.</p><p data-para=\"4\">TEC has run annually for three years and has received favourable responses from both the education and local communities. In a recent evaluation survey, most participants ranked themselves in the satisfactory performance category and considered they had gained practical skills to run a small business. A typical response was: 'I understand enterprise better and have developed a good team spint. Moreover, positive views were obtained from some participants despite the fact that they had not had a good experience. For example, one participant reflected: 'I initially received a lot of criticism and even thought about giving up. However, I eventually learned to work in a systematic way.\"</p><p data-para=\"5\">The positive evaluation outcomes came not only from participants but from other stakeholders as well. The adjudicators commented that most of the business plans demonstrated an adequate understanding and application of entrepreneurship in the context of seasonal sales. In addition, the school teachers stated that TEC was a good platform in that it enabled their students to engage in business. They felt the zero drop-out rate strongly supported their views on the promising future of TEC.</p><p data-para=\"6\">The positive post-activity evaluations were indications of the programme's success, but an assessment of how well TEC met its objectives will clarify how sustainable it is as an enterprise education programme. One objective was to provide participant with the opportunity to integrate conceptual learning with real business situations. The research studies that were carried out indicated that the school students taking part in TEC were able to apply entrepreneurial knowledge gained in their studies to the authentic business situations created by the programme. In fact, participants not only succeeded in doing this, but also increased their overall understanding of business enterprise.</p><p data-para=\"7\">However, the financial and manpower support required by this kind of practical experience is beyond the resources of many schools. In fact, most teachers have little choice but to adopt a limited range of teaching methods, mostly based around traditional ones. Moreover, the dominant examination-orientated culture leads teachers to concentrate on written tests rather than explore practical experiences. TEC, however, is able to empower participants to be active learning agents, and provides a feasible means of filling the gap in educational provision.</p><p data-para=\"8\">The research studies also demonstrated that the objective of promoting a collaborative approach to enterprise education was met. From the very start of the programme considerable emphasis was placed on collaboration and teamwork. The participants had to cope in a learning environment which was full of ever-changing challenges, and this meant they had to find ways to deal with events as they occurred. This involved participants taking responsibility for their assigned role within the team and working closely with other team members. Moreover, at certain points, participants had to collaborate with other TEC stakeholders such as entrepreneurs and members of the local community.</p><p data-para=\"9\">The third aim was to develop a network between business and the business education field. Local entrepreneurs acted as sponsors and had an important role in ensuring the programme was financially viable. The network broadly consisted of three tiers. The first tier was made up of key players, including the participants, the teachers, the instructors and the executive committee. There was close collaboration amongst these groups: members of the committee communicated regularly with instructors to disseminate information to participants, and the school teachers and instructors met often to provide suitable guidance to participants. The second tier was an organisational level that mainly consisted of the participating schools and the HKIEd. The contribution of the teacher training institute was to provide logistical support for implementing the programme, including the provision of a venue and a credible point of contact between the schools and the committee. Finally, the third tier consisted of the entrepreneurs who served as judges or sponsors, community groups, the local press and the customers themselves. The positive responses of all these stakeholders and their continuing support is a vote of confidence for the sustainability of TEC in Hong Kong.</p>"}};

    <div class="inst">Complete the notes below. Write <b>ONE WORD ONLY</b> from the passage for each answer.</div>
    <div class="completion">
      <h4>Problem of the skull's origins</h4>
      <p>Old bones common in New Zealand — Maori living there for 800 years — Ruamahanga skull surprising because of its age, ${inlineText(10)} and gender.</p>
      <h4>Mendana expedition</h4>
      <p>Possible source of skull, but probably did not visit New Zealand. Evidence of this expedition found elsewhere by ${inlineText(11)}.</p>
      <h4>New Zealand</h4>
      <p>First European explorer arrived in 1642. Hagerty and Edgar arrived in 1806 from ${inlineText(12)}, where they had been imprisoned.</p>
      <h4>Possible solution</h4>
      <p>Ruamahanga skull may have reached New Zealand in the 17th century after a ${inlineText(13)}.</p>
    </div>
  </div>`;
}
function renderP2Summary(){
  return `<div class="group"><h3>Questions 20–23</h3>
    <div class="inst">Complete the summary below. Write <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</div>
    <div class="completion">
      <h4>Improving the performance of hearing aids</h4>
      <p>
        At present, many people find their hearing aids do not work well when there is background noise.
        Dr Richard Turner is looking for a solution to this problem. Although sounds are never ${inlineText(20)}, he believes they do share some similarities.
        He and his colleagues have worked on a mathematical system using ${inlineText(21)} which replicate how we hear sounds.
        To allow this system to be ‘trained’, they have applied procedures used in machine learning and found that many different sounds can be described using a limited number of ${inlineText(22)}.
        They have now developed a system that can distinguish ${inlineText(23)} from other sounds.
      </p>
    </div>
  </div>`;
}
function renderTECSummary(){
  const opts=questions.find(q=>q.n===27).opts;
  return `<div class="group"><h3>Questions 27–32</h3>
    <div class="inst">Complete the summary using the list of words, <b>A–K</b>, below.</div>
    <div class="bank">${opts.map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="completion">
      <h4>The Teen Entrepreneurs Competition – an outline</h4>
      <p>The Teen Entrepreneurs Competition (TEC) is an enterprise education initiative developed by the Hong Kong Institute of Education (HKIEd). The executive committee that organises the event is made up of pre-service teachers who receive ${inlineSelect(27,opts)} from HKIEd staff.</p>
      <p>The ${inlineSelect(28,opts)} of the programme include giving secondary school students the opportunity to get involved in authentic business tasks and developing a ${inlineSelect(29,opts)} consisting of the institute, local business people and schools.</p>
      <p>The teams receive practical support from instructors. Before meeting the teams, the instructors go to ${inlineSelect(30,opts)} where they develop practical skills and are taught a range of entrepreneurial ${inlineSelect(31,opts)}.</p>
      <p>The competition requires teams to come up with a new business ${inlineSelect(32,opts)} for the Chinese New Year.</p>
    </div>
  </div>`;
}
function renderChoiceGroup(start,end,title,inst){
  return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>${questions.filter(q=>q.n>=start&&q.n<=end).map(card).join('')}</div>`;
}
function buildQuestions(p){
  let h='';
  if(p===1){
    h+=renderChoiceGroup(1,4,'Questions 1–4','Choose TRUE, FALSE or NOT GIVEN.');
    h+=renderFlow();
    h+=renderP1Notes();
  }else if(p===2){
    h+=renderMatch(14,19,'Questions 14–19','Choose the correct heading, i–ix, for each of the six sections.',true);
    h+=renderP2Summary();
    h+=renderChoiceGroup(24,26,'Questions 24–26','Choose the correct answer.');
  }else{
    h+=renderTECSummary();
    h+=renderChoiceGroup(33,36,'Questions 33–36','Choose YES, NO or NOT GIVEN.');
    h+=renderChoiceGroup(37,40,'Questions 37–40','Choose the correct answer.');
  }
  const saved=ssGet(markupKey('questions',p));
  document.getElementById('questionsPane').innerHTML=annotationToolbar('questions')+`<div id="notesQuestions" class="notes-panel"></div><div id="questionsCopy">${saved||h}</div>`;
  restore(p);bindTracking();bindAnnotations('questions');renderNotes('questions');
  if(submitted){
    const copy=document.getElementById('questionsCopy');
    if(copy&&!copy.querySelector('.review-note'))copy.insertAdjacentHTML('afterbegin','<div class="review-note">Review mode: câu sai có giải thích và evidence ngay bên dưới.</div>');
    markPassage(p);
  }
}
function showPassage(p){
  saveMarkup('passage');saveMarkup('questions');current=p;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.p===p));
  document.getElementById('passagePane').innerHTML=passageHTML(p);
  bindAnnotations('passage');renderNotes('passage');buildQuestions(p);
  document.getElementById('passagePane').scrollTop=0;
  document.getElementById('questionsPane').scrollTop=0;
}
function save(n,v){
  ssSet('q'+n,v);
  document.getElementById('nav'+n)?.classList.toggle('answered',String(v).trim()!=='');
}
function restore(p){
  for(const q of questions.filter(x=>x.p===p)){
    const v=ssGet('q'+q.n)||'';
    const e=document.getElementById('q'+q.n);
    if(e)e.value=v;
    if(q.type==='choice'&&v){
      const r=[...document.querySelectorAll(`input[name="q${q.n}"]`)].find(x=>x.value===v);
      if(r)r.checked=true;
    }
  }
}
function bindTracking(){
  document.querySelectorAll('.ans').forEach(e=>e.oninput=e.onchange=()=>save(+e.dataset.q,e.value));
  document.querySelectorAll('input[type="radio"]').forEach(e=>e.onchange=()=>save(+e.closest('.option').dataset.q,e.value));
}
function buildNav(){
  document.getElementById('navigator').innerHTML=Array.from({length:40},(_,i)=>`<button id="nav${i+1}" onclick="goQ(${i+1})">${i+1}</button>`).join('');
}
function goQ(n){
  const p=n<=13?1:n<=26?2:3;
  if(p!==current)showPassage(p);
  setTimeout(()=>document.getElementById('card'+n)?.scrollIntoView({behavior:'smooth',block:'center'}),60);
}
function correct(q,u){
  return q.type==='text'?q.ans.map(norm).includes(norm(u)):norm(u)===norm(q.ans);
}
function displayKey(q){
  if(q.type==='select'||q.type==='choice'){
    const f=(q.opts||[]).find(x=>optionValue(x)===String(q.ans));
    return f||q.ans;
  }
  return Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
}
function displayAnswer(q,u){
  if(!u)return 'Không trả lời';
  if(q.type==='select'||q.type==='choice'){
    const f=(q.opts||[]).find(x=>optionValue(x)===String(u));
    return f||u;
  }
  return u;
}
function reviewHTML(q,u){
  const r=answerReview[q.n];
  return `<div class="inline-review" data-review="${q.n}">
    <div class="inline-review-title">Q${q.n} · Giải thích câu sai</div>
    <div class="review-row"><div class="review-label">Bạn trả lời</div><div class="student-wrong">${esc(displayAnswer(q,u))}</div></div>
    <div class="review-row"><div class="review-label">Đáp án đúng</div><div class="correct-answer">${esc(displayKey(q))}</div></div>
    <div class="explain"><b>Vì sao?</b> ${esc(r.explain)}</div>
    <div class="evidence"><b>Evidence:</b> “${esc(r.evidence)}”</div>
    <button class="evidence-btn" onclick="focusEvidence(${q.n})">↗ Đối chiếu trong bài đọc</button>
  </div>`;
}
function placeReview(q,u,ok){
  document.querySelectorAll(`[data-review="${q.n}"]`).forEach(e=>e.remove());
  if(ok)return;
  const c=document.getElementById('card'+q.n);
  if(!c)return;
  const host=c.classList.contains('card')?c:(c.closest('.flow-step,p,.match-row')||c.parentElement);
  host.insertAdjacentHTML('beforeend',reviewHTML(q,u));
}
function markPassage(p){
  for(const q of questions.filter(x=>x.p===p)){
    const u=ssGet('q'+q.n)||'',ok=correct(q,u);
    const e=document.getElementById('q'+q.n);
    if(e){e.classList.remove('correct','wrong');e.classList.add(ok?'correct':'wrong')}
    document.querySelectorAll(`label[data-q="${q.n}"]`).forEach(l=>{
      l.classList.remove('correct','wrong');
      if(norm(l.dataset.val)===norm(q.ans))l.classList.add('correct');
      else if(u&&norm(l.dataset.val)===norm(u))l.classList.add('wrong');
    });
    const nav=document.getElementById('nav'+q.n);
    if(nav){nav.classList.remove('answered');nav.classList.add(ok?'correct':'wrong')}
    placeReview(q,u,ok);
  }
  document.querySelectorAll('#questionsCopy input,#questionsCopy select').forEach(e=>e.disabled=true);
}
function focusEvidence(n){
  const q=qBy(n),r=answerReview[n];
  const reveal=()=>{
    const t=document.querySelector(`#passageCopy p[data-para="${r.para}"]`);
    if(t){
      t.scrollIntoView({behavior:'smooth',block:'center'});
      t.classList.add('evidence-pulse');
      setTimeout(()=>t.classList.remove('evidence-pulse'),3000);
    }
  };
  if(q.p!==current){showPassage(q.p);setTimeout(reveal,120)}else reveal();
}
async function submitExam(auto=false){
  if(submitted)return;
  saveMarkup('passage');saveMarkup('questions');
  const unanswered=questions.filter(q=>!(ssGet('q'+q.n)||'').trim()).length;
  if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;
  submitted=true;clearInterval(timerHandle);
  let total=0,s=[0,0,0,0],details=[];
  for(const q of questions){
    const u=ssGet('q'+q.n)||'',ok=correct(q,u);
    if(ok){total++;s[q.p]++}
    details.push({q:q.n,answer:u,correct:ok,key:displayKey(q)});
  }
  markPassage(current);
  const name=document.getElementById('studentName').value.trim();
  const cls=document.getElementById('studentClass').value.trim();
  const dur=Math.round((Date.now()-startedAt)/1000);
  document.getElementById('resultStudent').textContent=`${name} — ${cls}`;
  document.getElementById('resultScore').textContent=`${total} / 40`;
  document.getElementById('resultPercent').textContent=`${Math.round(total/40*100)}% correct`;
  document.getElementById('p1score').textContent=`${s[1]} / 13`;
  document.getElementById('p2score').textContent=`${s[2]} / 13`;
  document.getElementById('p3score').textContent=`${s[3]} / 14`;
  document.getElementById('reviewSummary').innerHTML=total===40?'🎉 Bạn đã trả lời đúng cả 40 câu.':`Có <b>${40-total} câu cần xem lại</b>. Đóng bảng điểm để xem giải thích + evidence ngay dưới từng câu sai.`;
  document.getElementById('resultOverlay').classList.remove('hidden');
  document.getElementById('sheetStatus').textContent='Đang gửi kết quả về Google Sheet...';
  const data=new URLSearchParams({
    name,className:cls,total:String(total),maxScore:'40',durationSeconds:String(dur),
    activity:'IELTS Reading - Ahead of its time / Removing Unwanted Noise / TEC',
    reading:String(s[1]),grammar:String(s[2]),ing:String(s[3]),
    writingA:JSON.stringify(details),submittedAt:new Date().toISOString()
  });
  try{
    await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data.toString()});
    document.getElementById('sheetStatus').textContent='✓ Đã gửi kết quả về Google Sheet.';
  }catch(e){
    document.getElementById('sheetStatus').textContent='Không gửi được kết quả về Google Sheet.';
  }
}
function closeResult(){
  document.getElementById('resultOverlay').classList.add('hidden');
  markPassage(current);
}
</script></body></html>
