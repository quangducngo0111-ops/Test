<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guided Listening | IELTS Practice</title>
<style>
:root{--blue:#1766d1;--purple:#634ac5;--ink:#16223d;--muted:#68758e;--line:#e3e8f2;--bg:#f3f6fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f4efff,#edf6ff);color:var(--ink);font:15px/1.55 system-ui,Segoe UI,Arial,sans-serif}header{position:sticky;top:0;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:2;padding:12px max(16px,calc((100vw - 1050px)/2))}header a{color:var(--blue);text-decoration:none;font-weight:700}main{max-width:1050px;margin:25px auto 70px;padding:0 15px}.hero,.panel,.tile{background:#fff;border:1px solid var(--line);border-radius:21px;box-shadow:0 10px 35px #233c6810}.hero{padding:28px;margin-bottom:15px}.hero h1{margin:7px 0;font-size:28px}.pill{display:inline-block;background:#edeaff;color:#6145ad;border-radius:40px;padding:5px 12px;font-size:12px;font-weight:800}.muted{color:var(--muted)}.lessonbar,.steps,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.lessonbar button,.steps button,button{border:1px solid #dbe2f2;background:#fff;color:#273b62;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.lessonbar .active,.steps .active,button.primary{background:#2459c6;color:#fff;border-color:#2459c6}.steps button.done{border-color:#a3d9bc;color:#167545}.panel{padding:24px}.panel h2{margin:0 0 6px;font-size:23px}.tile{padding:15px;box-shadow:none;margin:10px 0}.tile p{margin:6px 0}.small{font-size:12px}.question{font-weight:700;font-size:16px}.options{display:grid;gap:8px;margin-top:10px}.options label{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.options label:has(input:checked){background:#edf3ff;border-color:#72a3f4}input[type=text],select{width:100%;max-width:540px;min-height:42px;border:1px solid #d8dfec;border-radius:10px;padding:8px 11px;font:inherit;background:white}input[type=radio]{accent-color:#2459c6}.note{padding:12px 14px;background:#f1f5ff;border-radius:11px;color:#425a7f}.ok{color:#117c46}.bad{color:#b44244}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:720px){.grid{grid-template-columns:1fr}.panel{padding:16px}.hero{padding:20px}}audio{width:100%;margin:10px 0}.summary{font-size:28px;font-weight:850;color:#2459c6}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#bed0ee;margin-right:4px}button:disabled{opacity:.5;cursor:not-allowed} .foot{margin-top:24px;color:var(--muted);font-size:12px}

/* Vocabulary Game: balanced word and answer columns */
.vocab-row{display:grid;grid-template-columns:minmax(125px,180px) minmax(0,520px);align-items:center;column-gap:22px;row-gap:10px;padding:18px 22px}
.vocab-word{font-size:19px;font-weight:800;color:#1b2746;line-height:1.35;overflow-wrap:anywhere}
.vocab-select{display:block;width:100%;max-width:520px;min-height:48px;border:1px solid #d8dfec;border-radius:13px;padding:10px 14px;font:inherit;background:#fff}
@media(max-width:720px){.vocab-row{grid-template-columns:minmax(0,1fr);gap:10px;padding:16px}.vocab-word{font-size:18px}.vocab-select{max-width:100%}}

/* Practice-style inline feedback instead of browser alerts. */
.practice-feedback{margin:14px 0;padding:15px 18px;border:1px solid #f0c3c3;border-left:4px solid #d94b55;border-radius:13px;background:#fff5f5;color:#89313b;font-size:14px;line-height:1.55;box-shadow:0 4px 15px #622c2c0b}
.practice-feedback strong{display:block;font-size:15px;margin-bottom:3px}.practice-feedback[hidden]{display:none!important}
.tile.practice-incorrect{border-color:#e8a0a9!important;background:#fffafa!important}
.tile.practice-incorrect .vocab-select{border-color:#d94b55!important}

/* Compact multiple-choice rows: prompt at left, three options use the right side. */
#content .choice-row{display:grid;grid-template-columns:minmax(200px,38%) minmax(0,1fr);align-items:center;gap:16px;padding:15px 18px}
#content .choice-row .question{margin:0;font-size:15px;line-height:1.45}
#content .choice-row .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
#content .choice-row .options label{display:flex;align-items:center;gap:7px;min-width:0;min-height:44px;padding:9px 11px;font-size:14px;line-height:1.35}
#content .choice-row .options input{margin:0;flex-shrink:0}
#content .tile.practice-correct{border-color:#8bcfa7!important;background:#f4fcf7!important}
#content .tile.practice-incorrect{border-color:#eda0a6!important;background:#fff7f7!important}
#content .choice-row .options label.answer-correct{border-color:#59b984!important;background:#def5e7!important;color:#12643c!important;font-weight:750}
#content .choice-row .options label.answer-wrong{border-color:#e78491!important;background:#ffe6e8!important;color:#9a2436!important;font-weight:750}
#content .choice-row .options label.answer-correct input{accent-color:#19814d}
#content .choice-row .options label.answer-wrong input{accent-color:#c93f4f}
@media(max-width:900px){#content .choice-row{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){#content .choice-row .options{grid-template-columns:1fr;gap:7px}#content .choice-row{padding:13px}}

/* Feedback highlights the whole question, not individual answer choices. */
#content .choice-row .options label.answer-correct,
#content .choice-row .options label.answer-wrong{background:#fff!important;border-color:var(--line)!important;color:inherit!important;font-weight:normal!important}
#content .choice-row .options label:has(input:checked){background:#edf3ff!important;border-color:#72a3f4!important;color:inherit!important;font-weight:500!important}
#content .tile.practice-correct{border-color:#70c798!important;background:#f0faf4!important}
#content .tile.practice-incorrect{border-color:#f09aa7!important;background:#fff2f3!important}
#content .tile.practice-unanswered{border-color:#e5bf78!important;background:#fffbf0!important}
/* Vocabulary cards take both sides of the page; one compact card per word. */
#content .vocab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
#content .vocab-grid .vocab-row{display:flex;flex-direction:column;align-items:stretch;gap:13px;min-width:0;margin:0;padding:18px 20px;border-radius:17px}
#content .vocab-top{display:flex;align-items:center;gap:11px;min-height:30px}
#content .vocab-index{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:#eef2fc;color:#5b6d94;font-size:12px;font-weight:800}
#content .vocab-word{font-size:18px;font-weight:800;line-height:1.3;color:#1c2a49}
#content .vocab-grid .vocab-select{width:100%;max-width:none;min-width:0;min-height:47px;border-radius:12px;background:#fff;font-size:14px}
#content .vocab-grid .practice-correct .vocab-index{background:#d9f3e4;color:#28734a}
#content .vocab-grid .practice-incorrect .vocab-index{background:#ffe0e4;color:#ab3646}
#content .vocab-grid .practice-incorrect .vocab-select{border-color:#f09aa7!important}
@media(max-width:680px){#content .vocab-grid{grid-template-columns:minmax(0,1fr);gap:10px}#content .vocab-grid .vocab-row{padding:14px 15px}}

#content .real-question{padding:16px 18px}
#content .real-question .question{font-size:15px;line-height:2.4;font-weight:600}
#content .real-answer-input{display:inline-block!important;vertical-align:middle!important;width:clamp(120px,18vw,190px)!important;max-width:100%!important;min-height:40px;margin:0 5px;font-weight:650;text-align:center}
@media(max-width:600px){#content .real-question{padding:12px}#content .real-answer-input{width:135px!important}}

/* Two-phase vocabulary: study first, then accessible drag/tap matching. */
#content .study-progress{display:inline-block;background:#edf2ff;color:#3d5b99;border-radius:12px;padding:9px 13px;margin:10px 0;font-weight:750;font-size:13px}
#content .study-grid,#content .match-targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
#content .study-card{display:flex;align-items:center;gap:12px;border:1px solid #dfe7f3;border-radius:16px;padding:15px;background:#fff;min-width:0}
#content .study-number{font-size:12px;min-width:30px;text-align:center;color:#627394;font-weight:800}
#content .study-text{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
#content .study-text strong{font-size:17px;color:#1c2a49;overflow-wrap:anywhere}

#content .study-sound{border-radius:50%;min-width:40px;padding:8px;background:#f0f4ff}

#content .match-slot.has-value{border:1px solid #a3bde9;background:#eaf1ff;color:#1c467e;font-weight:750;cursor:grab}
#content .match-slot.has-value:active{cursor:grabbing}
#content .match-placement{display:flex;align-items:stretch;gap:7px}
#content .match-placement .match-slot{flex:1;min-width:0}
#content .match-remove{flex:0 0 auto;min-width:76px;border:1px solid #d3dbe7;background:#f4f6f9;color:#536479;border-radius:11px;padding:0 10px;font-size:12px;font-weight:750;line-height:1.3}
#content .match-remove:hover,#content .match-remove:focus-visible{background:#e8edf4;border-color:#9eafc3;color:#314459}
#content .match-bank-title{font-weight:850;color:#233655;font-size:17px;margin:16px 0 10px}
#content .match-bank{display:flex;gap:9px;flex-wrap:wrap;padding:13px;background:#f3f6ff;border:1px solid #dae4f5;border-radius:16px;min-height:75px;max-height:185px;overflow-y:auto;position:sticky;top:60px;z-index:4;box-shadow:0 8px 20px #203d7514}
#content .match-token{border:1px solid #9db8e2;border-radius:11px;background:#fff;padding:11px 14px;color:#24466b;cursor:grab;max-width:100%;white-space:normal;touch-action:manipulation}
#content .match-token.selected{background:#244f9c;color:#fff;outline:3px solid #b2c7fb}
#content .match-targets .practice-correct{background:#ecfaf2!important}
#content .match-targets .practice-incorrect{background:#fff2f3!important}
@media(max-width:680px){#content .study-grid,#content .match-targets{grid-template-columns:1fr}}

/* Navigation: visited steps are clickable, future steps are truly disabled. */
.steps button.step-available{cursor:pointer}
.steps button.step-available:hover{border-color:#94a9df;background:#f3f6ff}
.steps button.step-locked,.steps button:disabled{opacity:.46;cursor:not-allowed;background:#f2f3f7;color:#8c97aa;border-color:#e2e5ed}
.steps button.active{opacity:1;cursor:default}

.gap-wrap{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:15px;align-items:start}
.gap-lines{padding:8px 18px;border:1px solid #e1e7f0;border-radius:16px}
.gap-line{display:grid;grid-template-columns:68px minmax(0,1fr);gap:10px;padding:13px 0;border-bottom:1px solid #e4e9f2;line-height:2.1}
.gap-line:last-child{border:0}.gap-role{font-size:10px;color:#6c4bb8;font-weight:800}
.gap-word{width:142px!important;max-width:min(100%,180px)!important;display:inline-block!important;margin:3px 6px!important;vertical-align:middle!important;min-height:43px!important;padding:8px 12px!important;border:1px solid #c6b9ed!important;border-bottom:2px solid #7750e3!important;border-radius:13px!important;background:#fff!important;font-size:14px!important;line-height:1.35!important;box-shadow:0 2px 8px rgba(76,54,145,.05);transition:border-color .15s,box-shadow .15s}
.gap-word:focus{outline:none!important;border-color:#7750e3!important;box-shadow:0 0 0 3px rgba(119,80,227,.14)!important}.gap-word.correct{background:#ebfaf0!important;border-color:#52ae77!important}
.gap-word.incorrect{background:#fff2f4!important;border-color:#d66974!important}
.gap-player{position:sticky;top:65px;background:#fff;border:1px solid #e1e7f0;border-radius:15px;padding:13px;display:grid;gap:9px}
.gap-player audio{margin:0}.gap-player input{max-width:100%}
.gap-actions{display:flex;gap:5px;flex-wrap:wrap}.gap-actions button{font-size:12px;padding:7px}
.gap-upload{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}
@media(max-width:760px){.gap-word{width:118px!important;padding:7px 9px!important}.gap-wrap{grid-template-columns:1fr}.gap-player{grid-row:1;position:static}.gap-line{grid-template-columns:56px minmax(0,1fr)}}

.selection-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}
.selection-option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #dfe6f2;border-radius:12px;background:#fff;cursor:pointer}
.selection-option input{flex:none;width:17px;height:17px;accent-color:#315fc1}
.selection-option span{display:flex;flex-direction:column;gap:2px}
.selection-option small{color:#718099}.selected-count{font-weight:800;color:#34508b}
.chosen-words{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chosen-word{display:inline-flex;align-items:center;gap:7px;border-radius:9px;background:#e8effd;color:#234879;padding:5px 9px;font-weight:700}
.chosen-word button{padding:3px 6px;font-size:11px;color:#566783}
.manual-vocab,.word-popup{display:flex;gap:7px;flex-wrap:wrap;padding:11px;border:1px solid #dae5f1;border-radius:12px;background:#f7faff}
.manual-vocab input,.word-popup input{flex:1 1 160px;max-width:none}
.word-popup[hidden]{display:none!important}
@media(max-width:690px){.selection-grid{grid-template-columns:1fr}}
.pending-list{display:grid;gap:9px;margin:10px 0}.pending-item{display:flex;align-items:center;gap:8px;border:1px solid #dce5f2;border-radius:10px;padding:9px;background:#fff}.pending-item b{min-width:90px;overflow-wrap:anywhere}.pending-item input{flex:1;min-width:0;max-width:none}.pending-item button{font-size:12px;white-space:nowrap}@media(max-width:700px){.pending-item{flex-wrap:wrap}.pending-item input{flex-basis:100%}}

.gap-lexeme{display:inline;position:relative;border:1px solid transparent;border-radius:6px;padding:0 2px;margin:0;cursor:help;user-select:text;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.gap-lexeme:hover,.gap-lexeme:focus-visible{background:#e9e0f8;border-color:#bea8e5;outline:none}

.gap-lexeme.picked{background:#e8e2f5;border-color:#c6b7e6}
.gap-instructions{padding:10px 13px;border:1px solid #e3e8f9;border-radius:12px;background:#f4f6ff;color:#43567f;font-size:13px;margin:10px 0 16px}
.gap-vocab{border-top:1px solid #e5e9f1;padding-top:12px;display:grid;gap:9px}
.gap-drop-zone{border:1px dashed #ac9ad2;border-radius:12px;padding:10px;background:#faf9ff;min-height:70px}
.gap-drop-zone.drag-over{background:#ece5ff;border-color:#7853c9}
.gap-vocab-item{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:8px 0;padding:7px;background:white;border:1px solid #e2e7f0;border-radius:9px}
.gap-vocab-item b{flex:1;font-size:12px;overflow-wrap:anywhere}
.gap-vocab-item input{width:100%!important;max-width:none!important;min-height:34px!important;font-size:12px!important}
.gap-vocab-item button{font-size:12px;padding:5px 8px}
.gap-vocab-chips{display:flex;gap:5px;flex-wrap:wrap}
.gap-vocab-chips span{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;color:#236447;background:#e7f5eb}
@media(min-width:980px){.gap-wrap{grid-template-columns:minmax(0,1fr) 280px}}

#gapFullResult{display:block;line-height:1.5;color:#335078}
#gapFullResult:empty{display:none}
#next:disabled{opacity:.5;cursor:not-allowed}

/* Listening Practice audio controls — same hierarchy, Part 4 theme accent. */
.gap-player{--gl-accent:#634ac5;--gl-accent-soft:#f0eaff;border:1px solid #e2e5ef;border-radius:16px;padding:14px;box-shadow:0 6px 18px #23194b0a;gap:10px}
.gl-audio-head{display:flex;align-items:center;gap:9px}
.gl-audio-head .gl-audio-icon{display:grid;place-items:center;flex:0 0 35px;width:35px;height:35px;border-radius:10px;background:var(--gl-accent-soft);font-size:17px}
.gl-audio-head strong{display:block;color:#21164b;font-size:13px}
.gl-audio-head span:not(.gl-audio-icon){display:block;color:var(--muted);font-size:11px}
.gap-player audio{display:none}
.gl-audio-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:7px}
.gl-audio-controls button{min-width:0;min-height:41px;padding:7px 4px;border:1px solid #dcdde9;border-radius:10px;background:#fff;color:#3d315d;font-size:12px;font-weight:800;white-space:nowrap}
.gl-audio-controls .gl-audio-play{background:var(--gl-accent);border-color:var(--gl-accent);color:#fff}
.gl-audio-btn:hover{background:var(--gl-accent-soft)}
.gl-audio-seek{display:block;width:100%;margin:1px 0;accent-color:var(--gl-accent);cursor:pointer}
.gl-audio-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:800;color:#30275b;font-variant-numeric:tabular-nums}
.gl-audio-meta label{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:10px;color:#67738d}
.gl-audio-meta select{min-height:34px;width:70px;max-width:70px;padding:4px 6px;font-size:12px;font-weight:800;border-radius:8px}
.gl-audio-volume{display:flex;align-items:center;gap:10px;color:#67738d;font-size:11px;font-weight:700}
.gl-audio-volume input{width:100%;min-width:0;accent-color:var(--gl-accent)}
.gl-audio-submit{width:100%;min-height:44px;background:var(--gl-accent)!important;border-color:var(--gl-accent)!important;color:#fff!important;border-radius:11px!important;font-weight:850!important;font-size:15px!important}
.gl-audio-submit:hover,.gl-audio-play:hover{filter:brightness(1.07)}
.gap-player .gap-vocab{margin-top:6px}
@media(max-width:760px){.gap-player{position:static}.gl-audio-controls{gap:8px}}

/* One-time focused onboarding, with an accessible replay control. */
.gap-guide-overlay[hidden]{display:none!important}
.gap-guide-overlay{position:fixed;inset:0;z-index:2147482000;background:rgba(14,19,37,.68);display:grid;place-items:center;padding:20px}
.gap-guide-dialog{width:min(530px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:#fff;border-radius:22px;padding:27px 30px;box-shadow:0 25px 85px rgba(16,12,44,.32);color:#1c2945}
.gap-guide-eyebrow{font-size:11px;letter-spacing:.09em;color:#634ac5;font-weight:850}
.gap-guide-dialog h2{font-size:25px;line-height:1.25;margin:10px 0 14px;color:#19284a}
.gap-guide-dialog p{font-size:14px;line-height:1.65;margin:0 0 12px}
.gap-guide-dialog ol{padding-left:22px;margin:13px 0 17px;font-size:14px;line-height:1.65}
.gap-guide-dialog li{padding:3px 0}
.gap-guide-dialog .gap-guide-tip{font-size:13px;color:#5b6680;padding:12px 13px;background:#f5f3fc;border-radius:11px}
.gap-guide-start{display:block;width:100%;margin-top:19px;min-height:49px;border:0!important;border-radius:12px!important;background:#634ac5!important;color:white!important;font-weight:850!important;font-size:15px!important}
.gap-guide-start:hover{background:#553bb5!important}
.gap-guide-replay{font-size:12px!important;padding:5px 10px!important;color:#5840a5!important;background:#f4f0ff!important;border:1px solid #dbd0f7!important}
.gap-guide-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gap-guide-heading h2{margin:0}
body.gap-guide-open{overflow:hidden}
@media(max-width:520px){.gap-guide-dialog{padding:23px 20px;border-radius:18px}.gap-guide-dialog h2{font-size:22px}}

.step-guide-toolbar{display:flex;justify-content:flex-end;margin:-7px 0 8px}
.step-guide-replay{background:#f4f0ff!important;border:1px solid #dbd0f7!important;color:#5840a5!important;border-radius:9px!important;font-size:12px!important;font-weight:750!important;padding:6px 11px!important}
.step-guide-replay:hover{background:#ebe3ff!important}
.selection-transcript{margin:16px 0 20px}.selection-transcript h3{margin:0 0 10px;font-size:17px}.selection-word-panel{top:65px}.selection-transcript .gap-lines{max-height:680px;overflow:auto}.selection-transcript .gap-vocab{border-top:0;padding-top:0}

.vocab-step-intro{display:grid;gap:4px;border:1px solid #b7dfcb;background:#f3faf6;padding:12px 15px;border-radius:12px;margin:12px 0 16px;color:#285946;font-size:13px}
.vocab-step-intro strong{font-size:15px}.vocab-step-total{font-weight:800;color:#168267}
.vocab-pick-sidebar{display:grid;gap:11px}.vocab-pick-sidebar h3{margin:0;font-size:17px;color:#155c46}
.vocab-pick-sidebar p{margin:0}.vocab-saved-count{font-weight:850;color:#168267}
.vocab-empty{display:block;font-size:12px;color:#637890;line-height:1.6;padding:8px}

const GUIDED_TRANSCRIPTS={ '01':"Today I’m going to talk about invasive species. Let me start by saying what an invasive species is and what it’s not. Invasive species are any animal or plant that is introduced into an environment by humans, and which is then harmful to that environment. It’s important to be clear that not all introduced species are invasive. Many introduced – or non-native – species thrive in new areas without posing any threat.\n\nIn some cases, invasive species have changed the natural world beyond recognition, so let’s look at the different ways they can be problematic. First of all, invasive species may eat native species, or sometimes they may bring a disease with them, which native species have never faced before and therefore have no defences against. Often the invasive species breed very quickly – which further adds to the problem of native species losing their sources of food. Species invasions are one of the biggest causes of damage in an ecosystem, actually putting its survival at risk.\n\nSo, how do invasive species spread? Without a doubt, the biggest cause is human activity. This could be intentional, or it could be accidental, such as when people who’ve been on holiday in another country come back with, say, the seeds of plants on their clothes or shoes. Plants and animals, especially insects, arrive in or on the cargo of ships, and then escape into their new ‘home’. But sometimes humans deliberately move animals and plants around the world, for example to use them to control pests on farms, or to be pets. This can go very wrong if those animals and plants move into wild settings and start breeding or begin growing in ways that weren’t predicted.\n\nLet’s now look at an example of an invasive species here in Australia: Rhinella marina is a species of toad that was deliberately introduced from Hawaii in 1935 as a form of biological control. It was hoped that the toads would eat the grey-backed beetles responsible for destroying crops of sugar on many of the plantations. At first, just a handful of toads were released by scientists into Queensland, but this number soon grew as other states followed suit. Within two years, 62,000 young toads had been released into the wild. The toads did nothing to protect the plantations, but they did reproduce rapidly and could soon be found all over the northern half of the country. The toads are poisonous at every stage of their life cycle, and anything that eats them will die.\n\nMy second example regarding invasive species is the United Kingdom. Actually, there are more than three-thousand invasive species there, including some that are extremely common. Some invasive plants, such as Japanese knotweed, have had a devastating impact on parts of the UK. Gardeners in the nineteenth century considered it a beautiful ornamental plant – which it is, when it’s kept under control – but it soon spread into the countryside and remains a problem even to this day as it’s so hard to eradicate. Another invasive plant is rhododendrons, which can be found in UK parks and woodlands. Their introduction dates back to 1763, but they’re now seen as harmful because they block out so much light that native wild flowers can’t grow beneath them.\n\nAnd then there are grey squirrels, which are one invasive species almost everyone in the UK will have come across. They were brought to the UK from North America and introduced to private estates around the 1870s but are now found everywhere, from forests to city squares. Grey squirrels have outcompeted the smaller, native red squirrels. They both eat the same food, and the grey squirrels carry a type of virus that is deadly to the red squirrels. Red squirrel populations have collapsed, and there are only a handful of sites left in the UK where they’re found.\n\nAn important question for ecologists worldwide is, what can we do to tackle the problem of invasive species? The first step in controlling invasive species is learning about the behaviour of new species coming into the country. Monitoring is an important part of this, so that we can know if the new species begins to have a negative impact in its new environment. One effective way to keep track of invasive species is to create a database for the whole country. That way, all relevant authorities and agencies can share important information and take whatever action’s needed. But the public also have a vital role to play in this process. They should be encouraged to photograph harmful species – because this helps with identification – and then to report when and where these were observed. But it’s important to tell people not to destroy or even touch what they’ve found.\n\nNow, I’m going to move on to ...", '02':"Today, I want to talk about self-regulatory focus theory and how the actions of leaders can affect the way followers approach different situations. Self-regulatory focus theory is a theory developed by Tori Higgins. He says that a person’ focus at any given time is to either approach pleasure or avoid pain. These are two basic motivations that each and every one of us has, and they cause us to have different kinds of goals. Promotion goals in different life situations emphasise achievement. Prevention goals are oriented towards the avoidance of punishment.\n\nIn a specific situation, our thoughts might focus more on promotion goals or more on prevention goals. The theory suggests that two factors affect which goals we are focusing on. First, there is a chronic factor. This factor is connected to a person’s personality and says that each person has a basic tendency to either focus more on promotion goals or focus more on prevention goals as part of his or her personality. Second, there is a situational factor which means that the context we are in can make us more likely to focus on one set of goals or the other. For example, we are more likely to be thinking about pleasure and to have promotion goals when we are spending time with a friend. In contrast, if we are working on an important project for our boss, we are more likely to try to avoid making mistakes and therefore have more prevention goals in our mind.\n\nResearch has shown that the goals we are focusing on at a given time affect the way we think. For example, when focusing on promotion goals, people consider their ideal self, their aspirations and gains. They don’t think about what they can lose, so they think in a happier mode. They feel more inspired to change.\n\nWhen people are focusing on prevention goals, they think about their “ought” self. What are they supposed to be? What are people expecting from them? They consider their obligations to others. As a result, they experience more anxiety and try to avoid situations where they could lose.\n\nNow that I have talked about the two focuses and how they affect people, I want to look at the idea that the way leaders behave, or their style of leading, can affect the focus that followers adopt in a specific situation. In talking about leadership, we often mention transformational leaders and transactional leaders. Transformational leaders, when interacting with their followers, focus on their development. In their words and actions transformational leaders highlight change. Their speech is passionate and conveys a definitive vision. All of these things can encourage followers to think about what could be. In other words, they inspire a promotion focus in their followers.\n\nIn contrast, transactional leaders focus on developing clear structures that tell their followers exactly what is expected of them. While they do explain the rewards people will get for following orders, they emphasise more how a follower will be punished or that a follower won’t get rewarded if his or her behaviour doesn’t change. In short, they emphasise the consequences of making a mistake. This emphasis will clearly lead followers to focus on avoiding punishment and problems. This is clearly a prevention focus.\n\nIn conclusion, it is important to understand that one focus is not necessarily better than the other one. For a designer who works in a field where a lot of innovation is needed, a promotion focus is probably better. In contrast, a prevention focus which causes people to work more cautiously and produce higher quality work might be very appropriate for a job like a surgeon, for example. The main point of the research, though, is that the actions of leaders can greatly influence whether people approach a situation with more of a promotion focus or more of a prevention focus." };
function fullTranscriptKey(){return 'sc-guided-transcript-'+lessons[lid].id}
function transcriptData(){
 const selected=lessons[lid];
 if(Array.isArray(selected.transcriptTurns)&&selected.transcriptTurns.length)return {name:selected.title,turns:selected.transcriptTurns};
 const raw=GUIDED_TRANSCRIPTS[selected.id];
 if(raw){
  // Separate complete lecture paragraphs into short readable turns, without rewriting their words.
  const turns=raw.split(/\n\s*\n/).flatMap(paragraph=>
   paragraph.trim().split(/(?<=[.!?])\s+(?=[A-Z“])/).filter(Boolean).map(text=>({speaker:'LECTURER',text}))
  );
  return {name:'Transcript bài '+lessons[lid].id,turns};
 }
 try{return JSON.parse(sessionStorage.getItem(fullTranscriptKey())||'null')}catch(e){return null}
}
function parseSRT(text){
 const raw=String(text||'').replaceAll('\r','').trim();
 let segments=raw.split('\n\n').filter(Boolean);
 const parsed=[];
 for(const part of segments){
  const lines=part.split('\n').map(x=>x.trim()).filter(Boolean);
  const time=lines.findIndex(x=>x.includes('-->'));
  let content=(time<0?lines:lines.slice(time+1)).join(' ').replace(/<[^>]*>/g,'').trim();
  if(content)parsed.push({speaker:'LECTURER',text:content});
 }
 if(parsed.length<=1){
  return raw.split(/(?<=[.!?])\s+(?=[A-Z])/).map(text=>({speaker:'LECTURER',text:text.trim()})).filter(x=>x.text);
 }
 return parsed.filter((x,i)=>i===0||x.text!==parsed[i-1].text);
}
async function importFullTranscript(el){

 catch(e){alert('Không thể lưu transcript trên trình duyệt.');return}
 store.gapTranscriptAnswers={};save();render();
}

function gapWordKeyValue(word){
 const w=String(word).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z']/g,'');
 return w.endsWith('ies')?w.slice(0,-3)+'y':w.endsWith('es')&&w.length>6?w.slice(0,-2):w.endsWith('s')&&!w.endsWith('ss')&&w.length>5?w.slice(0,-1):w;
}

function guidedGapEligible(m,turn){
 const raw=m[0],word=raw.toLowerCase(),key=gapWordKeyValue(word);
 // Do not remove place/person/organisation names, scientific names, or rare taxonomy.
 if(GUIDED_GAP_EXCLUSIONS.has(word)||GUIDED_GAP_EXCLUSIONS.has(key))return false;
 // Single words only, avoid scientific hyphenations, unfamiliar long terminology,
 // and capitalized names even if they occur at the beginning of a sentence.
 if(/[-'’]/.test(raw)||raw.length>11)return false;
 // Conservative by design: leave every originally capitalized token visible.
 // This also protects names that happen to start a sentence (e.g. World Tours).
 if(/[A-Z]/.test(raw))return false;
 return true;
}
function fullGapExercise(){
 const source=transcriptData();if(!source||!source.turns?.length)return null;
 const ignored=new Set(('there these those which would could their where today people about after before because should through really other every whose what when more much this that have been will were then them they from into with both your good also many some first second third well just very only once under over right around across again being doing going thing things actually currently local same time years later place places number country species').split(' '));
 const forbidden=new Set((lessons[lid].answer||[]).flat().map(gapWordKeyValue));
 const used=new Set(),blanks=[],lookup=new Map();
 const turns=source.turns,total=turns.length;
 // All lines get coverage first; longer lines get a second unique word.
 const candidates=turns.map((turn,line)=>{
  const words=[...turn.text.matchAll(/\b[A-Za-z][A-Za-z'-]{4,}\b/g)]
   .filter(m=>!ignored.has(m[0].toLowerCase())&&!forbidden.has(gapWordKeyValue(m[0]))&&guidedGapEligible(m,turn))
   .filter(m=>!(m.index>0&&/[’']/u.test(turn.text[m.index-1])));
  return words.map(m=>{
   const word=m[0].toLowerCase(),vocab=lessons[lid].vocab.some(v=>v[0].toLowerCase()===word);
   return {m,score:(GUIDED_GAP_PREFER.has(word)?8:0)+(vocab?1:0)+Math.min(word.length,9)*.12+(m.index/Math.max(1,turn.text.length))};
  }).sort((a,b)=>b.score-a.score||a.m.index-b.m.index);
 });
 const choice=Array.from({length:total},()=>[]);
 const target=Math.min(GUIDED_GAP_TARGET,candidates.reduce((n,x)=>n+Math.min(2,x.length),0));
 for(let pass=0;pass<2;pass++){
  for(let line=0;line<total;line++){
   if(choice.flat().length>=target)break;
   const words=candidates[line],turn=turns[line];
   // Second blank only for a long enough sentence, not in very short lines.
   if(pass===1&&turn.text.length<105)continue;
   const selected=words.find(({m})=>{
    const k=gapWordKeyValue(m[0]);
    return !used.has(k)&&choice[line].every(prev=>Math.abs(prev.m.index-m.index)>19);
   });
   if(selected){used.add(gapWordKeyValue(selected.m[0]));choice[line].push(selected)}
  }
 }
 for(let line=0;line<total;line++){
  const hits=choice[line].sort((a,b)=>a.m.index-b.m.index);
  if(hits.length){
   lookup.set(line,hits.map(hit=>({index:blanks.length+hits.indexOf(hit),start:hit.m.index,word:hit.m[0]})));
   hits.forEach(hit=>blanks.push(hit.m[0]));
  }
 }
 return {source,blanks,lookup};
}

function guidedExamQuestions(l){
 if(Array.isArray(l.exam)&&l.exam.length)return l.exam;
 return l.questions.map((q,i)=>({n:i+31,type:'blank',text:q,answers:l.answer[i],evidence:l.evidence[i],cue:{start:answerCues[l.id]?.[i]?.[0]||0,end:answerCues[l.id]?.[i]?.[1]||0}}));
}
function guidedExamCount(l){return guidedExamQuestions(l).reduce((n,q)=>n+(q.type==='two'?2:1),0)}
function guidedExamAnswer(q,i){
 const entry=String(item('real',i)||'').trim();
 if(q.type==='two')return entry.split(',').filter(x=>q.answers.includes(x)).length;
 return q.answers.some(x=>safe(x)===safe(entry))?1:0;
}
function guidedExamScore(l){return guidedExamQuestions(l).reduce((n,q,i)=>n+guidedExamAnswer(q,i),0)}
function guidedPutReal(i,value){put('real',Number(i),value)}
function guidedUpdateTwo(i,value,checked){
 let choices=String(item('real',i)||'').split(',').filter(Boolean);
 if(checked){if(!choices.includes(value)&&choices.length<2)choices.push(value)}
 else choices=choices.filter(x=>x!==value);
 put('real',i,choices.join(','));
 document.querySelectorAll('[data-two="'+i+'"]').forEach(x=>{
  x.checked=choices.includes(x.value);
  x.disabled=!!submitted||(!x.checked&&choices.length>=2);
 });
}
function guidedQuestionHTML(q,i){
 const value=String(item('real',i)||'');
 const disabled=submitted?' disabled':'';
 const title='<div class="guided-q-heading"><strong>Question '+q.n+(q.type==='two'?'–'+(q.n+1):'')+'</strong><span>'+escapeHtml(q.type==='match'?'Matching':q.type==='two'?'Choose TWO':q.type==='mc'?'Choose A, B or C':'ONE WORD ONLY')+'</span></div>';
 let field='';
 if(q.type==='blank'){
  const input='<input class="real-answer-input" type="text" autocomplete="off" data-index="'+i+'" value="'+escapeHtml(value)+'" placeholder="Điền đáp án" '+disabled+' oninput="guidedPutReal(this.dataset.index,this.value)">';
  const prompt=escapeHtml(q.text);
  field='<div class="question">'+(prompt.includes('[[BLANK]]')?prompt.replace('[[BLANK]]',input):prompt.includes('_____')?prompt.replace('_____',input):prompt+' '+input)+'</div>';
 }else if(q.type==='mc'||q.type==='two'){
  const choices=q.type==='two'?value.split(','):null;
  field='<div class="question">'+escapeHtml(q.text)+'</div><div class="guided-exam-options">'+(q.options||[]).map((option,j)=>{
   const letter=String.fromCharCode(65+j),checked=q.type==='two'?choices.includes(letter):value===letter;
   const attr=q.type==='two'?'onchange="guidedUpdateTwo('+i+',this.value,this.checked)" data-two="'+i+'"':'onchange="guidedPutReal('+i+',this.value)"';
   return '<label><input type="'+(q.type==='two'?'checkbox':'radio')+'" name="real'+i+'" value="'+letter+'" '+(checked?'checked':'')+' '+attr+disabled+'><span>'+letter+'. '+escapeHtml(option)+'</span></label>';
  }).join('')+'</div>';
 }else if(q.type==='match'){
  field='<div class="question">'+escapeHtml(q.text)+'</div><select class="guided-match-select" '+disabled+' onchange="guidedPutReal('+i+',this.value)"><option value="">Chọn đáp án A–G</option>'+(lessons[lid].matchOptions||[]).map((op,j)=>{const letter=String.fromCharCode(65+j);return '<option value="'+letter+'" '+(value===letter?'selected':'')+'>'+letter+'. '+escapeHtml(op)+'</option>'}).join('')+'</select>';
 }
 return '<div class="tile guided-exam-card">'+title+field+'</div>';
}

function change(dir){
 clearPracticeFeedback();
 if(dir<0){stage=Math.max(-1,stage-1);render();return}
 if(stage>=7)return;
 // Check the warm-up gate BEFORE the historical unlocked-step shortcut.
 if(stage===-1){
  const score=fullGapResult();
  if(!score||!score.total||score.correct!==score.total){
   checkFullTranscript();
   const notice=$('gapFullResult');
   notice?.scrollIntoView?.({behavior:'smooth',block:'nearest'});
   return;
  }
  store.gapPassed=true;
  store.maxUnlocked=Math.max(0,store.maxUnlocked);
  stage=0;save();render();window.scrollTo({top:0,behavior:'smooth'});return;
 }
 const warmup=fullGapResult();
 if(!warmup||!warmup.total||warmup.correct!==warmup.total){
  store.gapPassed=false;store.maxUnlocked=-1;stage=-1;save();render();return;
 }
 if(stage+1<=store.maxUnlocked){stage++;render();window.scrollTo({top:0,behavior:'smooth'});return}
 const l=lessons[lid];
 if(stage===0 && activeVocab(l).length<3){showPracticeFeedback('Chọn ít nhất 3 từ hoặc cụm từ cần học.');return}
 if(stage===2){
  const v=activeVocab(l);
  if(v.some((pair,i)=>!item('match',i))){showPracticeFeedback('Hãy ghép đủ các thẻ nghĩa trước khi tiếp tục.');return}
  const wrong=v.filter((pair,i)=>item('match',i)!==pair[1]).length;
  if(wrong){showPracticeFeedback('Có '+wrong+' cặp chưa đúng. Hãy thử lại.');return}
 }
 if(stage===3){
  const quiz=quizItems(l),answers=quiz.filter((q,i)=>!!item('quiz',i));
  if(answers.length!==quiz.length){showPracticeFeedback('Hãy trả lời đầy đủ câu hỏi trước khi tiếp tục.');return}
  const right=quiz.filter((q,i)=>item('quiz',i)===q[2]).length;
  if(right/quiz.length<0.8){showPracticeFeedback('Cần đạt ít nhất 80% câu đúng để tiếp tục.');return}
 }
 if(stage===4){
  if(l.keywords.some((q,i)=>!item('keyword',i))){showPracticeFeedback('Hãy hoàn thành tất cả câu hỏi.');return}
  if(l.keywords.some((q,i)=>item('keyword',i)!==q[2])){showPracticeFeedback('Một số câu chưa đúng. Hãy kiểm tra lại.');return}
 }
 if(stage===5){
  if(l.para.some((p,i)=>!item('para',i))){showPracticeFeedback('Hãy ghép đủ các cặp.');return}
  if(l.para.some((p,i)=>item('para',i)!==p[1])){showPracticeFeedback('Một số cặp chưa đúng. Hãy thử lại.');return}
 }
 if(stage===6&&!submitted){
  if(!confirm('Nộp bài? Sau bước này, đáp án và transcript sẽ được mở khóa.'))return;
  submitted=true;store.submitted=true;store.submittedAt=new Date().toISOString();
  let score=guidedExamScore(l);
  try{let h=JSON.parse(localStorage.getItem('SC_ATTEMPT_HISTORY_V1')||'[]');h.push({skill:'listening',section:'guided',title:'Guided Listening '+l.id+' – '+l.title,score,total:guidedExamCount(l),correct:score,wrong:guidedExamCount(l)-score,savedAt:store.submittedAt});localStorage.setItem('SC_ATTEMPT_HISTORY_V1',JSON.stringify(h))}catch(e){}
  reportGuidedResult(l,score);
 }
 stage=Math.min(7,stage+1);store.maxUnlocked=Math.max(store.maxUnlocked,stage);
 save();render();window.scrollTo({top:0,behavior:'smooth'});
}
function restart(){if(!confirm('Xóa câu trả lời hiện tại để luyện lại?'))return;sessionStorage.removeItem(key());stage=-1;getStore();render()}

 {title:'Tự chọn từ cần học',description:'Chỉ chọn từ hoặc cụm từ em chưa biết trong transcript vừa luyện.',tasks:['Đọc lại transcript vừa hoàn thành; nhấp vào từ cần học hoặc kéo sang danh sách bên phải.','Tra nghĩa bằng cách nhấp đúp, sau đó lưu từ muốn học.','Chọn ít nhất 3 từ để tiếp tục.'],tip:'Không cần học lại những từ em đã biết. Các từ em chọn sẽ tạo thành bộ từ cá nhân.'},
 {title:'Học bộ từ của em',description:'Ôn đúng những từ em đã tự chọn ở bước trước.',tasks:['Đọc từ tiếng Anh và nghĩa tiếng Việt.','Xem ví dụ theo ngữ cảnh nếu có; bấm biểu tượng loa để nghe phát âm.','Sau khi đã sẵn sàng, bấm “Tiếp tục” để chơi game.'],tip:'Em có thể quay lại bước chọn từ nếu cần điều chỉnh danh sách.'},
 {title:'Ghép thẻ từ vựng',description:'Ghép từng từ tiếng Anh với đúng nghĩa tiếng Việt.',tasks:['Kéo thẻ nghĩa vào từ tương ứng; trên điện thoại có thể chạm chọn.','Kéo thẻ đã ghép sang ô khác, về ngân hàng hoặc bấm “Bỏ ghép” để sửa.','Ghép đúng toàn bộ các cặp để tiếp tục.'],tip:'Khi kiểm tra, ô xanh là đúng, ô đỏ cần sửa. Hệ thống không hiện đáp án thay em.'},
 {title:'Vocabulary Check',description:'Kiểm tra xem em đã nhớ nghĩa của các từ vừa học chưa.',tasks:['Đọc từng câu hỏi và chọn một phương án.','Hoàn thành mọi câu rồi bấm “Tiếp tục”.','Đạt ít nhất 80% số câu đúng để mở bước tiếp.'],tip:'Nếu chưa đạt, xem lại các câu sai và thử lại.'},
 {title:'Nhận diện Keywords',description:'Dự đoán loại từ phù hợp với chỗ trống trong câu hỏi nghe.',tasks:['Đọc ngữ cảnh trước và sau chỗ trống.','Chọn noun, verb hoặc adjective cho từng câu.','Trả lời đúng tất cả để tiếp tục.'],tip:'Dựa vào cấu trúc câu, không cần biết trước đáp án nghe.'},
 {title:'Paraphrase Matching',description:'Ghép cách diễn đạt trong câu hỏi với cách nói tương ứng trong bài nghe.',tasks:['Đọc cụm ở bên trái.','Chọn cách diễn đạt tương đương trong danh sách đã xáo trộn.','Ghép đúng tất cả các cặp để tiếp tục.'],tip:'Đừng chỉ tìm từ giống hệt: bài nghe có thể diễn đạt cùng ý bằng từ khác.'},
 {title:'Real Listening Test',description:'Làm 10 câu nghe theo dạng đề IELTS thực tế.',tasks:['Đọc kỹ yêu cầu từng nhóm câu hỏi và nghe audio.','Trả lời theo đúng dạng: điền từ, trắc nghiệm hoặc matching.','Bấm “Nộp bài” để lưu kết quả và mở phần Review.'],tip:'Đáp án và phần giải thích chỉ được hiển thị sau khi nộp bài.'},
 {title:'Review bài nghe',description:'Xem những câu đã làm đúng hoặc cần cải thiện.',tasks:['Xem kết quả và đáp án của 10 câu.','Đọc dẫn chứng transcript ở từng câu.','Nghe lại những đoạn liên quan và ghi nhớ lỗi cần tránh.'],tip:'Em có thể bấm các bước đã mở ở thanh điều hướng để ôn lại.'}
];
function currentGuideIndex(){return Math.min(8,Math.max(0,stage+1))}
function gapGuideKey(){return 'SC_GUIDED_STEP_GUIDE_SEEN_V3_'+lessons[lid].id+'_'+currentGuideIndex()}
function showGapGuide(force=false){
 if(!force){try{if(localStorage.getItem(gapGuideKey())==='1')return}catch(e){}}
 const overlay=$('gapGuideOverlay');if(!overlay)return;
 const index=currentGuideIndex(),baseGuide=guidedStepGuide[index];
 const guide={...baseGuide,tasks:[...baseGuide.tasks]};
 if(index===7&&!lessons[lid].part){
  guide.tasks[1]='SECTION 4: điền một từ vào mỗi câu, đúng theo yêu cầu đề.';
 }
 if(index===0&&lessons[lid].transcriptScope==='selected-excerpts'){
  guide.description='Nghe và hoàn thành các ô từ còn thiếu trong những đoạn transcript hiện có của bài.';
 }
 $('gapGuideEyebrow').textContent='BƯỚC '+String(index+1).padStart(2,'0')+' · HƯỚNG DẪN';
 $('gapGuideTitle').textContent=guide.title;
 $('gapGuideDescription').textContent=guide.description;
 $('gapGuideTasks').replaceChildren(...guide.tasks.map(t=>{const li=document.createElement('li');li.textContent=t;return li}));
 $('gapGuideTip').textContent=guide.tip;
 overlay.hidden=false;document.body.classList.add('gap-guide-open');
 $('gapGuideStart')?.focus();
}
function closeGapGuide(){
 const overlay=$('gapGuideOverlay');if(!overlay)return;
 overlay.hidden=true;document.body.classList.remove('gap-guide-open');
 try{localStorage.setItem(gapGuideKey(),'1')}catch(e){}
 document.querySelector('.step-guide-replay')?.focus();
}
function render(){
 clearPracticeFeedback();
 const l=lessons[lid];$('lessonName').textContent=(l.part?'Part '+l.part+' · ':'Part 4 · ')+'Bài '+(l.part?l.id.split('-')[1]:l.id)+' · '+l.title;
 const part=l.part||4;
 $('guidedBack').textContent='← Part '+part;
 $('guidedBack').href='../Practice/Listening/Intensive%20Listening/Part'+part+'/';
 $('guidedAreaPill').textContent='FOUNDATIONS · GUIDED IELTS LISTENING · PART '+part;
 const labels=['Gap-fill',...stepNames];
 const result=fullGapResult();
 const gapPerfect=!!(result&&result.total>0&&result.correct===result.total);
 $('steps').innerHTML=labels.map((label,i)=>{
  const dest=i-1,locked=dest>(store.maxUnlocked??-1)||(dest>=0&&!gapPerfect),active=dest===stage;
  return '<button type="button" class="'+(active?'active':locked?'step-locked':'step-available')+'" '+(locked?'disabled aria-disabled="true"':'onclick="goto('+dest+')"')+' aria-current="'+(active?'step':'false')+'">'+(i+1)+'. '+label+'</button>';
 }).join('');
 $('content').innerHTML=stageHTML(l);
 $('content').insertAdjacentHTML('afterbegin','<div class="step-guide-toolbar"><button type="button" class="step-guide-replay" onclick="showGapGuide(true)">ⓘ Hướng dẫn bước này</button></div>');
 $('prev').style.visibility=stage===-1?'hidden':'visible';
 $('next').textContent=stage===-1?'Chọn từ cần học →':stage===0?'Học từ đã chọn →':stage===6?(submitted?'Xem Review →':'Nộp bài →'):'Tiếp tục →';
 $('next').style.display=stage===7?'none':'inline-block';
 $('next').disabled=stage===-1&&!gapPerfect;
 $('next').title=stage===-1&&!gapPerfect?'Hoàn thành đúng 100% Gap-fill để mở bước tiếp theo':'';
 if(stage===-1)$('next').textContent=gapPerfect?'Chọn từ cần học →':'Đạt 100% để tiếp tục';
 showGapGuide();
}
function goto(i){
 if(!Number.isInteger(i)||i< -1||i>7||i>(store.maxUnlocked??-1))return;
 if(i>=0){
  const gap=fullGapResult();
  if(!gap||!gap.total||gap.correct!==gap.total)return;
 }
 stage=i;render();window.scrollTo({top:0,behavior:'smooth'});
}
// Show an accurate answer-cue guide while the uploaded MP3 is selected by the learner.
window.GuidedListeningAnswerCues=answerCues;
const requestedLesson=new URLSearchParams(location.search).get('lesson');
const selectedLesson=lessons.findIndex(lesson=>lesson.id===requestedLesson);
if(selectedLesson>=0)lid=selectedLesson;
getStore();render();
