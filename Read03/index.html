<div id="start" class="start"><div class="start-card"><div class="eyebrow">IELTS Reading Practice</div><h1>Computer-Based Reading Test</h1><p>3 passages · 40 questions · 60 minutes</p><div class="field"><label>Họ và tên học sinh</label><input id="studentName" placeholder="Ví dụ: Nguyễn Văn An"></div><div class="field"><label>Lớp</label><input id="studentClass" placeholder="Ví dụ: 8A1"></div><button class="btn" onclick="startExam()">Bắt đầu làm bài</button><div id="startError" style="color:var(--bad);margin-top:10px"></div></div></div>
<div id="exam" class="exam hidden"><div class="top"><div>Student: <b id="topName"></b> &nbsp; | &nbsp; Class: <b id="topClass"></b></div><div id="timer" class="timer">60:00</div></div><div class="tabs"><button class="tab active" data-p="1" onclick="showPassage(1)">Passage 1</button><button class="tab" data-p="2" onclick="showPassage(2)">Passage 2</button><button class="tab" data-p="3" onclick="showPassage(3)">Passage 3</button></div><div class="workspace"><div id="passage" class="passage"></div><div id="questions" class="questions"></div></div><div class="bottom"><div id="nav" class="nav"></div><button class="submit" onclick="submitExam(false)">Nộp bài</button></div></div>

<script>const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwfwWjJ7Q3VTJEF5ldKGnFKYoziQdntAzRjq1Yqy6HSmbZSc69ijSdOvMCC_Zogbpcm/exec";
const passages={"1": {"title": "The History of the Chicken", "text": "<p>Chicken is the universal food of our era, crossing cultural boundaries with ease. With its mild taste and uniform texture, chicken presents a blank canvas for the national flavours of almost any cuisine. However, until the introduction of large-scale industrial production in the 20th century, the economic and nutritional contribution of chickens was small. Chickens were considered as domestic birds that were useful to humanity, but unlike other animals such as the horse or the ox, they did little to change the course of history. Nonetheless, the chicken has inspired contributions to culture, art, cuisine, science and religion over the millennia. Chickens were, and still are, a sacred animal in some cultures. The hen is a worldwide symbol of nurturing and fertility. The rooster is a universal sign of masculinity.</p>\n<p>The domesticated chicken has a complicated family tree, stretching back 10,000 years. Recent DNA testing has shown that the chicken's wild ancestor is the red junglefowl. The bird's resemblance to modern chickens is seen in the red feathers on top of its head, the red flesh around its mouth, and its distinctive call in the morning. The females of this breed protect their eggs in the same way modern-day chickens do, and they make the same clucking sounds. In its habitat, which stretches from north-eastern India to the Philippines, the red junglefowl looks on the forest floor for insects, seeds and fruit, and flies up to nest in the trees at night. That's about as much flying as it can manage, a trail that made it relatively easy for humans to capture and domesticate it. But the red junglefowl is not the sole ancestor of the modern chicken. Scientists have identified three closely related species that might have bred with the red junglefowl. Precisely how much genetic material these other birds contributed to the DNA of domesticated chickens is unknown. However, recent research suggests that modern chickens inherited at least one trait, their yellow skin, from the grey junglefowl of southern India.</p>\n<p>Once chickens were domesticated, cultural contacts, trade, migration and territorial conquest resulted in their introduction to different regions around the world over several thousand years. Chickens arrived in Egypt in around 1750 BC, as fighting birds and additions to zoos. Drawings of the birds decorated royal tombs, which contained the treasures that the kings and queens would take to the afterlife. Yet it would be another 100 years before the bird became popular among ordinary Egyptians.</p>\n<p>It was in that era that Egyptians mastered the technique of artificial incubation, which freed hens to lay more eggs. This was not easy. Most chicken eggs will hatch in three weeks, but only if the temperature remains at around 38 degrees Celsius. The eggs must also be turned three to five times a day, and the humidity must remain stable at about 55 percent, otherwise physical deformities can result, or the eggs won't hatch The Egyptians constructed vast complexes of large rooms, which were essentially ovens, and these were connected to a series of corridors and vents that allowed attendants to regulate the heat from fires. The egg attendants kept their methods a secret from outsiders for centuries.</p>\n<p>Around the Mediterranean, archaeologists have uncovered chicken bones from about 800 BC. Chickens were a delicacy among the Romans, whose culinary innovations included the omelette, and the practice of stuffing birds for cooking. European farmers began developing methods to fatten the birds, such as feeding them bread which had been soaked in wine. But the chicken’s status in Europe appears to have diminished with the collapse of Rome. In the period after the fall of the Roman Empire, chicken farms vanished and the birds returned to the size they had been 1,000 years earlier.</p>\n<p>Well into the 20th century chickens, although valued as a source of eggs, played a relatively minor role in diet and the economy. Long after cattle had entered the industrial age of centralized and mechanized large-scale production, chicken production was still a small-scale, local enterprise. The breakthrough that made today’s huge bird farms was the inclusion of antibiotics, along with a mixture of different vitamins, in the food chickens ate. This allowed chickens to be raised indoors and be protected from cold temperatures and heavy rain as well as predators. This factory farming represents the chicken’s final step in its transformation into a big protein-producing business.</p>\n<p>Factory farms turning out an increasing amount of chicken have resulted in an increasing demand. Modern chickens are cogs in a system designed to convert grain into protein with staggering efficiency. It takes less than 1 kilogram of feed to produce 400 grams of chicken. By comparison, around 3 kilograms of feed are required to produce 400 grams of beef. A day-old chick can be turned into a 2 kilogram bird in six week – half the time it took two generations ago.</p>\n<p>Chickens also make wonderful pets, as breeders will tell you. They are as colourful as tropical fish but more affectionate, as cute as guinea pigs and better catching mice than cats. In the USA, exotic and heritage breeds of chicken are being sold for a considerable source of money as the fashion for keeping chickens in the backyards becomes more popular.</p>\n<p>All in all, the globe-spanning chicken is an epic story of evolutionary, agricultural and culinary success, outnumbering human beings on the planet by nearly three to one.</p>"}, "2": {"title": "A study of introvert and extrovert characters", "text": "<p><b>A</b> We are often labelled as introverts or extroverts, and humans do seem to have biological propensities to behave in certain ways; some of us are naturally more talkative and sociable while others prefer more time alone. But, according to Canadian-born research psychologist Professor Brian Little, our traits are by no means fixed. In his book Me, Myself and Us: The Science of Personality and the Art of Well/-Being, Little suggests that we are often able to override our biological make-up through the adoption of what he calls \"free-traits', which allow us to behave in a manner which contrasts with our natural selves. According to Little, we adopt these free-traits only when we need them, in order to meet the demands of different situations and reach targets and goals that are important to us - our 'persona projects' These projects might be big (such as career ambitions) or small (like cleaning the car) and pursuing them shapes our day-to-day behavior and our relationships with friends, family and workmates.</p>\n<p><b>B</b> Little recommends that we might usefully think of ourselves as amateur scientists. We are continually exploring and testing the world around us to discover what works and what doesn't. We do things, say things, and then we observe the reactions and unconsciously store the results. We apply the knowledge gained from our 'experiments' to the advancement of our personal projects. Sometimes our personal project pursuit requires us to engage in free traits; at other times, we can just be ourselves. Little proposes that the successful pursuit of personal projects which are meaningful, manageable, supported by others and generate positive feelings can greatly impact our happiness and the quality of our lives.</p>\n<p><b>C</b> Professor Little and one of his graduate students, Sanna Balsari-Palsule, have looked into the experiences of employees in a range of organisations. The reason for basing the research on this environment, as Balsari-Palsule explains, is that ‘in an ideal world, one's job would fit one's traits perfectly, but that's very rarely the case. As so much can hinge on how we behave with others while at work, I wanted to discover what happens when people push the limits of their ability to act out of character. Do employees experience detriments in their well-being or work performance and does this increase their chances of burnout?\"</p>\n<p><b>D</b> Their findings suggest that extroverts initially experience advantages over introverts at work, in terms of getting noticed and promoted more rapidly. However, when introvert employees higher up in the organisation act out of character and take on extrovert traits, they have equal performance ratings to those extroverts, and do not report any negative effects of this use of free traits. Balsari Palsule offers an explanation: introvert employees make frequent use of 'restorative resources ‘These are spaces designed to allow employees to read quietly or simply relax in order to recover their equilibrium after a strenuous session of acting out of character that would otherwise leave them feeling drained. However, if the same employees were expected to act out of character for more prolonged periods, without the chance to recover, the benefits could quickly turn into costs.</p>\n<p><b>E</b> In the same study, however, extroverts report strikingly different, and much less rewarding, experiences of acting out of character. It appears that more outwardly confident personality types find it extremely hard-and stressful-to rein back their personalities and act as if they were introverted. We found this difference was most common among younger employees. It may be that introverts are generally so used to acting extrovertly in situations outside of the workplace that it becomes a relatively easy force of habit, particularly in Western cultures where extroversion is often highly valued. On the other hand, extrovert employees at the beginning of their careers are much less used to being isolated in an office for long periods of time, so may feel like caged animals, needing to feed off the energy of others in order to thrive, ‘says Balsari-Palsule.</p>\n<p><b>F</b> In the second stage of research, Balsari-Palsule is looking into the idiosyncrasies of people's work projects and how the work environment plays a vital role in supporting or, in some cases, constraining them. For example, highly competitive environments, which place demands on employees to conform to certain types of behaviour, may leave little time for employees to pursue projects which are important to them on a personal level. This could eventually be detrimental to their well-being. She expects that a closer look at the influences of different factors in the work environment, in conjunction with how people behave, will shed more light on what acting out of character may lead to.</p>\n<p><b>G</b> The implications of Little and BalsariPalsule's research are numerous and need to be taken into account by businesses. Balsari-Palsule suggests that it would serve companies well not to dismiss the costs of free-trait acting. She points out that compromised psychological and physical well-being can quickly result in more frequent occurrences of absenteeism. She also believes that management should rely less on handing out personality surveys that pigeonhole employees into introvert and extrovert categories. instead, organisations should adopt policies and build work environments that are supportive of free-trait expression, and also provide the spaces for people to be themselves. Furthermore, making these changes is also likely to lead to increases in productivity in the long run.</p>"}, "3": {"title": "Seeing the colour of sounds, hearing the colour of numbers", "text": "<p><b>A</b> What is the colour of five? What is the sound of blue? To most of us such questions are either meaningless or suitable only for poetry. But for some people these are questions to which very precise answers can be given. Five, for example, for some people is green, while others say the sound of a guitar is like someone blowing on their ankles. People who 'see' colour in numbers or letters of the alphabet and 'feel' sensation in sound have synesthesia – meaning literally 'joined sensation' – an extraordinary condition that causes certain senses to leak' into one another.</p>\n<p><b>B</b> People whose senses behave in this way are called 'synesthetes'. Some synesthetes take pleasure in it. To me it's like other people see the world in black and white, says one, who sees every letter, number, sound and pain in colour. Others learn to keep it a secret for fear of people laughing at them. But to neurologists investigating the brain it is of great interest. 'When scientists study normal perception,' says Daniel Smilek of the University of Waterloo in Ontario, Canada, there are lots of things we don't question because most of us perceive in the same way. Synesthesia, because it's abnormal, can give us new insights into normal perception.</p>\n<p><b>C</b> Seventeenth-century English philosopher John Locke was the first westerner to describe synesthesia. He wrote about a man who experienced bright red as the sound of the trumpet. Later, the condition excited the imagination of nineteenth-century European painters, such as the non-synesthete Wassily Kandinsky, who believed synesthetes were like good, much-played violins, which vibrate in all their parts and fibres. But it proved impossible to research and people lost interest. Recently, however, advances in brain imaging have sparked renewed interest.</p>\n<p><b>D</b> Early claims that the multi-sensory experiences of synesthesia were linked with the hallucinations of mental illness have long been disproved. Until 1993, many researchers dismissed it as another name for a vivid imagination, but then an experiment by Simon Baron-Cohen of Cambridge University in the UK showed that synesthetes who, when tested, had linked particular colours or shapes to letters, gave the same answers in 92 per cent of instances when tested again a week later. Non-synesthetes, given similar examples to imagine, returned the same answers in only 37 per cent of instances.</p>\n<p><b>E</b> Although there is some overlap between synesthetes as to what colour is linked to what – 56 per cent see the letter 'o' as white – most of the responses are individual. There are 30 possible sensory combinations, but links between sounds and colours are the most common. Women are between two and eight times more likely than men to have the condition.</p>\n<p><b>F</b> As yet there is no explanation for any of this, but small pieces of the jigsaw are emerging. A brain scanning experiment by Baron-Cohen in 1995 found that when synesthetes were listening to words, areas of the brain lit up that are normally only active in response to vision and colour. From this comes the notion that we may all have synesthesia at birth, when many parts of the brain are linked, but, as we develop, connections are pruned, so our senses become separated and the synesthetic mechanism is no longer intact. Somehow, synesthetes have kept their synaptic connections intact. It's an idea that has been challenged, however, on the grounds that if you give people certain drugs they will have synesthetic experiences, which suggests the mechanism is intact in adults but repressed.</p>\n<p><b>G</b> There are many more unanswered questions about synesthesia. For example, is the synesthete's colour response to a number five triggered by actually seeing the number five written on a page, or does the synesthete 'see' the colour just by thinking of the number five? The neurologist Vilyanur Ramachandran came up with a test for synesthesia which seemed to suggest it was the sight of the number that was important. He asked people to look at a page made up of specially drawn twos and fives that were a mirror image of each other. The fives were placed at random on the page but the twos were placed to form shapes such as circles or triangles. To most people the numbers just looked like a jumble without order, but to synesthetes the patterns made by the twos were very obvious as a different colour from the fives. 'This shows they were really sensing colour in the numbers they saw,' says Ramachandran 'Ideas don't form these kinds of patterns.'</p>\n<p><b>H</b> However, Smilek subsequently came up with evidence that what really matters is the idea of a number rather than the sight of it on a page. He asked a synesthete to do some simple mental arithmetic while looking at different coloured papers, The subject did not write her answers, but only thought of them and said them aloud. Smilek found that when the colour of the paper clashed with the colour of the answer, the subject's response was slower than when the colours were the same. An actual colour (the colour of the paper) could interfere with the colour of a number that existed only in her head (the answer to the mental arithmetic question). 'My research suggests that colour experiences coincide with the processing of meaning,' says Smilek. 'It's the concept of a number that's coloured.'</p>\n<p><b>I</b> So which is it? At present, we don't know, but in the future neurologists may be able to explain what's going on in the brains of people like the novelist Nabokov, who perceived the English 'a' as dark brown and the French 'e' as black.</p>"}};

function saveZoneMarkup(zone){
  const root=zoneRoot(zone);
  if(root)ssSet(zoneMarkupKey(zone),root.innerHTML);
}
function saveCurrentMarkups(){
  saveZoneMarkup('passage');
  saveZoneMarkup('questions');
}
function captureSelection(zone){
  if(submitted)return;
  const sel=window.getSelection();
  const root=zoneRoot(zone);
  if(!sel||!root||sel.rangeCount===0||sel.isCollapsed)return;
  const r=sel.getRangeAt(0);
  if(root.contains(r.commonAncestorContainer)){
    savedSelection=r.cloneRange();
    savedSelectionZone=zone;
  }
}
function annotationBlock(node){
  const el=node&&node.nodeType===3?node.parentElement:node;
  if(!el)return null;
  return el.closest('p,.completion-text,.flow-step,li,.card,.option,.inst,.bank div,h3,h4,.qtext');
}
function getUsableSelection(zone){
  const root=zoneRoot(zone);
  if(!savedSelection||savedSelectionZone!==zone||!root||!root.contains(savedSelection.commonAncestorContainer)){
    alert(zone==='questions'
      ?'Hãy bôi đen phần chữ ở bên câu hỏi trước.'
      :'Hãy bôi đen phần chữ trong bài đọc trước.');
    return null;
  }
  if(savedSelection.collapsed||!savedSelection.toString().trim()){
    alert('Hãy bôi đen một đoạn chữ trước.');
    return null;
  }

  const a=annotationBlock(savedSelection.startContainer);
  const b=annotationBlock(savedSelection.endContainer);
  if(!a||!b||a!==b){
    alert('Để highlight/ghi chú ổn định, hãy chọn chữ trong cùng một câu hoặc cùng một khối nội dung.');
    return null;
  }

  const cloned=savedSelection.cloneContents();
  if(cloned.querySelector && cloned.querySelector('input,select,button,textarea')){
    alert('Không thể highlight xuyên qua ô trả lời. Hãy chỉ chọn phần chữ.');
    return null;
  }
  return savedSelection.cloneRange();
}
function clearBrowserSelection(){
  const sel=window.getSelection();
  if(sel)sel.removeAllRanges();
  savedSelection=null;
  savedSelectionZone=null;
}
function addHighlight(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  try{
    const mark=document.createElement('mark');
    mark.className='user-highlight';
    mark.dataset.annotationZone=zone;
    const frag=r.extractContents();
    mark.appendChild(frag);
    r.insertNode(mark);
    activeHighlight=mark;
    activeHighlightZone=zone;
    saveZoneMarkup(zone);
    clearBrowserSelection();
  }catch(e){
    alert('Không thể highlight vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function clearHighlight(zone){
  if(submitted)return;
  let targets=[];
  if(activeHighlight&&activeHighlightZone===zone&&document.body.contains(activeHighlight)){
    targets=[activeHighlight];
  }else if(savedSelection&&savedSelectionZone===zone){
    const root=zoneRoot(zone);
    if(root)targets=[...root.querySelectorAll('mark.user-highlight')].filter(m=>{
      try{return savedSelection.intersectsNode(m)}catch(e){return false}
    });
  }
  if(!targets.length){
    alert('Hãy bấm vào phần đã highlight rồi chọn “Xóa HL”.');
    return;
  }
  targets.forEach(m=>{
    const p=m.parentNode;
    while(m.firstChild)p.insertBefore(m.firstChild,m);
    m.remove();
    p.normalize();
  });
  activeHighlight=null;
  activeHighlightZone=null;
  saveZoneMarkup(zone);
  clearBrowserSelection();
}
function loadNotes(zone,p=current){
  try{return JSON.parse(ssGet(noteStoreKey(zone,p))||'[]')}catch(e){return[]}
}
function saveNotes(zone,notes,p=current){
  ssSet(noteStoreKey(zone,p),JSON.stringify(notes));
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addNote(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  const quote=r.toString().trim();
  const text=prompt('Nhập ghi chú cho đoạn đã chọn:');
  if(text===null||!text.trim())return;
  const id='note_'+zone+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  try{
    const span=document.createElement('span');
    span.className='note-anchor';
    span.dataset.noteId=id;
    span.dataset.annotationZone=zone;
    span.title='Bấm để xem/sửa ghi chú';
    const frag=r.extractContents();
    span.appendChild(frag);
    r.insertNode(span);

    const notes=loadNotes(zone);
    notes.push({id,quote,text:text.trim()});
    saveNotes(zone,notes);
    saveZoneMarkup(zone);
    clearBrowserSelection();
    renderNotesPanel(zone,current,true);
  }catch(e){
    alert('Không thể tạo ghi chú cho vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function toggleNotes(zone){

function renderNotesPanel(zone,p=current,forceOpen=false){

  const notes=loadNotes(zone,p);
  if(count)count.textContent=notes.length;
  panel.innerHTML=notes.length
    ?notes.map(n=>`<div class="note-item">
        <div class="note-quote">“${esc(n.quote)}”</div>
        <div class="note-text">${esc(n.text)}</div>

          <button type="button" onclick="deleteNote('${zone}','${n.id}')">Xóa</button>
        </div>
      </div>`).join('')

function editNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt('Sửa ghi chú:',n.text);if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}

function deleteNote(zone,id){
  const notes=loadNotes(zone).filter(x=>x.id!==id);
  saveNotes(zone,notes);
  const root=zoneRoot(zone);
  if(root)root.querySelectorAll(`[data-note-id="${id}"]`).forEach(s=>{
    const p=s.parentNode;
    while(s.firstChild)p.insertBefore(s.firstChild,s);
    s.remove();
    p.normalize();
  });
  saveZoneMarkup(zone);
  renderNotesPanel(zone,current,true);
}
function openNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt(`Đoạn đã ghi chú:\n“${n.quote}”\n\nGhi chú:`,n.text);
  if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function bindAnnotations(zone){
  const root=zoneRoot(zone);if(!root)return;
  root.addEventListener('mouseup',()=>captureSelection(zone));
  root.addEventListener('keyup',()=>captureSelection(zone));
  root.addEventListener('click',e=>{
    const note=e.target.closest('.note-anchor');
    if(note){openNote(zone,note.dataset.noteId);return}
    const mark=e.target.closest('mark.user-highlight');
    if(mark){
      activeHighlight=mark;
      activeHighlightZone=zone;
    }else if(zone===activeHighlightZone){
      activeHighlight=null;
      activeHighlightZone=null;
    }
  });
}
function annotationToolbar(zone){
  const isQ=zone==='questions';
  const label=isQ?'Câu hỏi':'Bài đọc';
  const countId=isQ?'notesCountQuestions':'notesCountPassage';
  return `<div class="annotation-bar">

function optionValue(x){

}

    body=`<select class="ans" id="q${q.n}" data-q="${q.n}"><option value="">-- Choose --</option>${q.opts.map(x=>`<option value="${optionValue(x)}">${x}</option>`).join('')}</select>`;
  }else{
    body=q.opts.map(x=>{
      const v=optionValue(x);

  return `<div class="card" id="card${q.n}"><div class="qhead"><span class="qnum">${q.n}</span><div class="qtext">${q.text}</div></div>${body}<div class="feedback" id="fb${q.n}"></div></div>`;

function inlineText(n,placeholder='answer'){

function renderStandardGroup(qs,title,inst){

function buildQuestions(p){
  let h='';

    h+=renderStandardGroup(questions.filter(q=>q.n>=1&&q.n<=7),'Questions 1–7','Choose TRUE, FALSE or NOT GIVEN.');

    h+=renderChooseTwo();

  }else{

  restore(p);

  }

function getMulti(){
  try{return JSON.parse(ssGet('g2122')||'[]')}catch(e){return[]}
}
function restore(p){
  for(const q of questions.filter(x=>x.p===p&&x.type!=='multi')){
    const v=ssGet('q'+q.n)||'';
    if(q.type==='text'||q.type==='select'){
      const e=document.getElementById('q'+q.n);
      if(e)e.value=v;
    }else if(v){
      const e=[...document.querySelectorAll(`input[name="q${q.n}"]`)].find(x=>x.value===v);
      if(e)e.checked=true;
    }
  }
  if(p===2){
    const sel=getMulti();
    document.querySelectorAll('input[name="g2122"]').forEach(e=>e.checked=sel.includes(e.value));
  }

function bindTrack(){

  });
  document.querySelectorAll('input[type=radio]').forEach(e=>{

  });
  document.querySelectorAll('input[name="g2122"]').forEach(e=>{
    e.onchange=()=>{
      let sel=[...document.querySelectorAll('input[name="g2122"]:checked')].map(x=>x.value);
      if(sel.length>2){
        e.checked=false;
        sel=[...document.querySelectorAll('input[name="g2122"]:checked')].map(x=>x.value);
        alert('Chỉ chọn TWO đáp án.');
      }
      ssSet('g2122',JSON.stringify(sel));

  });

function save(n,v){

function goQ(n){
  const q=questions.find(x=>x.n===n);

  setTimeout(()=>{
    const target=document.getElementById('card'+n)||(n===22?document.getElementById('card21'):null);

function correct(q,u){

function removeInlineReview(n){
  document.querySelectorAll(`[data-inline-review="${n}"]`).forEach(e=>e.remove());
}

function renderInlineReview(q,user,ok){
  removeInlineReview(q.n);
  if(ok)return;

  const card=document.getElementById('card'+q.n);
  if(!card)return;

  // Standard IELTS question cards: explanation sits directly under the options.
  if(card.classList.contains('card')){
    card.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
    return;
  }

  // Completion tasks: place review under the sentence/step/note containing the blank.
  const host=card.closest('.flow-step,li,.completion-text') || card.parentElement;
  if(!host)return;

  // Several blanks may live in the same summary paragraph; keep each explanation labelled by Q number.
  host.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
}

function lockSubmittedAnswers(){
  if(!submitted)return;
  document.querySelectorAll('#questionsCopy input,#questionsCopy select').forEach(e=>e.disabled=true);
}

function focusEvidence(n){
  const q=questions.find(x=>x.n===n);
  const r=answerReview[n];
  if(!q||!r)return;

  const reveal=()=>{
    const copy=document.getElementById('passageCopy');
    const ps=copy?[...copy.querySelectorAll('p')]:[];
    const target=ps[r.para-1];
    if(!target)return;
    target.scrollIntoView({behavior:'smooth',block:'center'});
    target.classList.add('evidence-pulse');
    setTimeout(()=>target.classList.remove('evidence-pulse'),3200);
  };

  if(q.p!==current){
    showPassage(q.p);
    setTimeout(reveal,150);
  }else{
    reveal();
  }
}

function multiReviewHTML(sel,hits){

  const r=answerReview[21];
  return `<div class="inline-review integrated" data-inline-review="2122">
    <div class="inline-review-title"><span class="inline-review-badge">Q21–22</span><span>Giải thích nhóm câu trả lời sai</span></div>
    <div class="inline-review-row"><div class="inline-review-label">Bạn chọn</div><div class="inline-review-student">${esc(sel.length?sel.join(', '):'Không trả lời')}</div></div>
    <div class="inline-review-row"><div class="inline-review-label">Đáp án đúng</div><div class="inline-review-correct">B, E</div></div>
    <div class="inline-review-row"><div class="inline-review-label">Điểm nhóm</div><div>${hits} / 2</div></div>
    <div class="inline-review-explain"><b>Vì sao?</b> ${esc(r.explain)}</div>
    <div class="inline-review-evidence"><div class="inline-review-evidence-label">Evidence · Passage 2, đoạn ${r.para}</div><div class="inline-review-quote">“${esc(r.evidence)}”</div></div>
    <button type="button" class="inline-review-btn" onclick="focusEvidence(21)">↗ Đối chiếu trong bài đọc</button>
  </div>`;
}
function markMultiGroup(){
  const sel=getMulti(),key=['B','E'],hits=sel.filter(x=>key.includes(x)).length,perfect=hits===2&&sel.length===2;
  document.querySelectorAll('[data-group="g2122"]').forEach(l=>{
    l.classList.remove('correct','wrong');
    if(key.includes(l.dataset.val))l.classList.add('correct');
    else if(sel.includes(l.dataset.val))l.classList.add('wrong');
  });
  const fb=document.getElementById('fb2122');
  if(fb){
    fb.className='multi-score-note '+(perfect?'good':'bad');
    fb.textContent=perfect?'✓ Correct — 2 / 2':`Correct answers: B, E · Score: ${hits} / 2`;
  }
  ['nav21','nav22'].forEach(id=>{
    const e=document.getElementById(id);
    if(!e)return;
    e.classList.remove('answered','correct','wrong','partial');
    e.classList.add(perfect?'correct':hits===1?'partial':'wrong');
  });
  document.querySelector('[data-inline-review="2122"]')?.remove();
  const host=document.getElementById('multiReview2122');
  if(host&&!perfect)host.innerHTML=multiReviewHTML(sel,hits);
  document.querySelectorAll('input[name="g2122"]').forEach(e=>e.disabled=true);
}
function markPassage(p){
  for(const q of questions.filter(x=>x.p===p&&x.type!=='multi')){
    const u=ssGet('q'+q.n)||'';
    const ok=correct(q,u);
    const fb=document.getElementById('fb'+q.n);

    if(q.type==='text'||q.type==='select'){
      const e=document.getElementById('q'+q.n);
      if(e){e.classList.remove('correct','wrong');e.classList.add(ok?'correct':'wrong');}
    }else{
      document.querySelectorAll(`label[data-q="${q.n}"]`).forEach(l=>{
        l.classList.remove('correct','wrong');
        if(norm(l.dataset.val)===norm(q.ans))l.classList.add('correct');
        else if(u&&norm(l.dataset.val)===norm(u))l.classList.add('wrong');
      });
    }

    if(fb){
      const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
      fb.className='feedback '+(ok?'good':'bad');
      fb.textContent=ok?'✓ Correct':'Correct answer: '+key;
    }
    if(submitted)renderInlineReview(q,u,ok);
  }

  if(p===2&&submitted)markMultiGroup();
  lockSubmittedAnswers();
}
function displayAnswer(q,user){
  if(!String(user).trim())return 'Không trả lời';
  if(q.type==='select'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(user));
    return found||user;
  }
  if(q.type==='choice'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(user));
    return found||user;
  }
  return user;
}
function displayKey(q){
  const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
  if(q.type==='select'||q.type==='choice'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(key));
    return found||key;
  }
  return key;
}
function renderWrongReview(total){
  const box=document.getElementById('wrongReview');
  const wrong=40-total;
  if(!wrong){
    box.innerHTML='<h3 class="review-title">Review đáp án</h3><div class="perfect-review">🎉 Không có câu sai. Bạn đã trả lời đúng cả 40 câu!</div>';
    return;
  }
  box.innerHTML=`<h3 class="review-title">${wrong} điểm cần xem lại</h3>
    <div class="review-mode-note">Đóng bảng điểm để xem <b>giải thích + evidence được ghim trực tiếp ngay dưới từng câu/nhóm câu sai</b>. Khi chuyển Passage, phần giải thích vẫn còn để bạn đối chiếu với bài đọc.</div>`;
}
function gotoEvidence(n){
  document.getElementById('overlay').classList.add('hidden');
  focusEvidence(n);
}
async function submitExam(auto=false){
  if(submitted)return;
  saveCurrentMarkups();

  const normalMissing=questions.filter(q=>q.type!=='multi'&&!(ssGet('q'+q.n)||'').trim()).length;
  const multiMissing=Math.max(0,2-getMulti().length);
  const unanswered=normalMissing+multiMissing;
  if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu/ô đáp án chưa hoàn thành. Vẫn nộp bài?`))return;

  submitted=true;
  clearInterval(timerHandle);

  let total=0,scores=[0,0,0,0],details=[];

  for(const q of questions.filter(q=>q.type!=='multi')){
    const u=ssGet('q'+q.n)||'',ok=correct(q,u);
    if(ok){total++;scores[q.p]++;}
    details.push({q:q.n,answer:u,correct:ok,key:Array.isArray(q.ans)?q.ans.join(' / '):q.ans});
    const ne=document.getElementById('nav'+q.n);
    if(ne){ne.classList.remove('answered');ne.classList.add(ok?'correct':'wrong');}
  }

  const sel=getMulti(),multiKey=['B','E'];
  const hits=sel.filter(x=>multiKey.includes(x)).length;
  total+=hits;
  scores[2]+=hits;
  details.push({q:'21-22',answer:sel.join(', '),correct:hits===2,key:'B, E',score:hits});

  markPassage(current);
  saveZoneMarkup('questions');

  const name=document.getElementById('studentName').value.trim();
  const cls=document.getElementById('studentClass').value.trim();
  const dur=Math.round((Date.now()-startedAt)/1000);

  document.getElementById('rstudent').textContent=`${name} — ${cls}`;
  document.getElementById('rscore').textContent=`${total} / 40`;
  document.getElementById('rpercent').textContent=`${Math.round(total/40*100)}% correct`;
  document.getElementById('p1s').textContent=`${scores[1]} / 13`;
  document.getElementById('p2s').textContent=`${scores[2]} / 13`;
  document.getElementById('p3s').textContent=`${scores[3]} / 14`;
  renderWrongReview(total);

  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('status').textContent='Đang gửi kết quả về Google Sheet...';

  const p=new URLSearchParams({
    name,
    className:cls,
    total:String(total),
    maxScore:'40',
    durationSeconds:String(dur),
    activity:'IELTS Reading - Chicken / Introvert-Extrovert / Synesthesia',
    reading:String(scores[1]),
    grammar:String(scores[2]),
    ing:String(scores[3]),
    writingA:JSON.stringify(details),
    submittedAt:new Date().toISOString()
  });

  try{
    await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p.toString()});
    document.getElementById('status').textContent='✓ Đã gửi kết quả về Google Sheet.';
  }catch(e){
    document.getElementById('status').textContent='Không gửi được kết quả về Google Sheet. Hãy kiểm tra Web App URL hoặc kết nối mạng.';
  }
}

function closeResult(){document.getElementById('overlay').classList.add('hidden');markPassage(current);saveZoneMarkup('questions')}
</script></body></html>
