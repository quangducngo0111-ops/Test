<div id="exam" class="exam hidden"><div class="top"><div>Student: <b id="topName"></b> &nbsp; | &nbsp; Class: <b id="topClass"></b></div><div id="timer" class="timer">60:00</div></div><div class="tabs"><button class="tab active" data-p="1" onclick="showPassage(1)">Passage 1</button><button class="tab" data-p="2" onclick="showPassage(2)">Passage 2</button><button class="tab" data-p="3" onclick="showPassage(3)">Passage 3</button></div><div class="workspace"><div id="passage" class="passage"></div><div id="questions" class="questions"></div></div><div class="bottom"><div id="nav" class="nav"></div><button class="submit" onclick="submitExam(false)">Nộp bài</button></div></div>

<script>const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwfwWjJ7Q3VTJEF5ldKGnFKYoziQdntAzRjq1Yqy6HSmbZSc69ijSdOvMCC_Zogbpcm/exec";
const passages={"1":{"title":"Traditional Farming in Zambia's Luapula Province","subtitle":"","text":"<p>By tradition, land in Luapula Province is not owned by individuals but, as in many other parts of Africa, is allocated by the headman or headwoman of a village to people of either sex according to need. Since land is generally prepared by hand, a single family group cannot take on a very large area, so land has not been a limiting resource over large parts of the province. However, that situation has already changed near the main towns, and there has long been a scarcity of land for cultivation in the river valley. In both these areas, registered ownership patterns are becoming prevalent.</p>\n<p>Most of the traditional cropping in Luapula Province is based on citemene, a system whereby crops are grown on the ashes of tree branches. As a rule, entire trees are pollarded (pollarding: removing the tops of tree branches) rather than felled, so that they can regenerate. Branches are cut over an area of land of varying size early in the dry season and then stacked to dry out. The wood is fired before the onset of the rains, and in the first year, the area is planted with the African cereal called finger millet. The grain of this crop is used to brew local drinks such as cipumu, which contributes several vitamins of the B complex to people's diets. Cipumu is also used in cementing reciprocal working relationships (Pottier 1985).</p>\n<p>During the second year, and possibly for a few years more, the area is planted with various combinations of annuals such as maize, pumpkins, sweet potatoes, groundnuts, beans, and various leafy vegetables, grown with a certain amount of rotation. The diverse sequence ends with the vegetable cassava, which is often planted next to the last but one crop before this is harvested.</p>\n<p>Richards (1969) observed that the practice of cilemene entails a definite division of labour; men and women perform different tasks. The men stake out plots in an unobtrusive manner, since it is considered provocative towards one's neighbours to mark boundaries in an explicit way. The dangerous work of felling branches is also the men's province: Branches are then stacked by women and fired by men. Women and men cooperate in the planting work, but the harvesting is always done by women.</p>\n<p>At the beginning of the citemene cycle, little weeding is necessary, since the firing of the branches effectively destroys weeds, but as the cycle progresses, weeds increase, and nutrients eventually become depleted to a point where further effort with annual crops is not worthwhile. At this point, cassava is planted, since it can produce a crop on soil that is almost exhausted. Thereafter, the plot is abandoned, and a new area is pollarded for the next cycle.</p>\n<p>When forest is not available, a situation which is increasingly the case nowadays, a series of ridges is built, in which combinations of maize, beans, groundnuts, and sweet potatoes are then planted, usually followed by cassava. These plots are normally tended by women and provide subsistence.</p>\n<p>Where their roots have year-round access to water, mango, guava, and oil-palm trees are often grown around houses, forming a traditional agro-forestry system, and some of the fruit from these is sold by the roadside or in local markets. In addition, local varieties of rice are sometimes planted in waterlogged ground during the rainy season.</p>\n<p>Fishing has always been a far more remunerative activity in Luapula than crop husbandry. It provides a much-needed protein supplement to the diet, as well as being the one substantial source of cash. Mueh fish is dried for sale to areas away from the main waterways. The Mweru and Bangweulu Lake Basins are the main areas of Year-round fishing, but the Luapula River is also exploited during the latter part of the dry season. Several previously abundant and desirable species have all but disappeared from Lake Mweru, apparently due to overfishing (Huckaby 1979).</p>\n<p>Regarding animal husbandry, only small numbers of cattle or oxen are kept in the province owing to the prevalence of the tsetse fly. The resulting absence of animal power for pulling machinery greatly limits people's ability to plough and cultivate land: a married couple can rarely manage to prepare an area of more than half a hectare by hand-hoeing. However, most people keep freely roaming chickens and goats. These act as a reserve for bartering, but may also be occasionally slaughtered for ceremonies or for entertaining important visitors. These animals are not a standard part of most people's diet.</p>\n<p>Until recently, citemene has been an ingenious system for providing seasonal, high-quality cereals and vegetables in regions of acidic, heavily leached soils. Nutritionally, the most serious deficiency has been that of protein. However, this could be alleviated when fish were available, provided that cultivators lived near the valley or could find a source of dried fish. The citemene/fishing system was well adapted to the ecology of the woodland regions and sustainable for long periods, but only as long as human population densities stayed at low levels.</p>\n<p>Although population densities are still much lower today than in many other parts of the world, neither the fisheries nor the woodlands of Luapula are capable, with unmodified traditional practices, of supporting the expanding population in a sustainable manner. For instance, even in a normal season, diets suffer from a lack of energy, protein, vitamins, and minerals. It will therefore be necessary in the future to intensify and diversify productive systems.</p>"},"2":{"title":"Babies cry in their mother tongue","subtitle":"","text":"<p class=\"passage-sub\">A newborn baby's cry may sound the same to the ears of sleep-deprived parents the world over but, say scientists, comparisons of babies a few days old show that the cry of a newborn shares similarities with the language its parents speak. The reason for this is presumably the different intonation patterns in their native languages, which are already perceived in the uterus and are later reproduced.</p>\n<p><b>A</b> It is already known that human foetuses become attentive listeners in the final trimester of pregnancy. 'The mother's voice in particular is sensed early on,' explains Professor Amelia Finlayson of the Institute for Human Cognitive and Brain Sciences in Leipzig. 'Human foetuses perceive information filtered at around 400 hertz, but they cannot hear the actual words. It is a bit like holding your head under water when someone is talking next to the bath.'</p>\n<p><b>B</b> Finlayson's research indicates that newborn babies probably cannot distinguish between the accents of Welsh and Northern Scottish people or between Low German and Upper Bavarian, but they can recognise major differences in the intonation patterns of their respective mother tongues. The Leipzig researchers showed that in an earlier experiment, by means of physiological studies of babies of three to four months of age. For that study, the babies had hoods with electrodes put on their heads, and had recordings of different intonation patterns played to them. The children's brainwaves reacted to the differences even when they were asleep.</p>\n<p><b>C</b> At the same time, Doctor Katya Williams of the University of Wurzburg first suggested in her PhD thesis that babies' crying might be a stage in their linguistic development. Said Williams: 'It used to be thought that a baby's cry was just a signal of alarm to call its mother. This assumption was corrected when we noticed that the cries are not the same from week to week. What biological purpose would that have? If a fire siren sounded different every day, we would not even recognise it!'</p>\n<p><b>D</b> The question thus presented itself as to whether babies' cries already showed the intonation patterns of their different mother tongues. To study this, the Leipzig brain researchers and the 'screaming researchers' of the University of Wurzburg worked in collaboration with their colleagues at the Laboratory of Cognitive Sciences and Linguistics, at the Ecole Normale Superieure in Paris, to devise a new experiment. German and French babies were selected for the comparison because the differences in the intonation shapes of these two mother tongues are particularly pronounced. For example, the German word Papa is Papa in French.</p>\n<p><b>E</b> These three research groups made a comparison of recordings of 60 healthy newborns aged between two and five days old: 30 infants born into French-speaking families and 30 born into German-speaking families. Whenever the babies were hungry or thirsty or simply wanted their mothers and announced the fact by crying, the researchers were at the ready with their microphones and recorded their complaints. More than 20 hours of recordings of babies' crying were then fed into a computer for the purpose of analysis.</p>\n<p><b>F</b> The amazing result, published in the journal Modern Biology, is that just a few days after birth, babies use the acoustic input they perceive in the uterus to adapt their linguistic production to their target mother tongue. The melody of the German babies' screams usually began loudly and at a high pitch and then followed a downward curve, while the French babies more often screamed with a rising melody contour. Thus, they reproduce precisely the intonation patterns that are characteristic of their respective mother tongues. This proves, says the team of researchers, that babies' cries are attempts to communicate specifically with their mothers. 'Newborns are probably highly motivated to imitate their mother's behaviour in order to attract her and foster bonding and therefore physical nourishment,' they wrote. 'Because melody contour may be the only aspect of their mother's speech that newborns are able to imitate, this might explain why we found melody contour imitation at that early age.' This finding is interesting because it suggests that babies are producing sounds they have heard in the womb, meaning that this is learning rather than an innate behaviour.</p>\n<p><b>G</b> Furthermore, the findings are consistent with the hypothesis that linguistic development does not just begin from the age of nine to ten months, with the first babbling resembling language such as 'mam-mam-mam' or 'ba-ba-ba', but with the very first sounds that babies produce. 'We are born to learn language. And that starts right away,' says Dr Katya Williams. Dr Williams' colleague, Mr Walter Meade, discovered that this initial sensitivity to the melodic features of language assists infants to subsequently learn their mother tongue. 'The melodic patterns practised in crying are building blocks for eventual sound production, such as gurgling and babbling, right up to the first words and sentences,' says Meade.</p>\n<p><b>H</b> The results also demonstrated once again how language distinguishes human infants from all other primates. According to Williams, among baby chimpanzees, the 'crying melody' is closely associated with the build-up and reduction of pressure in the lungs, and is not generated by a mental process. 'In comparison with the sounds of other primates, the cries of a newborn human baby display a fantastic repertoire of melodic and rhythmic variations,' she adds. 'Our babies are expert vocalists in comparison with all the other animals. Could that offer some small consolation for nerve-wracked parents?'</p>"},"3":{"title":"Ancient Rome: archaeologists are trying to understand more about the early history of the city","subtitle":"","text":"<p>From ancient times to the present, historians have asked the question: How and why did an ordinary little town in central Italy grow so much bigger than any other in the ancient Mediterranean and come to control such a huge empire?’ During the first century BCE, Roman writers themselves began systematically to study the earlier centuries of their city and their empire. Yet these historians had little more direct evidence of the earliest phases of Rome's history than modern writers have, and in some ways perhaps not as much, as there were no surviving documents or archives. Their 'histories' about the foundation of ancient Rome tell us a good deal about how the Romans saw their city, their values, and their failings. However, they tell us very little indeed about what they claim to inform us about: that is, what earliest Rome was actually like. One fact is obvious. Rome was already a very old city by 63 BCE, the birth date of its first emperor. But how exactly are we to access reliable information about the origins of Rome?</p>\n<p>One way of doing this is by turning away from the histories of Roman writers and seeking out clues in the Latin language, or in later Roman institutions that might point back to features of earliest Rome. Much more tangible, however, is the evidence of archaeology. Dig down deep in the city of Rome, below the visible ancient monuments, and a few traces of a much earlier settlement or settlements remain. Beneath the Forum itself (an ancient marketplace at the centre of the city) lie the remains of an early cemetery, which caused tremendous excitement when they were first unearthed at the start of the 20th century. Cemeteries imply the existence of a community, and traces of that are presumably to be found in the groups of huts whose faint outlines have been detected under various parts of the later city, including on the Palatine (the centremost of the seven hills on which Rome is built). We have little idea of the nature of these huts beyond their construction in wood, clay, and thatch, and still less of the lifestyle they supported. But we can fill in some of the gaps if we look just outside Rome. One of the best preserved and most carefully excavated of these early structures was found at Fidenae, a few miles north of the city, in the 1980s. It is a rectangular building, some six by five metres, made of wood and rammed earth - a construction method still utilised up to the present day - with a simple porch around it, formed by the overhanging roof. Inside was a central hearth, some large pottery storage jars, and traces of predictable foodstuffs and domestic animals.</p>\n<p>There are vivid glimpses of human and other life here; the question is, what do those glimpses add up to? The archaeological remains certainly demonstrate that there is a long and rich prehistory behind the ancient Rome we can still see, but quite how long that prehistory is is another matter.</p>\n<p>Part of the problem is the conditions of excavation in the city itself. The site of Rome has been so intensively built on for centuries that we find these traces of early occupation only in spots that happen not to have been disturbed. The foundations dug in the first and second centuries CE for the vast marble temples of the forum obliterated much of what then lay beneath the surface; the cellars of grand Renaissance houses cut through even more ancient remains in other parts of the city. So we have tiny snapshots, never the big picture. This is archaeology at its most difficult, and - although new fragments of evidence emerge all the time - its interpretation, and reinterpretation is almost always contested and often controversial. For example, there is an ongoing debate about whether the small pieces of wattle and daub found in excavations in the Forum in the mid-20th century indicate that there was an early hut settlement there too, or whether they were inadvertently introduced as part of the rubble used a few centuries later to provide a new raised surface for the area. It has to be said that this place, though fine for a cemetery, would have been rather damp and marshy for a village.</p>\n<p>Precise dating is even more contentious. It cannot be stressed enough that there is no certain independent date for any of the archaeological material from earliest Rome or the area around, and that arguments still rage about the age of almost every major find. It has taken decades of work over the past century or so - using such diagnostics as the existence of wheel-made pottery (assumed to be later than handmade), the occasional presence on graves of Greek ceramics (whose dating is better, but still not perfectly understood) and careful comparison from site to site - to produce a rough chronological scheme covering the period from around 1000 to 600 BCE.</p>\n<p>On that basis, the earliest burials in Rome would have been around 1000 BCE, and the earliest known settlements around 750-700 BCE. But even these dates are far from certain. Recent scientific methods - including radiocarbon dating, which calculates the age of any organic material - have suggested that they are all too 'young', by as much as a hundred years. The building at Fidenae, for example, was dated around the middle of the eighth century BCE according to traditional archaeological criteria, but that is pushed back to around the end of the ninth century BCE if we follow radiocarbon analysis. If anything, Rome appears to be getting older.</p>"}};

ome people oppose archaeological excavations in Rome because they can damage the ancient monuments.","opts":["YES","NO","NOT GIVEN"],"ans":"NOT GIVEN"},{"n":33,"p":3,"type":"choice","text":"According to the writer, why were the archaeological remains found at Fidenae important?","opts":["A — They shed some light on the way of life of ancient Romans.","B — They were the first evidence of an ancient Roman settlement in the area.","C — They overturned common assumptions about the diet of ancient Romans.","D — They showed how sophisticated domestic Roman architecture could be."],"ans":"A"},{"n":34,"p":3,"type":"choice","text":"What did Rome's marble temples and Renaissance houses have in common?","opts":["A — They were the most enduring buildings of their respective eras.","B — They were evidence of Rome's enormous wealth.","C — They were built on previously unoccupied sites.","D — Their construction destroyed evidence of earlier buildings."],"ans":"D"},{"n":35,"p":3,"type":"choice","text":"What does the writer say in the fifth paragraph about the dating of excavated remains?","opts":["A — Only the age of a proportion of remains can be agreed upon.","B — Only an approximate sequence of eras can be established.","C — Serious attempts at dating began only a few decades ago.","D — More thorough investigations will result in reliable dates."],"ans":"B"},{"n":36,"p":3,"type":"choice","text":"In the final paragraph, the writer makes the point that","opts":["A — traditional archaeological methods of dating have been discredited.","B — many archaeologists are reluctant to abandon traditional methods of dating.","C — radiocarbon dating is more accurate than archaeological methods.","D — the findings of traditional archaeology and radiocarbon dating differ."],"ans":"D"},{"n":37,"p":3,"type":"select","text":"The Latin language can be","opts":["A — composed of organic materials which are in use in the 21st century.","B — referred to in popular legends about the origins of Rome.","C   if(p===2){if(n<=19)return['Questions 14–19','Which paragraph contains the information?'];if(n<=23)return['Questions 20–23','Match each statement with the correct researcher.'];return['Questions 24–26','Complete the sentences.']}
  if(n<=32)return['Questions 27–32','Choose YES, NO or NOT GIVEN.'];if(n<=36)return['Questions 33–36','Choose the correct answer.'];return['Questions 37–40','Complete each sentence with the correct ending.']
}
function zoneRoot(zone){
  return document.getElementById(zone==='questions'?'questionsCopy':'passageCopy');
}
function zoneMarkupKey(zone,p=current){
  return (zone==='questions'?'questionsMarkup':'passageMarkup')+p;
}
function noteStoreKey(zone,p=current){
  return 'notes_'+zone+'_'+p;
}
function notesPanelId(zone){
  return zone==='questions'?'notesPanelQuestions':'notesPanelPassage';
}
function notesCountId(zone){
  return zone==='questions'?'notesCountQuestions':'notesCountPassage';
}
function saveZoneMarkup(zone){
  const root=zoneRoot(zone);
  if(root)ssSet(zoneMarkupKey(zone),root.innerHTML);
}
function saveCurrentMarkups(){
  saveZoneMarkup('passage');
  saveZoneMarkup('questions');
}
function captureSelection(zone){
  if(submitted)return;
  const sel=window.getSelection();
  const root=zoneRoot(zone);
  if(!sel||!root||sel.rangeCount===0||sel.isCollapsed)return;
  const r=sel.getRangeAt(0);
  if(root.contains(r.commonAncestorContainer)){
    savedSelection=r.cloneRange();
    savedSelectionZone=zone;
  }
}
function annotationBlock(node){
  const el=node&&node.nodeType===3?node.parentElement:node;
  if(!el)return null;
  return el.closest('p,.completion-text,.flow-step,li,.card,.option,.inst,.bank div,h3,h4,.qtext');
}
function getUsableSelection(zone){
  const root=zoneRoot(zone);
  if(!savedSelection||savedSelectionZone!==zone||!root||!root.contains(savedSelection.commonAncestorContainer)){
    alert(zone==='questions'
      ?'Hãy bôi đen phần chữ ở bên câu hỏi trước.'
      :'Hãy bôi đen phần chữ trong bài đọc trước.');
    return null;
  }
  if(savedSelection.collapsed||!savedSelection.toString().trim()){
    alert('Hãy bôi đen một đoạn chữ trước.');
    return null;
  }

  const a=annotationBlock(savedSelection.startContainer);
  const b=annotationBlock(savedSelection.endContainer);
  if(!a||!b||a!==b){
    alert('Để highlight/ghi chú ổn định, hãy chọn chữ trong cùng một câu hoặc cùng một khối nội dung.');
    return null;
  }

  const cloned=savedSelection.cloneContents();
  if(cloned.querySelector && cloned.querySelector('input,select,button,textarea')){
    alert('Không thể highlight xuyên qua ô trả lời. Hãy chỉ chọn phần chữ.');
    return null;
  }
  return savedSelection.cloneRange();
}
function clearBrowserSelection(){
  const sel=window.getSelection();
  if(sel)sel.removeAllRanges();
  savedSelection=null;
  savedSelectionZone=null;
}
function addHighlight(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  try{
    const mark=document.createElement('mark');
    mark.className='user-highlight';
    mark.dataset.annotationZone=zone;
    const frag=r.extractContents();
    mark.appendChild(frag);
    r.insertNode(mark);
    activeHighlight=mark;
    activeHighlightZone=zone;
    saveZoneMarkup(zone);
    clearBrowserSelection();
  }catch(e){
    alert('Không thể highlight vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function clearHighlight(zone){
  if(submitted)return;
  let targets=[];
  if(activeHighlight&&activeHighlightZone===zone&&document.body.contains(activeHighlight)){
    targets=[activeHighlight];
  }else if(savedSelection&&savedSelectionZone===zone){
    const root=zoneRoot(zone);
    if(root)targets=[...root.querySelectorAll('mark.user-highlight')].filter(m=>{
      try{return savedSelection.intersectsNode(m)}catch(e){return false}
    });
  }
  if(!targets.length){
    alert('Hãy bấm vào phần đã highlight rồi chọn “Xóa HL”.');
    return;
  }
  targets.forEach(m=>{
    const p=m.parentNode;
    while(m.firstChild)p.insertBefore(m.firstChild,m);
    m.remove();
    p.normalize();
  });
  activeHighlight=null;
  activeHighlightZone=null;
  saveZoneMarkup(zone);
  clearBrowserSelection();
}
function loadNotes(zone,p=current){
  try{return JSON.parse(ssGet(noteStoreKey(zone,p))||'[]')}catch(e){return[]}
}
function saveNotes(zone,notes,p=current){
  ssSet(noteStoreKey(zone,p),JSON.stringify(notes));
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addNote(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  const quote=r.toString().trim();
  const text=prompt('Nhập ghi chú cho đoạn đã chọn:');
  if(text===null||!text.trim())return;
  const id='note_'+zone+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  try{
    const span=document.createElement('span');
    span.className='note-anchor';
    span.dataset.noteId=id;
    span.dataset.annotationZone=zone;
    span.title='Bấm để xem/sửa ghi chú';
    const frag=r.extractContents();
    span.appendChild(frag);
    r.insertNode(span);

    const notes=loadNotes(zone);
    notes.push({id,quote,text:text.trim()});
    saveNotes(zone,notes);
    saveZoneMarkup(zone);
    clearBrowserSelection();
    renderNotesPanel(zone,current,true);
  }catch(e){
    alert('Không thể tạo ghi chú cho vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function toggleNotes(zone){
  const panel=document.getElementById(notesPanelId(zone));
  if(panel)panel.classList.toggle('open');
}
function renderNotesPanel(zone,p=current,forceOpen=false){
  const panel=document.getElementById(notesPanelId(zone));
  const count=document.getElementById(notesCountId(zone));
  if(!panel)return;
  const notes=loadNotes(zone,p);
  if(count)count.textContent=notes.length;
  panel.innerHTML=notes.length
    ?notes.map(n=>`<div class="note-item">
        <div class="note-quote">“${esc(n.quote)}”</div>
        <div class="note-text">${esc(n.text)}</div>
        <div class="note-actions">
          <button type="button" onclick="editNote('${zone}','${n.id}')">Sửa</button>
          <button type="button" onclick="deleteNote('${zone}','${n.id}')">Xóa</button>
        </div>
      </div>`).join('')
    :'<div style="font-size:13px;color:var(--muted)">Chưa có ghi chú ở phần này.</div>';
  if(forceOpen)panel.classList.add('open');
}
function editNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt('Sửa ghi chú:',n.text);if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function deleteNote(zone,id){
  const notes=loadNotes(zone).filter(x=>x.id!==id);
  saveNotes(zone,notes);
  const root=zoneRoot(zone);
  if(root)root.querySelectorAll(`[data-note-id="${id}"]`).forEach(s=>{
    const p=s.parentNode;
    while(s.firstChild)p.insertBefore(s.firstChild,s);
    s.remove();
    p.normalize();
  });
  saveZoneMarkup(zone);
  renderNotesPanel(zone,current,true);
}
function openNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt(`Đoạn đã ghi chú:\n“${n.quote}”\n\nGhi chú:`,n.text);
  if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function bindAnnotations(zone){
  const root=zoneRoot(zone);if(!root)return;
  root.addEventListener('mouseup',()=>captureSelection(zone));
  root.addEventListener('keyup',()=>captureSelection(zone));
  root.addEventListener('click',e=>{
    const note=e.target.closest('.note-anchor');
    if(note){openNote(zone,note.dataset.noteId);return}
    const mark=e.target.closest('mark.user-highlight');
    if(mark){
      activeHighlight=mark;
      activeHighlightZone=zone;
    }else if(zone===activeHighlightZone){
      activeHighlight=null;
      activeHighlightZone=null;
    }
  });
}
function annotationToolbar(zone){
  const isQ=zone==='questions';
  const label=isQ?'Câu hỏi':'Bài đọc';
  const countId=isQ?'notesCountQuestions':'notesCountPassage';
  return `<div class="annotation-bar">
    <span class="annotation-zone-label">${label}</span>
    <button type="button" class="annotation-btn" onclick="addHighlight('${zone}')">🖍 Highlight</button>
    <button type="button" class="annotation-btn" onclick="clearHighlight('${zone}')">Xóa HL</button>
    <button type="button" class="annotation-btn" onclick="addNote('${zone}')">📝 Add note</button>
    <button type="button" class="annotation-btn" onclick="toggleNotes('${zone}')">Ghi chú (<span id="${countId}">0</span>)</button>
    <span class="annotation-tip">Bôi đen phần chữ rồi chọn công cụ.</span>
  </div>`;
}

  activeHighlightZone=null;
  savedSelection=null;
  savedSelectionZone=null;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.p===p));

  const passageMarkup=ssGet(zoneMarkupKey('passage',p))||passages[p].text;

    annotationToolbar('passage')+
    `<div id="notesPanelPassage" class="notes-panel"></div>

  renderNotesPanel('passage',p,false);
  buildQuestions(p);

  document.getElementById('passage').scrollTop=0;
  document.getElementById('questions').scrollTop=0;
}

function renderQ(q){
  let body='';
  if(q.type==='text'){
    body=`<input class="ans" id="q${q.n}" data-q="${q.n}" type="text" autocomplete="off" placeholder="Type your answer">`;
  }else if(q.type==='select'){
    body=`<select class="ans" id="q${q.n}" data-q="${q.n}"><option value="">-- Choose --</option>${q.opts.map(x=>`<option value="${optionValue(x)}">${x}</option>`).join('')}</select>`;
  }else{
    body=q.opts.map(x=>{
      const v=optionValue(x);
      return `<label class="option" data-q="${q.n}" data-val="${v}"><input type="radio" name="q${q.n}" value="${v}"> ${x}</label>`;
    }).join('');
  }
  return `<div class="card" id="card${q.n}"><div class="qhead"><span class="qnum">${q.n}</span><div class="qtext">${q.text}</div></div>${body}<div class="feedback" id="fb${q.n}"></div></div>`;
}
function inlineText(n,placeholder='answer'){
  return `<span class="inline-blank" id="card${n}"><span class="blank-num">${n}</span><input class="ans inline-answer short" id="q${n}" data-q="${n}" type="text" autocomplete="off" placeholder="${placeholder}"></span>`;
}
function inlineSelect(n,opts){
  return `<span class="inline-blank" id="card${n}"><span class="blank-num">${n}</span><select class="ans inline-answer select-wide" id="q${n}" data-q="${n}"><option value="">-- choose --</option>${opts.map(x=>`<option value="${optionValue(x)}">${x}</option>`).join('')}</select></span>`;
}
function renderMatchRows(start,end,title,inst,showBank=true){
  const rows=questions.filter(q=>q.n>=start&&q.n<=end),opts=rows[0].opts;
  return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>
    ${showBank?`<div class="bank">${opts.map(x=>`<div>${x}</div>`).join('')}</div>`:''}
    ${rows.map(q=>`<div class="match-row completion-text" id="card${q.n}">
      <div class="match-label"><span class="blank-num">${q.n}</span> ${q.text}</div>
      ${inlineSelect(q.n,opts).replace(`id="card${q.n}"`,'')}
    </div>`).join('')}
  </div>`;
}
function renderStandardGroup(rows,title,inst){
  return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>${rows.map(renderQ).join('')}</div>`;
}

function freshQuestionsHTML(p){
  let h='';
  if(p===1){
    h+=renderP1Completion();
    h+=renderMatchRows(6,9,'Questions 6–9','Match each statement with the correct animal, A, B or C. You may use any letter more than once.',true);
    h+=renderStandardGroup(questions.filter(q=>q.n>=10&&q.n<=12),'Questions 10–12','Choose TRUE, FALSE or NOT GIVEN.');
    h+=renderStandardGroup(questions.filter(q=>q.n===13),'Question 13','Choose the correct answer.');
  }else if(p===2){
    h+=renderMatchRows(14,19,'Questions 14–19','Which paragraph contains the following information? Choose A–H. You may use any letter more than once.',false);
    h+=renderMatchRows(20,23,'Questions 20–23','Match each statement with the correct researcher, A, B or C. You may use any letter more than once.',true);
    h+=renderP2Completion();
  }else{
    h+=renderStandardGroup(questions.filter(q=>q.n>=27&&q.n<=32),'Questions 27–32','Choose YES, NO or NOT GIVEN.');
    h+=renderStandardGroup(questions.filter(q=>q.n>=33&&q.n<=36),'Questions 33–36','Choose the correct answer.');
    h+=renderP3Endings();
  }
  return h;
}
function buildQuestions(p){
  const h=freshQuestionsHTML(p);
  document.getElementById('questions').innerHTML=
    annotationToolbar('questions')+
    `<div id="notesPanelQuestions" class="notes-panel"></div><div id="questionsCopy">${h}</div>`;
  restore(p);

  bindAnnotations('questions');
  renderNotesPanel('questions',p,false);
  if(submitted){
    const copy=document.getElementById('questionsCopy');
    if(copy&&!copy.querySelector('.review-mode-note.top-review-note')){
      copy.insertAdjacentHTML('afterbegin','<div class="review-mode-note top-review-note">Review mode: câu sai có giải thích và evidence ngay bên dưới. Bấm “Đối chiếu trong bài đọc” để đưa đoạn bằng chứng ở cột trái vào vị trí xem.</div>');
    }
    markPassage(p);
  }
}
function getMulti(group){
  try{return JSON.parse(ssGet(group)||'[]')}catch(e){return[]}
}
function restore(p){
  for(const q of questions.filter(x=>x.p===p&&x.type!=='multi')){
    const v=ssGet('q'+q.n)||'';
    if(q.type==='text'||q.type==='select'){
      const e=document.getElementById('q'+q.n);
      if(e)e.value=v;
    }else if(v){
      const e=[...document.querySelectorAll(`input[name="q${q.n}"]`)].find(x=>x.value===v);
      if(e)e.checked=true;
    }
  }
  if(p===2){
    for(const group of ['g2021','g2223']){
      const sel=getMulti(group);
      document.querySelectorAll(`input[name="${group}"]`).forEach(e=>e.checked=sel.includes(e.value));
    }
  }
}
function bindTrack(){
  document.querySelectorAll('.ans').forEach(e=>e.oninput=e.onchange=()=>save(+e.dataset.q,e.value));
  document.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>save(+e.closest('.option').dataset.q,e.value));
  for(const [group,a,b] of [['g2021',20,21],['g2223',22,23]]){
    document.querySelectorAll(`input[name="${group}"]`).forEach(e=>{
      e.onchange=()=>{
        let sel=[...document.querySelectorAll(`input[name="${group}"]:checked`)].map(x=>x.value);
        if(sel.length>2){
          e.checked=false;
          sel=[...document.querySelectorAll(`input[name="${group}"]:checked`)].map(x=>x.value);
          alert('Chỉ chọn TWO đáp án.');
        }
        ssSet(group,JSON.stringify(sel));
        for(let n=a;n<=b;n++) document.getElementById('nav'+n)?.classList.toggle('answered',sel.length===2);
      };
    });
  }
}
function save(n,v){
  ssSet('q'+n,v);
  document.getElementById('nav'+n)?.classList.toggle('answered',String(v).trim()!=='');
}
function buildNav(){
  document.getElementById('nav').innerHTML=questions.map(q=>`<button class="nq" id="nav${q.n}" onclick="goQ(${q.n})">${q.n}</button>`).join('');
}
function goQ(n){
  const q=questions.find(x=>x.n===n);
  if(q.p!==current)showPassage(q.p);
  setTimeout(()=>{
    let target=document.getElementById('card'+n);
    if(!target&&n===21)target=document.getElementById('card20');
    if(!target&&n===23)target=document.getElementById('card22');
    target?.scrollIntoView({behavior:'smooth',block:'center'});
    document.getElementById('q'+n)?.focus?.({preventScroll:true});
  },60);
}
function correct(q,u){
  if(q.type==='multi')return false;
  return q.type==='text'?q.ans.map(norm).includes(norm(u)):norm(u)===norm(q.ans);
}

function removeInlineReview(n){
  document.querySelectorAll(`[data-inline-review="${n}"]`).forEach(e=>e.remove());
}

function renderInlineReview(q,user,ok){
  removeInlineReview(q.n);
  if(ok)return;

  const card=document.getElementById('card'+q.n);
  if(!card)return;

  // Standard IELTS question cards: explanation sits directly under the options.
  if(card.classList.contains('card')){
    card.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
    return;
  }

  // Completion tasks: place review under the sentence/step/note containing the blank.
  const host=card.closest('.flow-step,li,.completion-text') || card.parentElement;
  if(!host)return;

  // Several blanks may live in the same summary paragraph; keep each explanation labelled by Q number.
  host.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
}

function lockSubmittedAnswers(){
  if(!submitted)return;
  document.querySelectorAll('#questionsCopy input,#questionsCopy select').forEach(e=>e.disabled=true);
}

function focusEvidence(n){
  const q=questions.find(x=>x.n===n);
  const r=answerReview[n];
  if(!q||!r)return;
  const reveal=()=>{
    const copy=document.getElementById('passageCopy');
    const ps=copy?[...copy.querySelectorAll('p')]:[];
    const target=ps[r.para-1];
    if(!target)return;
    target.scrollIntoView({behavior:'smooth',block:'center'});
    target.classList.add('evidence-pulse');
    setTimeout(()=>target.classList.remove('evidence-pulse'),3200);
  };
  if(q.p!==current){showPassage(q.p);setTimeout(reveal,150)}else reveal();
}
function markMulti(group,start,end,key,evidenceQ){
  const sel=getMulti(group),hits=sel.filter(x=>key.includes(x)).length,perfect=hits===2&&sel.length===2;
  document.querySelectorAll(`[data-group="${group}"]`).forEach(l=>{
    l.classList.remove('correct','wrong');
    if(key.includes(l.dataset.val))l.classList.add('correct');
    else if(sel.includes(l.dataset.val))l.classList.add('wrong');
  });
  const fb=document.getElementById('fb'+group);
  if(fb){
    fb.className='multi-score-note '+(perfect?'good':'bad');
    fb.textContent=perfect?'✓ Correct — 2 / 2':`Correct answers: ${key.join(', ')} · Score: ${hits} / 2`;
  }
  for(let n=start;n<=end;n++){
    const nav=document.getElementById('nav'+n);
    if(nav){
      nav.classList.remove('answered','correct','wrong','partial');
      nav.classList.add(perfect?'correct':hits===1?'partial':'wrong');
    }
  }
  const host=document.getElementById('review'+group);
  if(host){
    host.innerHTML='';
    if(!perfect){
      const r=answerReview[evidenceQ];
      host.innerHTML=`<div class="inline-review integrated">
        <div class="inline-review-title"><span class="inline-review-badge">Q${start}–${end}</span><span>Giải thích nhóm câu sai</span></div>
        <div class="review-row"><div class="review-label">Bạn chọn</div><div class="student-wrong">${sel.join(', ')||'Không trả lời'}</div></div>
        <div class="review-row"><div class="review-label">Đáp án đúng</div><div class="correct-answer">${key.join(', ')}</div></div>
        <div class="explain"><b>Vì sao?</b> ${r.explain}</div>
        <div class="evidence"><b>Evidence:</b> “${r.evidence}”</div>
        <button class="evidence-btn" onclick="focusEvidence(${evidenceQ})">↗ Đối chiếu trong bài đọc</button>
      </div>`;
    }
  }
  return hits;
}
function markPassage(p){
  for(const q of questions.filter(x=>x.p===p&&x.type!=='multi')){
    const u=ssGet('q'+q.n)||'',ok=correct(q,u);
    const fb=document.getElementById('fb'+q.n);
    if(q.type==='text'||q.type==='select'){
      const e=document.getElementById('q'+q.n);
      if(e){e.classList.remove('correct','wrong');e.classList.add(ok?'correct':'wrong')}
    }else{
      document.querySelectorAll(`label[data-q="${q.n}"]`).forEach(l=>{
        l.classList.remove('correct','wrong');
        if(norm(l.dataset.val)===norm(q.ans))l.classList.add('correct');
        else if(u&&norm(l.dataset.val)===norm(u))l.classList.add('wrong');
      });
    }
    if(fb){
      const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
      fb.className='feedback '+(ok?'good':'bad');
      fb.textContent=ok?'✓ Correct':'Correct answer: '+key;
    }
    if(submitted)renderInlineReview(q,u,ok);
  }
  lockSubmittedAnswers();
}

function displayAnswer(q,user){
  if(!String(user).trim())return 'Không trả lời';
  if(q.type==='select'||q.type==='choice'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(user));
    return found||user;
  }
  return user;
}
function displayKey(q){
  const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
  if(q.type==='select'||q.type==='choice'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(key));
    return found||key;
  }
  return key;
}
function renderWrongReview(details){
  const box=document.getElementById('wrongReview');
  const wrong=details.filter(x=>!x.correct);
  if(!wrong.length){
    box.innerHTML='<h3 class="review-title">Review đáp án</h3><div class="perfect-review">🎉 Không có câu sai. Bạn đã trả lời đúng cả 40 câu!</div>';
    return;
  }
  box.innerHTML=`<h3 class="review-title">${wrong.length} câu cần xem lại</h3>
    <div class="review-mode-note">Đóng bảng điểm để xem <b>giải thích + evidence được ghim trực tiếp ngay dưới từng câu sai</b>. Khi chuyển Passage, phần giải thích vẫn còn để bạn đối chiếu với bài đọc.</div>`;
}
function gotoEvidence(n){
  document.getElementById('overlay').classList.add('hidden');
  focusEvidence(n);
}

async function submitExam(auto=false){
  if(submitted)return;
  saveCurrentMarkups();
  const unanswered=questions.filter(q=>!(ssGet('q'+q.n)||'').trim()).length;
  if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu chưa hoàn thành. Vẫn nộp bài?`))return;
  submitted=true;clearInterval(timerHandle);
  let total=0,s=[0,0,0,0],details=[];
  for(const q of questions){
    const u=ssGet('q'+q.n)||'',ok=correct(q,u);
    if(ok){total++;s[q.p]++}
    details.push({q:q.n,answer:u,correct:ok,key:Array.isArray(q.ans)?q.ans.join(' / '):q.ans});
    const ne=document.getElementById('nav'+q.n);if(ne){ne.classList.remove('answered');ne.classList.add(ok?'correct':'wrong')}
  }
  document.getElementById('rstudent').textContent=`${document.getElementById('topName').textContent} · ${document.getElementById('topClass').textContent}`;
  document.getElementById('rscore').textContent=`${total} / 40`;
  document.getElementById('rpercent').textContent=`${Math.round(total/40*100)}%`;
  document.getElementById('p1s').textContent=`${s[1]} / 13`;document.getElementById('p2s').textContent=`${s[2]} / 13`;document.getElementById('p3s').textContent=`${s[3]} / 14`;
  renderWrongReview(details);document.getElementById('overlay').classList.remove('hidden');document.getElementById('status').textContent='Đang gửi kết quả về Google Sheet...';
  const dur=Math.max(0,Math.floor((Date.now()-startedAt)/1000));
  const payload=new URLSearchParams({name:document.getElementById('topName').textContent,className:document.getElementById('topClass').textContent,score:String(total),total:'40',percent:String(Math.round(total/40*100)),duration:String(dur),details:JSON.stringify({testId:'READING_TEST_13',title:'Reading Test 13',answers:details,passageScores:{p1:s[1],p2:s[2],p3:s[3]}})});
  try{await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload.toString()});document.getElementById('status').textContent='✓ Đã gửi kết quả về Google Sheet.'}catch(e){document.getElementById('status').textContent='Không gửi được kết quả về Google Sheet.'}
}
function closeResult(){document.getElementById('overlay').classList.add('hidden');markPassage(current);saveZoneMarkup('questions')}

(function(){
  const params=new URLSearchParams(location.search);
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem('IELTS_PRACTICE_STUDENT')||'null')}catch(e){}
  const name=(params.get('name')||'').trim()||(saved&&saved.name)||localStorage.getItem('IELTS_STUDENT_NAME')||'';
  const className=(params.get('className')||'').trim()||(saved&&saved.className)||localStorage.getItem('IELTS_STUDENT_CLASS')||'';
  const n=document.getElementById('studentName'),c=document.getElementById('studentClass');
  if(name&&className&&n&&c){
    n.value=name;c.value=className;
    if(params.get('fromPortal')==='1')setTimeout(()=>startExam(),100);
  }
})();

</script></body></html>
