<script>const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwfwWjJ7Q3VTJEF5ldKGnFKYoziQdntAzRjq1Yqy6HSmbZSc69ijSdOvMCC_Zogbpcm/exec";
const passages={"1": {"title": "Optimism and Health", "subtitle": "If you have a positive outlook, the likelihood is that you will lead a longer life. John Nash examines the link between optimism and good health", "text": "<p>Medical studies are concluding that optimists really do have something to be cheerful about. Coincidental links between Optimism and improved general health have been found by researchers. Recently, a Yale University psychologists’ study of 660 volunteers aged 50 and above was published. It found that thinking positively about ageing adds an average of seven years to a person's life. The team, led by Dr Becca Levy, suggests that having an optimistic attitude can bolster the will to live, though they admit that they cannot explain it fully.</p><p>Another American research team, however, says they have identified a physical mechanism behind the phenomenon. Their eight-year study of 670 men aged about 63 found that the optimists had significantly better lung function than men who were more pessimistic. This is the first study to show such a link. The research team at Brigham &amp; Women’s Hospital and Harvard Medical School believes that attitude somehow strengthens the immune system, and that adopting a more positive outlook may reverse physical decline. ‘Preliminary studies on heart patients suggest that by changing a person's outlook, you can improve their mortality risk,’ Says Dr Rosalind Wright.</p><p>The role of optimism in good health has long been noted but often sidelined. Sigmund Freud, the influential psychologist. optimism with ignorance. and from 1970 to 2000 there were 46,000 psychology papers on depression and only 40 on joy.</p><p>Part of that negativity may be blamed on optimists themselves. They are not necessarily fun to have around, Says Brice Pitt, the Emeritus Professor of the Psychiatry of Old Age at Imperial College, London. ‘Optimists tend to be insufferable people. Always jolly, always up, and, frankly, they have a hopelessly rosy outlook’ he says. ‘Depressive people see things as they really are, and that is a disadvantage from an evolutionary point of view. Optimism is a piece of evolutionary equipment that has carried us a long way through millennia of setbacks.’</p><p>Studies show that optimists do better than pessimists in work, school and sports: suffer less depression, achieve more goals, respond better to stress and fight disease better. Among people aged from their mid-nineties into their hundreds, researchers generally fail to find consistencies in diet or exercise (and some still smoke). What the super-aged do tend to share, however, is a Positive, optimistic outlook.</p><p>Toshihiko Maruta, of the Mayo Institute, headed an earlier American medical study to find a link between optimism and longevity. Her study found that optimists live about 19 per cent longer than people with grim outlooks. ‘It tells us that mind and body are linked and that attitude has an impact on the final outcome: death,’ she says. That simple message might have far more effect than exhortations to eat fresh fruit and warnings to stay out of the sun.</p><p>Despite the benefits of unprecedented material wealth, the World Health Organisation estimates that depression is soon to become the second leading cause of disability. Popular wisdom blames this on our frenetically busy society. According to social forecasters at the Henley Centre, while people in developed countries are 65 per cent better off financially today than they were 15 years ago, there is no evidence that they are any more content with their lives. While much of this is down to the perception among many of being rushed and pressured for time and space, it is the perception not the reality that counts, they say.</p><p>The Henley researchers found that if people think they have enough time, space or money, they feel more relaxed about life, regardless of how much of these things they actually have. ‘In terms of money, some of the people who “feel” wealthiest, and some of those who “feel” poorest, actually have almost the same amount of money at their disposal. Their attitudes and behaviour patterns, however, are different from one another,’ says Chad Wallens, a researcher.</p><p>Few studies have tried to ascertain the proportion of optimists in the world. But a 1995 nationwide survey conducted in the USA for the American magazine Adweek found that about half the population counted themselves as optimists, with women slightly more apt than men (53 per cent versus 48 per cent) to identify themselves thus. That attitude drops, however, to less than a third of people between the ages of 55 and 64, which supports research showing that men, in particular, tend to become more irritable as they get older. Lynn Myers, a psychotherapist, points out. however, that too much optimism can be a bad thing: ‘You can be what is called a cock-eyed optimist, the sort of person who smokes but is convinced they will never get lung cancer.’ Curiously, though, the Brigham &amp; Women's Hospital study found that that optimism was linked to improved lung function even after smoking was taken into account.</p><p>Myers is sceptical about whether there is a simple way that people can become optimistic in order to improve their health chances. ‘I certainly would not suggest that there is anything like “six easy lessons to change your outlook’ But if you can lower your anxiety levels, it tends to make you more optimistic. Conversely, people who are highly anxious tend to be Pessimistic,’ she says.</p>"}, "2": {"title": "New Technology in New Zealand's Health Service", "subtitle": "", "text": "<p><b>A</b> At some time in their lives, nearly all New Zealanders will have to attend an after-hours clinic following an emergency or accident. On entering the consulting room, the patient is faced with a barrage of questions. The first ones relate to the current episode, and are followed by more general enquiries. Do you have any allergies? Are you on any medications? And so on. But imagine a different scenario. The patient walks into the consulting room and there on the healthcare professional's computer screen is his or her medical record in its entirety allergies, medications, test results and everything else. To some, it's amazing that this isn't happening already. After all, individuals can track their bank accounts, phone records and countless other transactions online, so why can't they track their health? Ian McCrae, Orion Health's CEO, says that it's understandable if health often falls behind other sectors in its adoption of information technology (IT). It might be. he argues, because of concerns about patient privacy, but also because health care is just so complicated.</p><p><b>B</b> The irony is, New Zealand started out being ahead of the game. The backbone of any health IT system is having a unique identifier for each patient, and New Zealand's national health index (NHI) number system was introduced in 1993, before most other countries in the world. Innovation then slowed for some years, but in 2011 the earthquake in Canterbury, which affected thousands of people, was a catalyst for health IT in that region of the country. Suddenly, many people couldn't be seen by their usual doctor and many health records were inaccessible. An existing plan for an electronic shared record was fast-tracked, and within six months a basic system, HealthOne, was up and running. By 2013, clinicians in the hospital emergency department were able to see all relevant medical information about patients. Dr. Nigel Millar, Chief Medical Officer for the Canterbury region, says within days doctors were telling him the information had already revolutionised the way they worked.</p><p><b>C</b> This idea, known as a 'patient portal', is now in operation in other parts of the country, including the capital Wellington. With a mobile app patients can remain connected to their patient portal on their mobile device, allowing for added flexibility. However, there's a lot of complacency in medicine, according to Dr. Richard Medlicott. He says that innovative IT systems have the potential to radically change health care delivery, because they will free doctors from routine administrative tasks and instead allow them to focus on diagnosis and patient care, which is where their skills are really needed. But he admits there is some way to go in the adoption of shared care records, and also in changing the mindset of some doctors who are resistant to change. A good example of technology in use comes from Australia, where the National Home Doctor Service has brought back a service that was becoming infrequent the home visit. The after hours service uses an app to arrange an on-call doctor who will visit patients at home to provide on-the-spot healthcare.</p><p><b>D</b> A key part of the health IT picture is maintaining a dialogue and exchange of ideas between healthcare professionals, according to Kate Reid. a director at Orion Health. Reid says this is critical, but it's not easy because there are so many different agencies that are sometimes in competition. Another issue, Reid says, is that there are many information systems that are being trialled today. However, these trials are not big enough to determine if they could ever work at a national level. One area where cooperation in health IT really could deliver benefits is in disease prevention and early intervention, says Reid. 'We've got innovations and technology that could be reaching at-risk people right now.’ she argues, but the infrastructure is not in place to allow funding to be shifted from treatment to prevention. Scott Arrol, CEO of New Zealand Health IT, says that advances are comin, they're just not arriving as fast as everybody would like.</p><p><b>E</b> While IT is extremely important to a functioning health system. there are other areas where New Zealand technologies are improving health care. Dr. Hong Sheng Chiong, for example, has adapted a smartphone camera for medical use. The examination kit combines a phone adapter and app. allowing users to examine the eye with minimal training. Another innovation is the Clever MedKit, an intelligent first aid kit. It separates different items like band-aids and ice packs and orders replacements when necessary, making it particularly helpful in today's busy offices. In a separate field, the use of pre-made ceramic fittings which can be placed over a broken tooth in a single sitting reduces the cost of treatment. Dr. Adam Doudney came up with the idea before it was developed by researchers at the technology company Rhondium. Another idea is the Silhouette system, which offers a way to easily monitor wounds. It allows practitioners to detect small differences in wound size by collecting accurate images and data. Finally, the Auckland Bioengineering Institute is helping those wishing to keep fit or rehabilitate from injury. When placed on the body their special sensor moves with the wearer and measures the amount of movement, before the data is transmitted to the user's mobile or tablet. It'll be fascinating to see how these and other technologies transform medicine over the years to come.</p>"}, "3": {"title": "Game theory", "subtitle": "Computer software that models human behaviour can make forecasts, outsmart rivals, and transform negotiations", "text": "<p><b>A</b> According to game theory, our chances of success in negotiations are based on the choices of others. Computer models have been developed to work out how events will unfold as people and organizations act in what they perceive to be their own best interests. Numerical values are placed on the goals, motivations, and influence of players, and likely options are considered. Game theory software then evaluates the ability of each of those players to influence others, and hence predicts the course of events.</p><p><b>B</b> Although many individuals would feel uncomfortable having a computer make decisions for them, many organizations run such computer simulations for law firms, companies, and governments. But feeding software with accurate data on all the players involved is especially tricky for political matters. Reinier van Oosten of Decide, a Dutch firm that models political negotiations, notes that predictions may become unreliable when people unexpectedly give in to 'non-rational' emotions such as hatred, rather than pursuing what is apparently in their best interests. However, sorting out people's motivations is much easier when making money is the main object. Accordingly, modeling behavior using game theory is proving especially useful when applied to economics.</p><p><b>C</b> Using game theory software to model auctions can be very lucrative. Consulting firms are entering the market to help clients design profitable auctions, or to win them less expensively. In 2006, in the run-up to an online auction of radio-spectrum licenses by America's Federal Communications Commission, Dr Paul Milgrom, a consultant and Stanford University professor in the United States, customized his game theory software to assist a consortium of bidders. He was apprehensive at first, but the result was a triumph. When the auction began, Milgrom's software tracked competitors' bids to estimate their budgets for the 1,132 licenses on offer. Crucially, the software estimated the secret values bidders placed on specific licenses and determined that certain big licenses were being overvalued. Milgrom's clients were then directed to obtain a collection of smaller, less expensive licenses instead. Two of his clients paid about a third less than their competitors for an equivalent amount of spectrum, saving almost $1.2 billion. Such a saving makes one wonder why everyone isn't using game theory software. And, if they were, how would that affect the game?</p><p><b>D</b> PA Consulting, a British firm, designs models for software based on game theory to help its clients solve specific problems in areas from pharmaceuticals to the production of television shows. British government agencies have asked PA Consulting to build models to test scenarios that address how many of a type of business should be allowed to operate in a particular area. A simple example: if two competing ice-cream sellers share a long beach, they will set up stalls back-to-back in the middle and stay put, explains Dr Stephen Black, a modeler for PA. Unfortunately for potential customers at the far ends of the beach, each seller prevents the other from relocating – no other spot would be closer to more people. Introduce a third seller, however, and the stifling equilibrium is broken as relocations and pricing changes energize the market. By studying a chain of events such as this, software designers can assess the effect of change and see the patterns in possible outcomes that may occur. As a result, the use of modeling makes clients more inclined to look at future repercussions when making business decisions, Black says.</p><p><b>E</b> Where is all this heading? Alongside the increasingly elaborate modeling software, there are also efforts to develop software that can assist in negotiation and mediation. Two decades ago, Dr Clara Ponsati, a Spanish academic, came up with a clever idea. She accepted that, as negotiators everywhere know, the first side to disclose the maximum amount that it is willing to pay loses considerable bargaining power. Without leverage, it can be pushed backward in the bargaining process by a clever opponent. But if neither side reveals the concessions it is prepared to make, negotiations can become very slow or collapse. However, difficult negotiations can often be pushed along by neutral mediators, especially if they are entrusted with the secret bottom lines of all parties. Ponsati's idea was that if a human mediator was not trusted, affordable, or available, a computer could do the job instead. Negotiating parties would update the software with the confidential information on their bargaining positions after each round of talks. Once positions on both sides were no longer mutually exclusive, the software would be used to split the difference and propose an agreement. Ponsati, now head of the Institute of Economic Analysis at the Autonomous University of Barcelona in Spain, says such \"mediation machines\" could be employed to push negotiations forward by unlocking information that would otherwise be withheld from an opponent.</p><p><b>F</b> Could mediation which has been achieved using software based on game theory spread from auction bids and utility pricing to resolving political and military disputes? Today's game theory software is not yet sufficiently advanced to mediate between warring countries. But one day opponents on the brink of war might be tempted to use it to exchange information without having to engage in conflict. According to some game theorists, opponents could learn how a war would turn out, skip the fighting, and strike a deal. Over-optimistic, perhaps – but game theorists do have rather an impressive track record when it comes to predicting the future.</p>"}};

function groupMeta(n,p){if(p===1){if(n<=7)return['Questions 1–7','Choose TRUE, FALSE or NOT GIVEN.'];if(n<=10)return['Questions 8–10','Complete the flow-chart. Choose NO MORE THAN TWO WORDS from the passage.'];return['Questions 11–13','Complete the notes. Choose ONE WORD ONLY from the passage.']}if(p===2){if(n<=19)return['Questions 14–19','Complete the summary using the list A–J.'];if(n<=23)return['Questions 20–23','Choose YES, NO or NOT GIVEN.'];return['Questions 24–26','Choose the correct letter A, B, C or D.']}if(n<=32)return['Questions 27–32','Complete the summary using the list A–J.'];if(n<=36)return['Questions 33–36','Choose YES, NO or NOT GIVEN.'];return['Questions 37–40','Choose the correct letter A, B, C or D.']}

function zoneRoot(zone){
  return document.getElementById(zone==='questions'?'questionsCopy':'passageCopy');
}
function zoneMarkupKey(zone,p=current){
  return (zone==='questions'?'questionsMarkup':'passageMarkup')+p;
}
function noteStoreKey(zone,p=current){
  return 'notes_'+zone+'_'+p;
}
function notesPanelId(zone){
  return zone==='questions'?'notesPanelQuestions':'notesPanelPassage';
}
function notesCountId(zone){
  return zone==='questions'?'notesCountQuestions':'notesCountPassage';
}
function saveZoneMarkup(zone){
  const root=zoneRoot(zone);
  if(root)ssSet(zoneMarkupKey(zone),root.innerHTML);
}
function saveCurrentMarkups(){
  saveZoneMarkup('passage');
  saveZoneMarkup('questions');
}
function captureSelection(zone){
  if(submitted)return;
  const sel=window.getSelection();
  const root=zoneRoot(zone);
  if(!sel||!root||sel.rangeCount===0||sel.isCollapsed)return;
  const r=sel.getRangeAt(0);
  if(root.contains(r.commonAncestorContainer)){
    savedSelection=r.cloneRange();
    savedSelectionZone=zone;
  }
}
function annotationBlock(node){
  const el=node&&node.nodeType===3?node.parentElement:node;
  if(!el)return null;
  return el.closest('p,.completion-text,.flow-step,li,.card,.option,.inst,.bank div,h3,h4,.qtext');
}
function getUsableSelection(zone){
  const root=zoneRoot(zone);
  if(!savedSelection||savedSelectionZone!==zone||!root||!root.contains(savedSelection.commonAncestorContainer)){
    alert(zone==='questions'
      ?'Hãy bôi đen phần chữ ở bên câu hỏi trước.'
      :'Hãy bôi đen phần chữ trong bài đọc trước.');
    return null;
  }
  if(savedSelection.collapsed||!savedSelection.toString().trim()){
    alert('Hãy bôi đen một đoạn chữ trước.');
    return null;
  }

  const a=annotationBlock(savedSelection.startContainer);
  const b=annotationBlock(savedSelection.endContainer);
  if(!a||!b||a!==b){
    alert('Để highlight/ghi chú ổn định, hãy chọn chữ trong cùng một câu hoặc cùng một khối nội dung.');
    return null;
  }

  const cloned=savedSelection.cloneContents();
  if(cloned.querySelector && cloned.querySelector('input,select,button,textarea')){
    alert('Không thể highlight xuyên qua ô trả lời. Hãy chỉ chọn phần chữ.');
    return null;
  }
  return savedSelection.cloneRange();
}
function clearBrowserSelection(){
  const sel=window.getSelection();
  if(sel)sel.removeAllRanges();
  savedSelection=null;
  savedSelectionZone=null;
}
function addHighlight(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  try{
    const mark=document.createElement('mark');
    mark.className='user-highlight';
    mark.dataset.annotationZone=zone;
    const frag=r.extractContents();
    mark.appendChild(frag);
    r.insertNode(mark);
    activeHighlight=mark;
    activeHighlightZone=zone;
    saveZoneMarkup(zone);
    clearBrowserSelection();
  }catch(e){
    alert('Không thể highlight vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function clearHighlight(zone){
  if(submitted)return;
  let targets=[];
  if(activeHighlight&&activeHighlightZone===zone&&document.body.contains(activeHighlight)){
    targets=[activeHighlight];
  }else if(savedSelection&&savedSelectionZone===zone){
    const root=zoneRoot(zone);
    if(root)targets=[...root.querySelectorAll('mark.user-highlight')].filter(m=>{
      try{return savedSelection.intersectsNode(m)}catch(e){return false}
    });
  }
  if(!targets.length){
    alert('Hãy bấm vào phần đã highlight rồi chọn “Xóa HL”.');
    return;
  }
  targets.forEach(m=>{
    const p=m.parentNode;
    while(m.firstChild)p.insertBefore(m.firstChild,m);
    m.remove();
    p.normalize();
  });
  activeHighlight=null;
  activeHighlightZone=null;
  saveZoneMarkup(zone);
  clearBrowserSelection();
}
function loadNotes(zone,p=current){
  try{return JSON.parse(ssGet(noteStoreKey(zone,p))||'[]')}catch(e){return[]}
}
function saveNotes(zone,notes,p=current){
  ssSet(noteStoreKey(zone,p),JSON.stringify(notes));
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addNote(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  const quote=r.toString().trim();
  const text=prompt('Nhập ghi chú cho đoạn đã chọn:');
  if(text===null||!text.trim())return;
  const id='note_'+zone+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  try{
    const span=document.createElement('span');
    span.className='note-anchor';
    span.dataset.noteId=id;
    span.dataset.annotationZone=zone;
    span.title='Bấm để xem/sửa ghi chú';
    const frag=r.extractContents();
    span.appendChild(frag);
    r.insertNode(span);

    const notes=loadNotes(zone);
    notes.push({id,quote,text:text.trim()});
    saveNotes(zone,notes);
    saveZoneMarkup(zone);
    clearBrowserSelection();
    renderNotesPanel(zone,current,true);
  }catch(e){
    alert('Không thể tạo ghi chú cho vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function toggleNotes(zone){
  const panel=document.getElementById(notesPanelId(zone));
  if(panel)panel.classList.toggle('open');
}
function renderNotesPanel(zone,p=current,forceOpen=false){
  const panel=document.getElementById(notesPanelId(zone));
  const count=document.getElementById(notesCountId(zone));
  if(!panel)return;
  const notes=loadNotes(zone,p);
  if(count)count.textContent=notes.length;
  panel.innerHTML=notes.length
    ?notes.map(n=>`<div class="note-item">
        <div class="note-quote">“${esc(n.quote)}”</div>
        <div class="note-text">${esc(n.text)}</div>
        <div class="note-actions">
          <button type="button" onclick="editNote('${zone}','${n.id}')">Sửa</button>
          <button type="button" onclick="deleteNote('${zone}','${n.id}')">Xóa</button>
        </div>
      </div>`).join('')
    :'<div style="font-size:13px;color:var(--muted)">Chưa có ghi chú ở phần này.</div>';
  if(forceOpen)panel.classList.add('open');
}
function editNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt('Sửa ghi chú:',n.text);if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function deleteNote(zone,id){
  const notes=loadNotes(zone).filter(x=>x.id!==id);
  saveNotes(zone,notes);
  const root=zoneRoot(zone);
  if(root)root.querySelectorAll(`[data-note-id="${id}"]`).forEach(s=>{
    const p=s.parentNode;
    while(s.firstChild)p.insertBefore(s.firstChild,s);
    s.remove();
    p.normalize();
  });
  saveZoneMarkup(zone);
  renderNotesPanel(zone,current,true);
}
function openNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt(`Đoạn đã ghi chú:\n“${n.quote}”\n\nGhi chú:`,n.text);
  if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function bindAnnotations(zone){
  const root=zoneRoot(zone);if(!root)return;
  root.addEventListener('mouseup',()=>captureSelection(zone));
  root.addEventListener('keyup',()=>captureSelection(zone));
  root.addEventListener('click',e=>{
    const note=e.target.closest('.note-anchor');
    if(note){openNote(zone,note.dataset.noteId);return}
    const mark=e.target.closest('mark.user-highlight');
    if(mark){
      activeHighlight=mark;
      activeHighlightZone=zone;
    }else if(zone===activeHighlightZone){
      activeHighlight=null;
      activeHighlightZone=null;
    }
  });
}
function annotationToolbar(zone){
  const isQ=zone==='questions';
  const label=isQ?'Câu hỏi':'Bài đọc';
  const countId=isQ?'notesCountQuestions':'notesCountPassage';
  return `<div class="annotation-bar">
    <span class="annotation-zone-label">${label}</span>
    <button type="button" class="annotation-btn" onclick="addHighlight('${zone}')">🖍 Highlight</button>
    <button type="button" class="annotation-btn" onclick="clearHighlight('${zone}')">Xóa HL</button>
    <button type="button" class="annotation-btn" onclick="addNote('${zone}')">📝 Add note</button>
    <button type="button" class="annotation-btn" onclick="toggleNotes('${zone}')">Ghi chú (<span id="${countId}">0</span>)</button>
    <span class="annotation-tip">Bôi đen phần chữ rồi chọn công cụ.</span>
  </div>`;
}

function showPassage(p){
  saveCurrentMarkups();
  current=p;
  activeHighlight=null;
  activeHighlightZone=null;
  savedSelection=null;
  savedSelectionZone=null;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.p===p));

  const passageMarkup=ssGet(zoneMarkupKey('passage',p))||passages[p].text;
  document.getElementById('passage').innerHTML=
    annotationToolbar('passage')+
    `<div id="notesPanelPassage" class="notes-panel"></div>
     <h2>${passages[p].title}</h2>
     <div class="copy" id="passageCopy">${passageMarkup}</div>`;

  bindAnnotations('passage');
  renderNotesPanel('passage',p,false);
  buildQuestions(p);

  document.getElementById('passage').scrollTop=0;
  document.getElementById('questions').scrollTop=0;
}

function renderQ(q){
  let body='';
  if(q.type==='text'){
    body=`<input class="ans" id="q${q.n}" data-q="${q.n}" type="text" autocomplete="off" placeholder="Type your answer">`;
  }else if(q.type==='select'){
    body=`<select class="ans" id="q${q.n}" data-q="${q.n}"><option value="">-- Choose --</option>${q.opts.map(x=>`<option value="${optionValue(x)}">${x}</option>`).join('')}</select>`;
  }else{
    body=q.opts.map(x=>{
      const v=optionValue(x);
      return `<label class="option" data-q="${q.n}" data-val="${v}"><input type="radio" name="q${q.n}" value="${v}"> ${x}</label>`;
    }).join('');
  }
  return `<div class="card" id="card${q.n}"><div class="qhead"><span class="qnum">${q.n}</span><div class="qtext">${q.text}</div></div>${body}<div class="feedback" id="fb${q.n}"></div></div>`;
}
function inlineText(n,placeholder='answer'){
  return `<span class="inline-blank" id="card${n}"><span class="blank-num">${n}</span><input class="ans inline-answer short" id="q${n}" data-q="${n}" type="text" autocomplete="off" placeholder="${placeholder}"></span>`;
}
function inlineSelect(n,opts){
  return `<span class="inline-blank" id="card${n}"><span class="blank-num">${n}</span><select class="ans inline-answer select-wide" id="q${n}" data-q="${n}"><option value="">-- choose --</option>${opts.map(x=>`<option value="${optionValue(x)}">${x}</option>`).join('')}</select></span>`;
}
function renderMatchRows(start,end,title,inst,showBank=true){
  const rows=questions.filter(q=>q.n>=start&&q.n<=end);
  const opts=rows[0].opts;
  return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>
    ${showBank?`<div class="bank">${opts.map(x=>`<div>${x}</div>`).join('')}</div>`:''}
    ${rows.map(q=>`<div class="match-row completion-text" id="card${q.n}">
      <div class="match-label"><span class="blank-num">${q.n}</span> ${q.text}</div>
      ${inlineSelect(q.n,opts).replace(`id="card${q.n}"`,'')}
    </div>`).join('')}
  </div>`;
}

  return `<div class="group"><h3>Questions 1–5</h3>
    <div class="inst">Complete the summary below. Write <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</div>

      <p class="completion-text">
        Studies at Yale University have shown that a positive attitude can lengthen someone's lifespan by approximately ${inlineText(1)}.
        Another US research team claims to have found a physical reason why this happens.
        As a result of an eight-year study on ${inlineText(2)} male subjects of a certain age, they noted differences in the ${inlineText(3)} among positive and negative thinkers.
        This discovery led them to conclude that positive thinking makes the body's entire ${inlineText(4)} stronger, which, in turn, reduces ageing.
        Rosalind Wright cites some early research on ${inlineText(5)} in support of this view.
      </p>
    </div>
  </div>`;
}

function renderSentenceEndings(start,end,title,inst){
  const rows=questions.filter(q=>q.n>=start&&q.n<=end);
  const opts=rows[0].opts;
  return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>
    <div class="bank">${opts.map(x=>`<div>${x}</div>`).join('')}</div>
    ${rows.map(q=>`<div class="match-row completion-text" id="card${q.n}">
      <div class="match-label"><span class="blank-num">${q.n}</span> ${q.text}</div>
      ${inlineSelect(q.n,opts).replace(`id="card${q.n}"`,'')}
    </div>`).join('')}
  </div>`;
}
function renderStandardGroup(qs,title,inst){
  return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>${qs.map(renderQ).join('')}</div>`;
}
function buildQuestions(p){
  let h='';
  if(p===1){
    h+=renderP1Summary();
    h+=renderSentenceEndings(6,10,'Questions 6–10','Complete each sentence with the correct ending, A–H.');
    h+=renderStandardGroup(questions.filter(q=>q.n>=11&&q.n<=13),'Questions 11–13','Choose YES, NO or NOT GIVEN.');
  }else if(p===2){
    h+=renderMatchRows(14,18,'Questions 14–18','Which paragraph contains the following information? Choose A–E. You may use any letter more than once.',false);
    h+=renderMatchRows(19,22,'Questions 19–22','Match each statement with the correct person, A–E. You may use any letter more than once.');
    h+=renderP2Summary();
  }else{
    h+=renderStandardGroup(questions.filter(q=>q.n>=27&&q.n<=31),'Questions 27–31','Choose the correct answer.');
    h+=renderStandardGroup(questions.filter(q=>q.n>=32&&q.n<=35),'Questions 32–35','Choose YES, NO or NOT GIVEN.');
    h+=renderSentenceEndings(36,40,'Questions 36–40','Complete each sentence with the correct ending, A–F.');
  }

  const savedQuestionMarkup=ssGet(zoneMarkupKey('questions',p));
  const questionMarkup=savedQuestionMarkup||h;
  document.getElementById('questions').innerHTML=
    annotationToolbar('questions')+
    `<div id="notesPanelQuestions" class="notes-panel"></div><div id="questionsCopy">${questionMarkup}</div>`;

  restore(p);
  bindTrack();
  bindAnnotations('questions');
  renderNotesPanel('questions',p,false);

  if(submitted){
    const copy=document.getElementById('questionsCopy');
    if(copy&&!copy.querySelector('.review-mode-note.top-review-note')){
      copy.insertAdjacentHTML('afterbegin','<div class="review-mode-note top-review-note">Review mode: câu sai có giải thích và evidence ngay bên dưới. Bấm “Đối chiếu trong bài đọc” để đưa đoạn bằng chứng ở cột trái vào vị trí xem.</div>');
    }
    markPassage(p);
  }
}
function restore(p){
  for(const q of questions.filter(x=>x.p===p)){
    const v=ssGet('q'+q.n)||'';
    if(q.type==='text'||q.type==='select'){
      const e=document.getElementById('q'+q.n);
      if(e)e.value=v;
    }else if(v){
      const e=[...document.querySelectorAll(`input[name="q${q.n}"]`)].find(x=>x.value===v);
      if(e)e.checked=true;
    }
  }
}
function bindTrack(){
  document.querySelectorAll('.ans').forEach(e=>{
    e.oninput=e.onchange=()=>save(+e.dataset.q,e.value);
  });
  document.querySelectorAll('input[type=radio]').forEach(e=>{
    e.onchange=()=>save(+e.closest('.option').dataset.q,e.value);
  });
}
function save(n,v){
  ssSet('q'+n,v);
  const e=document.getElementById('nav'+n);
  if(e)e.classList.toggle('answered',String(v).trim()!=='');
}
function buildNav(){
  document.getElementById('nav').innerHTML=questions.map(q=>`<button class="nq" id="nav${q.n}" onclick="goQ(${q.n})">${q.n}</button>`).join('');
}
function goQ(n){
  const q=questions.find(x=>x.n===n);
  if(q.p!==current)showPassage(q.p);
  setTimeout(()=>{
    const target=document.getElementById('card'+n);
    target?.scrollIntoView({behavior:'smooth',block:'center'});
    const control=document.getElementById('q'+n);
    if(control&&(control.tagName==='SELECT'||control.type==='text'))control.focus({preventScroll:true});
  },60);
}
function correct(q,u){
  return q.type==='text'?q.ans.map(norm).includes(norm(u)):norm(u)===norm(q.ans);
}

function inlineReviewHTML(q,user){
  const r=answerReview[q.n];
  return `<div class="inline-review${q.type==='text'||q.type==='select'?' integrated':''}" data-inline-review="${q.n}">
    <div class="inline-review-title">
      <span class="inline-review-badge">Q${q.n}</span>
      <span>Giải thích câu trả lời sai</span>
    </div>
    <div class="inline-review-row">
      <div class="inline-review-label">Bạn trả lời</div>
      <div class="inline-review-student">${esc(displayAnswer(q,user))}</div>
    </div>
    <div class="inline-review-row">
      <div class="inline-review-label">Đáp án đúng</div>
      <div class="inline-review-correct">${esc(displayKey(q))}</div>
    </div>
    <div class="inline-review-explain"><b>Vì sao?</b> ${esc(r.explain)}</div>
    <div class="inline-review-evidence">
      <div class="inline-review-evidence-label">Evidence · Passage ${q.p}, đoạn ${r.para}</div>
      <div class="inline-review-quote">“${esc(r.evidence)}”</div>
    </div>
    <button type="button" class="inline-review-btn" onclick="focusEvidence(${q.n})">↗ Đối chiếu trong bài đọc</button>
  </div>`;
}

function removeInlineReview(n){
  document.querySelectorAll(`[data-inline-review="${n}"]`).forEach(e=>e.remove());
}

function renderInlineReview(q,user,ok){
  removeInlineReview(q.n);
  if(ok)return;

  const card=document.getElementById('card'+q.n);
  if(!card)return;

  // Standard IELTS question cards: explanation sits directly under the options.
  if(card.classList.contains('card')){
    card.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
    return;
  }

  // Completion tasks: place review under the sentence/step/note containing the blank.
  const host=card.closest('.flow-step,li,.completion-text') || card.parentElement;
  if(!host)return;

  // Several blanks may live in the same summary paragraph; keep each explanation labelled by Q number.
  host.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
}

function lockSubmittedAnswers(){
  if(!submitted)return;
  document.querySelectorAll('#questionsCopy input,#questionsCopy select').forEach(e=>e.disabled=true);
}

function focusEvidence(n){
  const q=questions.find(x=>x.n===n);
  const r=answerReview[n];
  if(!q||!r)return;

  const reveal=()=>{
    const copy=document.getElementById('passageCopy');
    const ps=copy?[...copy.querySelectorAll('p')]:[];
    const target=ps[r.para-1];
    if(!target)return;
    target.scrollIntoView({behavior:'smooth',block:'center'});
    target.classList.add('evidence-pulse');
    setTimeout(()=>target.classList.remove('evidence-pulse'),3200);
  };

  if(q.p!==current){
    showPassage(q.p);
    setTimeout(reveal,150);
  }else{
    reveal();
  }
}

function markPassage(p){
  for(const q of questions.filter(x=>x.p===p)){
    const u=ssGet('q'+q.n)||'';
    const ok=correct(q,u);
    const fb=document.getElementById('fb'+q.n);

    if(q.type==='text'||q.type==='select'){
      const e=document.getElementById('q'+q.n);
      if(e){
        e.classList.remove('correct','wrong');
        e.classList.add(ok?'correct':'wrong');
      }
    }else{
      document.querySelectorAll(`label[data-q="${q.n}"]`).forEach(l=>{
        l.classList.remove('correct','wrong');
        if(norm(l.dataset.val)===norm(q.ans))l.classList.add('correct');
        else if(u&&norm(l.dataset.val)===norm(u))l.classList.add('wrong');
      });
    }

    if(fb){
      const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
      fb.className='feedback '+(ok?'good':'bad');
      fb.textContent=ok?'✓ Correct':'Correct answer: '+key;
    }

    if(submitted)renderInlineReview(q,u,ok);
  }

  lockSubmittedAnswers();
}

function displayAnswer(q,user){
  if(!String(user).trim())return 'Không trả lời';
  if(q.type==='select'||q.type==='choice'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(user));
    return found||user;
  }
  return user;
}
function displayKey(q){
  const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
  if(q.type==='select'||q.type==='choice'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(key));
    return found||key;
  }
  return key;
}
function renderWrongReview(details){
  const box=document.getElementById('wrongReview');
  const wrong=details.filter(x=>!x.correct);
  if(!wrong.length){
    box.innerHTML='<h3 class="review-title">Review đáp án</h3><div class="perfect-review">🎉 Không có câu sai. Bạn đã trả lời đúng cả 40 câu!</div>';
    return;
  }
  box.innerHTML=`<h3 class="review-title">${wrong.length} câu cần xem lại</h3>
    <div class="review-mode-note">Đóng bảng điểm để xem <b>giải thích + evidence được ghim trực tiếp ngay dưới từng câu sai</b>. Khi chuyển Passage, phần giải thích vẫn còn để bạn đối chiếu với bài đọc.</div>`;
}
function gotoEvidence(n){
  document.getElementById('overlay').classList.add('hidden');
  focusEvidence(n);
}

async function submitExam(auto=false){if(submitted)return;saveCurrentMarkups();const unanswered=questions.filter(q=>!(ssGet('q'+q.n)||'').trim()).length;if(!auto&&unanswered&& !confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;submitted=true;clearInterval(timerHandle);let total=0,s=[0,0,0,0],details=[];for(const q of questions){const u=ssGet('q'+q.n)||'',ok=correct(q,u);if(ok){total++;s[q.p]++}details.push({q:q.n,answer:u,correct:ok,key:Array.isArray(q.ans)?q.ans.join(' / '):q.ans});const ne=document.getElementById('nav'+q.n);if(ne){ne.classList.remove('answered');ne.classList.add(ok?'correct':'wrong')}}markPassage(current);saveZoneMarkup('questions');const name=document.getElementById('studentName').value.trim(),cls=document.getElementById('studentClass').value.trim(),dur=Math.round((Date.now()-startedAt)/1000);document.getElementById('rstudent').textContent=`${name} — ${cls}`;document.getElementById('rscore').textContent=`${total} / 40`;document.getElementById('rpercent').textContent=`${Math.round(total/40*100)}% correct`;document.getElementById('p1s').textContent=`${s[1]} / 13`;document.getElementById('p2s').textContent=`${s[2]} / 13`;document.getElementById('p3s').textContent=`${s[3]} / 14`;renderWrongReview(details);document.getElementById('overlay').classList.remove('hidden');document.getElementById('status').textContent='Đang gửi kết quả về Google Sheet...';const p=new URLSearchParams({name,className:cls,total:String(total),maxScore:'40',durationSeconds:String(dur),activity:'IELTS Reading - Optimism / New Zealand Health IT / Game Theory',reading:String(s[1]),grammar:String(s[2]),ing:String(s[3]),writingA:JSON.stringify(details),submittedAt:new Date().toISOString()});try{await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p.toString()});document.getElementById('status').textContent='✓ Đã gửi kết quả về Google Sheet.'}catch(e){document.getElementById('status').textContent='Không gửi được kết quả về Google Sheet. Hãy kiểm tra Web App URL hoặc kết nối mạng.'}}
function closeResult(){document.getElementById('overlay').classList.add('hidden');markPassage(current);saveZoneMarkup('questions')}
</script></body></html>
