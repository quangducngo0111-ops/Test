<script>const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwfwWjJ7Q3VTJEF5ldKGnFKYoziQdntAzRjq1Yqy6HSmbZSc69ijSdOvMCC_Zogbpcm/exec";
const passages={"1": {"title": "William Gilbert and Magnetism", "subtitle": "", "text": "<p><b>A</b> The 16th and 17th centuries saw two great pioneers of modern science: Galileo and Gilbert. The impact of their findings is eminent. Gilbert was the first modern scientist, also the accredited father of the science of electricity and magnetism, an Englishman of learning and a physician at the court of Elizabeth. Prior to him, all that was known of electricity and magnetism was what the ancients knew, nothing more than that the lodestone possessed magnetic properties and that amber and jet, when rubbed, would attract bits of paper or other substances of small specific gravity. However, he is less well known than he deserves.</p><p><b>B</b> Gilbert’s birth pre-dated Galileo. Born in an eminent local family in Colchester County in the UK, on May 24, 1544, he went to grammar school, and then studied medicine at St John’s College, Cambridge, graduating in 1573. Later he travelled in the continent and eventually settled down in London.</p><p><b>C</b> He was a very successful and eminent doctor. All this culminated in his election to the president of the Royal Science Society. He was also appointed personal physician to the Queen (Elizabeth I), and later knighted by the Queen. He faithfully served her until her death. However, he didn’t outlive the Queen for long and died on November 30, 1603, only a few months after his appointment as personal physician to King James.</p><p><b>D</b> Gilbert was first interested in chemistry but later changed his focus due to the large portion of mysticism of alchemy involved (such as the transmutation of metal). He gradually developed his interest in physics after the great minds of the ancient, particularly about the knowledge the ancient Greeks had about lodestones, strange minerals with the power to attract iron. In the meantime, Britain became a major seafaring nation in 1588 when the Spanish Armada was defeated, opening the way to British settlement of America. British ships depended on the magnetic compass, yet no one understood why it worked. Did the Pole Star attract it, as Columbus once speculated; or was there a magnetic mountain at the pole, as described in Odyssey, which ships would never approach, because the sailors thought its pull would yank out all their iron nails and fittings? For nearly 20 years, William Gilbert conducted ingenious experiments to understand magnetism. His works include On the Magnet, Magnetic Bodies, and the Great Magnet of the Earth.</p><p><b>E</b> Gilbert’s discovery was so important to modern physics. He investigated the nature of magnetism and electricity. He even coined the word “electric”. Though the early beliefs of magnetism were also largely entangled with superstitions such as that rubbing garlic on lodestone can neutralise its magnetism, one example being that sailors even believed the smell of garlic would even interfere with the action of compass, which is why helmsmen were forbidden to eat it near a ship’s compass. Gilbert also found that metals can be magnetised by rubbing materials such as fur, plastic or the like on them. He named the ends of a magnet “north pole” and “south pole”. The magnetic poles can attract or repel, depending on polarity. In addition, however, ordinary iron is always attracted to a magnet. Though he started to study the relationship between magnetism and electricity, sadly he didn’t complete it. His research of static electricity using amber and jet only demonstrated that objects with electrical charges can work like magnets attracting small pieces of paper and stuff. It is a French guy named du Fay that discovered that there are actually two electrical charges, positive and negative.</p><p><b>F</b> He also questioned the traditional astronomical beliefs. Though a Copernican, he didn’t express in his quintessential beliefs whether the earth is at the centre of the universe or in orbit around the sun. However, he believed that stars are not equidistant from the earth but have their own earth-like planets orbiting around them. The earth itself is like a giant magnet, which is also why compasses always point north. They spin on an axis that is aligned with the earth’s polarity. He even likened the polarity of the magnet to the polarity of the earth and built an entire magnetic philosophy on this analogy. In his explanation, magnetism is the soul of the earth. Thus a perfectly spherical lodestone, when aligned with the earth’s poles, would wobble all by itself in 24 hours. Further, he also believed that the sun and other stars wobble just like the earth does around a crystal core, and speculated that the moon might also be a magnet caused to orbit by its magnetic attraction to the earth. This was perhaps the first proposal that a force might cause a heavenly orbit.</p><p><b>G</b> His research method was revolutionary in that he used experiments rather than pure logic and reasoning like the ancient Greek philosophers did. It was a new attitude towards scientific investigation. Until then, scientific experiments were not in fashion. It was because of this scientific attitude, together with his contribution to our knowledge of magnetism, that a unit of magneto motive force, also known as magnetic potential, was named Gilbert in his honour. His approach of careful observation and experimentation rather than the authoritative opinion or deductive philosophy of others had laid the very foundation for modern science.</p>"}, "2": {"title": "Multi-tasking and the brain", "subtitle": "", "text": "<p><b>A</b> Do you think you're a master of multi-tasking? Think again. Unless you are one of the three percent of super-taskers in the population, research shows that your brain is incapable of paying close attention to more than one complex task at a time. Researchers who study attention say that effective multi-tasking is beyond most of us. Psychiatrist Edward M Hallowell even describes multi-tasking as a 'mythical activity in which people believe they can perform two or more tasks simultaneously as effectively as they can perform one'.</p><p><b>B</b> It’s true that you can check your email while eating your lunch, or listen to music while walking. But innate activities like walking, chewing, and breathing do not require you to pay attention, whereas activities such as reading, tapping out a text message or driving a car do require attention. Why is paying attention to two things at once difficult? 'The brain can perform simultaneous tasks, but attention has capacity limitations,' says Associate Professor Paul E Dux, a cognitive neuroscientist at the University of Queensland in Australia. When you do only one thing at a time, you’re better at that task than when you're doing multiple things concurrently. Take the classic multi-tasking scenario of talking on a mobile phone while driving – an ill-advised activity that many people believe they have mastered. When David Strayer, Professor of Psychology in the University of Utah in the US, and his team observed 56,000 drivers as they approached an intersection. The majority of drivers who were talking on their phone failed to stop in accordance with traffic laws. And it did not matter if the driver was using a handheld or hands-free device. Even with both eyes on the road and both hands on the wheel, drivers' performance was impaired. Strayer’s research shows that performance deteriorates dramatically when attention is split between tasks: more mistakes are made and it takes longer to complete each activity.</p><p><b>C</b> The prefrontal cortex is the brain region responsible for choosing what to pay attention to, and for coordinating inputs from other brain areas. By scanning the prefrontal cortex of people while they multi-tasked, scientists at the French Institute of Health and Medical Research in Paris (INSERM) found that when people focused on a single thing, the right and left sides of the prefrontal cortex work together. But when people attempt to perform two things at once, the sides work independently. Neuroscientist Etienne Koechlin says his study demonstrates that while the brain can switch back and forth between two tasks, we might be in great trouble when we try to juggle more than two tasks simply because we have only two frontal lobes.</p><p><b>D</b> To the question of whether there is a difference between the sexes, Koechlin's imaging studies uncovered no differences in the ability switch between tasks in the prefrontal cortices of men or women. But other researchers studying real life scenarios such as finding lost keys, believe there might be truth to the claim that women are superior multi-taskers. Women have a much better strategy for finding the keys, whereas men tend to jump to it and be far less organised and thorough. 'It's as if they don't stop to reflect and plan for a moment,' says Professor Keith Laws from the University of Hertfordshire in England. But while the ability to develop strategies for coping with the numerous tasks in everyday life could give women an advantage, 'nobody can juggle two, never mind three, “complex” tasks at the same time.'</p><p><b>E</b> However, David Strayer's research uncovered that some rare people possess extraordinary multi-tasking ability. These so-called 'super-taskers' exhibit different patterns of brain activity when multi-tasking compared to ordinary people: they show less activity in the prefrontal cortex during multi-tasking suggesting their brains are functioning with a high level of efficiency. Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. 'All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling numerous tasks that demand attention at the same time.'</p><p><b>F</b> The ability to multi-task probably comes down to the DNA you inherit from your parents. To a large extent, says Strayer. 'You are either born with the neural structure that allows you to overcome the usual multi-tasking challenges, or you aren't. Super-taskers' brains are doing something we can’t do.' All in all, these findings may have very real consequences on our lives.</p>"}, "3": {"title": "The benefits of learning an instrument", "subtitle": "Studies show that learning a musical instrument can bring about significant improvements in your brain", "text": "<p><b>A</b> Are music lessons the way to get smarter? That's what a lot of parents and experts believe: studying an instrument gives children an advantage in the development of their intellectual, perceptual, and cognitive skills. This may, however, turn out to be wishful thinking. Two highly convincing trials carried out recently have found no evidence to support this idea. The IQs of pre-school children who attended several weeks of music classes as part of these studies did not differ significantly from the IQs of those who had not.</p><p><b>B</b> But that does not mean that the advantages of learning to play music are limited to expressing yourself, impressing friends, or just having fun. A growing number of studies show that learning an instrument in childhood can do something perhaps more valuable for the brain: it can provide benefits as we age, in the form of an added defense against memory loss cognitive decline, and impaired hearing. Not only that you may well get those benefits even if you haven't picked up your instrument in years, or decide to take up music for the first time in mid-life or beyond. According to neuropsychologist Brenda Hanna-Pladdy of Emory University in Atlanta, the time spent learning and practicing specific types of motor control and coordination – each finger on each hand doing something different, and for wind and brass instruments also using your mouth and breathing – contributes to the brain boost that shows up later in life.</p><p><b>C</b> You can even map the impact of musical training of the brain itself. In one study, Harvard neurologist Gottfried Schlaug found that the brains of adult professional musicians had a larger volume of grey matter than the brains of non-musicians had. Schlaug and colleagues also found that after 15 months of musical training in early childhood, structural brain changes associated with motor and auditory improvements begin to appear. 'What's unique about playing an instrument is that it requires a wide array of brain regions and cognitive functions to work together simultaneously, in both right and left hemispheres of the brain,' says Alison Balbag of the University of Southern California. 'Playing music may be an efficient way to stimulate the brain,' she says, 'cutting across a broad swath of its regions and cognitive functions and with ripple effects through the decades.'</p><p><b>D</b> More research is showing this might well be the case. In her first study on the subject, Hanna-Pladdy divided 70 healthy adults between the ages of 60 and 83 into three groups: musicians who had studied an instrument for at least ten years, those who had played between one and nine years, and a control group who had never learned an instrument. The group who had studied for at least ten years scored the highest when tested in such areas as nonverbal and visuo-spatial memory, naming objects, and taking in and adapting new information. Her follow-up study a year later confirmed those findings and further suggested that starting musical training before the age of nine and keeping at it for ten years or more may yield the greatest benefits. Interestingly, it was the group who had the lowest level of general education which showed the greatest gap in scores between those who had studied an instrument in childhood and those who had not. Hanna-Pladdy suspects that musical training could have made up for the lack of cognitive stimulation these people had academically.</p><p><b>E</b> Neuroscientist Nina Kraus of Northwestern University in Chicago has found still more positive effects of early musical training. She measured the electrical activity in the auditory brainstems of adults, ages 55 to 76, as they responded to the synthesized speech syllable 'da'. Although none of the subjects had played a musical instrument in 40 years, those who had trained the longest – between four and fourteen years – responded the fastest. 'That's significant,' says Kraus, 'because hearing tends to decline as we age, including the ability to quickly and accurately discern consonants, a skill crucial to understanding and participating in conversation.' 'If your nervous system is not keeping up with the timing necessary for encoding consonants, you will lose out on the flow and meaning of the conversation, and that can potentially create to a downward spiral leading to a sense of social isolation,' says Kraus. 'In addition, the fact that musical training appears to enhance auditory working memory might help reinforce in later life the memory capacity that facilitates verbal interaction.'</p><p><b>F</b> In another study at the University of South Florida, assistant professor of music education Jennifer Bugos studied the impact of elementary piano instruction on adults between the ages of 60 and 85. After six months, those who had received piano lessons showed more robust gains in memory, verbal fluency, the speed at which they processed information, planning ability, and other cognitive functions, compared with those who had not received the lessons. Bugos believes that playing an instrument has beneficial effects, regardless of how old the person is when he or she begins. 'Musical training contains all the components of a cognitive training program that sometimes are overlooked,' she says, 'And just as we work out our bodies, we should work out our minds.'</p>"}};

function clearHighlight(zone){
  if(submitted)return;
  let targets=[];
  if(activeHighlight&&activeHighlightZone===zone&&document.body.contains(activeHighlight)){
    targets=[activeHighlight];
  }else if(savedSelection&&savedSelectionZone===zone){
    const root=zoneRoot(zone);
    if(root)targets=[...root.querySelectorAll('mark.user-highlight')].filter(m=>{
      try{return savedSelection.intersectsNode(m)}catch(e){return false}
    });
  }
  if(!targets.length){
    alert('Hãy bấm vào phần đã highlight rồi chọn “Xóa HL”.');
    return;
  }
  targets.forEach(m=>{
    const p=m.parentNode;
    while(m.firstChild)p.insertBefore(m.firstChild,m);
    m.remove();
    p.normalize();
  });
  activeHighlight=null;
  activeHighlightZone=null;
  saveZoneMarkup(zone);
  clearBrowserSelection();

  if(p===1){
    const sel=getMulti();
    document.querySelectorAll('input[name="g1113"]').forEach(e=>e.checked=sel.includes(e.value));
  }
}
function bindTrack(){
  document.querySelectorAll('.ans').forEach(e=>{
    e.oninput=e.onchange=()=>save(+e.dataset.q,e.value);
  });
  document.querySelectorAll('input[type=radio]').forEach(e=>{
    e.onchange=()=>save(+e.closest('.option').dataset.q,e.value);
  });
  document.querySelectorAll('input[name="g1113"]').forEach(e=>{
    e.onchange=()=>{
      let sel=[...document.querySelectorAll('input[name="g1113"]:checked')].map(x=>x.value);
      if(sel.length>3){
        e.checked=false;
        sel=[...document.querySelectorAll('input[name="g1113"]:checked')].map(x=>x.value);
        alert('Chỉ chọn THREE đáp án.');
      }
      ssSet('g1113',JSON.stringify(sel));
      const done=sel.length===3;
      ['nav11','nav12','nav13'].forEach(id=>document.getElementById(id)?.classList.toggle('answered',done));
    };
  });
}
function save(n,v){
  ssSet('q'+n,v);
  const e=document.getElementById('nav'+n);
  if(e)e.classList.toggle('answered',String(v).trim()!=='');
}
function buildNav(){
  document.getElementById('nav').innerHTML=questions.map(q=>`<button class="nq" id="nav${q.n}" onclick="goQ(${q.n})">${q.n}</button>`).join('');
}
function goQ(n){
  const q=questions.find(x=>x.n===n);
  if(q.p!==current)showPassage(q.p);
  setTimeout(()=>{
    const target=document.getElementById('card'+n)||(n===12||n===13?document.getElementById('card11'):null);
    target?.scrollIntoView({behavior:'smooth',block:'center'});
    const control=document.getElementById('q'+n);
    if(control&&(control.tagName==='SELECT'||control.type==='text'))control.focus({preventScroll:true});
  },60);
}
function correct(q,u){
  if(q.type==='multi')return false;
  return q.type==='text'?q.ans.map(norm).includes(norm(u)):norm(u)===norm(q.ans);
}

function inlineReviewHTML(q,user){
  const r=answerReview[q.n];
  return `<div class="inline-review${q.type==='text'||q.type==='select'?' integrated':''}" data-inline-review="${q.n}">
    <div class="inline-review-title">
      <span class="inline-review-badge">Q${q.n}</span>
      <span>Giải thích câu trả lời sai</span>
    </div>
    <div class="inline-review-row">
      <div class="inline-review-label">Bạn trả lời</div>
      <div class="inline-review-student">${esc(displayAnswer(q,user))}</div>
    </div>
    <div class="inline-review-row">
      <div class="inline-review-label">Đáp án đúng</div>
      <div class="inline-review-correct">${esc(displayKey(q))}</div>
    </div>
    <div class="inline-review-explain"><b>Vì sao?</b> ${esc(r.explain)}</div>
    <div class="inline-review-evidence">
      <div class="inline-review-evidence-label">Evidence · Passage ${q.p}, đoạn ${r.para}</div>
      <div class="inline-review-quote">“${esc(r.evidence)}”</div>
    </div>
    <button type="button" class="inline-review-btn" onclick="focusEvidence(${q.n})">↗ Đối chiếu trong bài đọc</button>
  </div>`;
}

function removeInlineReview(n){
  document.querySelectorAll(`[data-inline-review="${n}"]`).forEach(e=>e.remove());
}

function renderInlineReview(q,user,ok){
  removeInlineReview(q.n);
  if(ok)return;

  const card=document.getElementById('card'+q.n);
  if(!card)return;

  // Standard IELTS question cards: explanation sits directly under the options.
  if(card.classList.contains('card')){
    card.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
    return;
  }

  // Completion tasks: place review under the sentence/step/note containing the blank.
  const host=card.closest('.flow-step,li,.completion-text') || card.parentElement;
  if(!host)return;

  // Several blanks may live in the same summary paragraph; keep each explanation labelled by Q number.
  host.insertAdjacentHTML('beforeend',inlineReviewHTML(q,user));
}

function lockSubmittedAnswers(){
  if(!submitted)return;
  document.querySelectorAll('#questionsCopy input,#questionsCopy select').forEach(e=>e.disabled=true);
}

function focusEvidence(n){
  const q=questions.find(x=>x.n===n);
  const r=answerReview[n];
  if(!q||!r)return;

  const reveal=()=>{
    const copy=document.getElementById('passageCopy');
    const ps=copy?[...copy.querySelectorAll('p')]:[];
    const target=ps[r.para-1];
    if(!target)return;
    target.scrollIntoView({behavior:'smooth',block:'center'});
    target.classList.add('evidence-pulse');
    setTimeout(()=>target.classList.remove('evidence-pulse'),3200);
  };

  if(q.p!==current){
    showPassage(q.p);
    setTimeout(reveal,150);
  }else{
    reveal();
  }
}

function multiReviewHTML(sel,hits){
  if(hits===3)return '';
  const r=answerReview[11];
  return `<div class="inline-review integrated" data-inline-review="1113">
    <div class="inline-review-title"><span class="inline-review-badge">Q11–13</span><span>Giải thích nhóm câu trả lời sai</span></div>
    <div class="inline-review-row"><div class="inline-review-label">Bạn chọn</div><div class="inline-review-student">${esc(sel.length?sel.join(', '):'Không trả lời')}</div></div>
    <div class="inline-review-row"><div class="inline-review-label">Đáp án đúng</div><div class="inline-review-correct">C, D, E</div></div>
    <div class="inline-review-row"><div class="inline-review-label">Điểm nhóm</div><div>${hits} / 3</div></div>
    <div class="inline-review-explain"><b>Vì sao?</b> C: metals can be magnetised; D: stars are not equidistant from Earth; E: Gilbert believed Earth wobbles.</div>
    <div class="inline-review-evidence"><div class="inline-review-evidence-label">Evidence · Passage 1</div><div class="inline-review-quote">“metals can be magnetised” · “stars are not equidistant from the earth” · “the sun and other stars wobble just like the earth does”</div></div>
    <button type="button" class="inline-review-btn" onclick="focusEvidence(11)">↗ Đối chiếu trong bài đọc</button>
  </div>`;
}
function markMultiGroup(){
  const sel=getMulti(),key=['C','D','E'],hits=sel.filter(x=>key.includes(x)).length,perfect=hits===3&&sel.length===3;
  document.querySelectorAll('[data-group="g1113"]').forEach(l=>{
    l.classList.remove('correct','wrong');
    if(key.includes(l.dataset.val))l.classList.add('correct');
    else if(sel.includes(l.dataset.val))l.classList.add('wrong');
  });
  const fb=document.getElementById('fb1113');
  if(fb){
    fb.className='multi-score-note '+(perfect?'good':'bad');
    fb.textContent=perfect?'✓ Correct — 3 / 3':`Correct answers: C, D, E · Score: ${hits} / 3`;
  }
  ['nav11','nav12','nav13'].forEach(id=>{
    const e=document.getElementById(id);
    if(!e)return;
    e.classList.remove('answered','correct','wrong','partial');
    e.classList.add(perfect?'correct':hits>0?'partial':'wrong');
  });
  document.querySelector('[data-inline-review="1113"]')?.remove();
  const host=document.getElementById('multiReview1113');
  if(host&&!perfect)host.innerHTML=multiReviewHTML(sel,hits);
  document.querySelectorAll('input[name="g1113"]').forEach(e=>e.disabled=true);
}
function markPassage(p){
  for(const q of questions.filter(x=>x.p===p&&x.type!=='multi')){
    const u=ssGet('q'+q.n)||'';
    const ok=correct(q,u);
    const fb=document.getElementById('fb'+q.n);

    if(q.type==='text'||q.type==='select'){
      const e=document.getElementById('q'+q.n);
      if(e){e.classList.remove('correct','wrong');e.classList.add(ok?'correct':'wrong');}
    }else{
      document.querySelectorAll(`label[data-q="${q.n}"]`).forEach(l=>{
        l.classList.remove('correct','wrong');
        if(norm(l.dataset.val)===norm(q.ans))l.classList.add('correct');
        else if(u&&norm(l.dataset.val)===norm(u))l.classList.add('wrong');
      });
    }

    if(fb){
      const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
      fb.className='feedback '+(ok?'good':'bad');
      fb.textContent=ok?'✓ Correct':'Correct answer: '+key;
    }
    if(submitted)renderInlineReview(q,u,ok);
  }
  if(p===1&&submitted)markMultiGroup();
  lockSubmittedAnswers();
}
function displayAnswer(q,user){
  if(!String(user).trim())return 'Không trả lời';
  if(q.type==='select'||q.type==='choice'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(user));
    return found||user;
  }
  return user;
}
function displayKey(q){
  const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
  if(q.type==='select'||q.type==='choice'){
    const found=(q.opts||[]).find(x=>optionValue(x)===String(key));
    return found||key;
  }
  return key;
}
function renderWrongReview(total){
  const box=document.getElementById('wrongReview');
  const wrong=40-total;
  if(!wrong){
    box.innerHTML='<h3 class="review-title">Review đáp án</h3><div class="perfect-review">🎉 Không có câu sai. Bạn đã trả lời đúng cả 40 câu!</div>';
    return;
  }
  box.innerHTML=`<h3 class="review-title">${wrong} điểm cần xem lại</h3>
    <div class="review-mode-note">Đóng bảng điểm để xem <b>giải thích + evidence được ghim trực tiếp ngay dưới từng câu/nhóm câu sai</b>. Khi chuyển Passage, phần giải thích vẫn còn để bạn đối chiếu với bài đọc.</div>`;
}
function gotoEvidence(n){
  document.getElementById('overlay').classList.add('hidden');
  focusEvidence(n);
}
async function submitExam(auto=false){
  if(submitted)return;
  saveCurrentMarkups();

  const normalMissing=questions.filter(q=>q.type!=='multi'&&!(ssGet('q'+q.n)||'').trim()).length;
  const multiMissing=Math.max(0,3-getMulti().length);
  const unanswered=normalMissing+multiMissing;
  if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu/ô đáp án chưa hoàn thành. Vẫn nộp bài?`))return;

  submitted=true;
  clearInterval(timerHandle);

  let total=0,scores=[0,0,0,0],details=[];

  for(const q of questions.filter(q=>q.type!=='multi')){
    const u=ssGet('q'+q.n)||'',ok=correct(q,u);
    if(ok){total++;scores[q.p]++;}
    details.push({q:q.n,answer:u,correct:ok,key:Array.isArray(q.ans)?q.ans.join(' / '):q.ans});
    const ne=document.getElementById('nav'+q.n);
    if(ne){ne.classList.remove('answered');ne.classList.add(ok?'correct':'wrong');}
  }

  const sel=getMulti(),multiKey=['C','D','E'];
  const hits=sel.filter(x=>multiKey.includes(x)).length;
  total+=hits;
  scores[1]+=hits;
  details.push({q:'11-13',answer:sel.join(', '),correct:hits===3,key:'C, D, E',score:hits});

  markPassage(current);
  saveZoneMarkup('questions');

  const name=document.getElementById('studentName').value.trim();
  const cls=document.getElementById('studentClass').value.trim();
  const dur=Math.round((Date.now()-startedAt)/1000);

  document.getElementById('rstudent').textContent=`${name} — ${cls}`;
  document.getElementById('rscore').textContent=`${total} / 40`;
  document.getElementById('rpercent').textContent=`${Math.round(total/40*100)}% correct`;
  document.getElementById('p1s').textContent=`${scores[1]} / 13`;
  document.getElementById('p2s').textContent=`${scores[2]} / 13`;
  document.getElementById('p3s').textContent=`${scores[3]} / 14`;
  renderWrongReview(total);

  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('status').textContent='Đang gửi kết quả về Google Sheet...';

  const p=new URLSearchParams({
    name,
    className:cls,
    total:String(total),
    maxScore:'40',
    durationSeconds:String(dur),
    activity:'IELTS Reading - Gilbert / Multitasking / Music',
    reading:String(scores[1]),
    grammar:String(scores[2]),
    ing:String(scores[3]),
    writingA:JSON.stringify(details),
    submittedAt:new Date().toISOString()
  });

  try{
    await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p.toString()});
    document.getElementById('status').textContent='✓ Đã gửi kết quả về Google Sheet.';
  }catch(e){
    document.getElementById('status').textContent='Không gửi được kết quả về Google Sheet. Hãy kiểm tra Web App URL hoặc kết nối mạng.';
  }
}

function closeResult(){document.getElementById('overlay').classList.add('hidden');markPassage(current);saveZoneMarkup('questions')}
</script></body></html>
