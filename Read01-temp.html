<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>IELTS Reading Computer-Based Test</title><style>
:root{--navy:#17344f;--navy2:#0d263b;--blue:#2e6f9f;--paper:#f4f4f2;--line:#d6dade;--text:#20262b;--muted:#64717b;--accent:#e9784e;--good:#2e7d5b;--bad:#b5442e}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff}.hidden{display:none!important}button,input,select{font:inherit}.start{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,var(--navy2),var(--navy))}.start-card{width:min(620px,100%);background:#fff;border-radius:16px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.22)}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);font-weight:700}.start-card h1{margin:8px 0 6px;color:var(--navy)}.start-card p{margin:0 0 22px;color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px}.btn{border:0;background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;font-weight:700;cursor:pointer}.exam{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto}.top{background:var(--navy2);color:#fff;padding:11px 16px;display:flex;justify-content:space-between;gap:16px;align-items:center}.timer{font-family:ui-monospace,monospace;font-weight:700;background:rgba(255,255,255,.1);padding:8px 11px;border-radius:6px}.timer.danger{background:#912f25}.tabs{display:flex;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafafa}.tab{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}.tab.active{background:var(--navy);color:#fff}.workspace{display:grid;grid-template-columns:1fr 1fr;min-height:0}.passage,.questions{overflow:auto;padding:24px 26px}.passage{border-right:1px solid var(--line)}.questions{background:#fafafa}.passage h2{font-size:1.35rem;color:var(--navy);margin:0 0 18px}.copy{font-size:15px;line-height:1.72}.copy p{margin:0 0 15px}.group{margin-bottom:26px}.group h3{color:var(--navy);margin:0 0 5px}.inst{font-size:.92rem;color:var(--muted);margin-bottom:12px}.bank{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;background:#eef3f6;border:1px solid var(--line);padding:12px;border-radius:8px;margin:10px 0;font-size:.92rem}.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px 15px;margin:10px 0}.qhead{display:flex;gap:10px;align-items:flex-start}.qnum{min-width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}.qtext{flex:1}.option{display:block;border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:7px 0;cursor:pointer}.option.correct{border-color:var(--good);background:rgba(46,125,91,.08)}.option.wrong{border-color:var(--bad);background:rgba(181,68,46,.08)}.ans{width:100%;margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:7px}.ans.correct{border-color:var(--good);background:rgba(46,125,91,.06)}.ans.wrong{border-color:var(--bad);background:rgba(181,68,46,.06)}.feedback{font-size:.88rem;margin-top:6px}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.bottom{border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:10px;align-items:center}.nav{display:flex;gap:4px;overflow-x:auto;flex:1}.nq{min-width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:5px;font-size:12px;font-weight:700}.nq.answered{background:#dcebf5}.nq.correct{background:#dcefe5;border-color:var(--good)}.nq.wrong{background:#f3ddd8;border-color:var(--bad)}.submit{background:var(--accent);color:#fff;border:0;padding:10px 16px;border-radius:7px;font-weight:700;white-space:nowrap;cursor:pointer}.overlay{position:fixed;inset:0;background:rgba(8,20,30,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.result{background:#fff;width:min(620px,100%);border-radius:14px;padding:28px}.score{font-size:2.5rem;font-weight:800;color:var(--navy);margin:8px 0}.break{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.break div{background:#f2f5f7;padding:12px;border-radius:8px;text-align:center}

.result{max-height:90vh;overflow:auto}
.review-wrap{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.review-title{font-size:1.08rem;color:var(--navy);margin:0 0 6px}
.review-sub{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.wrong-review{border:1px solid #e2c8c2;background:#fffaf8;border-radius:9px;padding:14px 15px;margin:11px 0}
.wrong-review .review-q{font-weight:700;color:var(--navy);margin-bottom:8px;line-height:1.45}
.answer-row{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:.92rem;margin:4px 0}
.answer-label{color:var(--muted);font-weight:700}
.student-wrong{color:var(--bad);font-weight:700}
.correct-answer{color:var(--good);font-weight:700}
.explain-box{margin-top:10px;padding:10px 11px;background:#fff;border-left:3px solid var(--blue);border-radius:4px;font-size:.92rem;line-height:1.5}
.evidence-box{margin-top:9px;padding:10px 11px;background:#f3f7fa;border:1px solid #d7e2ea;border-radius:7px;font-size:.9rem;line-height:1.5}
.evidence-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);font-weight:700;margin-bottom:4px}
.evidence-quote{font-style:italic}
.goto-evidence{margin-top:9px;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:6px;padding:7px 10px;font-size:.84rem;font-weight:700;cursor:pointer}
.goto-evidence:hover{background:#f4f7f9}
.evidence-pulse{outline:3px solid rgba(233,120,78,.45);background:#fff8e8;border-radius:5px;transition:background .2s}
.perfect-review{padding:14px;border-radius:8px;background:#edf7f1;color:#245c43;font-weight:700}


.completion-box{background:#fff;border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin-top:12px;line-height:1.8}
.completion-box h4{margin:0 0 12px;color:var(--navy);font-size:1.05rem}
.completion-text{font-size:15px;line-height:2.05;margin:0}
.inline-blank{display:inline-flex;align-items:center;gap:5px;margin:2px 4px;vertical-align:middle;scroll-margin:100px}
.blank-num{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:25px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700}
.inline-answer{width:auto!important;min-width:145px;max-width:245px;margin:0!important;padding:7px 9px!important;display:inline-block;vertical-align:middle;background:#fff}
.inline-answer.short{min-width:115px;max-width:180px}
.inline-answer.select-wide{min-width:190px;max-width:270px}
.flowchart{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin-top:10px}
.flow-step{background:#fbfcfc;border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.75}
.flow-arrow{text-align:center;color:var(--blue);font-size:20px;font-weight:700;line-height:1}
.notes-list{margin:8px 0 0;padding-left:20px}
.notes-list li{margin:9px 0;line-height:1.8}
.completion-box .bank{margin-top:14px;margin-bottom:16px}
.inline-answer.correct{border-color:var(--good)!important;background:rgba(46,125,91,.06)!important}
.inline-answer.wrong{border-color:var(--bad)!important;background:rgba(181,68,46,.06)!important}
@media(max-width:600px){
  .inline-answer,.inline-answer.select-wide{min-width:130px;max-width:100%;font-size:16px}

.questions-pane .annotation-bar{background:#fbfbfa}
.annotation-zone-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-right:2px}

.annotation-bar{position:sticky;top:-24px;z-index:8;display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);margin:-24px -26px 18px;padding:10px 14px}
.annotation-btn{border:1px solid var(--line);background:#fff;color:var(--navy);padding:7px 10px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
.annotation-btn:hover{background:#f4f7f9}
.annotation-tip{font-size:12px;color:var(--muted);margin-left:auto}
mark.user-highlight{background:#fff29a;color:inherit;padding:1px 0;border-radius:2px}

.note-text{font-size:14px;margin-bottom:7px}
.note-actions{display:flex;gap:6px}
.note-actions button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px 8px;font-size:12px;cursor:pointer}

<div id="start" class="start"><div class="start-card"><div class="eyebrow">IELTS Reading Practice</div><h1>Computer-Based Reading Test</h1><p>3 passages · 40 questions · 60 minutes</p><div class="field"><label>Họ và tên học sinh</label><input id="studentName" placeholder="Ví dụ: Nguyễn Văn An"></div><div class="field"><label>Lớp</label><input id="studentClass" placeholder="Ví dụ: 8A1"></div><button class="btn" onclick="startExam()">Bắt đầu làm bài</button><div id="startError" style="color:var(--bad);margin-top:10px"></div></div></div>
<div id="exam" class="exam hidden"><div class="top"><div>Student: <b id="topName"></b> &nbsp; | &nbsp; Class: <b id="topClass"></b></div><div id="timer" class="timer">60:00</div></div><div class="tabs"><button class="tab active" data-p="1" onclick="showPassage(1)">Passage 1</button><button class="tab" data-p="2" onclick="showPassage(2)">Passage 2</button><button class="tab" data-p="3" onclick="showPassage(3)">Passage 3</button></div><div class="workspace"><div id="passage" class="passage"></div><div id="questions" class="questions"></div></div><div class="bottom"><div id="nav" class="nav"></div><button class="submit" onclick="submitExam(false)">Nộp bài</button></div></div>

<script>const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwfwWjJ7Q3VTJEF5ldKGnFKYoziQdntAzRjq1Yqy6HSmbZSc69ijSdOvMCC_Zogbpcm/exec";
const passages={"1": {"title": "The problems and benefits created by the spread of the water hyacinth in Kenya", "text": "<p>Water hyacinth (Eichhornia crassipes), an aquatic plant native to South America, first appeared in countries in Africa in the early 1900s. Scientists there called it the &#x27;world&#x27;s worst aquatic weed&#x27;, after it spread from the southernmost tip of Africa in the early 1900s and started obstructing major dams and rivers.</p>\n<p>In east Africa the plant arrived with Belgian colonists in Rwanda, who liked the look of its glossy leaves and delicate purple flowers floating in their ponds. But by the 1980s, it had &#x27;escaped&#x27; out of the country via the Kagera river and made its way downstream to Lake Victoria. There, with no natural predators and perfect temperature conditions, the plant began spreading in the open water, blocking fishing routes and providing a new habitat for disease-carrying mosquitoes.</p>\n<p>For the women who smoke fish from the lake to sell it has meant declining income, as the boats that once brought the fish to shore by the hundreds struggle to navigate through the mass of plants. But water hyacinth isn&#x27;t their only headache. In order to smoke the fish that they buy, they must gather huge quantities of firewood, sometimes walking as far as 10km each way to collect enough to complete their work. And each day as they cook, they breathe in the thick, grey smoke. About three out of four families in Kenya depend on wood or charcoal to cook their daily meals, and the rate is even higher in rural areas, Kenya&#x27;s latest demographic and health survey shows. Using solid fuels like these for cooking increases indoor pollution. The World Health Organization estimates that about 14,300 Kenyans die annually as a result of indoor air pollution – most of which is caused by cooking and heating sources.</p>\n<p>Some years ago, on the shores of Lake Victoria, huge piles of water hyacinth that villagers had taken out of the water in an attempt to clear it were a common sight. But buried in those decaying waxy leaves was a renewable energy gold mine. It turns out the floating plant isn&#x27;t just good at spreading – its foliage also contains a high ratio of carbon to nitrogen. It&#x27;s a magic combination that has captivated researchers&#x27; imaginations since as early as the 1980s when, across the world, they began to explore its potential as a biofuel. Just about 4kg of the dried plant would be enough to cater for a large family&#x27;s daily energy needs, early research predicted.</p>\n<p>In 2014, Nigerian academics announced they had got better yields of biofuel gas when they mixed the plant with chicken manure. A few years later, Kenyan scientists confirmed what their Nigerian peers and others had already found: manure worked to improve the process of converting the weed into gas.</p>\n<p>In 2018, the technology came to a village on the shore of Lake Victoria, called Dunga. The project promised a two-for-one solution to the dual menaces of the water hyacinth and dependence on firewood. The community received a pair of donated biogas digesters – machines that would transform a mix of water hyacinth and cow dung into biogas for cooking.</p>\n<p>The digesters work a bit like a stomach. The mixture goes in one end – think of it as a mouth – and over the next 20 to 30 days, it goes through a fermentation process and breaks down, giving off gas that comes out the other end. From there, the clean-burning gas is passed through pipes to the point of use, just like traditional domestic gas. In Dunga, the machines produce enough gas to serve about 60% of the village&#x27;s population. It is used in domestic stoves and for other household tasks such as purifying water and incubating chicks.</p>\n<p>The project is testing whether biogas can provide an effective alternative to firewood and charcoal in rural Kenyan communities. Results indicate that the programme seems to be working. The women who smoke the lake fish are already getting sick less often. Besides, they don&#x27;t have to devote a lot of time every day to gathering firewood, which is a great relief. As a result, they&#x27;re able to make more money for their families from other enterprises.</p>\n<p>Kanyiva Muindi is an epidemiologist and air pollution research fellow at the African Population and Health Research Centre in Nairobi. She says families who switch to the smokeless cooking method could expect fewer respiratory diseases. Women, young girls and children are particularly vulnerable because they are the ones who cook in the kitchen or outside over fires.</p>\n<p>How much better the biogas stoves will be for the community&#x27;s health still needs more research, says Dominic Kahumbu Wanjihia, Biogas International&#x27;s chief executive. But unless the price of the machines drops, it&#x27;s pretty clear that most communities will never be able to afford any, since they sell for about $750.</p>\n<p>Kanyiva says affordability is a challenge worth addressing, given the huge health and environmental dangers posed by &#x27;dirty&#x27; fuels such as wood, charcoal and kerosene. If biogas could become affordable on a large scale, she says it &#x27;would be life-changing for millions on the African continent and beyond&#x27;.</p>"}, "2": {"title": "How could multilingualism benefit India&#x27;s poorest schoolchildren?", "text": "<p>The crowded and bustling streets of Delhi teem with life. Stop to listen and, above the din of rickshaws and buses, you&#x27;ll hear a multitude of languages, as more than 20 million people go about their daily lives. Many were born and raised here, and many millions more have recently made India&#x27;s capital their home, having moved from surrounding neighbourhoods, cities and states or across the country, often in the hope of gaining better jobs and a better life. Some arrive speaking fluent Hindi, the dominant language in Delhi (and the official language of government), but many arrive speaking any number of India&#x27;s 22 officially recognised languages, let alone the hundreds of regional languages in a country of more than 1.3 billion people.</p>\n<p>A team of researchers led by Professor Ianthi Tsimpli of Cambridge University is currently working on a project collecting data on 1,000 primary-age children in Delhi and the cities of Hyderabad and Bihar. The overriding aim of the four-year project, called &#x27;Multilingualism and Multiliteracy&#x27;, is to find out why in a country where multilingualism is so common (more than 255 million people in India speak at least two languages, and nearly 90 million speak three or more languages), the many benefits of speaking more than one language, observed in schools in Europe for instance, do not apply to many of India&#x27;s schoolchildren.</p>\n<p>&#x27;Each year across India, 600,000 children are tested, and year after year over 50% of children in Standard 5 [ten-year-olds] cannot read a Standard 2 [seven-year-olds] task fluently, and just under 50% of them cannot solve a Standard 2 subtraction task,&#x27; says Tsimpli. She explains that low educational achievement can lead to many of these students dropping out of school – a problem disproportionately affecting female students.</p>\n<p>Tsimpli and her colleagues are investigating whether these low learning outcomes could be caused by an Indian school system where the language that children are taught in often differs from the language used at home. The research project, which focuses on 8 to 11-year-old schoolchildren in rural and urban areas, collects data on whether the schoolchildren live in slum\\* or non-slum areas. Many of the children have moved from remote, rural areas to urban areas. They are so poor they have to live in slums and, as a result of migration, they may speak languages that are different from the regional language.</p>\n<p>Having already tested 1,000 children, the researchers will now embark on retesting them. They intend to look not only at test results, but also at variables such as the standard of schooling, the environment and the teaching practices themselves. It&#x27;s possible that one of the causes of low performance is the lack of pupil-centred teaching methods; in many Indian primary schools the teacher dominates and there is little room for independent learning.</p>\n<p>Although the findings are at a preliminary stage, Tsimpli and her team have found that the medium of instruction used in schools, especially English, may hold back those children who have little familiarity with, or exposure to, the language before starting school and outside of school life. According to Tsimpli, most of the evidence from this and other projects shows that English instruction for children from low socio-economic areas might not be the best way for them to learn, at least in the first three years of primary education.</p>\n<p>&#x27;What we would recommend for everyone, not just low socio-economic status children, would be to start learning in the language they feel comfortable learning in ... English can still be used, but perhaps not as the medium of instruction in primary schools. It could, for example, be one of the subjects that are being taught alongside other subjects. We are not suggesting that English be withdrawn – that ship has sailed – but we perhaps have to think more about learner needs. There is perhaps too much uniformity in teaching and less tailoring to the children&#x27;s language abilities and needs,&#x27; says Tsimpli.</p>\n<p>While the preliminary results show there is no difference in general intelligence among boys and girls from slum areas versus those from urban poor backgrounds, an unanticipated finding has been that children from slum backgrounds do not seem to lag behind children from other urban poor backgrounds – and in some cases outperform them (e.g. in numeracy and literacy tasks). According to the researchers, this unexpected finding may be down to the life experiences of children growing up in slums. They are likely to mature faster and come into closer contact with the numeracy skills essential for day-to-day survival.</p>\n<p>The project has already caught the attention of government ministers, who are keen to use the findings of the study to inform and adjust school policy in Delhi and the wider state. &#x27;They are as keen as us to understand how the challenging context of deprivation can be attenuated when focusing on the languages children learn and use while at school. Our findings don&#x27;t mean you&#x27;re doomed if you&#x27;re poor. It may be that these low learning outcomes are because of the way education is provided in India, with a huge focus on Hindi and English as the mediums of instruction, to the potential detriment of children unfamiliar with those languages,&#x27; explains Tsimpli.</p>\n<p>&#x27;Language is central to the way knowledge is transferred – so the medium of instruction is obviously hugely influential. We hope to ... show that problem solving, numeracy and literacy can and do improve in children who are educated in a language of instruction they know. The trick may be to bridge school skills with life skills and make use of the richness of a child&#x27;s life experience to help them learn in the most effective ways possible,&#x27; says Tsimpli.</p>"}, "3": {"title": "The Globemakers: The Curious Story of an Ancient Craft", "text": "<p><i>A review of Peter Bellerby&#x27;s book</i> The Globemakers</p>\n<p>In 2008, Peter Bellerby, who lived in London, wanted to give his father a model globe for his eightieth birthday. What seemed simple enough to start with triggered an almost obsessive, decade-long journey, marked by a series of obstacles that would have deterred anyone less determined. It ended with his establishing the world&#x27;s only bespoke globemaking company.</p>\n<p>The first surprise in <i>The Globemakers,</i> Bellerby&#x27;s account of this impulsive enterprise, is that obtaining such a globe was not simply a matter of a quick online order and a repressed sigh at the shipping costs. After all, contrary to stubbornly held popular views of our ancestors&#x27; geographical ignorance, we have known that the world is spherical since at least the 6th century BCE. The ancient Greek philosopher Plato in his work <i>Phaedo</i> likened it to a leather ball, while the accolade of producing the first recorded globe goes to the ancient Greek philosopher Crates of Mallus, who is said to have made one in around 150 BCE. Surely, Bellerby reasoned, a good-quality globe wouldn&#x27;t be difficult to find.</p>\n<p>Nearly two millennia later, however, it seemed that the art of globemaking had been largely forgotten. Bellerby came across shoddy commercial versions designed for school classrooms and genuine antiques in auction houses that would have bust his budget. Even his trips to Morocco and India, where surely the knowledge of artisan cartographers\\* had been preserved, drew a blank.</p>\n<p>Not one to be easily thwarted, Bellerby decided to make his own good-quality globe. In the process, almost everything that could possibly go wrong did so. Even the shape of the Earth posed a problem, as it is not quite a perfect sphere, but oblate (slightly flattened at the poles). Having decided to compromise and opt for two half-spherical pieces that could be fitted together, he was unable to discover anyone capable of casting moulds with sufficient accuracy to ensure that he would not be left with two half-spheres that were not quite the same circumference. Even after he eventually resolved this issue, extracting these from the moulds resulted in piles of cracked plaster of Paris\\<i>\\</i> and clouds of choking dust in the workshop he had set up at the rear of his house.</p>\n<p>This series of abortive experiments taught Bellerby a lot about the challenges of making globes, which he communicates here to the reader. Finding just the right way to prise the globes from the mould – a high-end air compressor finally did the trick – and locating the right paper and inks with which to make the gores (the sections of flat sheet mapping that are pasted onto the spherical globe) without the ink seeping out to create a mushy, unreadable mess took months and an alarming chunk out of his bank balance. Bellerby&#x27;s frustration at the painstaking process of attaching the gores to the globe surface – after having found a glue with precisely the right adhesive qualities – is palpable. Right at the end of the process, he learnt that the paper had stretched slightly and so the final one overlapped the first by a centimetre (which may not seem a great deal, but when that represents 2 per cent of the Earth&#x27;s diameter, it&#x27;s equivalent to obliterating the Himalayas or wiping out Chile).</p>\n<p>Bellerby&#x27;s account of the technical challenges of globe production is interspersed with a series of interludes on great globemakers of the past and cartographic history in general. Purists might wish for more map-making details, but Bellerby clearly found a kindred spirit in Martin Behaim. He was the Nuremberg entrepreneur who in 1492 created the Erdapfel, the world&#x27;s oldest surviving globe, beautifully finished by a workshop of painters and other craftsmen, only to find that the explorer Christopher Columbus had stumbled upon the Americas the very same year, rendering his masterpiece instantly out of date. Something of Bellerby&#x27;s unflinching ambition is reflected in the even more heroic efforts of the Italian cartographer Vincenzo Coronelli, who, in the seventeenth century, created two globes for Louis XIV of France. It took him twenty years to complete the monstrous pair, whose vast bulk – each with a diameter of around four metres – can still be admired in the National Library of France in Paris.</p>\n<p>Although a celebration of the revival of an ancient craft, Bellerby&#x27;s book is also a lament for the fading away of centuries-old traditions. When he embarked on his globemaking odyssey, he struggled to find artisans with the skills to make the right moulds for the globes or foundries that could shape the meridians (the metal frames which girdle globes) in just the right way. Although he finally located the right craftsmen, some simply dropping in, serendipitously, to his workshop (by now in more suitable premises than his back room), many of these have now retired or passed away. Bellerby&#x27;s father finally did receive his eightieth birthday present, albeit two years late.</p>\n<p>Bellerby went on to found a company which now turns out over six hundred globes a year for customers who can have their own tiny village marked or more unusual requests fulfilled. His book, beautifully illustrated with photographs of the various stages of his venture and a few illustrations of historic globes and maps, is hardly a blueprint for commercial success. But it is more than enough to stir up admiration for the craftsmanship of the great mapmakers of the past and the obsessive determination of a modern successor who revived their almost moribund art.</p>"}};

const answerReview={1:{para:2,explain:"TRUE. Đoạn văn nói cây được người Bỉ mang tới Rwanda vì họ thích vẻ ngoài của lá và hoa, tức mục đích ban đầu là trang trí.",evidence:"the plant arrived with Belgian colonists in Rwanda, who liked the look of its glossy leaves and delicate purple flowers floating in their ponds."},2:{para:2,explain:"FALSE. Cây không được ngư dân mang tới Lake Victoria; nó thoát khỏi Rwanda và trôi theo sông Kagera xuống hồ.",evidence:"it had 'escaped' out of the country via the Kagera river and made its way downstream to Lake Victoria."},3:{para:3,explain:"TRUE. Khối cây dày khiến thuyền chở cá khó di chuyển, đúng với ý 'difficult to force boats through'.",evidence:"the boats that once brought the fish to shore by the hundreds struggle to navigate through the mass of plants."},4:{para:2,explain:"NOT GIVEN. Bài chỉ nói cây chặn tuyến đánh cá và tạo nơi sống cho muỗi; không có thông tin rằng hóa chất từ cây làm thay đổi số lượng cá.",evidence:"the plant began spreading in the open water, blocking fishing routes and providing a new habitat for disease-carrying mosquitoes."},5:{para:3,explain:"NOT GIVEN. Bài nói wood và charcoal đều là solid fuels làm tăng ô nhiễm trong nhà, nhưng không so sánh charcoal có hại hơn wood.",evidence:"Using solid fuels like these for cooking increases indoor pollution."},6:{para:4,explain:"FALSE. Người dân thực tế đã kéo được rất nhiều cây ra khỏi hồ, đến mức các đống water hyacinth từng là cảnh thường thấy.",evidence:"huge piles of water hyacinth that villagers had taken out of the water in an attempt to clear it were a common sight."},7:{para:4,explain:"TRUE. Việc nghiên cứu tiềm năng biofuel đã bắt đầu từ thập niên 1980, tức trong thế kỷ 20.",evidence:"since as early as the 1980s when, across the world, they began to explore its potential as a biofuel."},8:{para:6,explain:"Đáp án là cow dung vì digester nhận hỗn hợp water hyacinth và phân bò để tạo biogas.",evidence:"machines that would transform a mix of water hyacinth and cow dung into biogas for cooking."},9:{para:7,explain:"Đáp án là fermentation / fermentation process vì hỗn hợp được để 20–30 ngày để trải qua quá trình lên men.",evidence:"it goes through a fermentation process and breaks down, giving off gas"},10:{para:7,explain:"Đáp án là pipes vì khí sạch được dẫn qua đường ống tới nơi sử dụng.",evidence:"the clean-burning gas is passed through pipes to the point of use"},11:{para:8,explain:"Đáp án là time. Lợi ích được nêu trực tiếp là phụ nữ không còn phải dành nhiều thời gian mỗi ngày để kiếm củi.",evidence:"they don't have to devote a lot of time every day to gathering firewood"},12:{para:8,explain:"Đáp án là money. Nhờ tiết kiệm thời gian, họ có thể làm các công việc khác và kiếm thêm tiền.",evidence:"they're able to make more money for their families from other enterprises."},13:{para:10,explain:"Đáp án là price. Trở ngại chính là giá máy quá cao so với khả năng chi trả của phần lớn cộng đồng.",evidence:"unless the price of the machines drops, it's pretty clear that most communities will never be able to afford any"},14:{para:1,explain:"I = dense population. Delhi được mô tả có hơn 20 triệu người, phù hợp với ý mật độ/dân số đông.",evidence:"more than 20 million people go about their daily lives."},15:{para:1,explain:"J = new immigrants. Nhiều người mới chuyển tới Delhi và biến nơi đây thành nhà của họ.",evidence:"many millions more have recently made India's capital their home"},16:{para:1,explain:"H = nearby district. 'surrounding neighbourhoods' tương ứng với khu vực lân cận.",evidence:"having moved from surrounding neighbourhoods, cities and states or across the country"},17:{para:1,explain:"B = employment opportunities. Họ chuyển đến với hy vọng tìm việc tốt hơn.",evidence:"often in the hope of gaining better jobs and a better life."},18:{para:2,explain:"E = primary objective. 'The overriding aim' là cách diễn đạt tương đương với 'primary objective'.",evidence:"The overriding aim of the four-year project ... is to find out why"},19:{para:2,explain:"F = similar advantages. Nghiên cứu muốn biết vì sao trẻ đa ngôn ngữ ở Ấn Độ không nhận được những lợi ích giống trẻ ở châu Âu.",evidence:"the many benefits of speaking more than one language, observed in schools in Europe for instance, do not apply to many of India's schoolchildren."},20:{para:3,explain:"NO. Tỷ lệ không đọc được bài literacy là trên 50%, trong khi tỷ lệ không giải được phép trừ là dưới 50%; vì vậy không thể nói literacy tốt hơn numeracy.",evidence:"over 50% ... cannot read ... fluently, and just under 50% of them cannot solve a ... subtraction task"},21:{para:3,explain:"NOT GIVEN. Bài chỉ nói việc bỏ học ảnh hưởng nữ sinh nhiều hơn; không hề nói Tsimpli gặp khó khăn khi thuyết phục nữ sinh tham gia nghiên cứu.",evidence:"low educational achievement can lead to many of these students dropping out of school – a problem disproportionately affecting female students."},22:{para:4,explain:"YES. Đây chính là một câu hỏi nghiên cứu: thành tích thấp có liên quan tới việc ngôn ngữ giảng dạy khác ngôn ngữ ở nhà hay không.",evidence:"investigating whether these low learning outcomes could be caused by an Indian school system where the language that children are taught in often differs from the language used at home."},23:{para:5,explain:"NO. Ngược lại, nhóm nghiên cứu dự định xem xét cả teaching practices, nên họ không loại bỏ yếu tố phương pháp giảng dạy.",evidence:"They intend to look not only at test results, but also at variables such as the standard of schooling, the environment and the teaching practices themselves."},24:{para:6,explain:"C. Đoạn 6 nói việc dùng English làm medium of instruction có thể cản trở trẻ ít tiếp xúc với tiếng Anh, đặc biệt trẻ thuộc nhóm kinh tế-xã hội thấp.",evidence:"English ... may hold back those children who have little familiarity with, or exposure to, the language"},25:{para:7,explain:"D. 'That ship has sailed' ở đây nghĩa là việc loại bỏ hoàn toàn English khỏi giáo dục đã không còn :3,explain:"NOT GIVEN. Bài chỉ nói Plato ví Trái Đất như quả bóng da; không nói ông bị chỉ trích vì nhận định đó.",evidence:"The ancient Greek philosopher Plato in his work Phaedo likened it to a leather ball"},35:{para:3,explain:"NOT GIVEN. Bài chỉ xác nhận Crates of Mallus được cho là làm quả địa cầu được ghi nhận đầu tiên; không đánh giá độ chính xác của nó.",evidence:"the accolade of producing the first recorded globe goes to ... Crates of Mallus"},36:{para:3,explain:"YES. Bellerby thực sự cho rằng tìm một quả địa cầu chất lượng sẽ không khó.",evidence:"Surely, Bellerby reasoned, a good-quality globe wouldn't be difficult to find."},37:{para:6,explain:"B. Khi dán các gores, ông phát hiện giấy đã giãn khiến mảnh cuối chồng lên mảnh đầu – một vấn đề bất ngờ.",evidence:"he learnt that the paper had stretched slightly and so the final one overlapped the first by a centimetre"},38:{para:7,explain:"C. Reviewer liên hệ Bellerby với các globemaker trước đây vì họ có những nét tương đồng: Behaim là 'kindred spirit', còn tham vọng của Bellerby được phản chiếu ở Coronelli.",evidence:"Bellerby clearly found a kindred spirit in Martin Behaim."},39:{para:8,explain:"D. Đoạn này nhấn mạnh sự tiếc nuối trước việc các nghề/kỹ năng thủ công lâu đời đang biến mất khi nhiều nghệ nhân nghỉ hưu hoặc qua đời.",evidence:"Bellerby's book is also a lament for the fading away of centuries-old traditions."},40:{para:9,explain:"A. Reviewer nói rõ cuốn sách không phải hướng dẫn để xây dựng một doanh nghiệp thành công về mặt thương mại.",evidence:"His book ... is hardly a blueprint for commercial success."}};

const norm=v=>String(v??'').normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' ');
function startExam(){const n=document.getElementById('studentName').value.trim(),c=document.getElementById('studentClass').value.trim();if(!n||!c){document.getElementById('startError').textContent='Vui lòng nhập đầy đủ Họ tên và Lớp.';return}document.getElementById('topName').textContent=n;document.getElementById('topClass').textContent=c;document.getElementById('start').classList.add('hidden');document.getElementById('exam').classList.remove('hidden');startedAt=Date.now();endAt=startedAt+60*60*1000;buildNav();showPassage(1);tickTimer();timerHandle=setInterval(tickTimer,250)}
function tickTimer(){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));updateTimer();if(remaining<=0&&!submitted){clearInterval(timerHandle);submitExam(true)}}function updateTimer(){const e=document.getElementById('timer'),m=Math.floor(Math.max(remaining,0)/60),s=Math.max(remaining,0)%60;e.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;e.classList.toggle('warning',remaining<=600&&remaining>300);e.classList.toggle('danger',remaining<=300)}
function groupMeta(n,p){if(p===1){if(n<=7)return['Questions 1–7','Choose TRUE, FALSE or NOT GIVEN.'];if(n<=10)return['Questions 8–10','Complete the flow-chart. Choose NO MORE THAN TWO WORDS from the passage.'];return['Questions 11–13','Complete the notes. Choose ONE WORD ONLY from the passage.']}if(p===2){if(n<=19)return['Questions 14–19','Complete the summary using the list A–J.'];if(n<=23)return['Questions 20–23','Choose YES, NO or NOT GIVEN.'];return['Questions 24–26','Choose the correct letter A, B, C or D.']}if(n<=32)return['Questions 27–32','Complete the summary using the list A–J.'];if(n<=36)return['Questions 33–36','Choose YES, NO or NOT GIVEN.'];return['Questions 37–40','Choose the correct letter A, B, C or D.']}

function zoneRoot(zone){
  return document.getElementById(zone==='questions'?'questionsCopy':'passageCopy');
}
function zoneMarkupKey(zone,p=current){
  return (zone==='questions'?'questionsMarkup':'passageMarkup')+p;
}
function noteStoreKey(zone,p=current){
  return 'notes_'+zone+'_'+p;
}
function notesPanelId(zone){
  return zone==='questions'?'notesPanelQuestions':'notesPanelPassage';
}
function notesCountId(zone){
  return zone==='questions'?'notesCountQuestions':'notesCountPassage';
}
function saveZoneMarkup(zone){
  const root=zoneRoot(zone);
  if(root)sessionStorage.setItem(zoneMarkupKey(zone),root.innerHTML);
}
function saveCurrentMarkups(){
  saveZoneMarkup('passage');
  saveZoneMarkup('questions');
}
function captureSelection(zone){
  if(submitted)return;
  const sel=window.getSelection();
  const root=zoneRoot(zone);
  if(!sel||!root||sel.rangeCount===0||sel.isCollapsed)return;
  const r=sel.getRangeAt(0);
  if(root.contains(r.commonAncestorContainer)){
    savedSelection=r.cloneRange();
    savedSelectionZone=zone;
  }
}
function annotationBlock(node){
  const el=node&&node.nodeType===3?node.parentElement:node;
  if(!el)return null;
  return el.closest('p,.completion-text,.flow-step,li,.card,.option,.inst,.bank div,h3,h4,.qtext');
}
function getUsableSelection(zone){
  const root=zoneRoot(zone);
  if(!savedSelection||savedSelectionZone!==zone||!root||!root.contains(savedSelection.commonAncestorContainer)){
    alert(zone==='questions'
      ?'Hãy bôi đen phần chữ ở bên câu hỏi trước.'
      :'Hãy bôi đen phần chữ trong bài đọc trước.');
    return null;
  }
  if(savedSelection.collapsed||!savedSelection.toString().trim()){
    alert('Hãy bôi đen một đoạn chữ trước.');
    return null;
  }

  const a=annotationBlock(savedSelection.startContainer);
  const b=annotationBlock(savedSelection.endContainer);
  if(!a||!b||a!==b){
    alert('Để highlight/ghi chú ổn định, hãy chọn chữ trong cùng một câu hoặc cùng một khối nội dung.');
    return null;
  }

  const cloned=savedSelection.cloneContents();
  if(cloned.querySelector && cloned.querySelector('input,select,button,textarea')){
    alert('Không thể highlight xuyên qua ô trả lời. Hãy chỉ chọn phần chữ.');
    return null;
  }
  return savedSelection.cloneRange();
}
function clearBrowserSelection(){
  const sel=window.getSelection();
  if(sel)sel.removeAllRanges();
  savedSelection=null;
  savedSelectionZone=null;
}
function addHighlight(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  try{
    const mark=document.createElement('mark');
    mark.className='user-highlight';
    mark.dataset.annotationZone=zone;
    const frag=r.extractContents();
    mark.appendChild(frag);
    r.insertNode(mark);
    activeHighlight=mark;
    activeHighlightZone=zone;
    saveZoneMarkup(zone);
    clearBrowserSelection();
  }catch(e){
    alert('Không thể highlight vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function clearHighlight(zone){
  if(submitted)return;
  let targets=[];
  if(activeHighlight&&activeHighlightZone===zone&&document.body.contains(activeHighlight)){
    targets=[activeHighlight];
  }else if(savedSelection&&savedSelectionZone===zone){
    const root=zoneRoot(zone);
    if(root)targets=[...root.querySelectorAll('mark.user-highlight')].filter(m=>{
      try{return savedSelection.intersectsNode(m)}catch(e){return false}
    });
  }
  if(!targets.length){
    alert('Hãy bấm vào phần đã highlight rồi chọn “Xóa HL”.');
    return;
  }
  targets.forEach(m=>{
    const p=m.parentNode;
    while(m.firstChild)p.insertBefore(m.firstChild,m);
    m.remove();
    p.normalize();
  });
  activeHighlight=null;
  activeHighlightZone=null;
  saveZoneMarkup(zone);
  clearBrowserSelection();
}
function loadNotes(zone,p=current){
  try{return JSON.parse(sessionStorage.getItem(noteStoreKey(zone,p))||'[]')}catch(e){return[]}
}
function saveNotes(zone,notes,p=current){
  sessionStorage.setItem(noteStoreKey(zone,p),JSON.stringify(notes));
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addNote(zone){
  if(submitted)return;
  const r=getUsableSelection(zone);if(!r)return;
  const quote=r.toString().trim();
  const text=prompt('Nhập ghi chú cho đoạn đã chọn:');
  if(text===null||!text.trim())return;
  const id='note_'+zone+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  try{
    const span=document.createElement('span');
    span.className='note-anchor';
    span.dataset.noteId=id;
    span.dataset.annotationZone=zone;
    span.title='Bấm để xem/sửa ghi chú';
    const frag=r.extractContents();
    span.appendChild(frag);
    r.insertNode(span);

    const notes=loadNotes(zone);
    notes.push({id,quote,text:text.trim()});
    saveNotes(zone,notes);
    saveZoneMarkup(zone);
    clearBrowserSelection();
    renderNotesPanel(zone,current,true);
  }catch(e){
    alert('Không thể tạo ghi chú cho vùng chọn này. Hãy chọn lại một đoạn chữ ngắn hơn.');
  }
}
function toggleNotes(zone){
  const panel=document.getElementById(notesPanelId(zone));
  if(panel)panel.classList.toggle('open');
}
function renderNotesPanel(zone,p=current,forceOpen=false){
  const panel=document.getElementById(notesPanelId(zone));
  const count=document.getElementById(notesCountId(zone));
  if(!panel)return;
  const notes=loadNotes(zone,p);
  if(count)count.textContent=notes.length;
  panel.innerHTML=notes.length
    ?notes.map(n=>`<div class="note-item">
        <div class="note-quote">“${esc(n.quote)}”</div>
        <div class="note-text">${esc(n.text)}</div>
        <div class="note-actions">
          <button type="button" onclick="editNote('${zone}','${n.id}')">Sửa</button>
          <button type="button" onclick="deleteNote('${zone}','${n.id}')">Xóa</button>
        </div>
      </div>`).join('')
    :'<div style="font-size:13px;color:var(--muted)">Chưa có ghi chú ở phần này.</div>';
  if(forceOpen)panel.classList.add('open');
}
function editNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt('Sửa ghi chú:',n.text);if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function deleteNote(zone,id){
  const notes=loadNotes(zone).filter(x=>x.id!==id);
  saveNotes(zone,notes);
  const root=zoneRoot(zone);
  if(root)root.querySelectorAll(`[data-note-id="${id}"]`).forEach(s=>{
    const p=s.parentNode;
    while(s.firstChild)p.insertBefore(s.firstChild,s);
    s.remove();
    p.normalize();
  });
  saveZoneMarkup(zone);
  renderNotesPanel(zone,current,true);
}
function openNote(zone,id){
  const notes=loadNotes(zone);
  const n=notes.find(x=>x.id===id);if(!n)return;
  const t=prompt(`Đoạn đã ghi chú:\n“${n.quote}”\n\nGhi chú:`,n.text);
  if(t===null)return;
  if(!t.trim()){deleteNote(zone,id);return}
  n.text=t.trim();
  saveNotes(zone,notes);
  renderNotesPanel(zone,current,true);
}
function bindAnnotations(zone){
  const root=zoneRoot(zone);if(!root)return;
  root.addEventListener('mouseup',()=>captureSelection(zone));
  root.addEventListener('keyup',()=>captureSelection(zone));
  root.addEventListener('click',e=>{
    const note=e.target.closest('.note-anchor');
    if(note){openNote(zone,note.dataset.noteId);return}
    const mark=e.target.closest('mark.user-highlight');
    if(mark){
      activeHighlight=mark;
      activeHighlightZone=zone;
    }else if(zone===activeHighlightZone){
      activeHighlight=null;
      activeHighlightZone=null;
    }
  });
}
function annotationToolbar(zone){
  const isQ=zone==='questions';
  const label=isQ?'Câu hỏi':'Bài đọc';
  const countId=isQ?'notesCountQuestions':'notesCountPassage';
  return `<div class="annotation-bar">
    <span class="annotation-zone-label">${label}</span>
    <button type="button" class="annotation-btn" onclick="addHighlight('${zone}')">🖍 Highlight</button>
    <button type="button" class="annotation-btn" onclick="clearHighlight('${zone}')">Xóa HL</button>
    <button type="button" class="annotation-btn" onclick="addNote('${zone}')">📝 Add note</button>
    <button type="button" class="annotation-btn" onclick="toggleNotes('${zone}')">Ghi chú (<span id="${countId}">0</span>)</button>
    <span class="annotation-tip">Bôi đen phần chữ rồi chọn công cụ.</span>
  </div>`;
}

function showPassage(p){
  saveCurrentMarkups();
  current=p;
  activeHighlight=null;
  activeHighlightZone=null;
  savedSelection=null;
  savedSelectionZone=null;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.p===p));

  const passageMarkup=sessionStorage.getItem(zoneMarkupKey('passage',p))||passages[p].text;
  document.getElementById('passage').innerHTML=
    annotationToolbar('passage')+
    `<div id="notesPanelPassage" class="notes-panel"></div>
     <h2>${passages[p].title}</h2>
     <div class="copy" id="passageCopy">${passageMarkup}</div>`;

  bindAnnotations('passage');
  renderNotesPanel('passage',p,false);
  buildQuestions(p);

  document.getElementById('passage').scrollTop=0;
  document.getElementById('questions').scrollTop=0;
}
function renderQ(q){let body='';if(q.type==='text')body=`<input class="ans" id="q${q.n}" data-q="${q.n}" type="text" autocomplete="off" placeholder="Type your answer">`;else if(q.type==='select')body=`<select class="ans" id="q${q.n}" data-q="${q.n}"><option value="">-- Choose --</option>${q.opts.map(x=>`<option value="${x.charAt(0)}">${x}</option>`).join('')}</select>`;else body=q.opts.map(x=>{const v=/^[A-D] —/.test(x)?x.charAt(0):x;return `<label class="option" data-q="${q.n}" data-val="${v}"><input type="radio" name="q${q.n}" value="${v}"> ${x}</label>`}).join('');return `<div class="card" id="card${q.n}"><div class="qhead"><span class="qnum">${q.n}</span><div class="qtext">${q.text}</div></div>${body}<div class="feedback" id="fb${q.n}"></div></div>`}

function inlineText(n,placeholder=''){
  return `<span class="inline-blank" id="card${n}"><span class="blank-num">${n}</span><input class="ans inline-answer short" id="q${n}" data-q="${n}" type="text" autocomplete="off" placeholder="${placeholder}"></span>`;
}
function inlineSelect(n,opts){

}

function renderDelhiSummary(){

function renderGlobeSummary(){

function renderStandardGroup(qs,title,inst){
  return `<div class="group"><h3>${title}</h3><div class="inst">${inst}</div>${qs.map(renderQ).join('')}</div>`;
}
function buildQuestions(p){
  let h='';
  if(p===1){
    h+=renderStandardGroup(questions.filter(q=>q.n>=1&&q.n<=7),'Questions 1–7','Choose TRUE, FALSE or NOT GIVEN.');
    h+=renderP1Flow();
    h+=renderP1Notes();
  }else if(p===2){
    h+=renderDelhiSummary();
    h+=renderStandardGroup(questions.filter(q=>q.n>=20&&q.n<=23),'Questions 20–23','Choose YES, NO or NOT GIVEN.');
    h+=renderStandardGroup(questions.filter(q=>q.n>=24&&q.n<=26),'Questions 24–26','Choose the correct letter A, B, C or D.');
  }else{
    h+=renderGlobeSummary();
    h+=renderStandardGroup(questions.filter(q=>q.n>=33&&q.n<=36),'Questions 33–36','Choose YES, NO or NOT GIVEN.');
    h+=renderStandardGroup(questions.filter(q=>q.n>=37&&q.n<=40),'Questions 37–40','Choose the correct letter A, B, C or D.');
  }
  const savedQuestionMarkup=sessionStorage.getItem(zoneMarkupKey('questions',p));
  const questionMarkup=savedQuestionMarkup||h;
  document.getElementById('questions').innerHTML=
    annotationToolbar('questions')+
    `<div id="notesPanelQuestions" class="notes-panel"></div>
     <div id="questionsCopy">${questionMarkup}</div>`;

  restore(p);
  bindTrack();
  bindAnnotations('questions');
  renderNotesPanel('questions',p,false);
  if(submitted)markPassage(p);
}

function restore(p){for(const q of questions.filter(x=>x.p===p)){const v=sessionStorage.getItem('q'+q.n)||'';if(q.type==='text'||q.type==='select'){const e=document.getElementById('q'+q.n);if(e)e.value=v}else if(v){const e=[...document.querySelectorAll(`input[name="q${q.n}"]`)].find(x=>x.value===v);if(e)e.checked=true}}}
function bindTrack(){document.querySelectorAll('.ans').forEach(e=>{e.oninput=e.onchange=()=>save(+e.dataset.q,e.value)});document.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>save(+e.closest('.option').dataset.q,e.value))}
function save(n,v){sessionStorage.setItem('q'+n,v);const e=document.getElementById('nav'+n);if(e)e.classList.toggle('answered',String(v).trim()!=='')}
function buildNav(){document.getElementById('nav').innerHTML=questions.map(q=>`<button class="nq" id="nav${q.n}" onclick="goQ(${q.n})">${q.n}</button>`).join('')}
function goQ(n){const q=questions.find(x=>x.n===n);if(q.p!==current)showPassage(q.p);setTimeout(()=>{const target=document.getElementById('card'+n);target?.scrollIntoView({behavior:'smooth',block:'center'});const control=document.getElementById('q'+n);if(control&&(control.tagName==='SELECT'||control.type==='text'))control.focus({preventScroll:true})},60)}
function correct(q,u){return q.type==='text'?q.ans.map(norm).includes(norm(u)):norm(u)===norm(q.ans)}
function markPassage(p){for(const q of questions.filter(x=>x.p===p)){const u=sessionStorage.getItem('q'+q.n)||'',ok=correct(q,u),fb=document.getElementById('fb'+q.n);if(q.type==='text'||q.type==='select'){const e=document.getElementById('q'+q.n);if(e){e.classList.remove('correct','wrong');e.classList.add(ok?'correct':'wrong')}}else document.querySelectorAll(`label[data-q="${q.n}"]`).forEach(l=>{l.classList.remove('correct','wrong');if(norm(l.dataset.val)===norm(q.ans))l.classList.add('correct');else if(u&&norm(l.dataset.val)===norm(u))l.classList.add('wrong')});if(fb){const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'✓ Correct':'Correct answer: '+key}}}

function displayAnswer(q,user){
  if(!String(user).trim())return 'Không trả lời';
  if(q.type==='select'||(q.type==='choice'&&/^[A-D]$/.test(String(user)))){
    const found=(q.opts||[]).find(x=>String(x).startsWith(String(user)+' '));
    return found||user;
  }
  return user;
}
function displayKey(q){
  const key=Array.isArray(q.ans)?q.ans.join(' / '):q.ans;
  if(q.type==='select'||(q.type==='choice'&&/^[A-D]$/.test(String(key)))){
    const found=(q.opts||[]).find(x=>String(x).startsWith(String(key)+' '));
    return found||key;
  }
  return key;
}
function renderWrongReview(details){
  const box=document.getElementById('wrongReview');
  const wrong=details.filter(x=>!x.correct);
  if(!wrong.length){
    box.innerHTML='<h3 class="review-title">Review đáp án</h3><div class="perfect-review">🎉 Không có câu sai. Bạn đã trả lời đúng cả 40 câu!</div>';
    return;
  }
  box.innerHTML=`<h3 class="review-title">Giải thích các câu trả lời sai (${wrong.length})</h3>
    <div class="review-sub">Mỗi câu gồm đáp án của bạn, đáp án đúng, lý do và trích dẫn trực tiếp từ passage.</div>`+
    wrong.map(d=>{
      const q=questions.find(x=>x.n===d.q),r=answerReview[d.q];
      return `<div class="wrong-review">
        <div class="review-q">Câu ${q.n}. ${esc(q.text)}</div>
        <div class="answer-row"><div class="answer-label">Bạn trả lời</div><div class="student-wrong">${esc(displayAnswer(q,d.answer))}</div></div>
        <div class="answer-row"><div class="answer-label">Đáp án đúng</div><div class="correct-answer">${esc(displayKey(q))}</div></div>
        <div class="explain-box"><b>Giải thích:</b> ${esc(r.explain)}</div>
        <div class="evidence-box">
          <div class="evidence-label">Trích dẫn · Passage ${q.p}, đoạn ${r.para}</div>
          <div class="evidence-quote">“${esc(r.evidence)}”</div>
        </div>
        <button type="button" class="goto-evidence" onclick="gotoEvidence(${q.n})">↗ Xem trong bài đọc</button>
      </div>`;
    }).join('');
}
function gotoEvidence(n){
  const q=questions.find(x=>x.n===n),r=answerReview[n];
  document.getElementById('overlay').classList.add('hidden');
  showPassage(q.p);
  setTimeout(()=>{
    const copy=document.getElementById('passageCopy');
    const ps=copy?[...copy.querySelectorAll('p')]:[];
    const target=ps[r.para-1];
    if(target){
      target.scrollIntoView({behavior:'smooth',block:'center'});
      target.classList.add('evidence-pulse');
      setTimeout(()=>target.classList.remove('evidence-pulse'),2600);
    }
    setTimeout(()=>{
      const card=document.getElementById('card'+n);
      if(card)card.scrollIntoView({behavior:'smooth',block:'center'});
    },1000);
  },100);
}

async function submitExam(auto=false){if(submitted)return;saveCurrentMarkups();const unanswered=questions.filter(q=>!(sessionStorage.getItem('q'+q.n)||'').trim()).length;if(!auto&&unanswered&& !confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;submitted=true;clearInterval(timerHandle);let total=0,s=[0,0,0,0],details=[];for(const q of questions){const u=sessionStorage.getItem('q'+q.n)||'',ok=correct(q,u);if(ok){total++;s[q.p]++}details.push({q:q.n,answer:u,correct:ok,key:Array.isArray(q.ans)?q.ans.join(' / '):q.ans});const ne=document.getElementById('nav'+q.n);if(ne){ne.classList.remove('answered');ne.classList.add(ok?'correct':'wrong')}}markPassage(current);const name=document.getElementById('studentName').value.trim(),cls=document.getElementById('studentClass').value.trim(),dur=Math.round((Date.now()-startedAt)/1000);document.getElementById('rstudent').textContent=`${name} — ${cls}`;document.getElementById('rscore').textContent=`${total} / 40`;document.getElementById('rpercent').textContent=`${Math.round(total/40*100)}% correct`;document.getElementById('p1s').textContent=`${s[1]} / 13`;document.getElementById('p2s').textContent=`${s[2]} / 13`;document.getElementById('p3s').textContent=`${s[3]} / 14`;renderWrongReview(details);document.getElementById('overlay').classList.remove('hidden');document.getElementById('status').textContent='Đang gửi kết quả về Google Sheet...';const p=new URLSearchParams({name,className:cls,total:String(total),maxScore:'40',durationSeconds:String(dur),activity:'IELTS Reading Computer-Based Test',reading:String(s[1]),grammar:String(s[2]),ing:String(s[3]),writingA:JSON.stringify(details),submittedAt:new Date().toISOString()});try{await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p.toString()});document.getElementById('status').textContent='✓ Đã gửi kết quả về Google Sheet.'}catch(e){document.getElementById('status').textContent='Không gửi được kết quả về Google Sheet. Hãy kiểm tra Web App URL hoặc kết nối mạng.'}}
function closeResult(){document.getElementById('overlay').classList.add('hidden');markPassage(current)}
</script></body></html>
