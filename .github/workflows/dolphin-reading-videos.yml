name: Build Dolphin Reading Videos
on:
  push:
    branches: [main]
    paths:
      - 'Foundations/Reading-Library/build-dolphin-videos.py'
      - 'Foundations/Reading-Library/dolphin-scenes/scene-1.webp'
      - '.github/workflows/dolphin-reading-videos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video renderer
        run: python -m pip install --disable-pip-version-check pillow numpy imageio imageio-ffmpeg
      - name: Render four 6-second MP4 loops
        run: python Foundations/Reading-Library/build-dolphin-videos.py
      - name: Publish MP4 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Foundations/Reading-Library/dolphin-scenes/scene-*.mp4
          if ! git diff --cached --quiet; then
            git commit -m "assets(reading): publish four dolphin pixel video loops"
            git push
          fi
